{id:"e",tab:"5 · לילה",title:"עבודת ה׳ בלילה ותיקון חצות",seif:"סעיף ה",objective:"Appreciate the greatness of nighttime Torah study and תיקון חצות, and its spiritual rewards.",source:"השכמה בחצות וחשיבות לימוד תורה בלילה",qs:["What is the ideal time for תיקון חצות?","What should one do if he cannot wake at חצות?","Why is learning Torah at night so special?","What is meant by משנה – אותיות נשמה?"],type:"night",pieces:[["he","תיקון חצות"],["he","משנה ↔ נשמה"],["sticker","🌙"],["sticker","⭐"],["sticker","📖"]]}
];
const HALACHA_LOCAL_KEY="halachaV14";
const HALACHA_PARAMS=new URLSearchParams(location.search);
const HALACHA_TEACHER_VIEW=HALACHA_PARAMS.get("teacherView")||"";
const HALACHA_TEACHER_LESSON=HALACHA_PARAMS.get("teacher")==="1";
const HALACHA_TEACHER_PREVIEW=HALACHA_TEACHER_LESSON||!!HALACHA_TEACHER_VIEW;
const HALACHA_STUDENT_ID=String(HALACHA_TEACHER_VIEW||(HALACHA_TEACHER_LESSON?"":localStorage.getItem("b3Games_studentId")||"")).trim();
let S={};try{S=JSON.parse(localStorage.getItem(HALACHA_LOCAL_KEY)||"{}")}catch(e){}
let halachaDb=null,cloudSaveTimer=null;
try{
 if(window.firebase&&window.B3_FIREBASE_CONFIG){
   if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
   halachaDb=firebase.database();
 }
}catch(e){console.warn("Halacha cloud save unavailable",e)}
function cloudPath(){
 return HALACHA_STUDENT_ID?"b3Games/students/"+HALACHA_STUDENT_ID+"/halacha/siman1":null;
}
function setSaveStatus(msg){let x=document.getElementById("cloudSaveStatus");if(x)x.textContent=msg}
function save(){
 if(HALACHA_TEACHER_VIEW){setSaveStatus("Teacher view — student work is read only");return}
 if(HALACHA_TEACHER_LESSON){
   try{localStorage.setItem(HALACHA_LOCAL_KEY+"_teacher",JSON.stringify(S))}catch(e){}
   setSaveStatus("Teacher lesson copy saved on this device");
   return
 }
 try{localStorage.setItem(HALACHA_LOCAL_KEY,JSON.stringify(S))}catch(e){}
 if(!halachaDb||!cloudPath()){setSaveStatus("Saved on this device");return}
 setSaveStatus("Saving…");
 clearTimeout(cloudSaveTimer);
 cloudSaveTimer=setTimeout(()=>{
   halachaDb.ref(cloudPath()).set({version:1,updatedAt:firebase.database.ServerValue.TIMESTAMP,state:S})
    .then(()=>setSaveStatus("✓ Saved to my account"))
    .catch(e=>{console.warn("Halacha cloud save failed",e);setSaveStatus("Saved on this device")});
 },350);
}
async function loadCloudHalacha(){
 if(HALACHA_TEACHER_LESSON){
   try{S=JSON.parse(localStorage.getItem(HALACHA_LOCAL_KEY+"_teacher")||"{}")}catch(e){}
   setSaveStatus("Teacher lesson mode");
   return
 }
 if(!halachaDb||!cloudPath()){setSaveStatus("Saved on this device");return}
 try{
   setSaveStatus("Loading my scrapbook…");
   const snap=await halachaDb.ref(cloudPath()).once("value"),row=snap.val();
   if(row&&row.state&&typeof row.state==="object"){
     const remote=JSON.stringify(row.state),local=JSON.stringify(S);
     if(HALACHA_TEACHER_VIEW && sessionStorage.getItem("halachaTeacherLoaded:"+HALACHA_TEACHER_VIEW)!=="1"){localStorage.setItem(HALACHA_LOCAL_KEY,remote);sessionStorage.setItem("halachaTeacherLoaded:"+HALACHA_TEACHER_VIEW,"1");location.reload();return}
     if(remote!==local && sessionStorage.getItem("halachaCloudLoaded")!=="1"){
       localStorage.setItem(HALACHA_LOCAL_KEY,remote);
       sessionStorage.setItem("halachaCloudLoaded","1");
       location.reload(); return;
     }
   }else if(Object.keys(S).length){
     await halachaDb.ref(cloudPath()).set({version:1,updatedAt:firebase.database.ServerValue.TIMESTAMP,state:S});
   }
   setSaveStatus("✓ Saved to my account");
 }catch(e){console.warn("Halacha cloud load failed",e);setSaveStatus("Saved on this device")}
}

function teacherSource(id){
 const x={
 a:`<b>קיצור שולחן ערוך — סעיף א</b><br><br>שִׁוִיתִי ה' לְנֶגְדִּי תָמִיד, הוּא כְּלָל גָּדוֹל בַּתּוֹרָה וּבְמַעֲלוֹת הַצַּדִּיקִים אֲשֶׁר הוֹלְכִים לִפְנֵי הָאֱלֹהִים. כִּי אֵין יְשִׁיבַת הָאָדָם תְּנוּעָתוֹ וַעֲסָקָיו וְהוּא לְבַדּוֹ בְּבֵיתוֹ, כְּמוֹ יְשִׁיבָתוֹ וּתְנוּעָתוֹ וַעֲסָקָיו כַּאֲשֶׁר הוּא לִפְנֵי מֶלֶךְ גָּדוֹל... כָּל שֶׁכֵּן כַּאֲשֶׁר יָשִׂים הָאָדָם אֶל לִבּוֹ כִּי הַמֶּלֶךְ הַגָּדוֹל הַקָּדוֹשׁ בָּרוּךְ הוּא... עוֹמֵד עָלָיו וְרוֹאֶה בְמַעֲשָׂיו... בְּוַדַּאי מִיָּד תַּגִּיעַ אֵלָיו הַיִּרְאָה וְהַהַכְנָעָה...`,
 b:`<b>קיצור שולחן ערוך — סעיף ב</b><br><br>וּמִיָּד כְּשֶׁיֵּעוֹר מִשְּׁנָתוֹ יִזְכֹּר חַסְדֵי ה'... שֶׁהֶחֱזִיר לוֹ אֶת נִשְׁמָתוֹ... וּבְעוֹדוֹ עַל מִשְׁכָּבוֹ, יֹאמַר, מוֹדֶה אֲנִי לְפָנֶיךָ מֶלֶךְ חַי וְקַיָּם שֶׁהֶחֱזַרְתָּ בִּי נִשְׁמָתִי בְּחֶמְלָה, רַבָּה אֱמוּנָתֶךָ. וְאַף עַל פִּי שֶׁעֲדַיִן אֵין יָדָיו נְקִיּוֹת, יָכוֹל לוֹמַר זֹאת, כֵּיוָן שֶׁאֵין בּוֹ שֵׁם. וְיַפְסִיק מְעַט בֵּין תֵּבַת בְּחֶמְלָה לְתֵבַת רַבָּה.`,
 c:`<b>קיצור שולחן ערוך — סעיף ג</b><br><br>יְהוּדָה בֶן תֵּימָא אוֹמֵר, הֱוֵי עַז כַּנָּמֵר וְקַל כַּנֶּשֶׁר, רָץ כַּצְּבִי וְגִבּוֹר כָּאֲרִי לַעֲשׂוֹת רְצוֹן אָבִיךָ שֶׁבַּשָּׁמַיִם. עַז כַּנָּמֵר... שֶׁלֹּא יִתְבַּיֵּשׁ... קַל כַּנֶּשֶׁר, כְּנֶגֶד רְאוֹת הָעָיִן... רָץ כַּצְּבִי, כְּנֶגֶד הָרַגְלַיִם... וְגִבּוֹר כָּאֲרִי, כְּנֶגֶד הַלֵּב... וְתִתְגַּבֵּר עַל הַיֵּצֶר לְנַצְּחוֹ.`,
 d:`<b>קיצור שולחן ערוך — סעיף ד</b><br><br>לָכֵן צָרִיךְ הָאָדָם לְהִתְגַּבֵּר כַּאֲרִי... יָקוּם בִּזְרִיזוּת... קֹדֶם שֶׁיִּתְגַּבֵּר עָלָיו הַיֵּצֶר הָרַע בְּטַעֲנוֹת וְתוֹאֲנוֹת... בַּחֹרֶף, אֵיךְ תָּקוּם עַתָּה... וְהַקֹּר גָּדוֹל. וּבַקַּיִץ... וַעֲדַיִן לֹא שָׂבַעְתָּ מִשְּׁנָתֶךָ... אִם הָיָה קוֹרֵא אוֹתוֹ אֵיזֶה אָדָם לְאֵיזֶה עֵסֶק שֶׁיַּרְוִיחַ בּוֹ מָמוֹן... בְּוַדַּאי הָיָה זָרִיז לָקוּם מִיָּד... עַל אַחַת כַּמָּה וְכַמָּה לַעֲבוֹדַת מֶלֶךְ מַלְכֵי הַמְּלָכִים...`,
 e:`<b>קיצור שולחן ערוך — סעיף ה</b><br><br>אִם אֶפְשָׁר לוֹ לְהַשְׁכִּים וְלָקוּם בַּחֲצוֹת הַלַּיְלָה לַעֲרֹךְ אָז תִּקּוּן חֲצוֹת, מַה טּוֹב... וְאִם אִי אֶפְשָׁר לוֹ לָקוּם בַּחֲצוֹת, יִתְגַּבֵּר עַל כָּל פָּנִים לָקוּם קֹדֶם עֲלוֹת הַשָּׁחַר... וְאַחַר כָּךְ יַעֲסֹק בַּתּוֹרָה... וְשִׁעוּר מִשְׁנָיוֹת קוֹדֵם לְכָל דָּבָר, וְעַל יְדֵי זֶה זוֹכֶה לִנְשָׁמָה, מִשְׁנָה אוֹתִיּוֹת נְשָׁמָה... וְטוֹב מְעַט בְּכַוָּנָה, מֵהַרְבּוֹת בְּלֹא כַוָּנָה.`}; return x[id]||'';
}
function teacherPoint(id){return ({a:'Compare how a person naturally behaves alone at home with how he behaves before a great king. Then bring out the Kitzur’s kal vachomer: awareness that Hashem sees our actions changes both behavior and speech.',b:'Focus on gratitude immediately upon waking: Hashem returned the נשמה refreshed. Teach why מודה אני may be said before washing and the pause between בחמלה and רבה.',c:'Do not stop at identifying the animals. Teach what each quality means: courage despite mockery, guarding the eyes, running toward good, and strengthening the heart against the Yetzer Hara.',d:'Act out the Yetzer Hara’s winter and summer excuses, then use the Kitzur’s money/business example to show how quickly a person gets up for something he values.',e:'Teach the ideal of חצות, the alternative of rising before dawn, the special value of nighttime Torah, and the word connection משנה / נשמה.'})[id]||''}

function add(id,type,text,pageIndex=0){
 let pages=document.querySelectorAll("#"+id+" .page"),page=pages[Math.min(pageIndex,pages.length-1)],p=pageCanvas(page),e=document.createElement("div");
 e.className="scrap "+(type==="he"?"he":type==="sticker"?"sticker":"");

 e.style.left=(30+Math.random()*140)+"px";e.style.top=(45+Math.random()*470)+"px";
 p.appendChild(e);drag(e);clampPiece(e);persist(id)
}
function clampPiece(e){
 let page=e.closest(".page"); if(!page)return;
 let maxL=Math.max(0,page.clientWidth-e.offsetWidth-8),maxT=Math.max(0,page.clientHeight-e.offsetHeight-8);
 e.style.left=Math.min(Math.max(8,e.offsetLeft),maxL)+"px";
 e.style.top=Math.min(Math.max(8,e.offsetTop),maxT)+"px";
}
function removeP(b){let id=b.closest(".section").id;b.closest(".scrap").remove();persist(id)}
function size(b,f){let e=b.closest(".scrap"),z=parseFloat(e.dataset.z||1)*f;e.dataset.z=z;e.style.zoom=z;clampPiece(e);persist(e.closest(".section").id)}
function rot(b){let e=b.closest(".scrap"),r=(+e.dataset.r||0)+5;e.dataset.r=r;e.style.setProperty("--r",r+"deg");persist(e.closest(".section").id)}
function drag(e){
 let sx,sy,l,t,on=false;
 e.ondblclick=v=>{v.stopPropagation();openCustomizer(e,v)};
 e.onpointerdown=v=>{
 if(v.target.tagName==="BUTTON")return;
 on=true;sx=v.clientX;sy=v.clientY;l=e.offsetLeft;t=e.offsetTop;
 e.setPointerCapture(v.pointerId);
 document.querySelectorAll(".scrap").forEach(x=>x.classList.remove("selected"));e.classList.add("selected")
 };
 e.onpointermove=v=>{
 if(!on)return;
 let sec=e.closest(".section"),pages=[...sec.querySelectorAll(".page")],cur=e.closest(".page");
 let target=pages.find(p=>{let r=p.getBoundingClientRect();return v.clientX>=r.left&&v.clientX<=r.right&&v.clientY>=r.top&&v.clientY<=r.bottom});
 if(target && target!==cur){
 let er=e.getBoundingClientRect(),tr=target.getBoundingClientRect(),c=target.querySelector(".canvas");
 c.appendChild(e);
 e.style.left=(er.left-tr.left)+"px";e.style.top=(er.top-tr.top)+"px";
 sx=v.clientX;sy=v.clientY;l=e.offsetLeft;t=e.offsetTop;
 } else {
 e.style.left=(l+v.clientX-sx)+"px";
 e.style.top=(t+v.clientY-sy)+"px";
 }
 };
 e.onpointerup=()=>{on=false;clampPiece(e);persist(e.closest(".section").id)}
}

function setupDraw(id,idx){
 let page=document.querySelectorAll("#"+id+" .page")[idx],c=page.querySelector(".draw-layer"); if(!c)return;
 let dpr=window.devicePixelRatio||1,rect=page.getBoundingClientRect();
 c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);
 c.style.width=rect.width+"px";c.style.height=rect.height+"px";
 let ctx=c.getContext("2d");ctx.scale(dpr,dpr);ctx.lineCap="round";ctx.lineJoin="round";
 let saved=(S[id+"_draw"]||[])[idx]; if(saved){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,rect.width,rect.height);im.src=saved}
 let drawing=false;
 c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);paint(e)};
 c.onpointermove=e=>{if(drawing)paint(e)};
 c.onpointerup=()=>{drawing=false;saveDrawing(id)};
 function paint(e){
 let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 let mode=page.dataset.drawMode||"pen";
 ctx.globalCompositeOperation=mode==="erase"?"destination-out":"source-over";
 ctx.strokeStyle=page.dataset.pen||"#e53935";ctx.lineWidth=mode==="erase"?28:10;
 if(!page._last){page._last=[x,y]}
 ctx.beginPath();ctx.moveTo(page._last[0],page._last[1]);ctx.lineTo(x,y);ctx.stroke();page._last=[x,y]
 }
 c.addEventListener("pointerup",()=>page._last=null);c.addEventListener("pointercancel",()=>page._last=null)
}

 if(t==="teacher" && HALACHA_TEACHER_PREVIEW){document.body.classList.add("teacher-mode")}
 if(t==="student"){document.body.classList.remove("teacher-mode");document.querySelectorAll(".teacher-source-panel").forEach(x=>x.classList.remove("show"))}
});


let activePiece=null;
function openCustomizer(e,ev){
 activePiece=e;
 document.querySelectorAll(".scrap").forEach(x=>x.classList.remove("selected"));e.classList.add("selected");
 let p=document.getElementById("pieceCustomizer"),r=e.getBoundingClientRect();
 p.style.left=Math.min(window.innerWidth-275,Math.max(8,r.right+8))+"px";
 p.style.top=Math.min(window.innerHeight-300,Math.max(8,r.top))+"px";
 p.classList.add("show");
 let cs=getComputedStyle(e);
 document.getElementById("pcFont").value=e.dataset.font||"Arial, sans-serif";
 document.getElementById("pcText").value=rgbToHex(cs.color)||"#243746";
 document.getElementById("pcBg").value=rgbToHex(cs.backgroundColor)||"#fff1b8";
 let fs=parseInt(cs.fontSize)||18,w=Math.round(r.width);
 document.getElementById("pcFontSize").value=Math.min(42,Math.max(12,fs));
 document.getElementById("pcWidth").value=Math.min(520,Math.max(100,w));
 document.getElementById("pcFontSizeVal").textContent=fs;
 document.getElementById("pcWidthVal").textContent=w;
}
function rgbToHex(rgb){
 let m=(rgb||"").match(/\d+/g);if(!m||m.length<3)return null;
 return "#"+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,"0")).join("");
}
function applyPieceStyle(){
 if(!activePiece)return;
 let f=document.getElementById("pcFont").value,tc=document.getElementById("pcText").value,bg=document.getElementById("pcBg").value,
 fs=document.getElementById("pcFontSize").value,w=document.getElementById("pcWidth").value;
 activePiece.dataset.font=f;activePiece.style.fontFamily=f;activePiece.style.color=tc;activePiece.style.background=bg;
 activePiece.style.fontSize=fs+"px";activePiece.style.width=w+"px";
 document.getElementById("pcFontSizeVal").textContent=fs;document.getElementById("pcWidthVal").textContent=w;
 clampPiece(activePiece);persist(activePiece.closest(".section").id)
}
function transparentPiece(){if(!activePiece)return;activePiece.style.background="transparent";persist(activePiece.closest(".section").id)}
function resetPieceStyle(){
 if(!activePiece)return;
 activePiece.style.fontFamily="";activePiece.style.color="";activePiece.style.background="";activePiece.style.fontSize="";activePiece.style.width="";
 activePiece.dataset.font="";persist(activePiece.closest(".section").id);openCustomizer(activePiece)
}
function closeCustomizer(){document.getElementById("pieceCustomizer").classList.remove("show");if(activePiece)activePiece.classList.remove("selected");activePiece=null}
document.addEventListener("pointerdown",ev=>{
 let p=ev.target.closest&&ev.target.closest(".scrap");
 if(p && !ev.target.closest("button")) {
 clearTimeout(window._pcTimer); window._pcTimer=setTimeout(()=>openCustomizer(p,ev),250);
 }
});
document.addEventListener("pointermove",()=>clearTimeout(window._pcTimer));


function printScrapbook(){
 closeCustomizer();
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("print-target"));
 // Determine the section that is actually visible on screen instead of assuming an "active" class.
 let sections=[...document.querySelectorAll(".section")];
 let current=sections.find(x=>getComputedStyle(x).display!=="none" && x.getBoundingClientRect().height>0) || sections[0];
 if(!current){alert("No scrapbook page is open.");return}
 current.classList.add("print-target");
 // Mirror drawings to a printable image background.
 current.querySelectorAll(".draw-layer").forEach(c=>{
 try{
 c.dataset.prePrintBg=c.style.backgroundImage||"";
 c.style.backgroundImage=`url("${c.toDataURL("image/png")}")`;
 c.style.backgroundSize="100% 100%";c.style.backgroundRepeat="no-repeat";
 }catch(e){}
 });
 setTimeout(()=>window.print(),200);
}
window.addEventListener("afterprint",()=>{
 document.querySelectorAll(".print-target").forEach(x=>x.classList.remove("print-target"));
 document.querySelectorAll(".draw-layer").forEach(c=>{
 c.style.backgroundImage=c.dataset.prePrintBg||"";
 c.style.backgroundSize="";c.style.backgroundRepeat="";
 });
});

</script><div id="pieceCustomizer" class="piece-customizer"><div class="pc-title">Customize this piece</div><div class="pc-row"><label>Font</label><select id="pcFont" onchange="applyPieceStyle()"><option value="Arial, sans-serif">Arial</option><option value="Georgia, serif">Book</option><option value="'Comic Sans MS', cursive">Playful</option><option value="'Trebuchet MS', sans-serif">Rounded</option><option value="'Times New Roman', serif">Classic</option></select></div><div class="pc-row"><label>Text</label><input id="pcText" type="color" value="#243746" oninput="applyPieceStyle()"><label>Background</label><input id="pcBg" type="color" value="#fff1b8" oninput="applyPieceStyle()"></div><div class="pc-row"><label>Text size</label><input id="pcFontSize" type="range" min="12" max="42" value="18" oninput="applyPieceStyle()"><span id="pcFontSizeVal">18</span></div><div class="pc-row"><label>Piece width</label><input id="pcWidth" type="range" min="100" max="520" value="220" oninput="applyPieceStyle()"><span id="pcWidthVal">220</span></div><div class="pc-row"><button onclick="transparentPiece()">No background</button><button onclick="resetPieceStyle()">Reset</button><button onclick="closeCustomizer()">Done ✓</button></div></div></body></html>
