const HALACHA_PARAMS=new URLSearchParams(location.search);
const HALACHA_TEACHER_VIEW=HALACHA_PARAMS.get("teacherView")||"";
const HALACHA_TEACHER_LESSON=HALACHA_PARAMS.get("teacher")==="1";
const HALACHA_TEACHER_PREVIEW=HALACHA_TEACHER_LESSON||!!HALACHA_TEACHER_VIEW;
const HALACHA_STUDENT_ID=String(HALACHA_TEACHER_VIEW||(HALACHA_TEACHER_LESSON?"":localStorage.getItem("b3Games_studentId")||"")).trim();
const HALACHA_LOCAL_KEY="halachaV14"+(HALACHA_STUDENT_ID?":"+HALACHA_STUDENT_ID:"");
let S={};try{S=JSON.parse(localStorage.getItem(HALACHA_LOCAL_KEY)||"{}")}catch(e){}
let halachaDb=null,cloudSaveTimer=null;
try{
 if(window.firebase&&window.B3_FIREBASE_CONFIG){
   if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
   halachaDb=firebase.database();
 }
}catch(e){console.warn("Halacha cloud save unavailable",e)}
function cloudPath(){
 return HALACHA_STUDENT_ID?"b3Games/students/"+HALACHA_STUDENT_ID+"/halacha/siman1":null;
}
function setSaveStatus(msg){let x=document.getElementById("cloudSaveStatus");if(x)x.textContent=msg}
function save(){
 if(HALACHA_TEACHER_VIEW){setSaveStatus("Teacher view — student work is read only");return}
 if(HALACHA_TEACHER_LESSON){
   try{localStorage.setItem(HALACHA_LOCAL_KEY+"_teacher",JSON.stringify(S))}catch(e){}
   setSaveStatus("Teacher lesson copy saved on this device");
   return
 }
 try{localStorage.setItem(HALACHA_LOCAL_KEY,JSON.stringify(S))}catch(e){}
 if(!halachaDb||!cloudPath()){setSaveStatus("Saved on this device");return}
 setSaveStatus("Saving…");
 clearTimeout(cloudSaveTimer);
 cloudSaveTimer=setTimeout(()=>{
   halachaDb.ref(cloudPath()).set({version:1,updatedAt:firebase.database.ServerValue.TIMESTAMP,state:S})
    .then(()=>setSaveStatus("✓ Saved to my account"))
    .catch(e=>{console.warn("Halacha cloud save failed",e);setSaveStatus("Saved on this device")});
 },350);
}
async function loadCloudHalacha(){
 if(HALACHA_TEACHER_LESSON){
   try{S=JSON.parse(localStorage.getItem(HALACHA_LOCAL_KEY+"_teacher")||"{}")}catch(e){}
   setSaveStatus("Teacher lesson mode");
   return
 }
 if(!halachaDb||!cloudPath()){setSaveStatus("Saved on this device");return}
 try{
   setSaveStatus("Loading my scrapbook…");
   const snap=await halachaDb.ref(cloudPath()).once("value"),row=snap.val();
   if(row&&row.state&&typeof row.state==="object"){
     const remote=JSON.stringify(row.state),local=JSON.stringify(S);
     if(HALACHA_TEACHER_VIEW && sessionStorage.getItem("halachaTeacherLoaded:"+HALACHA_TEACHER_VIEW)!=="1"){localStorage.setItem(HALACHA_LOCAL_KEY,remote);sessionStorage.setItem("halachaTeacherLoaded:"+HALACHA_TEACHER_VIEW,"1");location.reload();return}
     if(remote!==local && sessionStorage.getItem("halachaCloudLoaded:"+HALACHA_STUDENT_ID)!=="1"){
       localStorage.setItem(HALACHA_LOCAL_KEY,remote);
       sessionStorage.setItem("halachaCloudLoaded:"+HALACHA_STUDENT_ID,"1");
       location.reload(); return;
     }
   }else if(Object.keys(S).length){
     await halachaDb.ref(cloudPath()).set({version:1,updatedAt:firebase.database.ServerValue.TIMESTAMP,state:S});
   }
   setSaveStatus("✓ Saved to my account");
 }catch(e){console.warn("Halacha cloud load failed",e);setSaveStatus("Saved on this device")}
}

function pageCanvas(page){return page.querySelector(".canvas")}
function add(id,type,text,pageIndex=0){
 let pages=document.querySelectorAll("#"+id+" .page"),page=pages[Math.min(pageIndex,pages.length-1)],p=pageCanvas(page),e=document.createElement("div");
 e.className="scrap "+(type==="he"?"he":type==="sticker"?"sticker":type==="textbox"?"textbox":type==="workbook"?"workbook-piece":"");
 e.innerHTML=text+`<div class=mini><button onclick="event.stopPropagation();rot(this)">↻</button><button class="delete-piece" title="Delete this item" onclick="event.stopPropagation();removeP(this)">🗑</button></div><div class="resize-handle" title="Drag to resize"></div>`;
 e.style.left=(30+Math.random()*140)+"px";e.style.top=(45+Math.random()*470)+"px";
 if(type==="photo"){e.style.width="220px"}else if(type==="textbox"){e.style.width="220px";e.style.height="110px"}else if(type==="sticker"){e.style.width="90px"}else{e.style.width="220px"}
 p.appendChild(e);ensureDeleteControl(e);ensureResizeHandle(e);drag(e);clampPiece(e);persist(id)
}
function clampPiece(e){
 let page=e.closest(".page"); if(!page)return;
 let maxL=Math.max(0,page.clientWidth-e.offsetWidth-8),maxT=Math.max(0,page.clientHeight-e.offsetHeight-8);
 e.style.left=Math.min(Math.max(8,e.offsetLeft),maxL)+"px";
 e.style.top=Math.min(Math.max(8,e.offsetTop),maxT)+"px";
}
function ensureDeleteControl(e){
 if(!e||e.querySelector(".delete-piece"))return;
 let mini=e.querySelector(".mini");
 if(!mini){mini=document.createElement("div");mini.className="mini";e.appendChild(mini)}
 const del=document.createElement("button");
 del.type="button";del.className="delete-piece";del.title="Delete this item";del.textContent="🗑";
 del.onclick=ev=>{ev.stopPropagation();removeP(del)};
 mini.appendChild(del);
}
function ensureResizeHandle(e){
 if(!e||e.querySelector(".resize-handle"))return;
 // Remove the old +/- size buttons from saved pieces; resizing is now by dragging.
 e.querySelectorAll(".mini button").forEach(btn=>{
   const t=(btn.textContent||"").trim();
   if(t==="＋"||t==="+"||t==="－"||t==="-")btn.remove();
 });
 const h=document.createElement("div");
 h.className="resize-handle";h.title="Drag to resize";e.appendChild(h);
 installResize(e,h);
}
function installResize(e,h){
 if(!e||!h||h.dataset.bound==="1")return;
 h.dataset.bound="1";
 h.onpointerdown=ev=>{
   ev.preventDefault();ev.stopPropagation();
   const rect=e.getBoundingClientRect(),page=e.closest(".page");
   const startX=ev.clientX,startY=ev.clientY,startW=rect.width,startH=rect.height;
   const keepRatio=!e.classList.contains("textbox")&&!e.classList.contains("he")&&!e.classList.contains("text");
   const ratio=startW/Math.max(1,startH);
   h.setPointerCapture(ev.pointerId);
   const move=mv=>{
     let w=Math.max(60,startW+(mv.clientX-startX)),hgt=Math.max(40,startH+(mv.clientY-startY));
     if(keepRatio){
       const byW=w/ratio,byH=hgt*ratio;
       if(Math.abs(w-startW)>=Math.abs(hgt-startH)){hgt=byW}else{w=byH}
     }
     if(page){
       w=Math.min(w,Math.max(60,page.clientWidth-e.offsetLeft-8));
       hgt=Math.min(hgt,Math.max(40,page.clientHeight-e.offsetTop-8));
     }
     e.style.width=Math.round(w)+"px";
     if(e.classList.contains("textbox"))e.style.height=Math.round(hgt)+"px";
     else e.style.height="auto";
   };
   const up=()=>{
     h.onpointermove=null;h.onpointerup=null;h.onpointercancel=null;
     clampPiece(e);persist(e.closest(".section").id);
   };
   h.onpointermove=move;h.onpointerup=up;h.onpointercancel=up;
 };
}
function addTextBox(id){

}
function escText(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])).replace(/\n/g,"<br>")}
function removeP(b){
 const scrap=b.closest(".scrap");if(!scrap)return;
 const sec=scrap.closest(".section");if(!sec)return;
 const id=sec.id;

}
function size(b,f){let e=b.closest(".scrap"),z=parseFloat(e.dataset.z||1)*f;e.dataset.z=z;e.style.zoom=z;clampPiece(e);persist(e.closest(".section").id)}
function rot(b){let e=b.closest(".scrap"),r=(+e.dataset.r||0)+5;e.dataset.r=r;e.style.setProperty("--r",r+"deg");persist(e.closest(".section").id)}
function drag(e){
 let sx,sy,l,t,on=false;
 e.ondblclick=v=>{v.stopPropagation();openCustomizer(e,v)};
 e.onpointerdown=v=>{
 if(v.target.tagName==="BUTTON"||v.target.closest(".resize-handle"))return;
 on=true;sx=v.clientX;sy=v.clientY;l=e.offsetLeft;t=e.offsetTop;
 e.setPointerCapture(v.pointerId);
 document.querySelectorAll(".scrap").forEach(x=>x.classList.remove("selected"));e.classList.add("selected")
 };
 e.onpointermove=v=>{
 if(!on)return;
 let sec=e.closest(".section"),pages=[...sec.querySelectorAll(".page")],cur=e.closest(".page");
 let target=pages.find(p=>{let r=p.getBoundingClientRect();return v.clientX>=r.left&&v.clientX<=r.right&&v.clientY>=r.top&&v.clientY<=r.bottom});
 if(target && target!==cur){
 let er=e.getBoundingClientRect(),tr=target.getBoundingClientRect(),c=target.querySelector(".canvas");
 c.appendChild(e);
 e.style.left=(er.left-tr.left)+"px";e.style.top=(er.top-tr.top)+"px";
 sx=v.clientX;sy=v.clientY;l=e.offsetLeft;t=e.offsetTop;
 } else {
 e.style.left=(l+v.clientX-sx)+"px";
 e.style.top=(t+v.clientY-sy)+"px";
 }
 };
 e.onpointerup=()=>{on=false;clampPiece(e);persist(e.closest(".section").id)}
}

function setupDraw(id,idx){
 let page=document.querySelectorAll("#"+id+" .page")[idx],c=page.querySelector(".draw-layer"); if(!c)return;
 let dpr=window.devicePixelRatio||1,rect=page.getBoundingClientRect();
 c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);
 c.style.width=rect.width+"px";c.style.height=rect.height+"px";
 let ctx=c.getContext("2d");ctx.scale(dpr,dpr);ctx.lineCap="round";ctx.lineJoin="round";
 let saved=(S[id+"_draw"]||[])[idx]; if(saved){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,rect.width,rect.height);im.src=saved}
 let drawing=false;
 c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);paint(e)};
 c.onpointermove=e=>{if(drawing)paint(e)};
 c.onpointerup=()=>{drawing=false;saveDrawing(id)};
 function paint(e){
 let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 let mode=page.dataset.drawMode||"pen";
 ctx.globalCompositeOperation=mode==="erase"?"destination-out":"source-over";
 ctx.strokeStyle=page.dataset.pen||"#e53935";ctx.lineWidth=mode==="erase"?28:10;
 if(!page._last){page._last=[x,y]}
 ctx.beginPath();ctx.moveTo(page._last[0],page._last[1]);ctx.lineTo(x,y);ctx.stroke();page._last=[x,y]
 }
 c.addEventListener("pointerup",()=>page._last=null);c.addEventListener("pointercancel",()=>page._last=null)
}

function resetScrapbookPage(id,idx){
 const pages=[...document.querySelectorAll("#"+id+" .page")];
 const page=pages[idx];if(!page)return;
 if(!confirm("Reset this whole scrapbook page? This will delete every item and all drawing on this page."))return;
 const canvas=page.querySelector(".canvas");
 if(canvas)canvas.innerHTML="";
 const draw=page.querySelector(".draw-layer");
 if(draw){
   const ctx=draw.getContext("2d");
   if(ctx)ctx.clearRect(0,0,draw.width,draw.height);
 }
 page.classList.remove("drawing");
 page.querySelectorAll(".page-tools button").forEach(x=>x.classList.remove("pen-on"));
 const scrapPages=pages.map(p=>pageCanvas(p).innerHTML);
 S[id+"_scrap_pages"]=scrapPages;
 const drawings=Array.isArray(S[id+"_draw"])?S[id+"_draw"].slice():[];
 while(drawings.length<pages.length)drawings.push("");
 drawings[idx]="";
 S[id+"_draw"]=drawings;
 save();
}

function board(l){
if(l.type==="nigel")return `<div style="padding:8px 10px;margin-bottom:10px;border:2px solid #2563eb;border-radius:10px;background:#eff6ff"><b>📘 Workbook connection:</b> The reminder, how we wash, the 2 reasons and the do-not-touch rule are in the Scrapbook Tray.</div><h2>💧 נעגל וואסער</h2><p>Choose the <b>2 reasons</b> we wash our hands every morning:</p><button class=card onclick="choose(this,true,'f','Like a new person serving Hashem')">Like a new person serving Hashem</button><button class=card onclick="choose(this,false,'f','')">Only because our hands look dirty</button><button class=card onclick="choose(this,true,'f','To remove the רוח רעה from our hands')">To remove the רוח רעה that rests on our hands</button><button class=card onclick="choose(this,false,'f','')">Because it is just a nice custom</button>`;
if(l.type==="choices")return `<h2>🕵️ שויתי Challenge</h2><p><b>Choose the ONE best answer.</b></p><p>Where should a Yid remember that Hashem is with him?</p><div class=wordbank id=shivisiAnswers><button class=card onclick="singleChoice(this,false,'a')">Only in class</button><button class=card onclick="singleChoice(this,false,'a')">Only at home</button><button class=card onclick="singleChoice(this,true,'a')">Everywhere — even when nobody else is around</button></div><div id=shivisiFeedback aria-live=polite></div>`;
if(l.type==="sequence")return `<div style="padding:8px 10px;margin-bottom:10px;border:2px solid #2563eb;border-radius:10px;background:#eff6ff"><b>📘 Workbook connection:</b> מודה אני fill-in, the pause between words, and נעגל וואסער review are available in the Scrapbook Tray.</div><h2>✂️ Build the Modeh Ani card</h2><p>Click the strips in the correct order. Your finished card becomes a scrapbook piece.</p><div id=seqout class=dropzone><div class=slot>1</div><div class=slot>2</div><div class=slot>3</div></div><div class=wordbank><button class=card onclick="seq(this,'מודה אני')">מודה אני</button><button class=card onclick="seq(this,'לפניך')">לפניך</button><button class=card onclick="seq(this,'בחמלה')">בחמלה</button></div><p>Where is the important pause?</p><button class=card onclick="choose(this,true,'b','Pause after בחמלה')">After בחמלה</button><button class=card onclick="choose(this,false,'b','')">After מודה אני</button>`;
if(l.type==="match")return `<div style="padding:8px 10px;margin-bottom:10px;border:2px solid #2563eb;border-radius:10px;background:#eff6ff"><b>📘 Workbook connection:</b> Add the גבור כארי workbook segment from the Scrapbook Tray.</div><h2>🧩 Match the Four Middos</h2><p>Match each phrase to its animal. Correct matches become pieces for your page.</p><div class=matchgrid><button onclick="matchM(this,'עז כנמר','🐆')">עז כנמר → ?</button><button onclick="matchM(this,'קל כנשר','🦅')">קל כנשר → ?</button><button onclick="matchM(this,'רץ כצבי','🦌')">רץ כצבי → ?</button><button onclick="matchM(this,'גיבור כארי','🦁')">גיבור כארי → ?</button></div><div class=wordbank><span class=card>🐆 נמר</span><span class=card>🦅 נשר</span><span class=card>🦌 צבי</span><span class=card>🦁 ארי</span></div>`;
if(l.type==="comic")return `<h2>💥 Beat the Yetzer Hara!</h2><div class=comic><div class=bubble>“It’s cold! Stay under the blanket!”</div><div class=bubble>“It’s so early! Sleep longer!”</div></div><p>Pick the strongest response:</p><button class=card onclick="choose(this,true,'d','I get up with זריזות!')">I get up with זריזות!</button><button class=card onclick="choose(this,false,'d','')">Maybe tomorrow…</button><p>Someone would run early for an important business opportunity. What lesson does that teach us about עבודת ה׳?</p><button class=card onclick="choose(this,true,'d','Be at least as eager for עבודת ה׳')">Be at least as eager for עבודת ה׳</button>`;
return `<h2>🌙 Night Torah Challenge</h2><p>Choose the ideas that belong on this nighttime page.</p><button class=card onclick="choose(this,true,'e','תיקון חצות')">תיקון חצות</button><button class=card onclick="choose(this,true,'e','Torah learning at night')">Torah learning at night</button><button class=card onclick="choose(this,true,'e','משנה — אותיות נשמה')">משנה — אותיות נשמה</button><p>Teacher can use the complete review bank for the exact time/details from סעיף ה.</p>`}
let seqN=0;function seq(b,w){let slots=document.querySelectorAll("#b #seqout .slot");if(seqN>=3)return;let correct=["מודה אני","לפניך","בחמלה"][seqN];if(w===correct){slots[seqN].textContent=w;slots[seqN].classList.add("filled");b.disabled=true;seqN++;if(seqN===3){add("b","he","מודה אני לפניך בחמלה");S.b_seqdone=true;save();tryFinish("b")}}else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),300)}}
function matchM(b,txt,animal){if(b.dataset.done)return;b.textContent=txt+" "+animal;b.classList.add("good");b.dataset.done=1;add("c","he",txt+" "+animal)}
function render(l){let sec=document.createElement("div");sec.id=l.id;sec.className="section"+(l.id==="a"?" on":"");let th=S[l.id+"_theme"]||"";let workbookNotice=l.id==="a"?'<div style="margin:0 0 10px;padding:9px 11px;border:2px solid #93c5fd;border-radius:10px;background:#eff6ff;color:#1e3a8a;font-weight:800">📘 Workbook segments are included in Lessons 2 and 3.</div>':'';sec.innerHTML=`<div class=teacherOnly><div class="notes ${HALACHA_TEACHER_PREVIEW?'open':''}"><h3 style="margin-top:0">👨‍🏫 Teacher Notes — ${l.seif}</h3><div class=source>${teacherSource(l.id)}</div><p><b>What to bring out:</b> ${teacherPoint(l.id)}</p><p><b>Objective:</b> ${l.objective}</p><b>Ask students:</b><ol>${l.qs.map(q=>"<li>"+q+"</li>").join("")}</ol></div></div><div class=work><aside class=side>${workbookNotice}<h3>🎨 Scrapbook Tray</h3><div class=themeRow><button style="background:#fff3c9" onclick="setTheme('${l.id}','')"></button><button style="background:#e3f6ff" onclick="setTheme('${l.id}','blue')"></button><button style="background:#d7b27b" onclick="setTheme('${l.id}','craft')"></button><button style="background:#173758" onclick="setTheme('${l.id}','night')"></button></div><div class=step><button class=actbtn id="actbtn_${l.id}" onclick="toggleActivity('${l.id}')"></button></div><div class=step><b>Pieces to decorate with</b>${l.pieces.map(p=>`<button onclick="add('${l.id}','${p[0]}',\`${p[1]}\`)">${p[1]}</button>`).join("")}</div>${workbookTray(l.id)}<div class=step><button onclick="addTextBox('${l.id}')">✏️ Add text box</button><button onclick="document.getElementById('u_${l.id}').click()">📷 Add my picture</button><input hidden id="u_${l.id}" type=file accept="image/*" onchange="upload(event,'${l.id}')"></div><p><small>Drag pieces anywhere. Resize by dragging the blue handle on the bottom-right corner. Use ↻ to rotate. Use the crayons on each page to color and draw.</small></p></aside><div class=book><div class=spread><div class="page ${th}"><div class=activityBoard>${board(l)}</div><div class=canvas></div>${drawTools(l.id,0)}</div><div class="page ${th}"><div class=canvas></div>${drawTools(l.id,1)}</div></div></div></div>`;sections.appendChild(sec);let savedPages=S[l.id+"_scrap_pages"];if(savedPages){sec.querySelectorAll(".canvas").forEach((c,i)=>c.innerHTML=savedPages[i]||"")}else{let saved=S[l.id+"_scrap"];if(saved)sec.querySelector(".canvas").innerHTML=saved}sec.querySelectorAll(".scrap").forEach(e=>{ensureDeleteControl(e);ensureResizeHandle(e);drag(e);setTimeout(()=>clampPiece(e),0)});setTimeout(()=>{setupDraw(l.id,0);setupDraw(l.id,1)},0);let got=S[l.id+"_got"]||[];sec.querySelectorAll(".activityBoard button.card[onclick*=choose]").forEach(b=>{let m=(b.getAttribute("onclick")||"").match(/'[a-f]','([^']+)'\)/);if(m&&got.includes(m[1])){b.classList.add("good");b.disabled=true}});let ab=sec.querySelector(".activityBoard");if(S[l.id+"_done"])ab.classList.add("finished");else if(S[l.id+"_hideAct"])ab.classList.add("hidden");updateActBtn(l.id)}
lessons.forEach(render);
lessons.forEach(l=>{let b=document.createElement("button");b.dataset.id=l.id;b.textContent=(["b","c","f"].includes(l.id)?"📘 ":"")+l.tab;b.onclick=()=>show(l.id);if(l.id==="a")b.className="on";tabs.appendChild(b)});
let rb=document.createElement("button");rb.dataset.id="review";rb.textContent="🎤 Teacher Review";rb.className="teacherOnly";rb.onclick=()=>show("review");tabs.appendChild(rb);
loadCloudHalacha();
if(HALACHA_TEACHER_PREVIEW){
 setHalachaMode(true);
 setTimeout(()=>{
   const bar=document.querySelector(".bar");
   if(bar&&!document.getElementById("teacherPreviewBanner")){
     const x=document.createElement("span");x.id="teacherPreviewBanner";

let activePiece=null;
function openCustomizer(e,ev){
 activePiece=e;
 document.querySelectorAll(".scrap").forEach(x=>x.classList.remove("selected"));e.classList.add("selected");
 let p=document.getElementById("pieceCustomizer"),r=e.getBoundingClientRect();
 p.style.left=Math.min(window.innerWidth-275,Math.max(8,r.right+8))+"px";
 p.style.top=Math.min(window.innerHeight-300,Math.max(8,r.top))+"px";
 p.classList.add("show");
 let cs=getComputedStyle(e);
 document.getElementById("pcFont").value=e.dataset.font||"Arial, sans-serif";
 document.getElementById("pcText").value=rgbToHex(cs.color)||"#243746";
 document.getElementById("pcBg").value=rgbToHex(cs.backgroundColor)||"#fff1b8";
 let fs=parseInt(cs.fontSize)||18;
 document.getElementById("pcFontSize").value=Math.min(42,Math.max(12,fs));
 document.getElementById("pcFontSizeVal").textContent=fs;
}
function rgbToHex(rgb){
 let m=(rgb||"").match(/\d+/g);if(!m||m.length<3)return null;
 return "#"+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,"0")).join("");
}
function applyPieceStyle(){
 if(!activePiece)return;
 let f=document.getElementById("pcFont").value,tc=document.getElementById("pcText").value,bg=document.getElementById("pcBg").value,
 fs=document.getElementById("pcFontSize").value;
 activePiece.dataset.font=f;activePiece.style.fontFamily=f;activePiece.style.color=tc;activePiece.style.background=bg;
 activePiece.style.fontSize=fs+"px";
 document.getElementById("pcFontSizeVal").textContent=fs;
 clampPiece(activePiece);persist(activePiece.closest(".section").id)
}
function transparentPiece(){if(!activePiece)return;activePiece.style.background="transparent";persist(activePiece.closest(".section").id)}
function resetPieceStyle(){
 if(!activePiece)return;
 activePiece.style.fontFamily="";activePiece.style.color="";activePiece.style.background="";activePiece.style.fontSize="";activePiece.style.width="";
 activePiece.dataset.font="";persist(activePiece.closest(".section").id);openCustomizer(activePiece)
}
function closeCustomizer(){document.getElementById("pieceCustomizer").classList.remove("show");if(activePiece)activePiece.classList.remove("selected");activePiece=null}
document.addEventListener("pointerdown",ev=>{
 let p=ev.target.closest&&ev.target.closest(".scrap");
 if(p && !ev.target.closest("button")) {
 clearTimeout(window._pcTimer); window._pcTimer=setTimeout(()=>openCustomizer(p,ev),250);
 }
});
document.addEventListener("pointermove",()=>clearTimeout(window._pcTimer));


function printScrapbook(){
 closeCustomizer();
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("print-target"));
 // Determine the section that is actually visible on screen instead of assuming an "active" class.
 let sections=[...document.querySelectorAll(".section")];
 let current=sections.find(x=>getComputedStyle(x).display!=="none" && x.getBoundingClientRect().height>0) || sections[0];
 if(!current){alert("No scrapbook page is open.");return}
 current.classList.add("print-target");
 // Mirror drawings to a printable image background.
 current.querySelectorAll(".draw-layer").forEach(c=>{
 try{
 c.dataset.prePrintBg=c.style.backgroundImage||"";
 c.style.backgroundImage=`url("${c.toDataURL("image/png")}")`;
 c.style.backgroundSize="100% 100%";c.style.backgroundRepeat="no-repeat";
 }catch(e){}
 });
 setTimeout(()=>window.print(),200);
}
window.addEventListener("afterprint",()=>{
 document.querySelectorAll(".print-target").forEach(x=>x.classList.remove("print-target"));
 document.querySelectorAll(".draw-layer").forEach(c=>{
 c.style.backgroundImage=c.dataset.prePrintBg||"";
 c.style.backgroundSize="";c.style.backgroundRepeat="";
 });
});

</script><div id="pieceCustomizer" class="piece-customizer"><div class="pc-title">Customize this piece</div><div class="pc-row"><label>Font</label><select id="pcFont" onchange="applyPieceStyle()"><option value="Arial, sans-serif">Arial</option><option value="Georgia, serif">Book</option><option value="'Comic Sans MS', cursive">Playful</option><option value="'Trebuchet MS', sans-serif">Rounded</option><option value="'Times New Roman', serif">Classic</option></select></div><div class="pc-row"><label>Text</label><input id="pcText" type="color" value="#243746" oninput="applyPieceStyle()"><label>Background</label><input id="pcBg" type="color" value="#fff1b8" oninput="applyPieceStyle()"></div><div class="pc-row"><label>Text size</label><input id="pcFontSize" type="range" min="12" max="42" value="18" oninput="applyPieceStyle()"><span id="pcFontSizeVal">18</span></div><div class="pc-row"><button onclick="transparentPiece()">No background</button><button onclick="resetPieceStyle()">Reset</button><button onclick="closeCustomizer()">Done ✓</button></div></div></body></html>
