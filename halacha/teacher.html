<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halacha — Student Work</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#eef4f8;color:#203040}header{background:#173b62;color:#fff;padding:16px 22px}main{max-width:1100px;margin:auto;padding:20px}.status{padding:12px;background:#fff;border-radius:12px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px #0001}.card h3{margin:0 0 6px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e5f5e7;color:#25612f;font-size:12px;font-weight:bold}.empty{color:#718096}.card button{margin-top:12px;border:0;border-radius:9px;padding:9px 12px;background:#173b62;color:white;font-weight:bold;cursor:pointer}</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script><script src="../firebase-config.js"></script></head>
<body><header><h1>📔 Halacha — Student Work</h1></header><main><div id=status class=status>Checking teacher access…</div><div id=grid class=grid></div></main>
<script>
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);const db=firebase.database(),auth=firebase.auth();
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function doneCount(st){return ["a","b","c","d","e"].filter(x=>st&&st[x+"_done"]).length}
async function load(){
 const u=auth.currentUser;if(!u){status.textContent="Please open this from the signed-in Teacher Tools area.";return}
 status.textContent="Loading student Halacha books…";
 try{
  const [ts,ss]=await Promise.all([db.ref("b3Games/teachers/"+u.uid).once("value"),db.ref("b3Games/students").once("value")]);
  const teacher=ts.val()||{}, students=ss.val()||{}; grid.innerHTML="";
  const cards=[];
  Object.entries(students).forEach(([id,s])=>{
    const h=s&&s.halacha&&s.halacha.siman1;if(!h||!h.state)return;
    const n=doneCount(h.state),updated=h.updatedAt?new Date(h.updatedAt).toLocaleString():"";
    cards.push('<div class="card"><h3>'+esc(s.name||s.displayName||id)+'</h3><span class="pill">'+n+' / 5 sections started/completed</span><p>'+(updated?'Last saved: '+esc(updated):'Saved work available')+'</p><button onclick="openStudent(\''+esc(id)+'\')">Open scrapbook</button></div>');
  });
  grid.innerHTML=cards.join("")||'<div class="card empty">No student Halacha work has been saved yet.</div>';
  status.textContent="Student work — "+cards.length+" scrapbook"+(cards.length===1?"":"s");
 }catch(e){console.error(e);status.textContent="Could not load student work. Teacher access may need Firebase permission."}
}
function openStudent(id){sessionStorage.setItem("halachaTeacherViewStudent",id);location.href="index.html?teacherView="+encodeURIComponent(id)}
auth.onAuthStateChanged(load);
</script></body></html>
