name: FTT staging isolation checks

on:
  pull_request:
    paths:
      - 'staging/**'
      - 'backend/functions/**'
      - 'tests/staging-isolation.test.cjs'
      - 'e2e/staging-isolation.spec.ts'
      - '.github/workflows/ftt-staging-isolation.yml'

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/staging-isolation.test.cjs
      - name: Build and audit the complete static staging package
        env:
          B3_STAGING_FIREBASE_API_KEY: synthetic-staging-key
          B3_STAGING_FIREBASE_AUTH_DOMAIN: fun-torah-tools-staging.firebaseapp.com
          B3_STAGING_FIREBASE_DATABASE_URL: https://fun-torah-tools-staging-default-rtdb.firebaseio.com
          B3_STAGING_FIREBASE_PROJECT_ID: fun-torah-tools-staging
          B3_STAGING_FIREBASE_STORAGE_BUCKET: fun-torah-tools-staging.firebasestorage.app
          B3_STAGING_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          B3_STAGING_FIREBASE_APP_ID: 1:123456789:web:synthetic
        run: |
          mkdir -p "$RUNNER_TEMP/ftt-staging-site"
          node staging/package-site.cjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ftt-staging-site"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/staging-isolation.spec.ts --project=chromium
