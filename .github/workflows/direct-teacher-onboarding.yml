name: Direct teacher onboarding security checks
on:
  push:
    branches:
      - secure-direct-teacher-onboarding-20261015
  pull_request:
    paths:
      - 'owner-admin.html'
      - 'site-settings.js'
      - 'backend/functions/teacher-claim-core.cjs'
      - 'backend/functions/teacher-claim.js'
      - 'tests/direct-teacher-onboarding.test.cjs'
      - '.github/workflows/direct-teacher-onboarding.yml'
# Newer runs on the same PR/branch cancel superseded ones. Security and
# access checks on main get a unique group per run, so they are never
# cancelled or replaced and every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  teacher-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check teacher claim and tests
        run: |
          node --check backend/functions/teacher-claim-core.cjs
          node --check backend/functions/teacher-claim.js
          node --check tests/direct-teacher-onboarding.test.cjs
      - name: Teacher onboarding regression tests
        run: node --test tests/direct-teacher-onboarding.test.cjs
