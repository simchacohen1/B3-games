name: Chazara AI Practice (fictional only)
on:
  pull_request:
    paths:
      - 'chazara/**'
      - 'backend/functions/chazara-ai/**'
      - 'backend/functions/chazara-ai-practice.js'
      - 'backend/functions/student-practice-auth.cjs'
      - 'backend/functions/student-tool-policy.js'
      - 'backend/chazara-ai-staging/**'
      - 'tests/chazara-ai*'
      - 'scripts/chazara-ai*'
      - 'scripts/sync-chazara-ai-staging.cjs'
      - '.github/workflows/chazara-ai-practice.yml'
permissions:
  contents: read
jobs:
  chazara-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Silence check, real-words check, security, limits and privacy tests (fake transcriber, no paid services)
        run: node --test tests/chazara-ai-practice.test.cjs tests/chazara-recording-save.test.cjs tests/chazara-teacher-scope.test.cjs tests/chazara-owner-self-heal.test.cjs
      - name: Staging copy is in sync
        run: node scripts/sync-chazara-ai-staging.cjs --check
      - name: Instant silence check on generated audio files (synthetic voice, no paid services)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          bash scripts/chazara-ai-make-signal-set.sh "$RUNNER_TEMP/sigset"
          node scripts/chazara-ai-audio-eval.cjs "$RUNNER_TEMP/sigset/manifest.json" --silence-only
      - name: Browser journey (fake microphone, mocked checker)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.59.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/chazara-ai-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chazara-ai-browser-evidence
          path: test-results/chazara-ai/
          retention-days: 7
