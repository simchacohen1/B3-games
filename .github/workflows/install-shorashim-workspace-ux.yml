name: Improve Shorashim Learning Workspace

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install responsive learning-workspace UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("shorashim/index.html")
          if not path.exists():
              raise SystemExit("ERROR: shorashim/index.html was not found.")

          text = path.read_text(encoding="utf-8")
          marker = 'data-shorashim-workspace-ux="v1"'

          if marker in text:
              print("Responsive Shorashim workspace UX is already installed.")
              raise SystemExit(0)

          css = r'''
          <style data-shorashim-workspace-ux="v1">
            /*
              Responsive learning-workspace UX
              Goal: make the card creator comfortable at normal browser zoom.
            */

            /* -------- Compact learning-screen header on laptop-height screens -------- */
            body.shorashim-learning-active .topbar {
              padding-top: 14px !important;
              padding-bottom: 10px !important;
              gap: 12px !important;
            }

            body.shorashim-learning-active .topbar h1 {
              font-size: clamp(2rem, 3.1vw, 2.75rem) !important;
              line-height: 1.05 !important;
              margin-top: 4px !important;
              margin-bottom: 0 !important;
            }

            body.shorashim-learning-active #learnScreen .section-head {
              margin-top: 8px !important;
              margin-bottom: 10px !important;
              min-height: 52px;
            }

            body.shorashim-learning-active #learnScreen .section-head h2 {
              font-size: clamp(1.55rem, 2.3vw, 2rem) !important;
              line-height: 1.08 !important;
              margin: 2px 0 0 !important;
            }

            /* -------- Main two-column workspace -------- */
            #learnWorkspace .learn-layout {
              display: grid !important;
              grid-template-columns: minmax(220px, 270px) minmax(0, 1fr) !important;
              gap: 14px !important;
              align-items: start !important;
            }

            #learnWorkspace.ux-path-collapsed .learn-layout {
              grid-template-columns: minmax(0, 1fr) !important;
            }

            #learnWorkspace.ux-path-collapsed .word-list-panel {
              display: none !important;
            }

            #learnWorkspace .word-list-panel {
              position: sticky !important;
              top: 10px !important;
              max-height: calc(100vh - 165px) !important;
              overflow: hidden !important;
              padding: 14px !important;
            }

            #learnWorkspace .word-list-panel .panel-title-row {
              gap: 8px !important;
              align-items: center !important;
              flex-wrap: wrap !important;
            }

            #learnWorkspace .word-list-panel h3 {
              margin: 0 !important;
              line-height: 1.15 !important;
            }

            #learnWorkspace .word-list-panel .mini-note {
              margin: 8px 0 10px !important;
              line-height: 1.35 !important;
            }

            #learnWorkspace .word-list {
              max-height: calc(100vh - 285px) !important;
              overflow-y: auto !important;
              overscroll-behavior: contain;
              padding-right: 4px;
              scrollbar-gutter: stable;
            }

            .ux-path-toggle {
              border-radius: 999px !important;
              padding: 6px 10px !important;
              min-height: 0 !important;
              font-size: .78rem !important;
              white-space: nowrap;
            }

            /* -------- Editor -------- */
            #learnWorkspace .editor-panel {
              min-width: 0 !important;
              padding: 14px 16px 16px !important;
            }

            #learnWorkspace .editor-panel > .panel-title-row {
              margin-bottom: 8px !important;
              gap: 10px !important;
            }

            #learnWorkspace .editor-panel > .panel-title-row > div:first-child {
              min-width: 0;
            }

            #learnWorkspace #editorTitle {
              margin: 2px 0 0 !important;
              line-height: 1.15 !important;
            }

            /* Keep the two card sides large enough to use, but not so tall
               that the controls disappear below the screen. */
            #learnWorkspace .flip-stage {
              display: grid !important;
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              gap: 14px !important;
              align-items: stretch !important;
            }

            #learnWorkspace .flashcard.editable {
              min-height: 0 !important;
              height: clamp(245px, 34vh, 350px) !important;
              max-height: 350px !important;
              border-radius: 20px !important;
            }

            #learnWorkspace .flashcard .card-label {
              top: 12px !important;
              left: 12px !important;
            }

            /* -------- Editing tabs: one tool group at a time -------- */
            .ux-tool-tabs {
              display: flex;
              align-items: center;
              gap: 8px;
              margin: 12px 0 8px;
              padding: 5px;
              border: 1px solid rgba(99, 102, 241, .16);
              border-radius: 15px;
              background: rgba(248, 250, 252, .92);
              overflow-x: auto;
              scrollbar-width: thin;
            }

            .ux-tool-tab {
              appearance: none;
              border: 1px solid transparent;
              border-radius: 11px;
              padding: 9px 14px;
              background: transparent;
              color: inherit;
              font: inherit;
              font-weight: 800;
              cursor: pointer;
              white-space: nowrap;
              transition: background .15s ease, border-color .15s ease, transform .15s ease;
            }

            .ux-tool-tab:hover {
              background: #eef2ff;
            }

            .ux-tool-tab.active {
              background: #fff;
              border-color: #c7d2fe;
              box-shadow: 0 2px 9px rgba(49, 46, 129, .10);
              color: #3730a3;
            }

            .ux-tool-tab:active {
              transform: translateY(1px);
            }

            #learnWorkspace .tool-columns {
              display: block !important;
              margin-top: 0 !important;
            }

            #learnWorkspace .tool-columns > .toolbox {
              display: none !important;
              margin: 0 !important;
              padding: 13px 14px !important;
              min-height: 112px;
              border-radius: 14px !important;
            }

            #learnWorkspace .tool-columns > .toolbox.ux-tool-active {
              display: block !important;
            }

            /* Text controls become a compact two-column form. */
            #learnWorkspace .tool-columns > .toolbox[data-ux-tool="text"].ux-tool-active {
              display: grid !important;
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              gap: 9px 18px !important;
              align-items: center;
            }

            #learnWorkspace .tool-columns > .toolbox[data-ux-tool="text"] > h4 {
              grid-column: 1 / -1;
              margin: 0 0 2px !important;
            }

            #learnWorkspace .tool-columns > .toolbox[data-ux-tool="text"] > label {
              margin: 0 !important;
              gap: 8px !important;
            }

            #learnWorkspace .tool-columns > .toolbox[data-ux-tool="pictures"] .art-section-label,
            #learnWorkspace .tool-columns > .toolbox[data-ux-tool="draw"] .draw-row {
              margin-top: 6px !important;
            }

            #learnWorkspace .art-edit-row,
            #learnWorkspace .tool-columns .button-row {
              gap: 7px !important;
              flex-wrap: wrap !important;
            }

            /* -------- Always-available Save & Next -------- */
            .ux-quick-save {
              margin-left: auto !important;
              border: 0 !important;
              border-radius: 12px !important;
              padding: 9px 14px !important;
              min-height: 38px !important;
              background: #4f46e5 !important;
              color: #fff !important;
              font: inherit;
              font-weight: 900 !important;
              cursor: pointer;
              box-shadow: 0 4px 12px rgba(79, 70, 229, .18);
              white-space: nowrap;
            }

            .ux-quick-save:hover {
              filter: brightness(1.05);
            }

            .ux-quick-save[hidden] {
              display: none !important;
            }

            /* Original actions stay available but take less vertical space. */
            #learnWorkspace .editor-actions {
              margin-top: 10px !important;
              padding-top: 10px !important;
            }

            #learnWorkspace .session-footer {
              margin-top: 12px !important;
            }

            /* -------- Short laptop screens: even more compact -------- */
            @media (min-width: 901px) and (max-height: 860px) {
              body.shorashim-learning-active .topbar {
                padding-top: 9px !important;
                padding-bottom: 7px !important;
              }

              body.shorashim-learning-active .topbar h1 {
                font-size: 2.1rem !important;
              }

              body.shorashim-learning-active #learnScreen .section-head {
                margin-top: 4px !important;
                margin-bottom: 7px !important;
              }

              #learnWorkspace .flashcard.editable {
                height: clamp(220px, 31vh, 285px) !important;
                max-height: 285px !important;
              }

              #learnWorkspace .word-list-panel {
                max-height: calc(100vh - 135px) !important;
              }

              #learnWorkspace .word-list {
                max-height: calc(100vh - 250px) !important;
              }

              #learnWorkspace .tool-columns > .toolbox {
                min-height: 96px;
                padding-top: 10px !important;
                padding-bottom: 10px !important;
              }
            }

            /* -------- Narrow screens -------- */
            @media (max-width: 900px) {
              #learnWorkspace .learn-layout {
                grid-template-columns: 1fr !important;
              }

              #learnWorkspace .word-list-panel {
                position: static !important;
                max-height: none !important;
              }

              #learnWorkspace .word-list {
                max-height: 240px !important;
              }

              #learnWorkspace .flip-stage {
                grid-template-columns: 1fr !important;
              }

              #learnWorkspace .flashcard.editable {
                height: clamp(250px, 44vh, 340px) !important;
                max-height: 340px !important;
              }

              #learnWorkspace .tool-columns > .toolbox[data-ux-tool="text"].ux-tool-active {
                grid-template-columns: 1fr !important;
              }

              .ux-quick-save {
                width: 100%;
                order: 5;
                margin-left: 0 !important;
              }
            }

            @media (max-width: 560px) {
              .ux-tool-tabs {
                gap: 5px;
              }

              .ux-tool-tab {
                padding: 8px 10px;
                font-size: .86rem;
              }
            }
          </style>
          '''

          js = r'''
          <script data-shorashim-workspace-ux="v1">
          (() => {
            "use strict";

            const TOOL_DEFS = [
              { key: "text", label: "🅰 Text & Card" },
              { key: "pictures", label: "🖼 Pictures" },
              { key: "draw", label: "✏ Draw" }
            ];

            function editorIsOpen() {
              const editor = document.getElementById("editorContent");
              return !!editor && !editor.classList.contains("hidden");
            }

            function updateLearningBodyClass() {
              const learnScreen = document.getElementById("learnScreen");
              document.body.classList.toggle(
                "shorashim-learning-active",
                !!learnScreen && learnScreen.classList.contains("active")
              );
            }

            function setupToolTabs(workspace) {
              const toolColumns = workspace.querySelector(".tool-columns");
              if (!toolColumns || toolColumns.dataset.uxReady === "1") return;

              const toolboxes = Array.from(toolColumns.children)
                .filter(el => el.classList.contains("toolbox"));

              if (toolboxes.length < 3) return;

              toolColumns.dataset.uxReady = "1";

              toolboxes.slice(0, 3).forEach((box, i) => {
                box.dataset.uxTool = TOOL_DEFS[i].key;
              });

              const tabs = document.createElement("div");
              tabs.className = "ux-tool-tabs";
              tabs.setAttribute("role", "tablist");
              tabs.setAttribute("aria-label", "Card editing tools");

              TOOL_DEFS.forEach((def, index) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "ux-tool-tab";
                btn.dataset.tool = def.key;
                btn.textContent = def.label;
                btn.setAttribute("role", "tab");
                btn.setAttribute("aria-selected", "false");
                btn.addEventListener("click", () => selectTool(workspace, def.key));
                tabs.appendChild(btn);
              });

              toolColumns.parentNode.insertBefore(tabs, toolColumns);

              const remembered = sessionStorage.getItem("shorashim-editor-tool");
              const initial = TOOL_DEFS.some(x => x.key === remembered) ? remembered : "pictures";
              selectTool(workspace, initial);
            }

            function selectTool(workspace, key) {
              const tabs = workspace.querySelectorAll(".ux-tool-tab");
              tabs.forEach(btn => {
                const active = btn.dataset.tool === key;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
              });

              workspace.querySelectorAll(".tool-columns > .toolbox").forEach(box => {
                box.classList.toggle("ux-tool-active", box.dataset.uxTool === key);
              });

              try {
                sessionStorage.setItem("shorashim-editor-tool", key);
              } catch (_) {}
            }

            function setupPathToggle(workspace) {
              if (workspace.querySelector(".ux-path-toggle")) return;

              const sidebar = workspace.querySelector(".word-list-panel");
              const titleRow = sidebar?.querySelector(".panel-title-row");
              if (!sidebar || !titleRow) return;

              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "ghost small ux-path-toggle";
              btn.textContent = "Hide path";
              btn.title = "Give the card editor more room";

              btn.addEventListener("click", () => {
                const collapsed = workspace.classList.toggle("ux-path-collapsed");
                btn.textContent = collapsed ? "Show path" : "Hide path";
                btn.title = collapsed ? "Show your learning path" : "Give the card editor more room";
              });

              titleRow.appendChild(btn);
            }

            function setupQuickSave(workspace) {
              if (workspace.querySelector(".ux-quick-save")) return;

              const editorPanel = workspace.querySelector(".editor-panel");
              const titleRow = editorPanel?.querySelector(":scope > .panel-title-row");
              const originalSave = document.getElementById("saveCardBtn");
              if (!titleRow || !originalSave) return;

              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "ux-quick-save";
              btn.textContent = "Save & Next →";
              btn.title = "Save this card and continue";
              btn.addEventListener("click", () => originalSave.click());
              titleRow.appendChild(btn);

              const sync = () => {
                btn.hidden = !editorIsOpen() || originalSave.disabled;
              };

              sync();

              const observer = new MutationObserver(sync);
              const editorContent = document.getElementById("editorContent");
              if (editorContent) {
                observer.observe(editorContent, {
                  attributes: true,
                  attributeFilter: ["class"]
                });
              }
              observer.observe(originalSave, {
                attributes: true,
                attributeFilter: ["disabled", "class"]
              });
            }

            function setupWorkspace() {
              const workspace = document.getElementById("learnWorkspace");
              if (!workspace) return;

              setupToolTabs(workspace);
              setupPathToggle(workspace);
              setupQuickSave(workspace);
              updateLearningBodyClass();
            }

            function boot() {
              setupWorkspace();
              updateLearningBodyClass();

              const observer = new MutationObserver(() => {
                setupWorkspace();
                updateLearningBodyClass();
              });

              observer.observe(document.documentElement, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ["class", "disabled"]
              });
            }

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", boot, { once: true });
            } else {
              boot();
            }
          })();
          </script>
          '''

          lower = text.lower()
          head_idx = lower.rfind("</head>")
          body_idx = lower.rfind("</body>")

          if head_idx == -1 or body_idx == -1:
              raise SystemExit("ERROR: Could not find </head> and </body> in shorashim/index.html.")

          text = text[:head_idx] + css + "\n" + text[head_idx:]

          # Recalculate after adding CSS.
          lower = text.lower()
          body_idx = lower.rfind("</body>")
          text = text[:body_idx] + js + "\n" + text[body_idx:]

          path.write_text(text, encoding="utf-8")
          print("Installed responsive Shorashim learning-workspace UX.")
          PY

      - name: Commit the improved workspace
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorashim/index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Improve Shorashim learning workspace UX"
          git push
