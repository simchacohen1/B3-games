name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
# Newer runs on the same PR/branch cancel superseded ones (including main,
# where only the latest commit is what gets deployed).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      run: npx playwright test
    # Artifact hosting is auxiliary; the required Playwright step above is the test gate.
    - name: Upload Playwright report (best effort)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      continue-on-error: true
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
