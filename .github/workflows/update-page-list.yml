name: Update automatic page list

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "generate_page_list.py"
      - ".github/workflows/update-page-list.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-automatic-page-list
  cancel-in-progress: false

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Regenerate all-pages.html
        run: python3 generate_page_list.py

      - name: Propose the generated page list
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-page-list
          delete-branch: true
          commit-message: "Automatically update page list"
          title: "Update automatic page list"
          body: "Regenerate all-pages.html from the current main branch."
          add-paths: all-pages.html
