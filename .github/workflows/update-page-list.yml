name: Update automatic page list

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "generate_page_list.py"
      - ".github/workflows/update-page-list.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-automatic-page-list
  cancel-in-progress: false

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate and publish all-pages.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 generate_page_list.py
            git add all-pages.html

            if git diff --cached --quiet; then
              echo "No changes needed."
              exit 0
            fi

            git commit -m "Automatically update page list"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main changed while generating; regenerating from the new main."
            sleep $((attempt * 2))
          done

          echo "Could not publish the generated page list after 3 attempts."
          exit 1
