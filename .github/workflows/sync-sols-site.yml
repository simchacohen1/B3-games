name: Sync sols.tools site

# Every release to main is copied straight away to simchacohen1/sols-school-site,
# which GitHub Pages serves at https://sols.tools with Shluchim Online School
# branding. funtorahtools.com is still served from this repository and is not
# touched by this workflow. Both sites use the same live Firebase project.
#
# Uses the SOLS_SITE_DEPLOY_KEY secret: the private half of a deploy key that
# can write to sols-school-site only. The "Update from B3-games" workflow in
# that repository stays as a backup and does nothing when this one has already
# copied the same commit (both record it in .sols-source).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-sols-site
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'simchacohen1/B3-games'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this release
        uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false

      - name: Build the sols.tools copy
        run: |
          node src/sols-site/build.mjs src
          rm -rf src/.git src/.github

      - name: Open the sols-school-site repository
        env:
          DEPLOY_KEY: ${{ secrets.SOLS_SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::The SOLS_SITE_DEPLOY_KEY secret is missing, so sols.tools cannot be updated from here."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sols_site_key
          chmod 600 ~/.ssh/sols_site_key
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/sols_site_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          git clone --depth 1 git@github.com:simchacohen1/sols-school-site.git site

      - name: Copy the release into sols-school-site
        run: |
          rsync -a --delete --exclude '.git' --exclude '.github' src/ site/
          echo "${GITHUB_SHA}" > site/.sols-source
          cd site
          test "$(cat CNAME)" = "sols.tools"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          # --force: the copied .gitignore must not hide files that B3-games publishes.
          git add -A --force
          if git diff --cached --quiet; then
            echo "sols.tools already matches this release."
            exit 0
          fi
          git commit -q -m "Update from B3-games@${GITHUB_SHA} (main)"
          git push origin HEAD:main
          echo "sols.tools updated from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/sols_site_key
