name: Kriah assessment (fictional only)
on:
  pull_request:
    paths:
      - 'kriah-assessment/**'
      - 'backend/kriah-staging/**'
      - 'scripts/kriah-fixture.cjs'
      - 'tests/kriah*'
      - 'firebase.kriah-staging.json'
      - '.github/workflows/kriah-assessment.yml'
permissions:
  contents: read
jobs:
  kriah-fictional:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model, service, privacy and recorder tests
        run: node --test tests/kriah-assessment.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Fictional browser journey (no Firebase)
        run: python tests/kriah-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kriah-fictional-browser-evidence
          path: test-results/kriah/
          retention-days: 7
