name: Approved question-bank security rules
on:
  push:
    branches: [main, feature/outstanding-improvements]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix tests/rules ci
      - name: Test actual database rules in a local demo project
        env:
          FIREBASE_CLI_DISABLE_USAGE: '1'
        run: tests/rules/node_modules/.bin/firebase emulators:exec --config firebase.preview-tests.json --project demo-ftt-tests --only database 'node tests/rules/approved-banks.test.cjs'
