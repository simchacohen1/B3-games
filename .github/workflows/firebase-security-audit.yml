name: Firebase security regression audit

on:
  push:
    branches:
      - main
      - 'security/**'
    paths:
      - 'firebase-rules.json'
      - 'scripts/security-rule-audit.cjs'
      - 'security/public-permissions-baseline.json'
      - 'security/reviewed-permission-expressions.json'
      - 'tests/firebase-rule-permission-drift.test.cjs'
      - 'tests/firebase-security-audit.test.cjs'
      - '.github/workflows/firebase-security-audit.yml'
  pull_request:
    paths:
      - 'firebase-rules.json'
      - 'scripts/security-rule-audit.cjs'
      - 'security/public-permissions-baseline.json'
      - 'security/reviewed-permission-expressions.json'
      - 'tests/firebase-rule-permission-drift.test.cjs'
      - 'tests/firebase-security-audit.test.cjs'
      - '.github/workflows/firebase-security-audit.yml'

# Newer runs on the same PR/branch cancel superseded ones. Security and
# access checks on main get a unique group per run, so they are never
# cancelled or replaced and every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Firebase security-audit tests
        run: node --test tests/firebase-security-audit.test.cjs tests/firebase-rule-permission-drift.test.cjs
      - name: Block newly public database grants and private-path exposure
        run: node scripts/security-rule-audit.cjs --ci
