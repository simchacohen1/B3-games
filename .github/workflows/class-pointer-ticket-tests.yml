name: Class Pointer ticket regression
on:
  push:
    branches:
      - fix/pointer-student-share-flow-oct16
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/class-pointer-ticket-tests.yml'
      - 'backend/functions/class-pointer-share-auth.js'
      - 'backend/functions/class-pointer-share-ticket-cleanup.js'
      - 'firebase-rules.json'
      - 'tests/class-pointer-*.test.cjs'
      - 'tests/class-pointer-session-rules-emulator.cjs'
      - 'e2e/class-pointer-activity-screen.spec.cjs'
  workflow_dispatch:
jobs:
  ticket-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install pinned Firebase emulator CLI
        run: npm install --global firebase-tools@15.26.0
      - name: Verify class-scoped database authorization in the emulator
        run: firebase emulators:exec --only database --project demo-class-pointer "node --test tests/class-pointer-session-rules-emulator.cjs"
      - name: Install Chromium for simulated media test
        run: npx playwright install --with-deps chromium
      - name: Run authorization and simulated connection tests
        run: node --test tests/class-pointer-join-ticket.test.cjs tests/class-pointer-share-ticket-retry.test.cjs tests/class-pointer-ticket-cleanup.test.cjs tests/class-pointer-session-rules.test.cjs tests/class-pointer-activity-screen-e2e.test.cjs tests/class-pointer-sharing-cache.test.cjs tests/class-pointer-dashboard-ui.test.cjs
      - name: Run browser screen receiver test
        run: npx playwright test e2e/class-pointer-activity-screen.spec.cjs --project=chromium --workers=1
