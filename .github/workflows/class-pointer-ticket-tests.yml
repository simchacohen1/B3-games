name: Class Pointer ticket regression
on:
  push:
    branches:
      - fix/pointer-student-share-flow-oct16
  workflow_dispatch:
jobs:
  ticket-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Chromium for simulated media test
        run: npx playwright install --with-deps chromium
      - name: Run authorization and simulated connection tests
        run: node --test tests/class-pointer-share-ticket-retry.test.cjs tests/class-pointer-activity-screen-e2e.test.cjs tests/class-pointer-sharing-cache.test.cjs
      - name: Run browser screen receiver test
        run: npx playwright test e2e/class-pointer-activity-screen.spec.cjs --project=chromium --workers=1
