name: Migration access checks
on:
  push:
    branches: [main]
  pull_request:
# Newer runs on the same PR/branch cancel superseded ones. Security and
# access checks on main get a unique group per run, so they are never
# cancelled or replaced and every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  access-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci
      - name: Run class, teacher role, and backend regression tests
        run: node --test tests/*.test.cjs
      - name: Validate migrated frontend and backend JavaScript
        run: |
          node --check site-settings.js
          node --check game-gate.js
          node --check access-guard.js
          node --check yiddish/app.js
          node --check yiddish/teacher.js
          node --check backend/functions/yiddish-service/core.cjs
          node --check backend/functions/teacher-claim.js
          node --check backend/functions/student-management.js
          find backend/functions -type f \( -name "*.js" -o -name "*.cjs" \) -exec node --check {} \;
