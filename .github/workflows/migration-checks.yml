name: Migration access checks
on:
  push:
    branches: [main]
  pull_request:
# Newer runs on the same PR/branch cancel superseded ones. Security and
# access checks on main get a unique group per run, so they are never
# cancelled or replaced and every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  access-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm ci
      - name: Install backend emulator dependencies
        run: npm ci --prefix backend/functions --ignore-scripts
      - name: Run Firebase Realtime Database and Storage security tests in the emulator
        env:
          B3_RUN_RTDB_EMULATOR_TESTS: '1'
          B3_RUN_STORAGE_EMULATOR_TESTS: '1'
          FIREBASE_DATABASE_EMULATOR_PORT: '19100'
          FIREBASE_STORAGE_EMULATOR_PORT: '19199'
          JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2 -Xmx2g'
        run: npx firebase emulators:exec --project demo-ftt-security --config firebase.security-test.json --only database,storage "node --test tests/security-rules-emulator.test.cjs && node --test tests/storage-rules-emulator.test.cjs"
      - name: Install Playwright Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Run class, teacher role, and backend regression tests
        # These two legacy files use Playwright Test and target the hosted site;
        # the Playwright workflow owns browser execution. Keep Node's runner on
        # actual node:test files instead of invoking test() outside its runner.
        run: |
          mapfile -t node_tests < <(find tests -maxdepth 1 -name '*.test.cjs' ! -name 'auth-check.test.cjs' ! -name 'firebase-bandwidth.test.cjs' -print)
          node --test "${node_tests[@]}"
      - name: Run synthetic multi-teacher browser journey with local emulators
        env:
          B3_RUN_RTDB_EMULATOR_TESTS: '1'
          FIREBASE_DATABASE_EMULATOR_PORT: '19100'
          JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2 -Xmx2g'
        run: npx firebase emulators:exec --project demo-ftt-readiness --config firebase.security-test.json --only auth,database,storage,functions "npx playwright test e2e/firebase-auth-emulator.spec.ts e2e/synthetic-multiteacher-classroom.spec.ts --project=chromium --workers=1"
      - name: Test Classroom Pointer whiteboards and screen sharing
        run: npx playwright test e2e/class-pointer-teacher-workspace.spec.ts --project=chromium
      - name: Validate migrated frontend and backend JavaScript
        run: |
          node --check site-settings.js
          node --check game-gate.js
          node --check access-guard.js
          node --check yiddish/app.js
          node --check yiddish/teacher.js
          node --check backend/functions/yiddish-service/core.cjs
          node --check backend/functions/teacher-claim.js
          node --check backend/functions/student-management.js
          find backend/functions -type f \( -name "*.js" -o -name "*.cjs" \) -exec node --check {} \;
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-classroom-evidence
          path: |
            test-results/
            playwright-report/
            firebase-debug.log
            database-debug.log
          retention-days: 7
