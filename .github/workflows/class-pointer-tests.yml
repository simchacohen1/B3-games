name: Classroom Pointer checks
on:
  push:
    paths:
      - 'class-pointer-prototype/**'
      - 'tests/class-pointer-workspace-regression.test.cjs'
      - '.github/workflows/class-pointer-tests.yml'
  pull_request:
    paths:
      - 'class-pointer-prototype/**'
      - 'tests/class-pointer-workspace-regression.test.cjs'
      - '.github/workflows/class-pointer-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check class-pointer-prototype/activity-share.js
          node --check class-pointer-prototype/activity-screen-teacher.js
          node --check class-pointer-prototype/classroom.js
          node --check class-pointer-prototype/student-boards.js
          node --check backend/functions/class-pointer-share-auth.js
      - name: Classroom Pointer regression tests
        run: node --test tests/class-pointer-workspace-regression.test.cjs
