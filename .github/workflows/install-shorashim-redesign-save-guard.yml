name: Install Shorashim redesign + save guard

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Shorashim student experience
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("shorashim/app.js")
          index_path = Path("shorashim/index.html")
          if not app_path.exists():
              raise SystemExit("shorashim/app.js was not found")
          if not index_path.exists():
              raise SystemExit("shorashim/index.html was not found")

          text = app_path.read_text(encoding="utf-8")
          original = text

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              text = text.replace(old, new, 1)

          # 1) Learned cards are editable only when the student deliberately enters redesign mode.
          old = "function canEditItem(key,s=student()){if(!s.activeSession)return false;const [track]=splitKey(key);if(track!==s.activeSession.track)return false;return isSessionNew(key,s)||keyFor(track,nextUncreated(track,s)?.id||'')===key;}"
          new = "function canEditItem(key,s=student()){const [track]=splitKey(key),card=s.cards[key];if(window.__shorashimRedesignMode)return track===currentTrack&&!!card?.learnedAt;if(!s.activeSession)return false;if(track!==s.activeSession.track)return false;return isSessionNew(key,s)||keyFor(track,nextUncreated(track,s)?.id||'')===key;}"
          replace_once(old, new, "canEditItem")

          # 2) Leaving the learning screen exits redesign mode cleanly.
          old = "function goScreen(id){if(activeScreenId==='gamesScreen'&&id!=='gamesScreen')cleanupGameRuntime();document.querySelectorAll('#studentView .screen').forEach(s=>s.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active');activeScreenId=id;window.scrollTo(0,0);lastInteraction=Date.now();if(id==='learnScreen')renderLearningScreen();if(id==='reviewScreen'){renderReviewAvailability();renderDailyStatus();}if(id==='gamesScreen')renderGamesLock();if(id==='galleryScreen')renderGallery();}"
          new = "function goScreen(id){if(activeScreenId==='gamesScreen'&&id!=='gamesScreen')cleanupGameRuntime();if(id!=='learnScreen'&&window.__shorashimRedesignMode){window.__shorashimRedesignMode=false;window.__shorashimRedesignKey=null;window.__shorashimEditorDirty=false;selectedItemKey=null;}document.querySelectorAll('#studentView .screen').forEach(s=>s.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active');activeScreenId=id;window.scrollTo(0,0);lastInteraction=Date.now();if(id==='learnScreen')renderLearningScreen();if(id==='reviewScreen'){renderReviewAvailability();renderDailyStatus();}if(id==='gamesScreen')renderGamesLock();if(id==='galleryScreen')renderGallery();}"
          replace_once(old, new, "goScreen")

          # 3) Learning screen supports a separate redesign mode without starting a new learning session.
          old = "function renderLearningScreen(){const as=student().activeSession;if(as)currentTrack=as.track;document.getElementById('learnHeading').textContent=`Learn New ${labelTrack(currentTrack)}`;document.getElementById('pathTitle').textContent=`Your ${labelTrack(currentTrack)} Path`;document.getElementById('startSessionTitle').textContent=`Ready for new ${labelTrack(currentTrack)}?`;renderSession();renderWordList();if(as){const next=nextUncreated(currentTrack);const reopen=as.newCardIds[as.newCardIds.length-1];if(!selectedItemKey){if(next)loadEditorItem(keyFor(currentTrack,next.id));else if(reopen)loadEditorItem(reopen);else showNoMoreItems();}}}"
          new = "function renderLearningScreen(){const as=student().activeSession,redesigning=!!window.__shorashimRedesignMode;if(as)currentTrack=as.track;document.getElementById('learnHeading').textContent=redesigning?`Redesign Learned ${labelTrack(currentTrack)}`:`Learn New ${labelTrack(currentTrack)}`;document.getElementById('pathTitle').textContent=redesigning?`Your Learned ${labelTrack(currentTrack)}`:`Your ${labelTrack(currentTrack)} Path`;document.getElementById('startSessionTitle').textContent=`Ready for new ${labelTrack(currentTrack)}?`;renderSession();renderWordList();if(redesigning){if(selectedItemKey)loadEditorItem(selectedItemKey);return;}if(as){const next=nextUncreated(currentTrack);const reopen=as.newCardIds[as.newCardIds.length-1];if(!selectedItemKey){if(next)loadEditorItem(keyFor(currentTrack,next.id));else if(reopen)loadEditorItem(reopen);else showNoMoreItems();}}}"
          replace_once(old, new, "renderLearningScreen")

          old = "function renderSession(){const as=student().activeSession;document.getElementById('startSessionPanel').classList.toggle('hidden',!!as);document.getElementById('learnWorkspace').classList.toggle('hidden',!as);document.getElementById('sessionStatus').textContent=as?'Session active':'No active session';document.getElementById('sessionNewCount').textContent=`${as?.newCardIds.length||0} new card${as?.newCardIds.length===1?'':'s'}`;if(!as){document.getElementById('emptyEditor').classList.remove('hidden');document.getElementById('editorContent').classList.add('hidden');}}"
          new = "function renderSession(){const as=student().activeSession,redesigning=!!window.__shorashimRedesignMode,workspaceOpen=!!as||redesigning;document.getElementById('startSessionPanel').classList.toggle('hidden',workspaceOpen);document.getElementById('learnWorkspace').classList.toggle('hidden',!workspaceOpen);document.getElementById('sessionStatus').textContent=redesigning?'Redesign mode':(as?'Session active':'No active session');document.getElementById('sessionNewCount').textContent=`${as?.newCardIds.length||0} new card${as?.newCardIds.length===1?'':'s'}`;const footer=document.querySelector('#learnWorkspace .session-footer');if(footer)footer.classList.toggle('hidden',redesigning);if(!workspaceOpen){document.getElementById('emptyEditor').classList.remove('hidden');document.getElementById('editorContent').classList.add('hidden');}}"
          replace_once(old, new, "renderSession")

          old = "function renderWordList(){const box=document.getElementById('wordList'),s=student(),list=db.catalog[currentTrack]||[],visible=list.filter(x=>!x.hidden),next=nextUncreated(currentTrack,s),created=visible.filter(i=>s.cards[keyFor(currentTrack,i.id)]).length;document.getElementById('availableCount').textContent=`${created} / ${visible.length} created`;box.innerHTML='';list.forEach(item=>{if(item.hidden)return;const key=keyFor(currentTrack,item.id),c=s.cards[key],newNow=isSessionNew(key,s),isNext=next?.id===item.id,editable=canEditItem(key,s),b=document.createElement('button');b.type='button';let cls='word-row',status='🔒 Locked';if(c?.learnedAt){cls+=' learned';status='Learned';}else if(newNow){cls+=' session-new';status='NEW';}else if(isNext&&s.activeSession){cls+=' current';status='NEXT';}else cls+=' locked';if(selectedItemKey===key)cls+=' active';b.className=cls;b.disabled=!editable;b.innerHTML=`<div class=\"hebrew\">${escapeHTML(item.front)}</div><div class=\"meta\"><span>${escapeHTML(item.english)}</span><span>${status}</span></div>`;if(editable)b.onclick=()=>loadEditorItem(key);box.appendChild(b);});}"
          new = "function renderWordList(){const box=document.getElementById('wordList'),s=student(),list=db.catalog[currentTrack]||[],visible=list.filter(x=>!x.hidden),next=nextUncreated(currentTrack,s),created=visible.filter(i=>s.cards[keyFor(currentTrack,i.id)]).length,redesigning=!!window.__shorashimRedesignMode;document.getElementById('availableCount').textContent=redesigning?`${learnedCards(s,currentTrack,false).length} learned`:`${created} / ${visible.length} created`;box.innerHTML='';list.forEach(item=>{if(item.hidden)return;const key=keyFor(currentTrack,item.id),c=s.cards[key],newNow=isSessionNew(key,s),isNext=next?.id===item.id,editable=canEditItem(key,s),b=document.createElement('button');b.type='button';let cls='word-row',status='🔒 Locked';if(c?.learnedAt){cls+=' learned';status=redesigning?'Learned • Edit':'Learned';}else if(newNow){cls+=' session-new';status='NEW';}else if(isNext&&s.activeSession){cls+=' current';status='NEXT';}else cls+=' locked';if(selectedItemKey===key)cls+=' active';b.className=cls;b.disabled=!editable;b.innerHTML=`<div class=\"hebrew\">${escapeHTML(item.front)}</div><div class=\"meta\"><span>${escapeHTML(item.english)}</span><span>${status}</span></div>`;if(editable)b.onclick=()=>loadEditorItem(key);box.appendChild(b);});}"
          replace_once(old, new, "renderWordList")

          # 4) Dirty tracking: controls, drawing, art edits and drag movements count as adjustments.
          marker = "function bindEditor(){"
          if text.count(marker) != 1:
              raise SystemExit("bindEditor marker not found exactly once")
          dirty_code = """function markShorashimEditorDirty(){window.__shorashimEditorDirty=true;}\nfunction bindEditor(){\nconst editor=document.getElementById('editorContent');\neditor.addEventListener('input',markShorashimEditorDirty,true);\neditor.addEventListener('change',markShorashimEditorDirty,true);\neditor.addEventListener('click',e=>{if(e.target.closest('#emojiChoices button,#illustrationChoices button,#artSmallerBtn,#artBiggerBtn,#removeArtBtn,#removeAllArtBtn,#undoBtn,#clearDrawingBtn,#resetCardBtn'))markShorashimEditorDirty();},true);\nlet editorDragActive=false;\neditor.addEventListener('pointerdown',e=>{if(e.target.closest('.movable,.art-item,#drawCanvas'))editorDragActive=true;if(e.target.closest('#drawCanvas'))markShorashimEditorDirty();},true);\ndocument.addEventListener('pointermove',e=>{if(editorDragActive&&e.buttons)markShorashimEditorDirty();},true);\ndocument.addEventListener('pointerup',()=>{editorDragActive=false;},true);"""
          text = text.replace(marker, dirty_code, 1)

          # 5) Loading a card resets dirty state and labels learned cards correctly.
          old = "function loadEditorItem(key){const s=student(),item=getItem(key);if(!item||!canEditItem(key,s))return;selectedItemKey=key;const existing=s.cards[key],d=normalizeDesign(existing?.design);document.getElementById('emptyEditor').classList.add('hidden');document.getElementById('editorContent').classList.remove('hidden');document.getElementById('editorTitle').textContent=`${item.front} — ${item.english}`;document.getElementById('hebrewText').textContent=item.front;document.getElementById('englishText').textContent=item.english;setExamples(item);Object.entries({hebrewSize:d.hebrewSize,hebrewFont:d.hebrewFont,hebrewColor:d.hebrewColor,englishSize:d.englishSize,englishFont:d.englishFont,englishColor:d.englishColor,backgroundColor:d.backgroundColor}).forEach(([id,v])=>document.getElementById(id).value=v);const h=document.getElementById('hebrewText'),e=document.getElementById('englishText');h.style.left=d.hebrewPos.left+'%';h.style.top=d.hebrewPos.top+'%';e.style.left=d.englishPos.left+'%';e.style.top=d.englishPos.top+'%';renderArtChoices(item);renderEditorArts(d.arts);applyEditorControls();clearCanvas(false);drawHistory=[];if(d.drawing)loadDrawing(d.drawing);const badge=document.getElementById('newBadge');badge.textContent=existing?'NEW':'NEXT';badge.classList.remove('hidden');document.getElementById('saveCardBtn').textContent=existing?'Save Changes & Continue':'Save Card & Go to Next';renderWordList();}"
          new = "function loadEditorItem(key){const s=student(),item=getItem(key);if(!item||!canEditItem(key,s))return;selectedItemKey=key;window.__shorashimRedesignKey=window.__shorashimRedesignMode?key:null;const existing=s.cards[key],d=normalizeDesign(existing?.design);document.getElementById('emptyEditor').classList.add('hidden');document.getElementById('editorContent').classList.remove('hidden');document.getElementById('editorTitle').textContent=`${item.front} — ${item.english}`;document.getElementById('hebrewText').textContent=item.front;document.getElementById('englishText').textContent=item.english;setExamples(item);Object.entries({hebrewSize:d.hebrewSize,hebrewFont:d.hebrewFont,hebrewColor:d.hebrewColor,englishSize:d.englishSize,englishFont:d.englishFont,englishColor:d.englishColor,backgroundColor:d.backgroundColor}).forEach(([id,v])=>document.getElementById(id).value=v);const h=document.getElementById('hebrewText'),e=document.getElementById('englishText');h.style.left=d.hebrewPos.left+'%';h.style.top=d.hebrewPos.top+'%';e.style.left=d.englishPos.left+'%';e.style.top=d.englishPos.top+'%';renderArtChoices(item);renderEditorArts(d.arts);applyEditorControls();clearCanvas(false);drawHistory=[];if(d.drawing)loadDrawing(d.drawing);const badge=document.getElementById('newBadge'),learned=!!existing?.learnedAt;badge.textContent=learned?'LEARNED':(existing?'NEW':'NEXT');badge.classList.remove('hidden');document.getElementById('saveCardBtn').textContent=learned?'Save Redesign':(existing?'Save Changes & Continue':'Save Card & Go to Next');window.__shorashimEditorDirty=false;renderWordList();}"
          replace_once(old, new, "loadEditorItem")

          # 6) Save guard + learned-card redesign persistence.
          save_pattern = re.compile(r"async function saveCurrentCard\(\)\{.*?\n\}\nfunction resetCurrentDesign", re.S)
          matches = list(save_pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"saveCurrentCard block: expected 1 match, found {len(matches)}")
          save_replacement = r'''async function saveCurrentCard(){
          const s=student(),as=s.activeSession,item=getItem(selectedItemKey),existing=s.cards[selectedItemKey],redesigning=!!window.__shorashimRedesignMode&&!!existing?.learnedAt;
          if((!as&&!redesigning)||!item||!canEditItem(selectedItemKey,s))return;
          const wasNew=!existing;
          if(!window.__shorashimEditorDirty){
            const happy=confirm('You have not changed this card. Are you happy with this card as it is?');
            if(!happy)return;
          }
          const btn=document.getElementById('saveCardBtn'),oldLabel=btn.textContent;btn.disabled=true;btn.textContent='Saving…';
          try{
          const drawingData=canvasHasInk()?canvas.toDataURL('image/png'):'';
          const drawing=await saveDrawingToCloud(selectedItemKey,drawingData);
          const d={hebrewSize:+document.getElementById('hebrewSize').value,hebrewFont:document.getElementById('hebrewFont').value,hebrewColor:document.getElementById('hebrewColor').value,englishSize:+document.getElementById('englishSize').value,englishFont:document.getElementById('englishFont').value,englishColor:document.getElementById('englishColor').value,backgroundColor:document.getElementById('backgroundColor').value,hebrewPos:stylePos(document.getElementById('hebrewText'),document.getElementById('frontCard')),englishPos:stylePos(document.getElementById('englishText'),document.getElementById('backCard')),arts:serializeArts(),drawing};
          s.cards[selectedItemKey]={itemKey:selectedItemKey,itemType:existing?.itemType||currentTrack,itemId:item.id,createdAt:existing?.createdAt||Date.now(),learnedAt:existing?.learnedAt||null,sessionId:existing?.sessionId||as?.id||null,design:d};
          if(wasNew&&as&&!as.newCardIds.includes(selectedItemKey))as.newCardIds.push(selectedItemKey);
          s.lastActive=Date.now();saveDB();renderWordList();renderStudentStats();window.__shorashimEditorDirty=false;
          if(redesigning){document.getElementById('sessionStatus').textContent='Redesign saved ✓';renderGallery();return;}
          const next=nextUncreated(currentTrack,s);if(next)loadEditorItem(keyFor(currentTrack,next.id));else showNoMoreItems();
          }finally{btn.disabled=false;btn.textContent=oldLabel;}
          }
          function resetCurrentDesign'''
          text = save_pattern.sub(save_replacement, text, count=1)

          # 7) Gallery gets an explicit Redesign button for learned cards.
          gallery_pattern = re.compile(r"function renderGallery\(target='galleryGrid',s=student\(\)\)\{.*?\}\nfunction galleryHTML\(c\)\{.*?\}\nfunction galleryArtsHTML", re.S)
          gm = list(gallery_pattern.finditer(text))
          if len(gm) != 1:
              raise SystemExit(f"gallery block: expected 1 match, found {len(gm)}")
          gallery_replacement = r'''function openRedesignCard(itemKey){const s=student(),card=s.cards[itemKey];if(!card?.learnedAt)return;if(s.activeSession){alert('Finish your current learning session before redesigning an older learned card.');return;}currentTrack=card.itemType;window.__shorashimRedesignMode=true;window.__shorashimRedesignKey=itemKey;selectedItemKey=itemKey;goScreen('learnScreen');}
          function renderGallery(target='galleryGrid',s=student()){const box=document.getElementById(target);if(!box)return;const cards=Object.values(s.cards).sort((a,b)=>b.createdAt-a.createdAt);if(!cards.length){box.innerHTML='<div class="card-panel empty-state">No cards created yet.</div>';return;}const studentGallery=target==='galleryGrid';box.innerHTML=cards.map(c=>galleryHTML(c,studentGallery)).join('');if(studentGallery)box.querySelectorAll('[data-redesign-key]').forEach(btn=>btn.onclick=()=>openRedesignCard(btn.dataset.redesignKey));}
          function galleryHTML(c,allowRedesign=false){const item=getItem(c.itemKey);if(!item)return '';const d=normalizeDesign(c.design),ex=(item.examples||[]).slice(0,2).map(x=>escapeHTML(x.hebrew)).join('<br>'),edit=allowRedesign&&c.learnedAt?`<button type="button" class="ghost small" data-redesign-key="${escapeHTML(c.itemKey)}">✏️ Redesign</button>`:'';return `<div class="gallery-item"><div class="gallery-card" style="background:${d.backgroundColor}"><div class="g-hebrew" style="font-family:${d.hebrewFont};color:${d.hebrewColor};left:${d.hebrewPos.left}%;top:${d.hebrewPos.top}%">${escapeHTML(item.front)}</div><div class="g-examples">${ex}</div><div class="gallery-art-layer">${galleryArtsHTML(d.arts)}</div>${d.drawing?`<img class="g-drawing" src="${d.drawing}" alt="drawing">`:''}</div><div class="g-meta"><span>${singularTrack(c.itemType)}${item.pasuk?` • Pasuk ${item.pasuk}`:''}</span><span>${c.learnedAt?'Learned '+fmtDate(c.learnedAt):'New'}</span></div>${edit}</div>`;}
          function galleryArtsHTML'''
          text = gallery_pattern.sub(gallery_replacement, text, count=1)

          app_path.write_text(text, encoding="utf-8")

          # Update the student-facing explanation so the behavior is discoverable.
          html = index_path.read_text(encoding="utf-8")
          old_note = "Items unlock strictly in order. You may reopen cards made in this session; future items stay locked."
          new_note = "Items unlock strictly in order. You may redesign learned cards from My Card Gallery; future items stay locked."
          if old_note not in html:
              raise SystemExit("index note text was not found")
          html = html.replace(old_note, new_note, 1)
          index_path.write_text(html, encoding="utf-8")

          if text == original:
              raise SystemExit("No app.js changes were made")
          print("Patched Shorashim successfully.")
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: node --check shorashim/app.js

      - name: Commit the fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorashim/app.js shorashim/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Allow learned-card redesign and confirm unchanged saves"
          git push
