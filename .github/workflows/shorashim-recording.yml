name: Shorashim tests
on:
  pull_request:
    paths:
      - 'shorashim/**'
      - 'tests/shorashim-recording-repair.test.cjs'
      - 'tests/shorashim-picture-costs.test.cjs'
      - 'tests/shorashim-card-transition.test.cjs'
      - '.github/workflows/shorashim-recording.yml'
  push:
    paths:
      - 'shorashim/**'
      - 'tests/shorashim-recording-repair.test.cjs'
      - 'tests/shorashim-picture-costs.test.cjs'
      - 'tests/shorashim-card-transition.test.cjs'
      - '.github/workflows/shorashim-recording.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shorashim saving regression
        run: node --test tests/shorashim-recording-repair.test.cjs tests/shorashim-picture-costs.test.cjs tests/shorashim-card-transition.test.cjs
