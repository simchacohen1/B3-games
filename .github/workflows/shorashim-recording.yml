name: Shorashim tests
on:
  pull_request:
    paths:
      - 'shorashim/**'
      - 'tests/shorashim-recording-repair.test.cjs'
      - 'tests/shorashim-picture-costs.test.cjs'
      - 'tests/shorashim-card-transition.test.cjs'
      - 'tests/shorashim-teacher-screenshots.test.cjs'
      - '.github/workflows/shorashim-recording.yml'
  push:
    paths:
      - 'shorashim/**'
      - 'tests/shorashim-recording-repair.test.cjs'
      - 'tests/shorashim-picture-costs.test.cjs'
      - 'tests/shorashim-card-transition.test.cjs'
      - 'tests/shorashim-teacher-screenshots.test.cjs'
      - '.github/workflows/shorashim-recording.yml'

# Keep only the newest pending run for each workflow and branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shorashim saving regression
        run: node --test tests/shorashim-recording-repair.test.cjs tests/shorashim-picture-costs.test.cjs tests/shorashim-card-transition.test.cjs tests/shorashim-teacher-screenshots.test.cjs
