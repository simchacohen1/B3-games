name: Game Show focused checks
on:
  pull_request:
    paths:
      - 'game-show/**'
      - 'tests/game-show*.test.cjs'
      - '.github/workflows/game-show-focused.yml'
  push:
    branches: [main]
    paths:
      - 'game-show/**'
      - 'tests/game-show*.test.cjs'
      - '.github/workflows/game-show-focused.yml'
# Newer runs on the same PR/branch cancel superseded ones (including main,
# where only the latest commit is what gets deployed).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  game-show:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Game Show regression tests
        run: node --test tests/game-show*.test.cjs
      - name: Game Show JavaScript syntax
        run: |
          find game-show -maxdepth 1 -type f -name '*.js' -exec node --check {} \;
