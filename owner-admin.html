<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fun Torah Tools — Owner Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1f2937}header{background:#172033;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px}h1{margin:0;font-size:25px}.sub{color:#b9c6da;font-size:13px;margin-top:5px}.back{color:#fff;text-decoration:none;font-weight:800;background:#2b3953;padding:10px 14px;border-radius:10px}main{max-width:1050px;margin:28px auto;padding:0 18px}.notice{background:#eef2ff;border:1px solid #c7d2fe;border-radius:15px;padding:15px 17px;margin-bottom:20px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 5px 16px rgba(15,23,42,.06)}.icon{font-size:34px}.card h2{font-size:19px;margin:10px 0 6px}.card p{color:#64748b;line-height:1.45;margin:0}.status{margin-top:13px;font-size:12px;font-weight:900;color:#6d28d9;background:#f5f3ff;border-radius:999px;display:inline-block;padding:6px 9px}.gate{max-width:520px;margin:70px auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 30px rgba(15,23,42,.12);text-align:center}.gate button{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.hidden{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script><script src="firebase-config.js?v=20261001-teacherauth"></script>
</head><body>
<header><div><h1>Fun Torah Tools — Owner Admin</h1><div class="sub">Platform-wide management</div></div><a class="back" href="index.html">← Back to B3</a></header>
<main>
<div id="gate" class="gate"><h2>Owner access</h2><p id="gateMsg">Checking your signed-in Google account…</p><button id="signIn" class="hidden" type="button">Sign in with Google</button></div>
<div id="ownerArea" class="hidden">
<div class="notice"><strong>Owner level:</strong> Manage the Fun Torah Tools platform here. B3 is your first classroom.</div>
<div class="grid">
<section class="card"><div class="icon">👨‍🏫</div><h2>Teachers</h2><input id="teacherEmail" placeholder="Teacher Gmail"><input id="teacherName" placeholder="Teacher name"><button id="addTeacher">Add teacher</button><div id="teachers"></div></section>
<section class="card"><div class="icon">🏫</div><h2>Classes</h2><input id="className" placeholder="New class name"><button id="addClass">Add class</button><div id="classes"></div></section>
<section class="card"><div class="icon">🔗</div><h2>Teacher → Class</h2><select id="teacherSelect"><option value="">Choose teacher</option></select><select id="classSelect"><option value="">Choose class</option></select><button id="assign">Assign</button><p id="status"></p></section>
</div></div></main>
<style>
.card input,.card select{width:100%;padding:11px;margin:6px 0;border:1px solid #cbd5e1;border-radius:9px}.card button{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.entry{padding:9px 0;border-bottom:1px solid #e2e8f0}.entry small{display:block;color:#64748b}
</style>
<script>
(function(){
const OWNER="simcha5770@gmail.com",WS=(window.B3_APP_CONTEXT&&window.B3_APP_CONTEXT.workspaceId)||"b3-2026";
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.database(),q=id=>document.getElementById(id);let teacherData={},classData={};
function key(s){return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")}
function safe(s){const d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
async function load(){
 const ts=await db.ref("b3Games/workspaces/"+WS+"/teacherInvites").once("value"),cs=await db.ref("b3Games/workspaces/"+WS+"/classes").once("value");teacherData=ts.val()||{};classData=cs.val()||{};
 q("teachers").innerHTML="";q("teacherSelect").innerHTML='<option value="">Choose teacher</option>';
 Object.entries(teacherData).forEach(([id,v])=>{q("teachers").insertAdjacentHTML("beforeend",'<div class="entry"><b>'+safe(v.name||v.email)+'</b><small>'+safe(v.email)+'</small></div>');q("teacherSelect").insertAdjacentHTML("beforeend",'<option value="'+id+'">'+safe(v.name||v.email)+'</option>')});
 q("classes").innerHTML="";q("classSelect").innerHTML='<option value="">Choose class</option>';
 Object.entries(classData).forEach(([id,v])=>{q("classes").insertAdjacentHTML("beforeend",'<div class="entry"><b>'+safe(v.name||id)+'</b></div>');q("classSelect").insertAdjacentHTML("beforeend",'<option value="'+id+'">'+safe(v.name||id)+'</option>')});
}
q("addTeacher").onclick=async()=>{const email=q("teacherEmail").value.trim().toLowerCase(),name=q("teacherName").value.trim();if(!email.includes("@"))return;await db.ref("b3Games/workspaces/"+WS+"/teacherInvites/"+key(email)).set({email:email,name:name||email,role:"teacher",active:true});q("teacherEmail").value="";q("teacherName").value="";await load()};
q("addClass").onclick=async()=>{const name=q("className").value.trim();if(!name)return;let id=key(name);const exists=await db.ref("b3Games/workspaces/"+WS+"/classes/"+id).once("value");if(exists.exists())id+="_"+Date.now().toString().slice(-4);await db.ref("b3Games/workspaces/"+WS+"/classes/"+id).set({name:name,active:true});q("className").value="";await load()};
q("assign").onclick=async()=>{const t=q("teacherSelect").value,c=q("classSelect").value;if(!t||!c){q("status").textContent="Choose a teacher and class.";return}await db.ref("b3Games/workspaces/"+WS+"/teacherInvites/"+t+"/classIds/"+c).set(true);q("status").textContent="Assigned."};
q("signIn").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
auth.onAuthStateChanged(async user=>{const owner=user&&String(user.email||"").toLowerCase()===OWNER;if(owner){q("gate").classList.add("hidden");q("ownerArea").classList.remove("hidden");await load();return}q("ownerArea").classList.add("hidden");q("gate").classList.remove("hidden");q("signIn").classList.remove("hidden");q("gateMsg").textContent=user?"This Google account is not the Fun Torah Tools owner.":"Sign in with the Fun Torah Tools owner Google account."});
})();
</script></body></html>
