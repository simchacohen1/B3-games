<style>
  body { font-family: Calibri, Arial, sans-serif; background: #fdf6ec; margin: 0; padding: 20px; color: #3a2417; text-align: center; }
  h1 { color: #b85042; margin-bottom: 4px; }
  .subtitle { color: #7d5236; margin-bottom: 20px; font-style: italic; }
  .name-box { max-width: 420px; margin: 0 auto 30px auto; background: white; border: 1px solid #d9a85c; border-radius: 12px; padding: 24px; text-align: left; }
  .name-box h2 { margin: 0 0 6px; text-align: center; color: #7d5236; }
  .login-note { margin: 0 0 18px; text-align: center; color: #7d5236; font-size: 14px; }
  .name-box label { display: block; font-weight: bold; margin: 12px 0 5px; }
  .name-box input { font-size: 18px; padding: 11px 12px; width: 100%; border-radius: 8px; border: 1px solid #d9a85c; box-sizing: border-box; }
  .name-box button { font-size: 17px; padding: 11px 16px; border-radius: 8px; border: none; background: #7d5236; color: white; cursor: pointer; margin-top: 16px; width: 100%; }

  .buzz-btn:disabled { background: #ccc; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 16px; color: #7d5236; }

  .scoreboard h2 { margin: 0 0 14px; color: #7d5236; font-size: 21px; }
  .scoreboard table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .scoreboard th, .scoreboard td { padding: 12px 8px; border-bottom: 1px solid #f0e3d0; }
  .scoreboard th { color: #7d5236; font-size: 14px; }
  .scoreboard th:first-child { width: 42px; }
  .scoreboard th:last-child, .scoreboard td:last-child { width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  .scoreboard td:nth-child(2) { overflow-wrap: anywhere; }
  .scoreboard .your-row { background: #fff3d9; font-weight: bold; }
  .scoreboard-empty { color: #7d5236; }
  .hidden { display: none; }
  .master-blocked { max-width: 400px; margin: 60px auto 0 auto; background: white; border-radius: 12px; border: 1px solid #d9a85c; padding: 28px; font-size: 18px; }
  /* Fit the play controls and scores in one screen at normal zoom. */
  body { box-sizing: border-box; height: 100dvh; padding: 10px 14px; display: flex; flex-direction: column; }
  h1 { margin: 0 0 3px; font-size: 26px; }
  .subtitle { margin-bottom: 8px; font-size: 14px; }
  #gameArea { display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; max-width: 600px; margin: 0 auto; }
  #gameArea.hidden { display: none; }

  .qnum { margin-bottom: 4px; }

  .buzz-btn { width: 108px; height: 108px; font-size: 20px; padding: 10px; box-shadow: 0 4px 0 #78342a; }
  .buzz-btn:disabled { box-shadow: none; }
  .countdown { margin-top: 8px; font-size: 17px; }
  .status { margin-top: 8px; font-size: 15px; }

  #gameArea > .scoreboard { display: flex; flex-direction: column; flex: 1; min-height: 0; margin: 0; padding: 12px; }
  .scoreboard h2 { margin-bottom: 8px; font-size: 18px; flex-shrink: 0; }
  .scoreboard-list { flex: 1; min-height: 0; overflow-y: auto; }
  .scoreboard th, .scoreboard td { padding: 8px; font-size: 14px; }

  @media (max-height: 600px) {
    .buzz-btn { width: 88px; height: 88px; font-size: 18px; }
    .qtext { font-size: 17px; }
    #gameArea > .panel { padding: 8px 12px; }
  }
</style>
<script src="../teacher-account.js"></script></head>
<body>

<h1>Game Show</h1>
<div class="subtitle">Get ready to play!</div>

<div class="master-blocked hidden" id="masterBlocked">
  This game is currently turned off. Ask your teacher.
</div>

<div class="name-box" id="nameBox">
  <h2>Student Login</h2>
  <p class="login-note">Use the same student name and passcode as Fun Torah Tools.</p>
  <label for="classPinInput">Passcode</label>
  <input type="password" id="classPinInput" placeholder="Ask your teacher" maxlength="20" inputmode="numeric" autocomplete="off" />
  <label for="studentNameInput">Your name</label>
  <input type="text" id="studentNameInput" placeholder="Type your name" maxlength="30" autocomplete="name" />
  <button id="joinButton" onclick="joinGame()">Join Game</button>
  <div id="loginMsg" class="login-msg" aria-live="polite"></div>
</div>

<div id="gameArea" class="hidden">
  <div class="signed-in">
    <span>Playing as <b id="signedInName"></b></span>
    <button class="switch-btn" id="switchStudentBtn" type="button">Switch student</button>
  </div>
  <div class="panel">
    <div class="qnum" id="qnum">Question 1 of 1</div>
    <div class="qtext" id="qtext" tabindex="0" role="region" aria-label="Question"></div>
    <button class="buzz-btn" id="buzzBtn" onclick="buzzIn()">BUZZ IN</button>
    <div class="countdown" id="countdown"></div>
    <div class="status" id="status"></div>
  </div>
  <div class="score-display">Your score: <span id="myScore">0</span></div>
  <section class="panel scoreboard" aria-labelledby="scoreboardTitle">
    <h2 id="scoreboardTitle">Players &amp; scores</h2>
    <p id="scoreboardEmpty" class="scoreboard-empty">Waiting for players to join.</p>
    <div class="scoreboard-list" tabindex="0" role="region" aria-label="Player scoreboard">
    <table id="scoreboardTable" class="hidden" aria-label="Live player scores">
      <thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Score</th></tr></thead>
      <tbody id="scoreboardRows"></tbody>
    </table>
    </div>
  </section>
</div>

<script>
// ---- REPLACE WITH YOUR FIREBASE CONFIG (same as teacher.html) ----
const firebaseConfig = {
  apiKey: "AIzaSyDaheO5K2qL8qe3rHIZY4nTd0wuEUG_DEs",
  authDomain: "b3-games.firebaseapp.com",
  databaseURL: "https://b3-games-default-rtdb.firebaseio.com",
  projectId: "b3-games",
  storageBucket: "b3-games.firebasestorage.app",
  messagingSenderId: "568530046190",
  appId: "1:568530046190:web:fd765fdd27e55a3c73f7ff"
};
// --------------------------------------------------------------------

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// A class other than B3's own (et/wt) plays its own separate game with its own questions.
const GS_CLASS = (new URLSearchParams(location.search).get('class') || sessionStorage.getItem('b3Games_studentClass') || '').trim();
const CLASS_SPACE = /^[A-Za-z0-9_-]{1,100}$/.test(GS_CLASS) && !['et', 'wt'].includes(GS_CLASS);
const gameRef = db.ref(CLASS_SPACE ? 'questionSets/classes/' + GS_CLASS + '/live' : "tentTrailTrivia");

// Questions live in the database (teacher.html is the master copy). This
// screen just reads them live - you never need to edit this file for
// question changes.
const ACTIVE_SET_ID = "vayeira18";
const setRef = db.ref(CLASS_SPACE ? 'questionSets/classes/' + GS_CLASS + '/set' : "questionSets/" + ACTIVE_SET_ID);

let questions = [];
let questionsReady = false;

setRef.on('value', snap => {
  const data = snap.val();
  if (data && data.questions) {
    questions = data.questions;
    questionsReady = true;
  }
});

let myName = "";
let myStudentId = "";
let teacherPreview=false;

function sanitize(name) {
  return String(name || '').replace(/[.#$\[\]]/g, '_');
}

function slugify(name) {
  return String(name || '')
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
}

function setLoginMsg(text) {
  document.getElementById('loginMsg').textContent = text || '';
}

// Master admin toggle: the same b3Games/siteSettings node the B3 Games
// homepage admin panel writes to. If the whole site or just this game has
// been switched off, block joining and show the closed message - even for
// a student who already had this tab open.
let masterBlocked = false;
function applyMasterBlocked() {
  if(teacherPreview)masterBlocked=false;
  document.getElementById('masterBlocked').classList.toggle('hidden', !masterBlocked);
  if (masterBlocked) {
    document.getElementById('nameBox').classList.add('hidden');
    document.getElementById('gameArea').classList.add('hidden');
  } else if (myStudentId) {
    document.getElementById('nameBox').classList.add('hidden');
    document.getElementById('gameArea').classList.remove('hidden');
  } else {
    document.getElementById('nameBox').classList.remove('hidden');
    document.getElementById('gameArea').classList.add('hidden');
  }
}
db.ref('b3Games/siteSettings').on('value', snap => {
  const settings = snap.val() || {};
  const gamesMap = settings.games || {};
  masterBlocked = settings.siteEnabled === false || gamesMap['game-show'] === false;
  applyMasterBlocked();
}, err => {
  console.warn('Could not read master site settings', err);
  masterBlocked = false;
  applyMasterBlocked();
});

// This is the exact same student-access source used by Posuk Practice and
// Shorashim: one shared Class PIN plus the teacher-approved student roster.
async function checkStudentAccess(name, pin) {
  const slug=slugify(name);if(!slug)return {ok:false,reason:'Please type your name.'};
  const profileSnap=await db.ref('b3Games/students/'+slug+'/profile').once('value');
  let profile=profileSnap.val();
  if(!profile){
    const legacySnap=await db.ref('posukPractice/allowedStudents/'+slug).once('value');
    if(!legacySnap.exists())return {ok:false,reason:'Ask your teacher to add your name first.'};
    const legacy=legacySnap.val()||{};profile={name:legacy.name||name,passcode:String(legacy.passcode||'5770'),active:legacy.active!==false};
  }
  if(profile.active===false)return {ok:false,reason:'Your student access is turned off. Ask your teacher.'};
  if(String(profile.passcode||'').trim()!==String(pin).trim())return {ok:false,reason:'Incorrect passcode. Ask your teacher.'};
  return {ok:true,slug,displayName:String(profile.name||name.trim())};
}

function enterGame(displayName, studentId) {
  myStudentId = studentId;
  myName = sanitize(displayName);

  sessionStorage.setItem('posukPractice_studentName', displayName);
  sessionStorage.setItem('posukPractice_studentId', studentId);

  document.getElementById('signedInName').textContent = displayName;
  gameRef.child('scores').child(myName).transaction(current => current || 0);
  applyMasterBlocked();

  renderScoreboard(lastData && lastData.scores);
}

async function joinGame() {
  location.href='../index.html';return;
  if (masterBlocked) return;

  const name = document.getElementById('studentNameInput').value.trim();
  const pin = document.getElementById('classPinInput').value.trim();
  const joinButton = document.getElementById('joinButton');

  if (!name) {
    setLoginMsg('Please type your name.');
    return;
  }

  joinButton.disabled = true;
  setLoginMsg('Checking…');

  try {
    const result = await checkStudentAccess(name, pin);
    if (!result.ok) {
      setLoginMsg(result.reason);
      return;
    }

    setLoginMsg('');
    enterGame(result.displayName, result.slug);
  } catch (error) {
    console.error('Game Show login failed:', error);
    setLoginMsg('Could not check your login. Try again.');
  } finally {
    joinButton.disabled = false;
  }
}

async function restoreSharedStudentLogin() {
const account=await window.B3TeacherAccountReady;
if(account.user&&account.authorized&&!window.B3SiteSettings.getActingStudent()){
teacherPreview=true;myStudentId='teacher_preview';myName='Teacher Preview';masterBlocked=false;
document.getElementById('signedInName').textContent='Teacher Preview ? practice buzzer, no live game changes';applyMasterBlocked();
if(!questions.length)questions=[{q:'How many days are in a week?'}];questionsReady=true;
renderGameSnapshot({val:()=>({qIndex:0,hostSeenAt:Date.now(),scores:{'Teacher Preview':0}})});return;
}
  const savedId=sessionStorage.getItem('b3Games_studentId')||sessionStorage.getItem('posukPractice_studentId');
  const savedName=sessionStorage.getItem('b3Games_studentName')||sessionStorage.getItem('posukPractice_studentName');
  if(!savedId||!savedName)return;
  try{
    const profileSnap=await db.ref('b3Games/students/'+savedId+'/profile').once('value');
    let profile=profileSnap.val();
    if(!profile){
      const legacySnap=await db.ref('posukPractice/allowedStudents/'+savedId).once('value');
      if(!legacySnap.exists())return;
      profile=legacySnap.val()||{};
    }
    if(profile.active===false)return;
    enterGame(profile.name?String(profile.name):savedName,savedId);
  }catch(error){console.warn('Could not restore shared student login:',error);}
}

// Students switch accounts on the Fun Torah Tools homepage only.
document.getElementById('switchStudentBtn').addEventListener('click', () => { location.href='../index.html'; });

['classPinInput', 'studentNameInput'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      joinGame();
    }
  });
});

restoreSharedStudentLogin();

let sharedPlayerCtx = null;

function playBuzzSound() {
  if (!sharedPlayerCtx) {
    sharedPlayerCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (sharedPlayerCtx.state === "suspended") { sharedPlayerCtx.resume(); }
  const ctx = sharedPlayerCtx;
  const notes = [523, 659, 784];
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
    gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.08);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + i * 0.08 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.25);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + i * 0.08);
    osc.stop(ctx.currentTime + i * 0.08 + 0.25);
  });
}

function mustSitOut(data, name) {
  return !!(data && data.lastWinner === name && (data.lastWinnerStreak || 0) >= 2);
}

function buzzIn() {
  if(teacherPreview){renderGameSnapshot({val:()=>({...lastData,buzzedBy:myName})});playBuzzSound();return;}
  if (masterBlocked || !myName || mustSitOut(lastData, myName)) return;
  if (lockedUntil && Date.now() < lockedUntil) return;
  if (lastData && lastData.buzzedBy) return;
  // A root transaction keeps winner and streak together even when students
  // buzz simultaneously or another tab has newer state.
  gameRef.transaction(current => {
    if (!current || current.buzzedBy || mustSitOut(current, myName)) return;
    if (current.buzzerDelayOn && Date.now() < (current.buzzUnlockAt || 0)) return;
    if (current.revealDelayOn) {
      if (current.buzzPool && current.buzzPool[myName]) return;
      current.buzzPool = current.buzzPool || {};
      current.buzzPool[myName] = true;
    } else {
      const round = String(current.buzzOpenAt || 0) + ':' + (current.qIndex || 0);
      if (current.lastWinnerRound !== round) {
        current.lastWinnerStreak = current.lastWinner === myName ? (current.lastWinnerStreak || 0) + 1 : 1;
        current.lastWinner = myName;
        current.lastWinnerRound = round;
      }
      current.buzzedBy = myName;
      current.selectedPlayer = myName;
    }
    return current;
  }, (error, committed) => {
    if (error) document.getElementById('status').textContent = 'Could not buzz in. Please try again.';
    else if (committed) playBuzzSound();
  });
}

let lockedUntil = 0;
let countdownInterval = null;
let lastData = null;

function updateBuzzAvailability() {
  const buzzBtn = document.getElementById('buzzBtn');
  const countdownEl = document.getElementById('countdown');
  const now = Date.now();

  if (mustSitOut(lastData, myName)) {
    buzzBtn.disabled = true;
    countdownEl.textContent = '';
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
    return;
  }
  if (lockedUntil && now < lockedUntil) {
    buzzBtn.disabled = true;
    const secsLeft = Math.ceil((lockedUntil - now) / 1000);
    countdownEl.textContent = 'Wait ' + secsLeft + '...';
    if (!countdownInterval) {
      countdownInterval = setInterval(updateBuzzAvailability, 250);
    }
  } else {
    countdownEl.textContent = '';
    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }
    // Only re-enable if nobody has buzzed in yet, and (in randomize-winner
    // mode) I haven't already buzzed myself this question.
    const iAlreadyBuzzed = !!(lastData && lastData.revealDelayOn && lastData.buzzPool && lastData.buzzPool[myName]);
    if (!lastData || (!lastData.buzzedBy && !iAlreadyBuzzed)) {
      buzzBtn.disabled = false;
    }
  }
}

// The game is "live" only while the teacher's Game Show screen is open (it updates
// hostSeenAt every 20 seconds) or a question was opened recently.
const LIVE_WINDOW_MS = 10 * 60 * 1000;
function gameIsLive(d) {
  const last = Math.max(Number(d && d.hostSeenAt) || 0, Number(d && d.buzzOpenAt) || 0);
  return last > 0 && Date.now() - last < LIVE_WINDOW_MS;
}
function showWaiting(waiting) {
  const panel = document.querySelector('#gameArea .panel:not(#waitingMsg)');
  let w = document.getElementById('waitingMsg');
  if (!w) {
    w = document.createElement('div'); w.id = 'waitingMsg'; w.className = 'panel';
    w.innerHTML = '<div class="qtext">⏳ Waiting for your teacher to start the Game Show.</div><div class="status">This page will start by itself when the game begins.</div>';
    panel.parentNode.insertBefore(w, panel);
  }
  w.style.display = waiting ? '' : 'none';
  panel.style.display = waiting ? 'none' : '';
}
setInterval(() => { if (lastData) showWaiting(!gameIsLive(lastData)); }, 15000);

// Use the current game's score roster, so each class sees its own players.
function renderScoreboard(scores) {
  const players = Object.entries(scores || {}).map(([name, score]) => ({
    name, score: Number.isFinite(Number(score)) ? Number(score) : 0
  })).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  const rows = document.getElementById('scoreboardRows');
  rows.replaceChildren();
  document.getElementById('scoreboardEmpty').classList.toggle('hidden', players.length > 0);
  document.getElementById('scoreboardTable').classList.toggle('hidden', players.length === 0);
  document.getElementById('myScore').textContent = (players.find(player => player.name === myName) || { score: 0 }).score;
  let rank = 0;
  players.forEach((player, index) => {
    if (index === 0 || player.score !== players[index - 1].score) rank = index + 1;
    const row = document.createElement('tr');
    const isYou = player.name === myName;
    row.classList.toggle('your-row', isYou);
    [rank, player.name + (isYou ? ' (you)' : ''), player.score].forEach(value => {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.appendChild(cell);
    });
    rows.appendChild(row);
  });
}

gameRef.on('value', snapshot => {if(!teacherPreview)renderGameSnapshot(snapshot);});
function renderGameSnapshot(snapshot){
  const data = snapshot.val() || {};
  lastData = data;
  renderScoreboard(data.scores);
  if (!questionsReady) return; // Scores can update while questions load.
  showWaiting(!gameIsLive(data));
  const qIndex = data.qIndex || 0;
  const q = questions[qIndex] || questions[0];
  document.getElementById('qnum').textContent = 'Question ' + (qIndex + 1) + ' of ' + questions.length;
  document.getElementById('qtext').textContent = q.q;

  lockedUntil = data.buzzerDelayOn ? (data.buzzUnlockAt || 0) : 0;

  const buzzBtn = document.getElementById('buzzBtn');
  const status = document.getElementById('status');
  const iAlreadyBuzzed = !!(data.revealDelayOn && data.buzzPool && data.buzzPool[myName]);
  if (data.buzzedBy) {
    buzzBtn.disabled = true;
    status.textContent = data.buzzedBy === myName ? "You buzzed in first!" : data.buzzedBy + " buzzed in first.";
    document.getElementById('countdown').textContent = '';
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  } else if (mustSitOut(data, myName)) {
    buzzBtn.disabled = true;
    status.textContent = 'You won two buzz-ins in a row. Let another player have a turn!';
    document.getElementById('countdown').textContent = '';
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  } else if (iAlreadyBuzzed) {
    buzzBtn.disabled = true;
    status.textContent = "You buzzed in! Waiting...";
    document.getElementById('countdown').textContent = '';
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  } else {
    status.textContent = "";
    updateBuzzAvailability();
  }


}
</script>
