<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posuk Practice — Teacher Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Quicksand:wght@500;600;700&family=Noto+Serif+Hebrew:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1F2D3D;
    --navy-light: #2E4257;
    --parchment: #F1E7CE;
    --gold: #C9A227;
    --gold-light: #E4C662;
    --rimon: #8C2F39;
    --ink: #24344A;
    --ink-soft: #5A6C82;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Quicksand', sans-serif;
    background: linear-gradient(180deg, var(--navy) 0%, #16202c 100%);
    color: #E9E4D4;
    min-height:100vh;
  }
  .wrap{ max-width: 1400px; margin:0 auto; padding: 22px 24px 50px; }
  header{ text-align:center; margin-bottom: 16px; }
  header h1{
    font-family:'Frank Ruhl Libre', serif;
    color: var(--gold-light);
    margin:0 0 3px;
    font-size: 1.65rem;
  }
  header p{ margin:0; color:#B7C2D0; font-size:0.88rem; }
  :focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }

  .gate{
    max-width: 360px; margin: 60px auto; background:#26374A; border-radius:14px;
    padding:24px; text-align:center; border: 2px solid var(--gold);
  }
  .gate input{
    font-size:1.1rem; padding:10px 14px; border-radius:10px; border:none; width:100%;
    margin: 12px 0; text-align:center;
  }

  .btn{
    font-family:'Quicksand', sans-serif; font-weight:700; border:none; border-radius:999px;
    padding: 10px 22px; cursor:pointer; color:#fff; background: var(--rimon);
    box-shadow: 0 4px 0 #6e1f28; display:inline-flex; align-items:center; gap:7px;
    transition: filter .1s ease;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ transform: translateY(2px); box-shadow:none; }
  .btn.gold{ background: var(--gold); color:var(--ink); box-shadow: 0 4px 0 #97781a; }
  .btn.small{ padding:9px 16px; font-size:0.85rem; }

  .layout{ display:flex; gap:22px; align-items:flex-start; }
  .students-toggle-btn{ display:none; }
  .students-panel{
    flex: 0 0 230px;
    background:#26374A;
    border: 2px solid #3A5068;
    border-radius: 14px;
    padding: 14px;
    max-height: 78vh;
    overflow-y:auto;
  }
  .students-panel h2{
    font-size:0.82rem; color: var(--gold-light); margin:0 0 10px;
    text-transform:uppercase; letter-spacing:0.04em; font-weight:700;
  }
  .student-search-input{
    width:100%; box-sizing:border-box; padding:8px 12px; margin-bottom:10px;
    border-radius:10px; border:2px solid #3A5068; background:#1c2a38; color:#E9E4D4;
    font-family:'Quicksand', sans-serif; font-size:0.85rem;
  }
  .student-search-input::placeholder{ color:#8494a6; }
  .student-search-input:focus{ outline:none; border-color:var(--gold); }
  .student-count{ font-size:0.72rem; color:#9fb0c2; font-weight:600; margin: -4px 0 10px; }
  /* Small section labels above each group of students in the sidebar
     (e.g. "B3 WT" / "B3 ET" / "Ungrouped") so a teacher with multiple
     classes/cohorts can tell at a glance who's in which one. */
  .student-group-header{
    font-size:0.68rem; font-weight:700; color:#8fa2b8; text-transform:uppercase;
    letter-spacing:0.05em; margin: 14px 0 6px; padding-top:8px; border-top:1px solid #33475d;
  }
  .student-group-header:first-of-type{ margin-top:0; padding-top:0; border-top:none; }
  .student-item{
    padding: 12px 14px;
    border-radius: 10px;
    cursor:pointer;
    margin-bottom: 8px;
    font-weight:700;
    color: #FFFFFF;
    display:flex; flex-direction:column; align-items:flex-start; gap:4px;
    border: 2px solid transparent;
    transition: background .1s ease, border-color .1s ease;
  }
  .student-item:hover{ background: #32475e; border-color:#4A6580; }
  .student-item.active{ background: var(--gold); color: var(--ink); }
  .student-item .name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .student-item .last-active{ font-size:0.75rem; opacity:0.75; font-weight:600; color:#C7D3E0; }
  .student-item.active .last-active{ color:#5A4A18; opacity:1; }

  .main-panel{
    flex: 1 1 500px;
    background: var(--parchment);
    color: var(--ink);
    border-radius: 16px;
    padding: 22px 26px;
    min-height: 400px;
  }
  .main-panel h2{
    font-family:'Frank Ruhl Libre', serif;
    color: var(--rimon);
    margin: 0 0 14px;
    font-size: 1.45rem;
  }
  .filters{ display:flex; gap:8px; margin-bottom: 14px; flex-wrap:wrap; }
  .filters select{
    padding:8px 10px; border-radius:8px; border:2px solid var(--ink-soft); font-family:'Quicksand', sans-serif;
  }

  .posuk-group{
    background:#fff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .posuk-group h3{
    font-family:'Frank Ruhl Libre', serif;
    margin:0 0 4px;
    color: var(--ink);
    font-size:1rem;
  }
  .posuk-hebrew{
    font-family:'Noto Serif Hebrew', serif;
    direction:rtl;
    font-size:1.3rem;
    color:#3B2A1E;
    margin: 4px 0 10px;
  }
  .attempt-row{
    border-top: 1px dashed #ccc;
    padding: 8px 0;
    font-size:0.85rem;
  }
  .attempt-row .top-line{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; margin-bottom:4px;}
  .row{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:3px 0; font-size:0.9rem; }
  .row .label{ color: var(--ink-soft); }
  .score-pill{
    background: var(--gold-light); border-radius:999px; padding:2px 10px; font-weight:700; font-size:0.75rem;
  }
  audio{ height:32px; max-width: 240px; }
  .comp-result{
    margin-top: 6px;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.85rem;
    display:flex;
    flex-wrap: wrap;
    align-items:center;
    gap:8px;
  }
  .comp-result.excellent{ background:#E4EAF4; border:2px solid var(--tent-navy, var(--ink)); }
  .comp-result.correct{ background:#E4F4E4; border:2px solid #4C9A4C; }
  .comp-result.partial{ background:#FBF0D9; border:2px solid var(--gold); }
  .comp-result.incorrect{ background:#F6E1E1; border:2px solid var(--rimon); }
  .comp-badge{
    font-weight:700;
    border-radius: 999px;
    padding: 4px 12px;
    font-size:0.75rem;
    white-space:nowrap;
    color:#fff;
  }
  .comp-result.excellent .comp-badge{ background: var(--tent-navy, var(--ink)); }
  .comp-result.correct .comp-badge{ background:#4C9A4C; }
  .comp-result.partial .comp-badge{ background: var(--gold); color: var(--ink); }
  .comp-result.incorrect .comp-badge{ background: var(--rimon); }
  .hebrew-word-breakdown{
    width:100%; font-family:'Frank Ruhl Libre', serif; font-size:1.15rem;
    direction:rtl; line-height:1.6; margin:4px 0;
  }
  .hebrew-word-breakdown .word-ok{ color:#3D7A3D; }
  .hebrew-word-breakdown .word-miss{
    color: var(--rimon-dark, var(--rimon)); text-decoration: underline;
    text-decoration-style: wavy; text-underline-offset: 3px;
  }
  .transcript-line{ font-style:italic; color: var(--ink-soft); font-size:0.85rem; margin:2px 0; }
  .empty-msg{ color: var(--ink-soft); text-align:center; padding: 40px 0; }
  .loading{ color: var(--ink-soft); text-align:center; padding:20px 0; }

  /* One coordinated bar (not five separate floating ovals) — inactive
     tabs sit flat and quiet against the white bar, the active tab is the
     only one that pops in burgundy. */
  .tab-bar{
    display:flex; gap:5px; margin-bottom:18px; background:#fff; border-radius:14px;
    padding:6px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); flex-wrap:wrap;
  }
  .tab-btn{
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:0.85rem;
    border: none; background:transparent; color: var(--ink-soft);
    border-radius: 999px; padding: 10px 16px; cursor:pointer;
    transition: background .12s ease, color .12s ease;
  }
  .tab-btn:hover{ background:#f1e7ce; color:var(--ink); }
  .tab-btn.active{ background: var(--rimon); color:#fff; }

  .summary-row{
    background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .summary-row .top-line{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  .summary-row h3{ font-family:'Frank Ruhl Libre', serif; margin:0; font-size:1rem; color:var(--ink); }
  .summary-meta{ font-size:0.75rem; color: var(--ink-soft); }
  .avg-bars{ display:flex; gap:18px; margin-top:10px; flex-wrap:wrap; }
  .avg-bar{ flex:1; min-width:180px; }
  .avg-bar .bar-label{ display:flex; justify-content:space-between; font-size:0.78rem; font-weight:700; margin-bottom:4px; color: var(--ink-soft); }
  .bar-track{ background:#e8e0c8; border-radius:999px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; }
  .bar-fill.hebrew{ background: var(--navy); }
  .bar-fill.translate{ background: var(--rimon); }

  /* ---------- Student tile grid (By Student tab) ---------- */
  .student-head{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .student-head h2{ margin:0; }
  .mini-tabs{ display:flex; gap:6px; }
  .mini-tab-btn{
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:0.78rem;
    border: 2px solid var(--gold); background:#fff; color: var(--ink-soft);
    border-radius: 999px; padding: 6px 14px; cursor:pointer;
  }
  .mini-tab-btn.active{ background: var(--rimon); border-color: var(--rimon-dark, var(--rimon)); color:#fff; }
  .perek-label{
    font-family:'Frank Ruhl Libre', serif; font-weight:700; color: var(--rimon);
    margin: 14px 0 6px; display:flex; justify-content:space-between; align-items:baseline;
  }
  .perek-label .summary{ font-family:'Quicksand', sans-serif; font-weight:600; font-size:0.78rem; color: var(--ink-soft); }
  .posuk-grid{
    display:grid; grid-template-columns: repeat(10, 1fr); gap: 8px; direction: rtl;
  }
  @media (max-width: 560px){ .posuk-grid{ grid-template-columns: repeat(5, 1fr); gap: 10px; } }
  .posuk-tile{
    aspect-ratio: 1 / 1; border-radius: 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Quicksand', sans-serif; cursor:pointer; border: none; padding: 4px;
    transition: transform .08s ease; overflow: hidden;
  }
  .posuk-tile:active{ transform: scale(0.94); }
  .posuk-tile.selected{ outline: 3px solid var(--navy); outline-offset: 2px; }
  .posuk-tile .tile-num{ font-family: 'Noto Serif Hebrew', serif; font-weight:700; font-size:1.4rem; line-height:1; }
  .posuk-tile .tile-score{ font-size:0.62rem; font-weight:600; line-height:1.1; text-align:center; margin-top:4px; opacity:0.9; }
  .posuk-tile.tile-none{ background: #fff; border: 2px dashed var(--ink-soft); color: var(--ink-soft); }
  .posuk-tile.tile-high{ background: #C9E4A6; color: #33511E; }
  .posuk-tile.tile-mid{ background: var(--gold-light); color: var(--ink); }
  .posuk-tile.tile-low{ background: #EFC1C1; color: #7A2626; }
  .posuk-tile{ position:relative; }
  .posuk-tile.tile-disputed{ outline: 2px solid var(--rimon); outline-offset: 1px; }
  .tile-dispute-flag{
    position:absolute; top:2px; right:2px; font-size:0.7rem; line-height:1;
  }
  .dispute-banner{
    background:#F6E1E1; border:2px solid var(--rimon); border-radius:10px;
    padding:8px 12px; margin-bottom:8px; font-size:0.85rem; color:#7A2626; font-weight:700;
  }
  .finalize-row{
    background:#FBF0D9; border:2px solid var(--gold); border-radius:10px;
    padding:8px 12px; margin-top:6px; font-size:0.85rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .finalize-row input[type="number"]{
    width:70px; padding:6px; border-radius:8px; border:2px solid var(--ink-soft); font-family:'Quicksand', sans-serif; text-align:center;
  }
  .finalize-row select{
    padding:6px; border-radius:8px; border:2px solid var(--ink-soft); font-family:'Quicksand', sans-serif;
  }
  .finalize-row .btn{ padding: 6px 14px; font-size:0.8rem; }
  .student-item .dispute-badge{ cursor:pointer; }
  .student-item .dispute-badge{
    background: var(--rimon); color:#fff; border-radius:999px; font-size:0.72rem; font-weight:700;
    padding: 3px 10px; white-space:nowrap; box-shadow: 0 2px 0 #6e1f28;
  }
  .hidden{ display:none !important; }
  #posukDetail{ margin-top:18px; }
  #posukDetail:empty{ margin-top:0; }

  /* ---------- Reports tab: grouped card view ----------
     Replaces the old single long flat table (one row per student per
     posuk, names repeating over and over) with cards grouped by whatever
     the teacher cares about right now — a posuk, a student, or a day —
     so related information sits together instead of being scattered
     across a giant scroll. */
  .report-group-card{
    background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .report-group-header{
    font-family:'Frank Ruhl Libre', serif; color: var(--rimon); font-size:1.05rem;
    margin:0 0 6px; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px;
  }
  .report-group-meta{ font-size:0.75rem; color: var(--ink-soft); font-weight:600; white-space:nowrap; }
  /* Each report-line is its own mini CSS grid rather than a flex row, so
     the score columns land at the same x-position on every row instead of
     drifting based on how long each student's name happens to be — the
     "cols-N" variant sets how many score columns to reserve (matches
     however many of Reading/Translation/Comprehension are switched on),
     and "no-date" drops the trailing date column for day-grouped rows
     where the date is already shown once in the card header above. */
  .report-line{
    display:grid; align-items:center; gap:6px 14px;
    padding:9px 2px; border-top:1px dashed #e3d7b3; font-size:0.88rem;
  }
  .report-line:first-of-type{ border-top:none; }
  .report-line.cols-1, .report-col-header.cols-1{ grid-template-columns: minmax(90px,1fr) 88px 78px; }
  .report-line.cols-2, .report-col-header.cols-2{ grid-template-columns: minmax(90px,1fr) 88px 88px 78px; }
  .report-line.cols-3, .report-col-header.cols-3{ grid-template-columns: minmax(90px,1fr) 88px 88px 108px 78px; }
  .report-line.cols-1.no-date, .report-col-header.cols-1.no-date{ grid-template-columns: minmax(90px,1fr) 88px; }
  .report-line.cols-2.no-date, .report-col-header.cols-2.no-date{ grid-template-columns: minmax(90px,1fr) 88px 88px; }
  .report-line.cols-3.no-date, .report-col-header.cols-3.no-date{ grid-template-columns: minmax(90px,1fr) 88px 88px 108px; }
  .report-line .rl-name{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* display:contents unwraps this span so its pill children become direct
     grid items in their own reserved columns, instead of one flex blob
     that starts wherever the name text happens to end. */
  .report-line .rl-scores{ display:contents; }
  .report-line .rl-date{ font-size:0.75rem; color: var(--ink-soft); white-space:nowrap; text-align:right; }
  .report-subgroup{ margin: 10px 0 2px; padding-left:12px; border-left:3px solid var(--gold-light); }
  .report-subgroup-header{ font-weight:700; font-size:0.88rem; color: var(--ink); margin-bottom:2px; }
  .report-groupby-row{ display:flex; gap:8px; margin-bottom:14px; }
  /* Score-tier coloring so a weak score and a strong score don't share
     the same flat gold pill — and so "never attempted" (—) reads as
     visually absent rather than looking like a real recorded 0%. */
  .score-pill{
    border-radius:999px; padding:3px 10px; font-weight:700; font-size:0.74rem;
    border:1.5px solid transparent; white-space:nowrap; text-align:center;
  }
  .score-pill.tier-great{ background:#E4F4E4; border-color:#4C9A4C; color:#2f6b2f; }
  .score-pill.tier-ok{ background:#FBF0D9; border-color:var(--gold); color:#8a6a13; }
  .score-pill.tier-low{ background:#F6E1E1; border-color:var(--rimon); color:var(--rimon); }
  .score-pill.tier-none{ background:#f1efe9; border:1.5px dashed #d9d3c2; color:#a39c8a; font-weight:600; }
  /* A muted heading row above each card's student lines, sharing the same
     cols-N grid template as .report-line so labels sit directly above
     their matching pill column instead of teachers having to guess which
     icon means what. */
  .report-col-header{
    display:grid; align-items:end; gap:6px 14px; padding:0 2px 7px;
    font-size:0.7rem; font-weight:700; color: var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.03em; border-bottom:2px solid #e3d7b3;
  }
  .report-col-header span:not(:first-child){ text-align:center; }
  .report-col-header span:last-child{ text-align:right; }

  /* ---------- Reports tab: filters card ----------
     One clean card with a real grid instead of controls scattered across
     inline flex-wrap, so every label/input lines up and nothing (like the
     old lone "To" date) strands itself on its own line. */
  .report-filters-card{
    background:#fff; border-radius:14px; padding:18px 20px 16px; margin-bottom:16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .report-filters-card h3{
    font-family:'Frank Ruhl Libre', serif; color: var(--rimon); margin:0 0 14px; font-size:1.02rem;
  }
  .report-filters-grid{
    display:grid; grid-template-columns: repeat(4, minmax(120px,1fr)); gap:14px 16px; margin-bottom:16px;
  }
  .report-filters-grid.row2{ grid-template-columns: repeat(3, minmax(140px,1fr)); }
  .report-filters-grid.row3{ grid-template-columns: repeat(2, minmax(140px,1fr)); max-width:380px; }
  .report-field label{
    display:block; font-size:0.74rem; font-weight:700; color: var(--ink-soft); margin-bottom:5px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .report-field select, .report-field input[type="date"]{
    width:100%; box-sizing:border-box; height:40px; padding:0 10px; border-radius:9px;
    border:2px solid #d8c9a0; font-family:'Quicksand', sans-serif; font-size:0.86rem; background:#fffdf7; color:var(--ink);
  }
  .report-field select:focus, .report-field input:focus{ outline:none; border-color:var(--gold); }
  .report-select-box{
    border:2px solid #d8c9a0; border-radius:10px; padding:10px 12px; max-height:160px;
    overflow-y:auto; background:#fffdf7; font-size:0.85rem;
  }
  .report-select-box label{ display:block; font-weight:400; margin:4px 0; cursor:pointer; padding:3px 4px; border-radius:6px; }
  .report-select-box label:hover{ background:#f1e7ce; }
  .report-select-box label.all-option{
    font-weight:700; margin:0 0 7px; padding-bottom:7px; border-bottom:1px dashed #e3d7b3;
  }
  .report-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .bonus-breakdown-card{
    background:#fff; border-radius:12px; padding:12px 16px; margin-bottom:14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .bonus-breakdown-card .bb-title{ font-weight:700; font-size:0.82rem; color: var(--ink-soft); }
  .bonus-breakdown-card .bb-item{ display:flex; align-items:center; gap:5px; font-weight:700; font-size:0.9rem; }

  /* ---------- Class Roster tab ---------- */
  .roster-table{ width:100%; border-collapse: collapse; }
  .roster-table th{
    text-align:left; font-size:0.78rem; color: var(--ink-soft); font-weight:700;
    padding: 6px 10px; border-bottom: 2px solid var(--gold);
  }
  .roster-row{ cursor:pointer; }
  .roster-row:hover{ background: #f7efd8; }
  .roster-row td{ padding: 10px; border-bottom: 1px dashed #d8c9a0; font-size:0.9rem; }
  .roster-row .rname{ font-weight:700; }
  .status-pill{
    display:inline-block; border-radius:999px; padding:3px 12px; font-size:0.75rem; font-weight:700;
  }
  .status-pill.high{ background:#C9E4A6; color:#33511E; }
  .status-pill.mid{ background: var(--gold-light); color: var(--ink); }
  .status-pill.low{ background:#EFC1C1; color:#7A2626; }
  .status-pill.none{ background:#e8e0c8; color: var(--ink-soft); }

  /* ---------- Class Stats tab ---------- */
  .stat-cards{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .stat-card{
    flex:1; min-width:130px; background:#fff; border-radius:12px; padding:14px 12px; text-align:center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .stat-card .num{ font-family:'Frank Ruhl Libre', serif; font-size:1.6rem; font-weight:700; color: var(--rimon); }
  .stat-card .lbl{ font-size:0.72rem; color: var(--ink-soft); font-weight:600; margin-top:2px; }
  .section-title{ font-family:'Frank Ruhl Libre', serif; color: var(--rimon); margin: 20px 0 10px; font-size:1.1rem; }

<script>

/* Simple client-side passcode gate — NOT real security, just keeps casual visitors out.
   Change this to whatever you'd like. */
const TEACHER_PASSCODE = "vayeira5786";

/* Comprehension is graded as a category, not a 1-10 rating. */
const VERDICT_INFO = {
  excellent: { label: '🌟 Excellent', tier: 'high' },
  correct:   { label: '✅ Got it',    tier: 'high' },
  partial:   { label: '🤔 Almost',    tier: 'mid'  },
  incorrect: { label: '💡 Try again', tier: 'low'  }
};

/* ---------- Dispute-aware score/verdict readers ----------
   If a teacher has finalized a disputed attempt, that final value
   should be what's used everywhere a score/verdict is displayed or
   averaged — not the original auto-graded one. Everything below reads
   through these two helpers rather than the raw fields directly. */
function effHebrewScore(record){
  return (record && typeof record.hebrewFinalScore === 'number') ? record.hebrewFinalScore : (record ? record.hebrewScore : null);
}
function effComprehensionVerdict(record){
  // The freehand/bonus explanation keeps its own four-tier verdict.
  return record ? (record.comprehensionFinalVerdict || record.comprehensionVerdict) : null;
}
function effQuestionScore(record){
  if(!record || !Array.isArray(record.questionResults) || !record.questionResults.length) return null;

  // Newer/older records may store "80%" or 80. Accept either.
  if(typeof record.questionScore === 'number' && Number.isFinite(record.questionScore)){
    return Math.max(0, Math.min(100, Math.round(record.questionScore)));
  }
  if(typeof record.questionScore === 'string'){
    const n = parseFloat(record.questionScore.replace('%','').trim());
    if(Number.isFinite(n)) return Math.max(0, Math.min(100, Math.round(n)));
  }

  // Backstop: derive the score directly from the saved per-question verdicts.
  const total = record.questionResults.length;
  const correct = record.questionResults.filter(q => q && (q.finalVerdict || q.verdict) === 'correct').length;
  return total ? Math.round((correct / total) * 100) : null;
}
function hasQuestionComprehension(record){
  return effQuestionScore(record) !== null;
}
function effComprehensionScore(record){
  // Question mode is the primary comprehension grade whenever it exists.
  const qScore = effQuestionScore(record);
  if(typeof qScore === 'number') return qScore;

  // Otherwise fall back to the optional freehand/bonus score.
  return (record && typeof record.comprehensionScore === 'number') ? record.comprehensionScore : null;
}
function comprehensionSkillInfo(record){
  if(!record) return null;

  // Primary question-based comprehension is shown as an actual percentage.
  const qScore = effQuestionScore(record);
  if(typeof qScore === 'number'){
    return { tier: pctTier(qScore), label: qScore + '%', score: qScore, mode: 'questions' };
  }

  // Older/freehand-only records retain the original four-tier display.
  const verdict = effComprehensionVerdict(record);
  if(verdict && VERDICT_INFO[verdict]){
    return { tier: VERDICT_INFO[verdict].tier, label: VERDICT_INFO[verdict].label, verdict, mode: 'freehand' };
  }
  return null;
}
// Translation isn't stored as a single percentage (each chunk piece is
// graded correct/incorrect separately), so its percentage is derived here
// from the saved per-chunk results — same math as the "X% correct" badge
// shown on the Translate tab itself in student.html. No dispute mechanism
// exists for translation (only Hebrew reading and comprehension have one).
function effTranslationScore(record){
  if(!record || !Array.isArray(record.translationChunkResults) || !record.translationChunkResults.length) return null;
  const total = record.translationChunkResults.length;
  // Once a teacher finalizes a disputed chunk, that decision is the
  // official verdict for scoring purposes too — not just the badge.
  const correct = record.translationChunkResults.filter(c => (c.finalVerdict || c.verdict) === 'correct').length;
  return Math.round((correct / total) * 100);
}
function hasPendingDispute(record){
  if(!record) return false;
  if(record.hebrewDisputeStatus === 'pending' || record.comprehensionDisputeStatus === 'pending') return true;
  if(Array.isArray(record.translationChunkResults)){
    return record.translationChunkResults.some(c => c.disputeStatus === 'pending');
  }
  return false;
}

const PARSHA_ORDER = {
  "Bereishis":0, "Noach":1, "LechLecha":2, "Vayeira":3,
  "ChayeiSarah":4, "Toldos":5, "Vayeitzei":6, "Vayishlach":7,

};

/* =========================================================
   PARSHA / PEREK / POSUK MAP + Hebrew numerals — kept identical
   to student.html / progress.html so ranges & labels line up.
   ========================================================= */
const PARSHA_CONFIG = {
  "Bereishis": [ {num:1}, {num:2}, {num:3}, {num:4}, {num:5}, {num:6, maxPosuk:8} ],
  "Noach": [ {num:6, minPosuk:9}, {num:7}, {num:8}, {num:9}, {num:10}, {num:11} ],

  "Chayei Sarah": [ {num:23}, {num:24}, {num:25, maxPosuk:18} ],
  "Toldos": [ {num:25, minPosuk:19}, {num:26}, {num:27}, {num:28, maxPosuk:9} ],
  "Vayeitzei": [ {num:28, minPosuk:10}, {num:29}, {num:30}, {num:31}, {num:32, maxPosuk:3} ],
  "Vayishlach": [ {num:32, minPosuk:4}, {num:33}, {num:34}, {num:35}, {num:36} ],
  "Vayeishev": [ {num:37}, {num:38}, {num:39}, {num:40} ],
  "Mikeitz": [ {num:41}, {num:42}, {num:43}, {num:44, maxPosuk:17} ],
  "Vayigash": [ {num:44, minPosuk:18}, {num:45}, {num:46}, {num:47, maxPosuk:27} ],
  "Vayechi": [ {num:47, minPosuk:28}, {num:48}, {num:49}, {num:50} ]
};

const HEB_HUNDREDS = ['','ק','ר','ש','ת'];
const HEB_TENS = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
const HEB_ONES = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];

function hebrewLetters(num){
  let n = num;
  let letters = '';
  while(n >= 400){ letters += 'ת'; n -= 400; }
  if(n >= 100){
    letters += HEB_HUNDREDS[Math.floor(n / 100)];
    n = n % 100;
  }
  if(n === 15){
    letters += 'טו';
    n = 0;
  } else if(n === 16){
    letters += 'טז';
    n = 0;
  } else {
    if(n >= 10){
      letters += HEB_TENS[Math.floor(n / 10)];
      n = n % 10;
    }
    if(n > 0){
      letters += HEB_ONES[n];
    }
  }
  return letters;
}

function hebrewNumeral(num){
  const letters = hebrewLetters(num);
  if(!letters) return String(num);
  if(letters.length === 1) return letters + '׳';
  return letters.slice(0, -1) + '״' + letters.slice(-1);
}

/* hebrewScore is a 0-100 percentage from the automatic reading scorer. */
function pctTier(score){
  if(score >= 80) return 'high';
  if(score >= 50) return 'mid';
  return 'low';
}

const LOCAL_TEXT = { 18: new Array(33) }; // only length matters here

let chapterCache = {};
async function fetchChapterLength(perekNum){
  if(chapterCache[perekNum]) return chapterCache[perekNum];
  if(LOCAL_TEXT[perekNum]){
    chapterCache[perekNum] = LOCAL_TEXT[perekNum].length;
    return chapterCache[perekNum];
  }
  const cacheKey = 'posukPractice_ch_v7_' + perekNum;
  const localCached = localStorage.getItem(cacheKey);
  if(localCached){
    const len = JSON.parse(localCached).length;
    chapterCache[perekNum] = len;
    return len;
  }
  try{
    const res = await fetch('https://www.sefaria.org/api/texts/Genesis.' + perekNum + '?context=0&pad=0');
    const data = await res.json();
    const len = (data.he || []).length;
    chapterCache[perekNum] = len;
    return len;
  }catch(err){
    console.error('Could not determine chapter length for perek', perekNum, err);
    return null;
  }
}

function getPerekRangeStatic(perekNum){
  let min = Infinity, max = -Infinity, needsFetch = false;
  Object.values(PARSHA_CONFIG).forEach(chapters => {
    const ch = chapters.find(c => c.num === perekNum);
    if(ch){
      min = Math.min(min, ch.minPosuk || 1);
      if(ch.maxPosuk){ max = Math.max(max, ch.maxPosuk); }
      else { needsFetch = true; }
    }
  });
  return { min, max, needsFetch };
}

async function getPerekRange(perekNum){
  const { min, max, needsFetch } = getPerekRangeStatic(perekNum);
  if(!needsFetch) return { min, max };
  const len = await fetchChapterLength(perekNum);
  return { min, max: len ? Math.max(max, len) : max };
}

function getAllPerekNums(){
  const nums = new Set();
  Object.values(PARSHA_CONFIG).forEach(chapters => chapters.forEach(ch => nums.add(ch.num)));
  return [...nums].sort((a,b) => a - b);
}

/* A given perek can belong to two different parshas at once (e.g. perek 25
   splits between Chayei Sarah and Toldos), so posukKey construction needs to
   know which parsha a specific posuk falls under, not just the perek. */
function resolveParshaSlug(perekNum, posukNum){
  for(const [name, chapters] of Object.entries(PARSHA_CONFIG)){
    const ch = chapters.find(c => c.num === perekNum);
    if(!ch) continue;
    const min = ch.minPosuk || 1;
    const max = ch.maxPosuk || Infinity;
    if(posukNum >= min && posukNum <= max) return name.replace(/\s+/g, '');
  }
  return null;
}

function formatDuration(seconds){
  if(!isFinite(seconds) || seconds === null) return '';
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function getAudioDuration(url){
  return new Promise((resolve) => {
    const audio = new Audio();
    audio.preload = 'metadata';
    audio.onloadedmetadata = () => resolve(audio.duration);
    audio.onerror = () => resolve(null);
    audio.src = url;
  });
}

document.getElementById('studentTabBtn').onclick = () => setTab('student');

function setTab(tab){

// Display-only capitalization (e.g. "chaim chaikin" / "LEIBEL VOGEL" both
// render as "Chaim Chaikin" / "Leibel Vogel") — never touches the actual
// stored name, which stays exactly as-is for matching/sorting/lookups.
function displayName(name){
  return String(name || '').toLowerCase().replace(/\b\p{L}/gu, c => c.toUpperCase());
}

async function loadStudents(){
  const listEl = document.getElementById('studentList');
  const countEl = document.getElementById('studentCount');
  try{
    // Merge two sources: allowedStudents (the teacher's full roster —
    // approved usernames, whether or not they've ever logged in) and
    // posukPractice/students (activity data — only exists once someone
    // has actually opened the app). Every approved name shows up in the
    // sidebar even with zero recordings; the roster entry's name/group
    // wins if both exist, since that's what the teacher intentionally set.
    const [recordedSnap, allowedSnap] = await Promise.all([
      db.ref('posukPractice/students').once('value'),
      db.ref('posukPractice/allowedStudents').once('value')
    ]);
    const recordedVal = recordedSnap.val() || {};
    const allowedVal = allowedSnap.val() || {};
    const allIds = new Set([...Object.keys(recordedVal), ...Object.keys(allowedVal)]);
    if(allIds.size === 0){
      listEl.innerHTML = '<div class="empty-msg">No students yet.</div>';
      if(countEl) countEl.textContent = '';
      return;
    }
    listEl.innerHTML = '';
    const merged = [...allIds].map(id => {
      const recorded = recordedVal[id];
      const allowed = allowedVal[id];
      const name = (allowed && allowed.name) || (recorded && recorded.name) || id;
      const group = (allowed && allowed.group) || '';
      const lastActive = recorded && recorded.lastActive ? recorded.lastActive : null;
      return { id, name, group, lastActive };
    });
    merged.sort((a,b) => (a.group || '').localeCompare(b.group || '') || a.name.localeCompare(b.name));

    // Group into labeled sections (e.g. "B3 WT" / "B3 ET") instead of one
    // flat list, so a teacher juggling multiple classes/cohorts can see
    // who's in which at a glance. No-group students land in a shared
    // "Ungrouped" section, sorted after any named groups.
    const byGroup = {};
    merged.forEach(s => {
      const key = s.group || '\uFFFFUngrouped';
      (byGroup[key] = byGroup[key] || []).push(s);
    });
    const groupKeysSorted = Object.keys(byGroup).sort((a,b) => a.localeCompare(b));

    if(countEl) countEl.textContent = merged.length + (merged.length === 1 ? ' student' : ' students');

    groupKeysSorted.forEach(gkey => {
      const header = document.createElement('div');
      header.className = 'student-group-header';
      header.textContent = gkey === '\uFFFFUngrouped' ? 'Ungrouped' : gkey;
      listEl.appendChild(header);

      byGroup[gkey].forEach(({ id, name, lastActive }) => {
        studentsMap[id] = name;
        studentsInfo[id] = { name, lastActive };
        const div = document.createElement('div');
        div.className = 'student-item';
        div.dataset.id = id;
        div.dataset.searchName = name.toLowerCase();
        const lastActiveLabel = lastActive ? 'Last activity: ' + new Date(lastActive).toLocaleDateString() : 'Never recorded';
        div.innerHTML = `<span class="name-row"><span>${displayName(name)}</span><span class="dispute-badge hidden" id="disputeBadge_${id}"></span></span><span class="last-active">${lastActiveLabel}</span>`;
        div.onclick = () => {
          setTab('student');
          selectStudent(id, name, div);
          // On mobile the sidebar is a drawer — picking a student should
          // close it back up rather than leaving it covering the report.
          const panel = document.getElementById('studentsPanel');
          if(panel) panel.classList.remove('open');
        };
        listEl.appendChild(div);
      });
    });
    markStudentsWithPendingDisputes();
  }catch(err){
    listEl.innerHTML = '<div class="empty-msg">Could not load students.</div>';
    console.error(err);
  }
}

// Filters the sidebar list as the teacher types, matching against the raw
// stored name (case-insensitive). Also hides a group header if every
// student under it got filtered out, so searching doesn't leave empty
// "B3 WT" labels dangling with nothing underneath.
document.getElementById('studentSearchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const listEl = document.getElementById('studentList');
  let currentHeader = null;
  let currentHeaderHasMatch = false;
  [...listEl.children].forEach(el => {
    if(el.classList.contains('student-group-header')){
      if(currentHeader) currentHeader.style.display = currentHeaderHasMatch ? '' : 'none';
      currentHeader = el;
      currentHeaderHasMatch = false;
    }else if(el.classList.contains('student-item')){
      const match = !q || (el.dataset.searchName || '').includes(q);
      el.style.display = match ? '' : 'none';
      if(match) currentHeaderHasMatch = true;
    }
  });
  if(currentHeader) currentHeader.style.display = currentHeaderHasMatch ? '' : 'none';
});

/* Scans every attempt once (reusing the shared cache) so the sidebar can
   flag students with a pending dispute — the teacher shouldn't have to
   click into each student just to find out one is waiting on them.
   Also remembers WHERE the first pending dispute is (posukKey + which
   skill tab) so clicking the badge can jump straight to it instead of
   just opening the student's default grid. */
let pendingDisputeTargets = {}; // studentId -> { posukKey, tab }
async function markStudentsWithPendingDisputes(){
  try{
    const allAttempts = await loadAllAttempts();
    Object.keys(studentsMap).forEach(id => {
      const posukMap = allAttempts[id];
      const badge = document.getElementById('disputeBadge_' + id);
      if(!badge || !posukMap) return;
      let count = 0;
      let firstTarget = null;
      Object.entries(posukMap).forEach(([posukKey, attemptMap]) => {
        Object.values(attemptMap).forEach(a => {
          if(a.hebrewDisputeStatus === 'pending'){
            count++;
            if(!firstTarget) firstTarget = { posukKey, tab: 'reading' };
          }
          if(a.comprehensionDisputeStatus === 'pending'){
            count++;
            if(!firstTarget) firstTarget = { posukKey, tab: 'comprehension' };
          }
          if(Array.isArray(a.translationChunkResults)){
            a.translationChunkResults.forEach(c => {
              if(c.disputeStatus === 'pending'){
                count++;
                if(!firstTarget) firstTarget = { posukKey, tab: 'translate' };
              }
            });
          }
        });
      });
      if(count > 0){
        badge.textContent = '⚠️ ' + count + (count === 1 ? ' dispute' : ' disputes');
        badge.classList.remove('hidden');
        pendingDisputeTargets[id] = firstTarget;
        badge.onclick = (ev) => {
          ev.stopPropagation(); // don't also trigger the row's own click
          const target = pendingDisputeTargets[id];
          const rowEl = document.querySelector(`.student-item[data-id="${id}"]`);
          const name = studentsMap[id];
          if(target){
            studentActiveTab = target.tab;
            selectedPosukKey = target.posukKey;
          }
          selectStudent(id, name, rowEl || document.createElement('div'));
        };
      }else{
        badge.textContent = '';
        badge.classList.add('hidden');
        badge.onclick = null;
        delete pendingDisputeTargets[id];
      }
    });
  }catch(err){
    console.error('Could not check for pending disputes', err);
  }
}

/* ---------- Shared cache of every attempt, every student ----------
   Roster and Class Stats both need the full tree; fetch it once and
   reuse until the teacher explicitly refreshes. */
let allAttemptsCache = null;
async function loadAllAttempts(forceRefresh){
  if(allAttemptsCache && !forceRefresh) return allAttemptsCache;
  const snap = await db.ref('posukPractice/attempts').once('value');
  allAttemptsCache = snap.val() || {};
  return allAttemptsCache;
}

/* Reduce one student's raw posukMap (posukKey -> attemptId -> {...})
   down to simple stats used by the Roster and Class Stats tabs. */
function computeStudentStats(posukMap){
  let hebrewScores = [];
  let translationScores = [];
  let comprehensionScores = [];
  let verdictCounts = { excellent: 0, correct: 0, partial: 0, incorrect: 0 };
  let posukCount = 0;
  Object.values(posukMap || {}).forEach(attemptMap => {
    const attempts = Object.values(attemptMap).sort((a,b) => b.timestamp - a.timestamp);
    const latest = attempts[0];
    posukCount++;
    const hScore = effHebrewScore(latest);
    if(typeof hScore === 'number') hebrewScores.push(hScore);
    const tScore = effTranslationScore(latest);
    if(typeof tScore === 'number') translationScores.push(tScore);
    const cScore = effComprehensionScore(latest);
    if(typeof cScore === 'number') comprehensionScores.push(cScore);

    // Keep counting old freehand verdicts separately for historical context,
    // but question-mode percentages are now the primary comprehension grade.
    const cVerdict = effComprehensionVerdict(latest);
    if(cVerdict && verdictCounts.hasOwnProperty(cVerdict)){
      verdictCounts[cVerdict]++;
    }
  });
  const avg = hebrewScores.length ? hebrewScores.reduce((a,b) => a+b, 0) / hebrewScores.length : null;
  const avgTranslation = translationScores.length ? translationScores.reduce((a,b) => a+b, 0) / translationScores.length : null;
  const avgComprehension = comprehensionScores.length ? comprehensionScores.reduce((a,b) => a+b, 0) / comprehensionScores.length : null;
  return { posukCount, avg, avgTranslation, avgComprehension, verdictCounts };
}

/* ---------- Class Roster ---------- */
async function loadRoster(){
  const mainEl = document.getElementById('mainContent');
  mainEl.innerHTML = '<div class="loading">Building class roster…</div>';
  try{
    const allAttempts = await loadAllAttempts();
    const rows = Object.entries(studentsMap).map(([id, name]) => {
      const stats = computeStudentStats(allAttempts[id]);
      const lastActive = studentsInfo[id] && studentsInfo[id].lastActive
        ? new Date(studentsInfo[id].lastActive).toLocaleDateString() : '—';
      return { id, name, ...stats, lastActive };
    });

    if(rows.length === 0){
      mainEl.innerHTML = '<h2>Class Roster</h2><div class="empty-msg">No students yet.</div>';
      return;
    }

    // Students needing the most support float to the top; students with
    // no recordings at all sort to the very bottom.
    rows.sort((a,b) => {
      if(a.avg === null && b.avg === null) return a.name.localeCompare(b.name);
      if(a.avg === null) return 1;
      if(b.avg === null) return -1;
      return a.avg - b.avg;
    });

    let html = `<h2>Class Roster</h2>
      <table class="roster-table">
        <thead><tr>
          <th>Student</th><th>Pesukim Recorded</th><th>Avg Reading %</th><th>Avg Translation %</th><th>Comprehension</th><th>Last Active</th>
        </tr></thead><tbody>`;
    rows.forEach(r => {
      const tier = r.avg === null ? 'none' : pctTier(r.avg);
      const tierLabel = tier === 'high' ? 'Doing Well' : tier === 'mid' ? 'Making Progress' : tier === 'low' ? 'Needs Support' : 'Not Started';
      const avgLabel = r.avg === null ? '—' : Math.round(r.avg) + '%';
      const avgTranslationLabel = r.avgTranslation === null ? '—' : Math.round(r.avgTranslation) + '%';
      const vc = r.verdictCounts;
      const historicalParts = [];
      if(vc.excellent) historicalParts.push('🌟' + vc.excellent);
      if(vc.correct) historicalParts.push('✅' + vc.correct);
      if(vc.partial) historicalParts.push('🤔' + vc.partial);
      if(vc.incorrect) historicalParts.push('💡' + vc.incorrect);
      const avgCompLabel = r.avgComprehension === null ? '—' : Math.round(r.avgComprehension) + '%';
      const compLabel = historicalParts.length
        ? avgCompLabel + ' · bonus ' + historicalParts.join(' ')
        : avgCompLabel;
      html += `<tr class="roster-row" data-id="${r.id}">
        <td class="rname">${r.name}</td>
        <td>${r.posukCount}</td>
        <td>${avgLabel}</td>
        <td>${avgTranslationLabel}</td>
        <td><span class="status-pill ${tier}">${tierLabel}</span> <span style="margin-left:6px;">${compLabel}</span></td>
        <td>${r.lastActive}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    mainEl.innerHTML = html;

    mainEl.querySelectorAll('.roster-row').forEach(row => {
      row.onclick = () => {
        const id = row.dataset.id;
        setTab('student');
        const el = [...document.querySelectorAll('.student-item')].find(e => e.dataset.id === id);
        if(el) selectStudent(id, studentsMap[id], el);
      };
    });
  }catch(err){
    mainEl.innerHTML = '<div class="empty-msg">Could not build the class roster.</div>';
    console.error(err);
  }
}

/* ---------- Reports tab ----------
   Flat, filterable list of every posuk attempt across the class: who,
   which parsha/perek/posuk, their reading %, and their comprehension
   verdict. Filters can be combined freely — one/several/all students,
   one parsha, one perek within it, one posuk within that perek, a date
   range, and which score type(s) to show — so a teacher can go as broad
   as "the whole class, whole parsha" or as narrow as "how did everyone
   do on this one posuk". Results can be read on screen, downloaded as a
   CSV, or opened in a print-friendly view (which any browser can
   "Print to PDF" from). */
let reportRows = []; // cached rows for the current filter selection, used by CSV/print export

function verdictLabel(v){
  if(v === 'excellent') return '🌟 Excellent';
  if(v === 'correct') return '✅ Got it';
  if(v === 'partial') return '🤔 Almost';
  if(v === 'incorrect') return '💡 Try again';
  return '—';
}

// Same as verdictLabel but appends the supplementary 0-100 score, e.g.
// "🌟 Excellent (94%)" — used wherever a report row displays comprehension.
function verdictLabelWithScore(v, score){
  const label = verdictLabel(v);
  if(typeof score === 'number'){
    // Question-mode comprehension intentionally uses a percentage as its
    // primary result rather than forcing it into a freehand verdict tier.
    if(label === '—') return score + '%';
    return label + ' (' + score + '%)';
  }
  return label;
}

// Builds one row per posuk (or posuk-range) per student from the raw
// attempts tree, resolving each posukKey into a parsha name / perek /
// posuk number so it can be filtered and displayed like the rest of the
// dashboard. A comprehension range attempt (key ends in "from-to" instead
// of a plain posuk number) becomes a row with isRange true and no reading
// scores. Range attempts can now contain reading, translation, and comprehension.
// Includes the latest attempt's timestamp so rows can be filtered/shown by date.
function buildReportRows(allAttempts){
  const rows = [];
  Object.entries(studentsMap).forEach(([id, name]) => {
    const posukMap = allAttempts[id];
    if(!posukMap) return;
    Object.entries(posukMap).forEach(([posukKey, attemptMap]) => {
      const parts = posukKey.split('_');
      if(parts.length < 3) return;
      const posukPart = parts[parts.length - 1];
      const perekNum = parseInt(parts[parts.length - 2]);
      const parshaSlug = parts.slice(0, parts.length - 2).join('_');
      if(!perekNum) return;
      const rangeMatch = /^(\d+)-(\d+)$/.exec(posukPart);
      const isRange = !!rangeMatch;
      const posukNum = isRange ? parseInt(rangeMatch[1]) : parseInt(posukPart);
      if(!posukNum) return;
      const rangeStart = isRange ? parseInt(rangeMatch[1]) : null;
      const rangeEnd = isRange ? parseInt(rangeMatch[2]) : null;
      const parshaName = Object.keys(PARSHA_CONFIG).find(n => n.replace(/\s+/g,'') === parshaSlug) || parshaSlug;
      const attempts = Object.values(attemptMap).sort((a,b) => b.timestamp - a.timestamp);
      const latest = attempts[0];
      rows.push({
        studentId: id,
        studentName: name,
        parshaName,
        perekNum,
        posukNum,
        isRange,
        rangeStart,
        rangeEnd,
        posukLabel: isRange ? `${rangeStart}–${rangeEnd}` : String(posukNum),
        timestamp: latest ? latest.timestamp : null,
        hebrewScore: effHebrewScore(latest),
        translationScore: effTranslationScore(latest),
        comprehensionVerdict: effComprehensionVerdict(latest),
        comprehensionScore: effComprehensionScore(latest)
      });
    });
  });
  return rows;
}

        fromStr = toYmd(new Date(now.getFullYear(), now.getMonth(), 1));

      dateFromInput.value = fromStr;
      dateToInput.value = todayStr;
      dateFromInput.disabled = true;
      dateToInput.disabled = true;
    };

    document.getElementById('reportCsvBtn').onclick = downloadReportCsv;

    document.getElementById('reportGroupBy').onchange = () => {
      if(reportRows.length) renderGroupedReportInto(document.getElementById('reportResults'), reportRows, document.getElementById('reportScoreTypeFilter').value);
    };
  }catch(err){
    mainEl.innerHTML = '<div class="empty-msg">Could not load reports.</div>';

}

// Repopulates the Perek dropdown to match the chosen parsha (or every
// perek across all parshas, if "All Parshas" is selected), and resets
// the Posuk dropdown since it depends on which perek ends up chosen.
function populatePerekFilter(parshaFilter){
  const perekSelect = document.getElementById('reportPerekFilter');
  const perekNums = parshaFilter === 'all'
    ? getAllPerekNums()
    : (PARSHA_CONFIG[parshaFilter] || []).map(ch => ch.num);
  perekSelect.innerHTML = '<option value="all">All Perakim</option>' +
    perekNums.map(n => `<option value="${n}">${n}</option>`).join('');
  populatePosukFilter('all');
}

// Repopulates the Posuk checkbox box to the actual posuk range of the
// chosen perek. Left empty/disabled-looking when no single perek is
// chosen, since "posuk 5" doesn't mean anything across several perakim.
// Supports shift-click range selection, same idea as shift-clicking a
// range of files: click one posuk, shift-click another, and everything
// in between gets checked too — handy for "pesukim 1 through 10".
let lastPosukCbIndex = null;

async function populatePosukFilter(perekFilter){
  const box = document.getElementById('reportPosukBox');
  lastPosukCbIndex = null;

  if(perekFilter === 'all'){
    box.innerHTML = '<label style="display:block;font-size:0.85rem;font-weight:600;margin:0 0 4px;"><input type="checkbox" id="reportPosukAll" checked> All Pesukim</label>';
    box.style.opacity = '0.6';
    box.style.pointerEvents = 'none';
    return;
  }

  box.style.opacity = '1';
  box.style.pointerEvents = 'auto';
  box.innerHTML = '<label style="display:block;font-size:0.85rem;font-weight:600;margin:0 0 4px;"><input type="checkbox" id="reportPosukAll" checked> All Pesukim</label>';
  try{
    const { min, max } = await getPerekRange(parseInt(perekFilter));
    if(isFinite(min) && isFinite(max)){
      let html = box.innerHTML;
      for(let p = min; p <= max; p++){
        html += `<label style="display:block;font-size:0.85rem;font-weight:400;margin:2px 0;"><input type="checkbox" class="report-posuk-cb" value="${p}"> ${p}</label>`;
      }
      box.innerHTML = html;
    }
  }catch(err){
    console.error('Could not load posuk range for perek', perekFilter, err);
  }

  wirePosukCheckboxes();
}

function wirePosukCheckboxes(){
  const allBox = document.getElementById('reportPosukAll');
  const cbs = () => [...document.querySelectorAll('.report-posuk-cb')];
  allBox.onchange = () => {
    if(allBox.checked) cbs().forEach(cb => cb.checked = false);
  };
  cbs().forEach((cb, idx) => {
    cb.onclick = (e) => {
      if(e.shiftKey && lastPosukCbIndex !== null){
        const all = cbs();
        const [start, end] = [lastPosukCbIndex, idx].sort((a,b) => a - b);
        for(let i = start; i <= end; i++) all[i].checked = true;
      }
      lastPosukCbIndex = idx;
      if(cb.checked) allBox.checked = false;
      if(!cbs().some(c => c.checked)) allBox.checked = true;
    };
  });
}

function getSelectedPosukNums(){
  const allBox = document.getElementById('reportPosukAll');
  if(!allBox || allBox.checked) return null; // null = no posuk filter, show every posuk
  return [...document.querySelectorAll('.report-posuk-cb')].filter(cb => cb.checked).map(cb => parseInt(cb.value));
}

function getSelectedStudentIds(){
  const allBox = document.getElementById('reportStudentAll');
  if(allBox.checked) return null; // null = no student filter, show everyone
  return [...document.querySelectorAll('.report-student-cb')].filter(cb => cb.checked).map(cb => cb.value);
}

// Shared summary-stats calculation used by the on-screen report, the CSV
// export, and the printable PDF, so all three always agree with each other.
function computeReportSummary(rows, scoreType){
  const distinctStudents = new Set(rows.map(r => r.studentId)).size;
  const readingScores = rows.map(r => r.hebrewScore).filter(s => typeof s === 'number');
  const avgReading = readingScores.length ? Math.round(readingScores.reduce((a,b)=>a+b,0) / readingScores.length) : null;
  const translationScores = rows.map(r => r.translationScore).filter(s => typeof s === 'number');
  const avgTranslation = translationScores.length ? Math.round(translationScores.reduce((a,b)=>a+b,0) / translationScores.length) : null;
  const comprehensionScores = rows.map(r => r.comprehensionScore).filter(s => typeof s === 'number');
  const avgComprehension = comprehensionScores.length ? Math.round(comprehensionScores.reduce((a,b)=>a+b,0) / comprehensionScores.length) : null;
  const verdictCounts = { excellent: 0, correct: 0, partial: 0, incorrect: 0 };
  rows.forEach(r => { if(r.comprehensionVerdict && verdictCounts.hasOwnProperty(r.comprehensionVerdict)) verdictCounts[r.comprehensionVerdict]++; });
  return { distinctStudents, avgReading, avgTranslation, avgComprehension, verdictCounts };
}

// Renders the summary as an HTML block (used on-screen and in the print view).
// Same .stat-cards/.stat-card look already used on the Class Stats tab —
// reused here rather than inventing a second style, and the percentage
// is the visually loudest thing in each card per the redesign brief.
// Averages/counts themselves are untouched from computeReportSummary.
function reportSummaryHtml(rows, scoreType){
  const { distinctStudents, avgReading, avgTranslation, avgComprehension, verdictCounts } = computeReportSummary(rows, scoreType);
  let html = `<h3 class="section-title" style="margin-top:0;">Report Summary</h3><div class="stat-cards">
      <div class="stat-card"><div class="num">${rows.length}</div><div class="lbl">Pesukim</div></div>
      <div class="stat-card"><div class="num">${distinctStudents}</div><div class="lbl">Students</div></div>`;
  if(scoreType === 'all' || scoreType === 'reading'){
    html += `<div class="stat-card"><div class="num">${avgReading === null ? '—' : avgReading + '%'}</div><div class="lbl">Reading</div></div>`;
  }
  if(scoreType === 'all' || scoreType === 'translation'){
    html += `<div class="stat-card"><div class="num">${avgTranslation === null ? '—' : avgTranslation + '%'}</div><div class="lbl">Translation</div></div>`;
  }
  if(scoreType === 'all' || scoreType === 'comprehension'){
    html += `<div class="stat-card"><div class="num">${avgComprehension === null ? '—' : avgComprehension + '%'}</div><div class="lbl">Comprehension</div></div>`;
  }
  html += `</div>`;
  if(scoreType === 'all' || scoreType === 'comprehension'){
    html += `<div class="bonus-breakdown-card">
      <span class="bb-title">Bonus / freehand breakdown</span>
      <span class="bb-item" title="Excellent">🌟 ${verdictCounts.excellent}</span>
      <span class="bb-item" title="Got it">✅ ${verdictCounts.correct}</span>
      <span class="bb-item" title="Almost">🤔 ${verdictCounts.partial}</span>
      <span class="bb-item" title="Try again">💡 ${verdictCounts.incorrect}</span>
    </div>`;
  }
  return html;
}

async function renderReportResults(){
  const resultsEl = document.getElementById('reportResults');
  const summaryEl = document.getElementById('reportSummary');
  resultsEl.innerHTML = '<div class="loading">Building report…</div>';
  summaryEl.innerHTML = '';
  try{
    const studentIds = getSelectedStudentIds(); // null = all
    const parshaFilter = document.getElementById('reportParshaFilter').value;
    const perekFilter = document.getElementById('reportPerekFilter').value;
    const posukNums = getSelectedPosukNums(); // null = all
    const scoreType = document.getElementById('reportScoreTypeFilter').value;
    const dateFromVal = document.getElementById('reportDateFrom').value;
    const dateToVal = document.getElementById('reportDateTo').value;
    const dateFrom = dateFromVal ? new Date(dateFromVal + 'T00:00:00').getTime() : null;
    const dateTo = dateToVal ? new Date(dateToVal + 'T23:59:59').getTime() : null;

    const allAttempts = await loadAllAttempts();
    let rows = buildReportRows(allAttempts);

    if(studentIds) rows = rows.filter(r => studentIds.includes(r.studentId));
    if(parshaFilter !== 'all') rows = rows.filter(r => r.parshaName === parshaFilter);
    if(perekFilter !== 'all') rows = rows.filter(r => r.perekNum === parseInt(perekFilter));
    // A range attempt (e.g. pesukim 3-5) matches a specific-posuk filter if
    // any of the selected posukim fall anywhere inside that range.
    if(posukNums) rows = rows.filter(r => r.isRange
      ? posukNums.some(p => p >= r.rangeStart && p <= r.rangeEnd)
      : posukNums.includes(r.posukNum));
    if(dateFrom !== null) rows = rows.filter(r => typeof r.timestamp === 'number' && r.timestamp >= dateFrom);
    if(dateTo !== null) rows = rows.filter(r => typeof r.timestamp === 'number' && r.timestamp <= dateTo);

    rows.sort((a,b) => {
      const n = a.studentName.localeCompare(b.studentName);
      if(n !== 0) return n;
      if(a.perekNum !== b.perekNum) return a.perekNum - b.perekNum;
      return a.posukNum - b.posukNum;
    });

    reportRows = rows;
    document.getElementById('reportCsvBtn').classList.toggle('hidden', rows.length === 0);
    document.getElementById('reportPrintBtn').classList.toggle('hidden', rows.length === 0);

    if(rows.length === 0){
      summaryEl.innerHTML = '';
      resultsEl.innerHTML = '<div class="empty-msg">No recordings match these filters yet.</div>';
      return;
    }

    // Summary stats give the big picture before scrolling through every row.
    summaryEl.innerHTML = reportSummaryHtml(rows, scoreType);

    renderGroupedReportInto(resultsEl, rows, scoreType);
  }catch(err){
    resultsEl.innerHTML = '<div class="empty-msg">Could not build the report.</div>';
    console.error(err);
  }
}

// Small colored score pills for one row's result, used inside every
// grouping mode below — reused instead of duplicated so all three modes
// always render a student's scores identically.
// Buckets a score into a visual tier so weak/strong/unattempted results
// are distinguishable at a glance instead of every pill being the same
// flat gold regardless of what it actually says. Falls back to the
// comprehension verdict when there's no numeric score to bucket by.
function scoreTier(pct, verdict){
  if(typeof pct === 'number'){
    if(pct >= 80) return 'great';
    if(pct >= 50) return 'ok';
    return 'low';
  }
  if(verdict === 'excellent' || verdict === 'correct') return 'great';
  if(verdict === 'partial') return 'ok';
  if(verdict === 'incorrect') return 'low';
  return 'none';
}

function reportScorePillsHtml(r, showReadingCol, showTranslationCol, showComprehensionCol){
  let html = '';
  if(showReadingCol){
    const label = typeof r.hebrewScore === 'number' ? Math.round(r.hebrewScore) + '%' : '—';
    html += `<span class="score-pill tier-${scoreTier(r.hebrewScore)}" title="Reading">📖 ${label}</span>`;
  }
  if(showTranslationCol){
    const label = typeof r.translationScore === 'number' ? Math.round(r.translationScore) + '%' : '—';
    html += `<span class="score-pill tier-${scoreTier(r.translationScore)}" title="Translation">🗣️ ${label}</span>`;
  }
  if(showComprehensionCol){
    const label = verdictLabelWithScore(r.comprehensionVerdict, r.comprehensionScore);
    html += `<span class="score-pill tier-${scoreTier(r.comprehensionScore, r.comprehensionVerdict)}" title="Comprehension">🧠 ${label}</span>`;
  }
  return html;
}

// Builds the whole on-screen report as grouped cards (rather than one
// long flat table where a student's name repeats once per posuk) and
// injects it into containerEl. groupBy comes straight from the
// "Group by" dropdown so switching it re-renders instantly from the
// already-fetched rows — no need to hit Generate Report again.
function renderGroupedReportInto(containerEl, rows, scoreType){
  const groupBy = document.getElementById('reportGroupBy').value;
  const showReadingCol = scoreType === 'all' || scoreType === 'reading';
  const showTranslationCol = scoreType === 'all' || scoreType === 'translation';
  const showComprehensionCol = scoreType === 'all' || scoreType === 'comprehension';
  // Drives the .cols-N grid-template variant (see CSS) so every line's
  // score pills land in the same fixed-width columns regardless of name
  // length — same count for every line in a given render since scoreType
  // is a single dropdown for the whole report.
  const colsClass = 'cols-' + [showReadingCol, showTranslationCol, showComprehensionCol].filter(Boolean).length;
  const dateLabel = (r) => typeof r.timestamp === 'number' ? new Date(r.timestamp).toLocaleDateString() : '—';
  const posukRefLabel = (r) => `${r.parshaName}, Perek ${r.perekNum}, Posuk ${r.posukLabel}`;
  // One small header row per card so a teacher never has to guess which
  // column a pill belongs to — shares the exact same grid template as the
  // lines below it (see .report-col-header CSS) so labels sit directly
  // above their column.
  const colHeaderHtml = (nameLabel, includeDate) => {
    let cells = `<span>${nameLabel}</span>`;
    if(showReadingCol) cells += `<span>Reading</span>`;
    if(showTranslationCol) cells += `<span>Translation</span>`;
    if(showComprehensionCol) cells += `<span>Comprehension</span>`;
    if(includeDate) cells += `<span>Date</span>`;
    return `<div class="report-col-header ${colsClass}${includeDate ? '' : ' no-date'}">${cells}</div>`;
  };

  let html = '';

  if(groupBy === 'student'){
    // One card per student — everything they've done, across every
    // posuk, sits together instead of scattered across separate rows.
    const byStudent = {};
    rows.forEach(r => { (byStudent[r.studentId] = byStudent[r.studentId] || []).push(r); });
    const studentIdsSorted = Object.keys(byStudent).sort((a,b) => byStudent[a][0].studentName.localeCompare(byStudent[b][0].studentName));
    studentIdsSorted.forEach(sid => {
      const studentRows = byStudent[sid].slice().sort((a,b) => (a.perekNum - b.perekNum) || (a.posukNum - b.posukNum));
      html += `<div class="report-group-card">
        <div class="report-group-header"><span>👤 ${displayName(studentRows[0].studentName)}</span><span class="report-group-meta">${studentRows.length} posuk${studentRows.length===1?'':'im'}</span></div>
        ${colHeaderHtml('Posuk', true)}`;
      studentRows.forEach(r => {
        html += `<div class="report-line ${colsClass}">
          <span class="rl-name">${posukRefLabel(r)}</span>
          <span class="rl-scores">${reportScorePillsHtml(r, showReadingCol, showTranslationCol, showComprehensionCol)}</span>
          <span class="rl-date">${dateLabel(r)}</span>
        </div>`;
      });
      html += `</div>`;
    });

  }else if(groupBy === 'day'){
    // One card per calendar day, and within each day, results are
    // further grouped by posuk — matching how a teacher actually thinks
    // about it ("today we covered these pesukim, here's everyone").
    const byDay = {};
    rows.forEach(r => {
      const key = typeof r.timestamp === 'number' ? new Date(r.timestamp).toLocaleDateString() : 'Unknown date';
      (byDay[key] = byDay[key] || []).push(r);
    });
    const dayKeysSorted = Object.keys(byDay).sort((a,b) => {
      const ta = byDay[a][0].timestamp || 0, tb = byDay[b][0].timestamp || 0;
      return tb - ta; // most recent day first
    });
    dayKeysSorted.forEach(dayKey => {
      const dayRows = byDay[dayKey];
      const byPosuk = {};
      dayRows.forEach(r => {
        const pkey = r.parshaName + '|' + r.perekNum + '|' + r.posukLabel;
        (byPosuk[pkey] = byPosuk[pkey] || []).push(r);
      });
      const posukKeysSorted = Object.keys(byPosuk).sort((a,b) => {
        const ra = byPosuk[a][0], rb = byPosuk[b][0];
        return (ra.perekNum - rb.perekNum) || (ra.posukNum - rb.posukNum);
      });
      html += `<div class="report-group-card">
        <div class="report-group-header"><span>🗓️ ${dayKey}</span><span class="report-group-meta">${dayRows.length} posuk${dayRows.length===1?'':'im'} recorded</span></div>`;
      posukKeysSorted.forEach(pkey => {
        const posukRows = byPosuk[pkey].slice().sort((a,b) => a.studentName.localeCompare(b.studentName));
        html += `<div class="report-subgroup">
          <div class="report-subgroup-header">📖 ${posukRefLabel(posukRows[0])}</div>
          ${colHeaderHtml('Student', false)}`;
        posukRows.forEach(r => {
          html += `<div class="report-line ${colsClass} no-date">
            <span class="rl-name">${displayName(r.studentName)}</span>
            <span class="rl-scores">${reportScorePillsHtml(r, showReadingCol, showTranslationCol, showComprehensionCol)}</span>
          </div>`;
        });
        html += `</div>`;
      });
      html += `</div>`;
    });

  }else{
    // Default: group by posuk — pick a posuk, see every student's
    // reading / translation / comprehension side by side at a glance.
    const byPosuk = {};
    rows.forEach(r => {
      const pkey = r.parshaName + '|' + r.perekNum + '|' + r.posukLabel;
      (byPosuk[pkey] = byPosuk[pkey] || []).push(r);
    });
    const posukKeysSorted = Object.keys(byPosuk).sort((a,b) => {
      const ra = byPosuk[a][0], rb = byPosuk[b][0];
      return (ra.perekNum - rb.perekNum) || (ra.posukNum - rb.posukNum);
    });
    posukKeysSorted.forEach(pkey => {
      const posukRows = byPosuk[pkey].slice().sort((a,b) => a.studentName.localeCompare(b.studentName));
      html += `<div class="report-group-card">
        <div class="report-group-header"><span>📖 ${posukRefLabel(posukRows[0])}</span><span class="report-group-meta">${posukRows.length} student${posukRows.length===1?'':'s'}</span></div>
        ${colHeaderHtml('Student', true)}`;
      posukRows.forEach(r => {
        html += `<div class="report-line ${colsClass}">
          <span class="rl-name">${displayName(r.studentName)}</span>
          <span class="rl-scores">${reportScorePillsHtml(r, showReadingCol, showTranslationCol, showComprehensionCol)}</span>
          <span class="rl-date">${dateLabel(r)}</span>
        </div>`;
      });
      html += `</div>`;
    });
  }

  containerEl.innerHTML = html;
}

// CSV/print exports always include every column regardless of what's
// hidden on screen — a downloaded file shouldn't silently drop data just
// because it looked redundant in the current on-screen view.
function downloadReportCsv(){
  if(!reportRows.length) return;
  const scoreType = document.getElementById('reportScoreTypeFilter').value;
  const { distinctStudents, avgReading, avgTranslation, avgComprehension, verdictCounts } = computeReportSummary(reportRows, scoreType);

  // Summary block first, then a blank line, then the full data table —
  // so the totals are right there without having to scroll or recompute.
  const summaryLines = [];
  summaryLines.push(['Pesukim in this report', reportRows.length].join(','));
  summaryLines.push(['Students represented', distinctStudents].join(','));
  if(scoreType === 'all' || scoreType === 'reading'){
    summaryLines.push(['Average reading score', avgReading === null ? '' : avgReading + '%'].join(','));
  }
  if(scoreType === 'all' || scoreType === 'translation'){
    summaryLines.push(['Average translation score', avgTranslation === null ? '' : avgTranslation + '%'].join(','));
  }
  if(scoreType === 'all' || scoreType === 'comprehension'){
    summaryLines.push(['Average comprehension score', avgComprehension === null ? '' : avgComprehension + '%'].join(','));
    summaryLines.push(['Bonus/freehand Excellent', verdictCounts.excellent].join(','));
    summaryLines.push(['Bonus/freehand Correct', verdictCounts.correct].join(','));
    summaryLines.push(['Bonus/freehand Partial', verdictCounts.partial].join(','));
    summaryLines.push(['Bonus/freehand Incorrect', verdictCounts.incorrect].join(','));
  }

  const header = ['Student','Parsha','Perek','Posuk','Reading %','Translation %','Comprehension','Comprehension Score','Date'];
  const lines = [...summaryLines, '', header.join(',')];
  reportRows.forEach(r => {
    const scoreLabel = typeof r.hebrewScore === 'number' ? Math.round(r.hebrewScore) : '';
    const translationLabel = typeof r.translationScore === 'number' ? Math.round(r.translationScore) : '';
    const verdictText = r.comprehensionVerdict || '';
    const compScoreLabel = typeof r.comprehensionScore === 'number' ? r.comprehensionScore : '';
    const dateLabel = typeof r.timestamp === 'number' ? new Date(r.timestamp).toLocaleDateString() : '';
    // Quote the student/parsha name in case a name ever contains a comma.
    lines.push([`"${r.studentName}"`, `"${r.parshaName}"`, r.perekNum, r.posukLabel, scoreLabel, translationLabel, verdictText, compScoreLabel, dateLabel].join(','));
  });
  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'posuk_practice_report.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Must match student.html's slugify exactly - this is the key used both to
// gate entry there and to manage the approved-name list here.
function slugify(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
