<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posuk Practice — Teacher Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Quicksand:wght@500;600;700&family=Noto+Serif+Hebrew:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1F2D3D;
    --navy-light: #2E4257;
    --parchment: #F1E7CE;
    --gold: #C9A227;
    --gold-light: #E4C662;
    --rimon: #8C2F39;
    --ink: #24344A;
    --ink-soft: #5A6C82;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Quicksand', sans-serif;
    background: linear-gradient(180deg, var(--navy) 0%, #16202c 100%);
    color: #E9E4D4;
    min-height:100vh;
  }
  .wrap{ max-width: 1000px; margin:0 auto; padding: 26px 18px 60px; }
  header{ text-align:center; margin-bottom: 20px; }
  header h1{
    font-family:'Frank Ruhl Libre', serif;
    color: var(--gold-light);
    margin:0 0 4px;
    font-size: 1.8rem;
  }
  header p{ margin:0; color:#B7C2D0; font-size:0.9rem; }

  .gate{
    max-width: 360px; margin: 60px auto; background:#26374A; border-radius:14px;
    padding:24px; text-align:center; border: 2px solid var(--gold);
  }
  .gate input{
    font-size:1.1rem; padding:10px 14px; border-radius:10px; border:none; width:100%;
    margin: 12px 0; text-align:center;
  }

  .btn{
    font-family:'Quicksand', sans-serif; font-weight:700; border:none; border-radius:999px;
    padding: 10px 22px; cursor:pointer; color:#fff; background: var(--rimon);
    box-shadow: 0 4px 0 #6e1f28;
  }
  .btn:active{ transform: translateY(2px); box-shadow:none; }
  .btn.gold{ background: var(--gold); color:var(--ink); box-shadow: 0 4px 0 #97781a; }

  .layout{ display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .students-panel{
    flex: 0 0 240px;
    background:#26374A;
    border-radius: 14px;
    padding: 14px;
    max-height: 75vh;
    overflow-y:auto;
  }
  .students-panel h2{ font-size:1rem; color: var(--gold-light); margin:0 0 10px; }
  .student-item{
    padding: 10px 12px;
    border-radius: 10px;
    cursor:pointer;
    margin-bottom: 6px;
    font-weight:600;
    display:flex; justify-content:space-between; align-items:center;
  }
  .student-item:hover{ background: #32475e; }
  .student-item.active{ background: var(--gold); color: var(--ink); }
  .student-item .last-active{ font-size:0.7rem; opacity:0.7; font-weight:500; }

  .main-panel{
    flex: 1 1 500px;
    background: var(--parchment);
    color: var(--ink);
    border-radius: 16px;
    padding: 20px;
    min-height: 400px;
  }
  .main-panel h2{
    font-family:'Frank Ruhl Libre', serif;
    color: var(--rimon);
    margin-top:0;
  }
  .filters{ display:flex; gap:8px; margin-bottom: 14px; flex-wrap:wrap; }
  .filters select{
    padding:8px 10px; border-radius:8px; border:2px solid var(--ink-soft); font-family:'Quicksand', sans-serif;
  }

  .posuk-group{
    background:#fff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .posuk-group h3{
    font-family:'Frank Ruhl Libre', serif;
    margin:0 0 4px;
    color: var(--ink);
    font-size:1rem;
  }
  .posuk-hebrew{
    font-family:'Noto Serif Hebrew', serif;
    direction:rtl;
    font-size:1.3rem;
    color:#3B2A1E;
    margin: 4px 0 10px;
  }
  .attempt-row{
    border-top: 1px dashed #ccc;
    padding: 8px 0;
    font-size:0.85rem;
  }
  .attempt-row .top-line{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; margin-bottom:4px;}
  .score-pill{
    background: var(--gold-light); border-radius:999px; padding:2px 10px; font-weight:700; font-size:0.75rem;
  }
  audio{ height:32px; max-width: 240px; }
  .empty-msg{ color: var(--ink-soft); text-align:center; padding: 40px 0; }
  .loading{ color: var(--ink-soft); text-align:center; padding:20px 0; }

  .tab-bar{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:0.85rem;
    border: 2px solid var(--ink-soft); background:#fff; color: var(--ink-soft);
    border-radius: 999px; padding: 8px 18px; cursor:pointer;
  }
  .tab-btn.active{ background: var(--rimon); border-color: var(--rimon); color:#fff; }

  .summary-row{
    background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .summary-row .top-line{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  .summary-row h3{ font-family:'Frank Ruhl Libre', serif; margin:0; font-size:1rem; color:var(--ink); }
  .summary-meta{ font-size:0.75rem; color: var(--ink-soft); }
  .avg-bars{ display:flex; gap:18px; margin-top:10px; flex-wrap:wrap; }
  .avg-bar{ flex:1; min-width:180px; }
  .avg-bar .bar-label{ display:flex; justify-content:space-between; font-size:0.78rem; font-weight:700; margin-bottom:4px; color: var(--ink-soft); }
  .bar-track{ background:#e8e0c8; border-radius:999px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; }
  .bar-fill.hebrew{ background: var(--navy); }
  .bar-fill.translate{ background: var(--rimon); }

  /* ---------- Student tile grid (By Student tab) ---------- */
  .student-head{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .student-head h2{ margin:0; }
  .mini-tabs{ display:flex; gap:6px; }
  .mini-tab-btn{
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:0.78rem;
    border: 2px solid var(--gold); background:#fff; color: var(--ink-soft);
    border-radius: 999px; padding: 6px 14px; cursor:pointer;
  }
  .mini-tab-btn.active{ background: var(--rimon); border-color: var(--rimon-dark, var(--rimon)); color:#fff; }
  .perek-label{
    font-family:'Frank Ruhl Libre', serif; font-weight:700; color: var(--rimon);
    margin: 14px 0 6px; display:flex; justify-content:space-between; align-items:baseline;
  }
  .perek-label .summary{ font-family:'Quicksand', sans-serif; font-weight:600; font-size:0.78rem; color: var(--ink-soft); }
  .posuk-grid{
    display:grid; grid-template-columns: repeat(10, 1fr); gap: 8px; direction: rtl;
  }
  @media (max-width: 560px){ .posuk-grid{ grid-template-columns: repeat(5, 1fr); gap: 10px; } }
  .posuk-tile{
    aspect-ratio: 1 / 1; border-radius: 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Quicksand', sans-serif; cursor:pointer; border: none; padding: 4px;
    transition: transform .08s ease; overflow: hidden;
  }
  .posuk-tile:active{ transform: scale(0.94); }
  .posuk-tile.selected{ outline: 3px solid var(--navy); outline-offset: 2px; }
  .posuk-tile .tile-num{ font-family: 'Noto Serif Hebrew', serif; font-weight:700; font-size:1.4rem; line-height:1; }
  .posuk-tile .tile-score{ font-size:0.62rem; font-weight:600; line-height:1.1; text-align:center; margin-top:4px; opacity:0.9; }
  .posuk-tile.tile-none{ background: #fff; border: 2px dashed var(--ink-soft); color: var(--ink-soft); }
  .posuk-tile.tile-high{ background: #C9E4A6; color: #33511E; }
  .posuk-tile.tile-mid{ background: var(--gold-light); color: var(--ink); }
  .posuk-tile.tile-low{ background: #EFC1C1; color: #7A2626; }
  #posukDetail{ margin-top:18px; }
  #posukDetail:empty{ margin-top:0; }

  /* ---------- Class Roster tab ---------- */
  .roster-table{ width:100%; border-collapse: collapse; }
  .roster-table th{
    text-align:left; font-size:0.78rem; color: var(--ink-soft); font-weight:700;
    padding: 6px 10px; border-bottom: 2px solid var(--gold);
  }
  .roster-row{ cursor:pointer; }
  .roster-row:hover{ background: #f7efd8; }
  .roster-row td{ padding: 10px; border-bottom: 1px dashed #d8c9a0; font-size:0.9rem; }
  .roster-row .rname{ font-weight:700; }
  .status-pill{
    display:inline-block; border-radius:999px; padding:3px 12px; font-size:0.75rem; font-weight:700;
  }
  .status-pill.high{ background:#C9E4A6; color:#33511E; }
  .status-pill.mid{ background: var(--gold-light); color: var(--ink); }
  .status-pill.low{ background:#EFC1C1; color:#7A2626; }
  .status-pill.none{ background:#e8e0c8; color: var(--ink-soft); }

  /* ---------- Class Stats tab ---------- */
  .stat-cards{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .stat-card{
    flex:1; min-width:130px; background:#fff; border-radius:12px; padding:14px 12px; text-align:center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .stat-card .num{ font-family:'Frank Ruhl Libre', serif; font-size:1.6rem; font-weight:700; color: var(--rimon); }
  .stat-card .lbl{ font-size:0.72rem; color: var(--ink-soft); font-weight:600; margin-top:2px; }
  .section-title{ font-family:'Frank Ruhl Libre', serif; color: var(--rimon); margin: 20px 0 10px; font-size:1.1rem; }
  .bucket-chart{ display:flex; gap:14px; align-items:flex-end; height:120px; background:#fff; border-radius:12px; padding:14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .bucket-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bucket-bar{ width:100%; border-radius:8px 8px 0 0; }
  .bucket-bar.high{ background:#9FCB6B; }
  .bucket-bar.mid{ background: var(--gold); }
  .bucket-bar.low{ background:#D97A7A; }
  .bucket-col .bucket-count{ font-weight:700; font-size:0.85rem; margin-bottom:4px; }
  .bucket-col .bucket-lbl{ font-size:0.7rem; color: var(--ink-soft); margin-top:6px; text-align:center; }
  .activity-chart{ display:flex; gap:6px; align-items:flex-end; height:100px; background:#fff; border-radius:12px; padding:14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .activity-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .activity-bar{ width:100%; background: var(--navy); border-radius:4px 4px 0 0; min-height:2px; }
  .activity-col .activity-lbl{ font-size:0.62rem; color: var(--ink-soft); margin-top:5px; }
  .dur{ font-size:0.72rem; opacity:0.75; font-weight:600; }

  /* ---------- Class Stats: collapsible perek accordion ---------- */
  .perek-section{ border-bottom: 1px dashed #d8c9a0; margin-bottom: 4px; }
  .perek-header{ cursor:pointer; user-select:none; margin: 10px 0; }
  .perek-header .arrow{ display:inline-block; transition: transform .15s ease; margin-inline-end:6px; font-size:0.8em; }
  .perek-section.expanded .perek-header .arrow{ transform: rotate(90deg); }
  .perek-body{ display:none; padding-bottom:12px; }
  .perek-section.expanded .perek-body{ display:block; }
  .class-posuk-detail-inline{ margin-top:14px; }
  .class-posuk-detail-inline:empty{ margin-top:0; }
  .not-done-list{ font-size:0.85rem; color: var(--ink-soft); line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">

  <div id="gate" class="gate">
    <div>Teacher Passcode</div>
    <input id="passcodeInput" type="password" placeholder="Enter passcode">
    <button class="btn gold" id="enterBtn">Enter Dashboard</button>
    <div id="gateMsg" style="font-size:0.8rem;margin-top:8px;color:#ffb3b3;"></div>
  </div>

  <div id="dashboard" style="display:none;">
    <header>
      <h1>📖 Posuk Practice — Teacher Dashboard</h1>
      <p>Review recordings and self-grades for every student</p>
    </header>

    <div class="layout">
      <div class="students-panel">
        <h2>Students</h2>
        <div id="studentList" class="loading">Loading students…</div>
      </div>

      <div class="main-panel">
        <div class="tab-bar">
          <button class="tab-btn active" id="studentTabBtn">👤 By Student</button>
          <button class="tab-btn" id="rosterTabBtn">📋 Class Roster</button>
          <button class="tab-btn" id="summaryTabBtn">📊 Class Stats</button>
        </div>
        <div id="mainContent" class="empty-msg">Select a student to view their practice history.</div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
/* Paste the SAME firebaseConfig used in student.html and your other B3 Games files */
const firebaseConfig = {
  apiKey: "AIzaSyDaheO5K2qL8qe3rHIZY4nTd0wuEUG_DEs",
  authDomain: "b3-games.firebaseapp.com",
  databaseURL: "https://b3-games-default-rtdb.firebaseio.com",
  projectId: "b3-games",
  storageBucket: "b3-games.firebasestorage.app",
  messagingSenderId: "568530046190",
  appId: "1:568530046190:web:fd765fdd27e55a3c73f7ff"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* Simple client-side passcode gate — NOT real security, just keeps casual visitors out.
   Change this to whatever you'd like. */
const TEACHER_PASSCODE = "vayeira5786";

const RATING_LABELS = [
  "Just Starting", "Trying Hard", "Getting There", "Making Progress", "Doing Okay",
  "Pretty Good", "Really Good", "Great Job", "Excellent", "Perfect!"
];

document.getElementById('enterBtn').onclick = () => {
  const val = document.getElementById('passcodeInput').value;
  if(val === TEACHER_PASSCODE){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadStudents();
  }else{
    document.getElementById('gateMsg').textContent = 'Incorrect passcode.';
  }
};

let activeStudentId = null;
let studentsMap = {}; // id -> name
let studentsInfo = {}; // id -> { name, lastActive }

const PARSHA_ORDER = { "Vayeira": 0, "ChayeiSarah": 1, "Toldos": 2 };

/* =========================================================
   PARSHA / PEREK / POSUK MAP + Hebrew numerals — kept identical
   to student.html / progress.html so ranges & labels line up.
   ========================================================= */
const PARSHA_CONFIG = {
  "Vayeira":      [ {num:18}, {num:19}, {num:20}, {num:21}, {num:22} ],
  "Chayei Sarah": [ {num:23}, {num:24}, {num:25, maxPosuk:18} ],
  "Toldos":       [ {num:25, minPosuk:19}, {num:26}, {num:27}, {num:28, maxPosuk:9} ]
};

const HEB_HUNDREDS = ['','ק','ר','ש','ת'];
const HEB_TENS = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
const HEB_ONES = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];

function hebrewLetters(num){
  let n = num;
  let letters = '';
  while(n >= 400){ letters += 'ת'; n -= 400; }
  if(n >= 100){
    letters += HEB_HUNDREDS[Math.floor(n / 100)];
    n = n % 100;
  }
  if(n === 15){
    letters += 'טו';
    n = 0;
  } else if(n === 16){
    letters += 'טז';
    n = 0;
  } else {
    if(n >= 10){
      letters += HEB_TENS[Math.floor(n / 10)];
      n = n % 10;
    }
    if(n > 0){
      letters += HEB_ONES[n];
    }
  }
  return letters;
}

function hebrewNumeral(num){
  const letters = hebrewLetters(num);
  if(!letters) return String(num);
  if(letters.length === 1) return letters + '׳';
  return letters.slice(0, -1) + '״' + letters.slice(-1);
}

function scoreTier(score){
  if(score >= 8) return 'high';
  if(score >= 5) return 'mid';
  return 'low';
}

const LOCAL_TEXT = { 18: new Array(33) }; // only length matters here

let chapterCache = {};
async function fetchChapterLength(perekNum){
  if(chapterCache[perekNum]) return chapterCache[perekNum];
  if(LOCAL_TEXT[perekNum]){
    chapterCache[perekNum] = LOCAL_TEXT[perekNum].length;
    return chapterCache[perekNum];
  }
  const cacheKey = 'posukPractice_ch_v7_' + perekNum;
  const localCached = localStorage.getItem(cacheKey);
  if(localCached){
    const len = JSON.parse(localCached).length;
    chapterCache[perekNum] = len;
    return len;
  }
  try{
    const res = await fetch('https://www.sefaria.org/api/texts/Genesis.' + perekNum + '?context=0&pad=0');
    const data = await res.json();
    const len = (data.he || []).length;
    chapterCache[perekNum] = len;
    return len;
  }catch(err){
    console.error('Could not determine chapter length for perek', perekNum, err);
    return null;
  }
}

function getPerekRangeStatic(perekNum){
  let min = Infinity, max = -Infinity, needsFetch = false;
  Object.values(PARSHA_CONFIG).forEach(chapters => {
    const ch = chapters.find(c => c.num === perekNum);
    if(ch){
      min = Math.min(min, ch.minPosuk || 1);
      if(ch.maxPosuk){ max = Math.max(max, ch.maxPosuk); }
      else { needsFetch = true; }
    }
  });
  return { min, max, needsFetch };
}

async function getPerekRange(perekNum){
  const { min, max, needsFetch } = getPerekRangeStatic(perekNum);
  if(!needsFetch) return { min, max };
  const len = await fetchChapterLength(perekNum);
  return { min, max: len ? Math.max(max, len) : max };
}

function getAllPerekNums(){
  const nums = new Set();
  Object.values(PARSHA_CONFIG).forEach(chapters => chapters.forEach(ch => nums.add(ch.num)));
  return [...nums].sort((a,b) => a - b);
}

/* A given perek can belong to two different parshas at once (e.g. perek 25
   splits between Chayei Sarah and Toldos), so posukKey construction needs to
   know which parsha a specific posuk falls under, not just the perek. */
function resolveParshaSlug(perekNum, posukNum){
  for(const [name, chapters] of Object.entries(PARSHA_CONFIG)){
    const ch = chapters.find(c => c.num === perekNum);
    if(!ch) continue;
    const min = ch.minPosuk || 1;
    const max = ch.maxPosuk || Infinity;
    if(posukNum >= min && posukNum <= max) return name.replace(/\s+/g, '');
  }
  return null;
}

function formatDuration(seconds){
  if(!isFinite(seconds) || seconds === null) return '';
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function getAudioDuration(url){
  return new Promise((resolve) => {
    const audio = new Audio();
    audio.preload = 'metadata';
    audio.onloadedmetadata = () => resolve(audio.duration);
    audio.onerror = () => resolve(null);
    audio.src = url;
  });
}

document.getElementById('studentTabBtn').onclick = () => setTab('student');
document.getElementById('rosterTabBtn').onclick = () => setTab('roster');
document.getElementById('summaryTabBtn').onclick = () => setTab('summary');

function setTab(tab){
  document.getElementById('studentTabBtn').classList.toggle('active', tab === 'student');
  document.getElementById('rosterTabBtn').classList.toggle('active', tab === 'roster');
  document.getElementById('summaryTabBtn').classList.toggle('active', tab === 'summary');
  if(tab === 'summary'){
    [...document.querySelectorAll('.student-item')].forEach(e => e.classList.remove('active'));
    loadClassSummary();
  }else if(tab === 'roster'){
    [...document.querySelectorAll('.student-item')].forEach(e => e.classList.remove('active'));
    loadRoster();
  }else if(activeStudentId){
    const el = [...document.querySelectorAll('.student-item')].find(e => e.dataset.id === activeStudentId);
    if(el) selectStudent(activeStudentId, studentsMap[activeStudentId], el);
  }else{
    document.getElementById('mainContent').innerHTML = '<div class="empty-msg">Select a student to view their practice history.</div>';
  }
}

async function loadStudents(){
  const listEl = document.getElementById('studentList');
  try{
    const snap = await db.ref('posukPractice/students').once('value');
    const val = snap.val();
    if(!val){
      listEl.innerHTML = '<div class="empty-msg">No students yet.</div>';
      return;
    }
    listEl.innerHTML = '';
    Object.entries(val)
      .sort((a,b) => a[1].name.localeCompare(b[1].name))
      .forEach(([id, info]) => {
        studentsMap[id] = info.name;
        studentsInfo[id] = info;
        const div = document.createElement('div');
        div.className = 'student-item';
        div.dataset.id = id;
        const lastActive = info.lastActive ? new Date(info.lastActive).toLocaleDateString() : '';
        div.innerHTML = `<span>${info.name}</span><span class="last-active">${lastActive}</span>`;
        div.onclick = () => { setTab('student'); selectStudent(id, info.name, div); };
        listEl.appendChild(div);
      });
  }catch(err){
    listEl.innerHTML = '<div class="empty-msg">Could not load students.</div>';
    console.error(err);
  }
}

/* ---------- Shared cache of every attempt, every student ----------
   Roster and Class Stats both need the full tree; fetch it once and
   reuse until the teacher explicitly refreshes. */
let allAttemptsCache = null;
async function loadAllAttempts(forceRefresh){
  if(allAttemptsCache && !forceRefresh) return allAttemptsCache;
  const snap = await db.ref('posukPractice/attempts').once('value');
  allAttemptsCache = snap.val() || {};
  return allAttemptsCache;
}

/* Reduce one student's raw posukMap (posukKey -> attemptId -> {...})
   down to simple stats used by the Roster and Class Stats tabs. */
function computeStudentStats(posukMap){
  let scores = [];
  let posukCount = 0;
  Object.values(posukMap || {}).forEach(attemptMap => {
    const attempts = Object.values(attemptMap).sort((a,b) => b.timestamp - a.timestamp);
    const latest = attempts[0];
    posukCount++;
    if(typeof latest.hebrewScore === 'number') scores.push(latest.hebrewScore);
    if(typeof latest.translationScore === 'number') scores.push(latest.translationScore);
  });
  const avg = scores.length ? scores.reduce((a,b) => a+b, 0) / scores.length : null;
  return { posukCount, avg };
}

/* ---------- Class Roster ---------- */
async function loadRoster(){
  const mainEl = document.getElementById('mainContent');
  mainEl.innerHTML = '<div class="loading">Building class roster…</div>';
  try{
    const allAttempts = await loadAllAttempts();
    const rows = Object.entries(studentsMap).map(([id, name]) => {
      const stats = computeStudentStats(allAttempts[id]);
      const lastActive = studentsInfo[id] && studentsInfo[id].lastActive
        ? new Date(studentsInfo[id].lastActive).toLocaleDateString() : '—';
      return { id, name, ...stats, lastActive };
    });

    if(rows.length === 0){
      mainEl.innerHTML = '<h2>Class Roster</h2><div class="empty-msg">No students yet.</div>';
      return;
    }

    // Students needing the most support float to the top; students with
    // no recordings at all sort to the very bottom.
    rows.sort((a,b) => {
      if(a.avg === null && b.avg === null) return a.name.localeCompare(b.name);
      if(a.avg === null) return 1;
      if(b.avg === null) return -1;
      return a.avg - b.avg;
    });

    let html = `<h2>Class Roster</h2>
      <table class="roster-table">
        <thead><tr>
          <th>Student</th><th>Pesukim Recorded</th><th>Avg Score</th><th>Status</th><th>Last Active</th>
        </tr></thead><tbody>`;
    rows.forEach(r => {
      const tier = r.avg === null ? 'none' : scoreTier(r.avg);
      const tierLabel = tier === 'high' ? 'Doing Well' : tier === 'mid' ? 'Making Progress' : tier === 'low' ? 'Needs Support' : 'Not Started';
      const avgLabel = r.avg === null ? '—' : r.avg.toFixed(1) + '/10';
      html += `<tr class="roster-row" data-id="${r.id}">
        <td class="rname">${r.name}</td>
        <td>${r.posukCount}</td>
        <td>${avgLabel}</td>
        <td><span class="status-pill ${tier}">${tierLabel}</span></td>
        <td>${r.lastActive}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    mainEl.innerHTML = html;

    mainEl.querySelectorAll('.roster-row').forEach(row => {
      row.onclick = () => {
        const id = row.dataset.id;
        setTab('student');
        const el = [...document.querySelectorAll('.student-item')].find(e => e.dataset.id === id);
        if(el) selectStudent(id, studentsMap[id], el);
      };
    });
  }catch(err){
    mainEl.innerHTML = '<div class="empty-msg">Could not build the class roster.</div>';
    console.error(err);
  }
}

let studentActiveTab = 'translation'; // 'translation' | 'reading', for the currently-viewed student
let studentPosukData = {}; // posukKey -> { attempts, latest } for the currently-viewed student
let studentPerekData = {}; // perekNum -> posukNum -> posukKey, for the currently-viewed student
let selectedPosukKey = null;

async function selectStudent(id, name, el){
  activeStudentId = id;
  selectedPosukKey = null;
  [...document.querySelectorAll('.student-item')].forEach(e => e.classList.remove('active'));
  el.classList.add('active');

  const mainEl = document.getElementById('mainContent');
  mainEl.innerHTML = '<div class="loading">Loading ' + name + '\'s practice history…</div>';

  try{
    const snap = await db.ref('posukPractice/attempts/' + id).once('value');
    const val = snap.val();
    if(!val){
      mainEl.innerHTML = '<h2>' + name + '</h2><div class="empty-msg">No recordings yet.</div>';
      return;
    }

    // Reshape into perek -> posuk -> posukKey, and cache each posukKey's
    // attempts so tapping a tile can show detail without re-fetching.
    studentPosukData = {};
    studentPerekData = {};
    Object.entries(val).forEach(([posukKey, attemptMap]) => {
      const attempts = Object.values(attemptMap).sort((a,b) => b.timestamp - a.timestamp);
      studentPosukData[posukKey] = { attempts, latest: attempts[0] };
      const parts = posukKey.split('_');
      if(parts.length < 3) return;
      const posukNum = parseInt(parts[parts.length - 1]);
      const perekNum = parseInt(parts[parts.length - 2]);
      if(!perekNum || !posukNum) return;
      if(!studentPerekData[perekNum]) studentPerekData[perekNum] = {};
      studentPerekData[perekNum][posukNum] = posukKey;
    });

    mainEl.innerHTML = `
      <div class="student-head">
        <h2>${name}</h2>
        <div class="mini-tabs">
          <button class="mini-tab-btn ${studentActiveTab==='translation'?'active':''}" id="studentTranslationBtn">🌐 Translation</button>
          <button class="mini-tab-btn ${studentActiveTab==='reading'?'active':''}" id="studentReadingBtn">🎙️ Reading</button>
        </div>
      </div>
      <div id="studentGridWrap"></div>
      <div id="posukDetail"></div>`;
    document.getElementById('studentTranslationBtn').onclick = () => { studentActiveTab = 'translation'; renderStudentGrid(); };
    document.getElementById('studentReadingBtn').onclick = () => { studentActiveTab = 'reading'; renderStudentGrid(); };

    await renderStudentGrid();
    if(selectedPosukKey) renderPosukDetail(selectedPosukKey);
  }catch(err){
    mainEl.innerHTML = '<div class="empty-msg">Could not load this student\'s recordings.</div>';
    console.error(err);
  }
}

async function renderStudentGrid(){
  document.querySelectorAll('.mini-tab-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(studentActiveTab === 'translation' ? 'studentTranslationBtn' : 'studentReadingBtn');
  if(btn) btn.classList.add('active');

  const wrap = document.getElementById('studentGridWrap');
  wrap.innerHTML = '';
  const scoreField = studentActiveTab === 'translation' ? 'translationScore' : 'hebrewScore';
  const perekNums = Object.keys(studentPerekData).map(Number).sort((a,b) => a - b);

  if(perekNums.length === 0){
    wrap.innerHTML = '<div class="empty-msg">No recordings yet.</div>';
    return;
  }

  for(const perekNum of perekNums){
    const range = await getPerekRange(perekNum);
    const posuksThisPerek = studentPerekData[perekNum];
    let doneCount = 0;

    const label = document.createElement('div');
    label.className = 'perek-label';
    label.innerHTML = `<span>פרק ${hebrewNumeral(perekNum)}</span><span class="summary" id="teacherPerekSummary${perekNum}"></span>`;

    const grid = document.createElement('div');
    grid.className = 'posuk-grid';

    for(let posukNum = range.min; posukNum <= range.max; posukNum++){
      const posukKey = posuksThisPerek[posukNum];
      const record = posukKey ? studentPosukData[posukKey].latest : null;
      const score = record ? record[scoreField] : null;
      if(score) doneCount++;

      const tile = document.createElement('div');
      tile.className = 'posuk-tile ' + (score ? 'tile-' + scoreTier(score) : 'tile-none') + (posukKey === selectedPosukKey ? ' selected' : '');
      tile.innerHTML = `<span class="tile-num">${hebrewNumeral(posukNum)}</span><span class="tile-score">${score ? RATING_LABELS[score - 1] : '—'}</span>`;
      if(posukKey){
        tile.onclick = () => { selectedPosukKey = posukKey; renderStudentGrid(); renderPosukDetail(posukKey); };
      }
      grid.appendChild(tile);
    }

    label.querySelector('#teacherPerekSummary' + perekNum).textContent = `${doneCount}/${range.max - range.min + 1} pesukim done`;
    wrap.appendChild(label);
    wrap.appendChild(grid);
  }
}

function renderPosukDetail(posukKey){
  const detailEl = document.getElementById('posukDetail');
  if(!detailEl) return;
  const { attempts, latest } = studentPosukData[posukKey];
  const refLabel = formatRefLabel(posukKey);
  let html = `<div class="posuk-group">
    <h3>${refLabel}</h3>
    <div class="posuk-hebrew">${latest.posukText || ''}</div>`;
  attempts.forEach(a => {
    const dateStr = new Date(a.timestamp).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
    let lines = `<div class="top-line"><strong>${dateStr}</strong></div>`;
    if(a.hebrewAudioURL){
      lines += `<div class="top-line">
        <span>🎙️ Hebrew reading — <span class="score-pill">${a.hebrewScore}/10 · ${RATING_LABELS[a.hebrewScore-1]}</span></span>
        <audio controls src="${a.hebrewAudioURL}"></audio>
      </div>`;
    }
    if(a.translationAudioURL){
      lines += `<div class="top-line">
        <span>🌐 Translation — <span class="score-pill">${a.translationScore}/10 · ${RATING_LABELS[a.translationScore-1]}</span></span>
        <audio controls src="${a.translationAudioURL}"></audio>
      </div>`;
    }
    html += `<div class="attempt-row">${lines}</div>`;
  });
  html += `</div>`;
  detailEl.innerHTML = html;
}

/* ---------- Shared helpers ---------- */
function parsePosukKey(posukKey){
  // format: ParshaSlug_perek_posuk  e.g. "ChayeiSarah_24_10"
  const parts = posukKey.split('_');
  const posuk = parseInt(parts.pop());
  const perek = parseInt(parts.pop());
  const parshaSlug = parts.join('');
  return { parshaSlug, perek, posuk };
}

function formatRefLabel(posukKey){
  const { parshaSlug, perek, posuk } = parsePosukKey(posukKey);
  const parshaName = parshaSlug === 'ChayeiSarah' ? 'Chayei Sarah' : parshaSlug;
  return `${parshaName} · Perek ${perek} · Posuk ${posuk}`;
}

function sortPosukKeys(keys){
  return keys.sort((a, b) => {
    const pa = parsePosukKey(a), pb = parsePosukKey(b);
    const orderA = PARSHA_ORDER[pa.parshaSlug] ?? 99;
    const orderB = PARSHA_ORDER[pb.parshaSlug] ?? 99;
    if(orderA !== orderB) return orderA - orderB;
    if(pa.perek !== pb.perek) return pa.perek - pb.perek;
    return pa.posuk - pb.posuk;
  });
}

/* ---------- Class Summary ---------- */
let classActiveSkill = 'translation'; // 'translation' | 'reading' -- one global toggle for the whole tab
let expandedPerekNum = null; // only one perek open (accordion) at a time; null = all collapsed
let lastAttemptsVal = null; // cached attempts tree so toggling skill/expand doesn't need a re-fetch

async function loadClassSummary(){
  const mainEl = document.getElementById('mainContent');
  mainEl.innerHTML = '<div class="loading">Crunching class averages…</div>';
  try{
    const val = await loadAllAttempts();
    lastAttemptsVal = val;
    if(!val || Object.keys(val).length === 0){
      mainEl.innerHTML = '<h2>Class Stats</h2><div class="empty-msg">No recordings yet.</div>';
      return;
    }

    let html = '<h2>Class Stats</h2>';
    html += `<div class="mini-tabs" style="margin-bottom:6px;">
      <button class="mini-tab-btn ${classActiveSkill==='translation'?'active':''}" id="classTranslationBtn">🌐 Translation</button>
      <button class="mini-tab-btn ${classActiveSkill==='reading'?'active':''}" id="classReadingBtn">🎙️ Reading</button>
    </div>`;
    html += `<div id="classPosukGridWrap"></div>`;
    mainEl.innerHTML = html;

    document.getElementById('classTranslationBtn').onclick = () => { classActiveSkill = 'translation'; renderClassPosukGrid(lastAttemptsVal); };
    document.getElementById('classReadingBtn').onclick = () => { classActiveSkill = 'reading'; renderClassPosukGrid(lastAttemptsVal); };

    await renderClassPosukGrid(val);
  }catch(err){
    mainEl.innerHTML = '<div class="empty-msg">Could not load class summary.</div>';
    console.error(err);
  }
}

let classPosukData = {}; // posukKey -> { doneList, notDoneList, posukText } for the currently active skill
let selectedClassPosukKey = null;

async function renderClassPosukGrid(val){
  const wrap = document.getElementById('classPosukGridWrap');
  if(!wrap) return;
  wrap.innerHTML = '';
  classPosukData = {};
  const totalStudents = Object.keys(studentsMap).length;
  if(totalStudents === 0){
    wrap.innerHTML = '<div class="empty-msg">No students yet.</div>';
    return;
  }
  const scoreField = classActiveSkill === 'translation' ? 'translationScore' : 'hebrewScore';
  const audioField = classActiveSkill === 'translation' ? 'translationAudioURL' : 'hebrewAudioURL';

  const perekNums = getAllPerekNums();
  for(const perekNum of perekNums){
    const range = await getPerekRange(perekNum);
    const isExpanded = expandedPerekNum === perekNum;

    const section = document.createElement('div');
    section.className = 'perek-section' + (isExpanded ? ' expanded' : '');

    const header = document.createElement('div');
    header.className = 'perek-label perek-header';
    header.innerHTML = `<span><span class="arrow">▶</span>פרק ${hebrewNumeral(perekNum)}</span><span class="summary" id="classPerekSummary${perekNum}"></span>`;
    header.onclick = () => {
      expandedPerekNum = isExpanded ? null : perekNum;
      selectedClassPosukKey = null;
      renderClassPosukGrid(val);
    };

    const body = document.createElement('div');
    body.className = 'perek-body';

    const grid = document.createElement('div');
    grid.className = 'posuk-grid';
    let perekStarted = 0, perekTotal = 0;

    if(isExpanded){
      for(let posukNum = range.min; posukNum <= range.max; posukNum++){
        const slug = resolveParshaSlug(perekNum, posukNum);
        if(!slug) continue;
        const posukKey = `${slug}_${perekNum}_${posukNum}`;
        perekTotal++;

        const doneList = [];
        let posukText = '';
        Object.entries(studentsMap).forEach(([studentId, name]) => {
          const attemptMap = val[studentId] && val[studentId][posukKey];
          if(attemptMap){
            const attempts = Object.values(attemptMap).sort((a,b) => b.timestamp - a.timestamp);
            const latest = attempts.find(a => typeof a[scoreField] === 'number') || null;
            if(latest){
              doneList.push({ studentId, name, latest });
              if(!posukText && latest.posukText) posukText = latest.posukText;
            }
          }
        });
        const doneIds = new Set(doneList.map(d => d.studentId));
        const notDoneList = Object.entries(studentsMap)
          .filter(([sid]) => !doneIds.has(sid))
          .map(([, name]) => name);

        if(doneList.length) perekStarted++;

        const scores = doneList.map(d => d.latest[scoreField]).filter(s => typeof s === 'number');
        const avg = scores.length ? scores.reduce((a,b) => a+b, 0) / scores.length : null;

        classPosukData[posukKey] = { doneList, notDoneList, posukText };

        const tile = document.createElement('div');
        tile.className = 'posuk-tile ' + (avg !== null ? 'tile-' + scoreTier(avg) : 'tile-none') + (posukKey === selectedClassPosukKey ? ' selected' : '');
        tile.innerHTML = `<span class="tile-num">${hebrewNumeral(posukNum)}</span><span class="tile-score">${doneList.length}/${totalStudents}</span>`;
        tile.onclick = () => {
          const prevSelected = grid.querySelector('.posuk-tile.selected');
          if(prevSelected) prevSelected.classList.remove('selected');
          tile.classList.add('selected');
          selectedClassPosukKey = posukKey;
          renderClassPosukDetail(posukKey, body);
        };
        grid.appendChild(tile);
      }
    }else{
      // Collapsed: still need started/total counts for the header summary,
      // without building tiles (keeps collapsed sections cheap).
      for(let posukNum = range.min; posukNum <= range.max; posukNum++){
        const slug = resolveParshaSlug(perekNum, posukNum);
        if(!slug) continue;
        perekTotal++;
        const posukKey = `${slug}_${perekNum}_${posukNum}`;
        const started = Object.keys(studentsMap).some(studentId => {
          const attemptMap = val[studentId] && val[studentId][posukKey];
          return attemptMap && Object.values(attemptMap).some(a => typeof a[scoreField] === 'number');
        });
        if(started) perekStarted++;
      }
    }

    header.querySelector('#classPerekSummary' + perekNum).textContent = `${perekStarted}/${perekTotal} pesukim started`;
    body.appendChild(grid);
    body.appendChild(Object.assign(document.createElement('div'), { className: 'class-posuk-detail-inline' }));
    section.appendChild(header);
    section.appendChild(body);
    wrap.appendChild(section);

    if(isExpanded && selectedClassPosukKey && classPosukData[selectedClassPosukKey]){
      renderClassPosukDetail(selectedClassPosukKey, body);
    }
  }
}

function renderClassPosukDetail(posukKey, bodyEl){
  const detailEl = bodyEl.querySelector('.class-posuk-detail-inline');
  if(!detailEl) return;
  const data = classPosukData[posukKey];
  if(!data) return;
  const total = Object.keys(studentsMap).length;
  const doneCount = data.doneList.length;
  const notDoneCount = total - doneCount;
  const refLabel = formatRefLabel(posukKey);
  const skillLabel = classActiveSkill === 'translation' ? '🌐 Translation' : '🎙️ Reading';
  const audioField = classActiveSkill === 'translation' ? 'translationAudioURL' : 'hebrewAudioURL';
  const scoreField = classActiveSkill === 'translation' ? 'translationScore' : 'hebrewScore';
  const durKey = classActiveSkill === 'translation' ? 'tr' : 'heb';

  let html = `<div class="posuk-group">
    <h3>${refLabel} — ${skillLabel}</h3>
    ${data.posukText ? `<div class="posuk-hebrew">${data.posukText}</div>` : ''}
    <div class="summary-meta" style="margin-bottom:10px;">${doneCount} of ${total} student${total===1?'':'s'} recorded this posuk${notDoneCount > 0 ? ' · ' + notDoneCount + ' not yet' : ''}</div>`;

  if(doneCount === 0){
    html += `<div class="empty-msg">No one has recorded this posuk yet.</div>`;
  }else{
    [...data.doneList].sort((a,b) => a.name.localeCompare(b.name)).forEach(entry => {
      const a = entry.latest;
      const dateStr = new Date(a.timestamp).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
      let lines = `<div class="top-line"><strong>${entry.name}</strong><span class="summary-meta">${dateStr}</span></div>`;
      if(a[audioField]){
        lines += `<div class="top-line">
          <span>${skillLabel} — <span class="score-pill">${a[scoreField]}/10 · ${RATING_LABELS[a[scoreField]-1]}</span> <span class="dur" id="dur_${entry.studentId}_${durKey}">⏱ …</span></span>
          <audio controls src="${a[audioField]}"></audio>
        </div>`;
      }
      html += `<div class="attempt-row">${lines}</div>`;
    });
  }

  if(data.notDoneList.length > 0){
    html += `<div class="section-title" style="margin:14px 0 6px;font-size:0.95rem;">Not Yet Recorded</div>
      <div class="not-done-list">${[...data.notDoneList].sort().join(', ')}</div>`;
  }
  html += `</div>`;
  detailEl.innerHTML = html;

  // Recording lengths aren't stored — fetch them lazily from the audio
  // files themselves only for the posuk currently being viewed.
  data.doneList.forEach(entry => {
    const a = entry.latest;
    if(a[audioField]){
      getAudioDuration(a[audioField]).then(d => {
        const el = document.getElementById(`dur_${entry.studentId}_${durKey}`);
        if(el) el.textContent = d ? '⏱ ' + formatDuration(d) : '';
      });
    }
  });
}
