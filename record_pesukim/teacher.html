/* Simple client-side passcode gate — NOT real security, just keeps casual visitors out.
   Change this to whatever you'd like. */
const TEACHER_PASSCODE = "vayeira5786";

/* Comprehension is graded as a category, not a 1-10 rating. */
const VERDICT_INFO = {
  excellent: { label: '🌟 Excellent', tier: 'high' },
  correct:   { label: '✅ Got it',    tier: 'high' },
  partial:   { label: '🤔 Almost',    tier: 'mid'  },

/* ---------- Dispute-aware score/verdict readers ----------
   If a teacher has finalized a disputed attempt, that final value
   should be what's used everywhere a score/verdict is displayed or
   averaged — not the original auto-graded one. Everything below reads
   through these two helpers rather than the raw fields directly. */
function effHebrewScore(record){
  return (record && typeof record.hebrewFinalScore === 'number') ? record.hebrewFinalScore : (record ? record.hebrewScore : null);
}
function effComprehensionVerdict(record){
  return record ? (record.comprehensionFinalVerdict || record.comprehensionVerdict) : null;
}
function effComprehensionScore(record){
  return (record && typeof record.comprehensionScore === 'number') ? record.comprehensionScore : null;
}
function hasPendingDispute(record){
  return !!record && (record.hebrewDisputeStatus === 'pending' || record.comprehensionDisputeStatus === 'pending');
}

let activeStudentId = null;
let studentsMap = {}; // id -> name
let studentsInfo = {}; // id -> { name, lastActive }

const PARSHA_ORDER = { "Vayeira": 0, "ChayeiSarah": 1, "Toldos": 2 };

/* =========================================================
   PARSHA / PEREK / POSUK MAP + Hebrew numerals — kept identical
   to student.html / progress.html so ranges & labels line up.
   ========================================================= */
const PARSHA_CONFIG = {
  "Vayeira":      [ {num:18}, {num:19}, {num:20}, {num:21}, {num:22} ],
  "Chayei Sarah": [ {num:23}, {num:24}, {num:25, maxPosuk:18} ],
  "Toldos":       [ {num:25, minPosuk:19}, {num:26}, {num:27}, {num:28, maxPosuk:9} ]
};

const HEB_HUNDREDS = ['','ק','ר','ש','ת'];
const HEB_TENS = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
const HEB_ONES = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];

function hebrewLetters(num){
  let n = num;
  let letters = '';
  while(n >= 400){ letters += 'ת'; n -= 400; }
  if(n >= 100){
    letters += HEB_HUNDREDS[Math.floor(n / 100)];
    n = n % 100;
  }
  if(n === 15){
    letters += 'טו';
    n = 0;
  } else if(n === 16){
    letters += 'טז';
    n = 0;
  } else {
    if(n >= 10){
      letters += HEB_TENS[Math.floor(n / 10)];
      n = n % 10;
    }
    if(n > 0){
      letters += HEB_ONES[n];
    }
  }
  return letters;
}

function hebrewNumeral(num){
  const letters = hebrewLetters(num);
  if(!letters) return String(num);
  if(letters.length === 1) return letters + '׳';
  return letters.slice(0, -1) + '״' + letters.slice(-1);
}

/* hebrewScore is a 0-100 percentage from the automatic reading scorer. */
function pctTier(score){
  if(score >= 80) return 'high';
  if(score >= 50) return 'mid';
  return 'low';
}

const LOCAL_TEXT = { 18: new Array(33) }; // only length matters here

let chapterCache = {};
async function fetchChapterLength(perekNum){
  if(chapterCache[perekNum]) return chapterCache[perekNum];
  if(LOCAL_TEXT[perekNum]){
    chapterCache[perekNum] = LOCAL_TEXT[perekNum].length;
    return chapterCache[perekNum];
  }
  const cacheKey = 'posukPractice_ch_v7_' + perekNum;
  const localCached = localStorage.getItem(cacheKey);
  if(localCached){
    const len = JSON.parse(localCached).length;
    chapterCache[perekNum] = len;
    return len;
  }
  try{
    const res = await fetch('https://www.sefaria.org/api/texts/Genesis.' + perekNum + '?context=0&pad=0');
    const data = await res.json();
    const len = (data.he || []).length;
    chapterCache[perekNum] = len;
    return len;
  }catch(err){
    console.error('Could not determine chapter length for perek', perekNum, err);
    return null;
  }
}

function getPerekRangeStatic(perekNum){
  let min = Infinity, max = -Infinity, needsFetch = false;
  Object.values(PARSHA_CONFIG).forEach(chapters => {
    const ch = chapters.find(c => c.num === perekNum);
    if(ch){
      min = Math.min(min, ch.minPosuk || 1);
      if(ch.maxPosuk){ max = Math.max(max, ch.maxPosuk); }
      else { needsFetch = true; }
    }
  });
  return { min, max, needsFetch };
}

async function getPerekRange(perekNum){
  const { min, max, needsFetch } = getPerekRangeStatic(perekNum);
  if(!needsFetch) return { min, max };
  const len = await fetchChapterLength(perekNum);
  return { min, max: len ? Math.max(max, len) : max };
}

function getAllPerekNums(){
  const nums = new Set();
  Object.values(PARSHA_CONFIG).forEach(chapters => chapters.forEach(ch => nums.add(ch.num)));
  return [...nums].sort((a,b) => a - b);
}

/* A given perek can belong to two different parshas at once (e.g. perek 25
   splits between Chayei Sarah and Toldos), so posukKey construction needs to
   know which parsha a specific posuk falls under, not just the perek. */
function resolveParshaSlug(perekNum, posukNum){
  for(const [name, chapters] of Object.entries(PARSHA_CONFIG)){
    const ch = chapters.find(c => c.num === perekNum);
    if(!ch) continue;
    const min = ch.minPosuk || 1;
    const max = ch.maxPosuk || Infinity;
    if(posukNum >= min && posukNum <= max) return name.replace(/\s+/g, '');
  }
  return null;
}

function formatDuration(seconds){
  if(!isFinite(seconds) || seconds === null) return '';
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function getAudioDuration(url){
  return new Promise((resolve) => {
    const audio = new Audio();
    audio.preload = 'metadata';
    audio.onloadedmetadata = () => resolve(audio.duration);
    audio.onerror = () => resolve(null);
    audio.src = url;
  });
}

document.getElementById('accessTabBtn').onclick = () => setTab('access');

function setTab(tab){
  document.getElementById('studentTabBtn').classList.toggle('active', tab === 'student');
  document.getElementById('rosterTabBtn').classList.toggle('active', tab === 'roster');
  document.getElementById('summaryTabBtn').classList.toggle('active', tab === 'summary');
  document.getElementById('reportsTabBtn').classList.toggle('active', tab === 'reports');
  document.getElementById('accessTabBtn').classList.toggle('active', tab === 'access');
  if(tab === 'summary'){
    [...document.querySelectorAll('.student-item')].forEach(e => e.classList.remove('active'));
    loadClassSummary();
  }else if(tab === 'roster'){
    [...document.querySelectorAll('.student-item')].forEach(e => e.classList.remove('active'));
    loadRoster();
  }else if(tab === 'reports'){
    [...document.querySelectorAll('.student-item')].forEach(e => e.classList.remove('active'));
    loadReportsTab();
  }else if(tab === 'access'){
    [...document.querySelectorAll('.student-item')].forEach(e => e.classList.remove('active'));
    loadAccessTab();
  }else if(activeStudentId){
    const el = [...document.querySelectorAll('.student-item')].find(e => e.dataset.id === activeStudentId);
    if(el) selectStudent(activeStudentId, studentsMap[activeStudentId], el);
  }else{
    document.getElementById('mainContent').innerHTML = '<div class="empty-msg">Select a student to view their practice history.</div>';
  }
}

async function loadStudents(){
  const listEl = document.getElementById('studentList');
  try{
    const snap = await db.ref('posukPractice/students').once('value');
    const val = snap.val();
    if(!val){
      listEl.innerHTML = '<div class="empty-msg">No students yet.</div>';
      return;
    }
    listEl.innerHTML = '';
    Object.entries(val)
      .sort((a,b) => a[1].name.localeCompare(b[1].name))
      .forEach(([id, info]) => {
        studentsMap[id] = info.name;
        studentsInfo[id] = info;
        const div = document.createElement('div');
        div.className = 'student-item';
        div.dataset.id = id;
        const lastActive = info.lastActive ? new Date(info.lastActive).toLocaleDateString() : '';
        div.innerHTML = `<span>${info.name}<span class="dispute-badge hidden" id="disputeBadge_${id}"></span></span><span class="last-active">${lastActive}</span>`;
        div.onclick = () => { setTab('student'); selectStudent(id, info.name, div); };
        listEl.appendChild(div);
      });
    markStudentsWithPendingDisputes();
  }catch(err){
    listEl.innerHTML = '<div class="empty-msg">Could not load students.</div>';
    console.error(err);
  }
}

/* Scans every attempt once (reusing the shared cache) so the sidebar can
   flag students with a pending dispute — the teacher shouldn't have to
   click into each student just to find out one is waiting on them. */
async function markStudentsWithPendingDisputes(){
  try{
    const allAttempts = await loadAllAttempts();
    Object.keys(studentsMap).forEach(id => {
      const posukMap = allAttempts[id];
      const badge = document.getElementById('disputeBadge_' + id);
      if(!badge || !posukMap) return;
      let count = 0;
      Object.values(posukMap).forEach(attemptMap => {
        Object.values(attemptMap).forEach(a => {
          if(a.hebrewDisputeStatus === 'pending') count++;
          if(a.comprehensionDisputeStatus === 'pending') count++;
        });
      });
      if(count > 0){
        badge.textContent = '⚠️ ' + count;
        badge.classList.remove('hidden');
      }else{
        badge.textContent = '';
        badge.classList.add('hidden');
      }
    });
  }catch(err){
    console.error('Could not check for pending disputes', err);
  }
}

/* ---------- Shared cache of every attempt, every student ----------
   Roster and Class Stats both need the full tree; fetch it once and
   reuse until the teacher explicitly refreshes. */
let allAttemptsCache = null;
async function loadAllAttempts(forceRefresh){
  if(allAttemptsCache && !forceRefresh) return allAttemptsCache;
  const snap = await db.ref('posukPractice/attempts').once('value');
  allAttemptsCache = snap.val() || {};
  return allAttemptsCache;
}

/* Reduce one student's raw posukMap (posukKey -> attemptId -> {...})
   down to simple stats used by the Roster and Class Stats tabs. */
function computeStudentStats(posukMap){
  let hebrewScores = [];
  let verdictCounts = { excellent: 0, correct: 0, partial: 0, incorrect: 0 };
  let posukCount = 0;
  Object.values(posukMap || {}).forEach(attemptMap => {
    const attempts = Object.values(attemptMap).sort((a,b) => b.timestamp - a.timestamp);
    const latest = attempts[0];
    posukCount++;
    const hScore = effHebrewScore(latest);
    if(typeof hScore === 'number') hebrewScores.push(hScore);
    const cVerdict = effComprehensionVerdict(latest);
    if(cVerdict && verdictCounts.hasOwnProperty(cVerdict)){
      verdictCounts[cVerdict]++;
    }
  });
  const avg = hebrewScores.length ? hebrewScores.reduce((a,b) => a+b, 0) / hebrewScores.length : null;
  return { posukCount, avg, verdictCounts };
}

/* ---------- Class Roster ---------- */
async function loadRoster(){
  const mainEl = document.getElementById('mainContent');
  mainEl.innerHTML = '<div class="loading">Building class roster…</div>';
  try{
    const allAttempts = await loadAllAttempts();
    const rows = Object.entries(studentsMap).map(([id, name]) => {
      const stats = computeStudentStats(allAttempts[id]);
      const lastActive = studentsInfo[id] && studentsInfo[id].lastActive
        ? new Date(studentsInfo[id].lastActive).toLocaleDateString() : '—';
      return { id, name, ...stats, lastActive };
    });

    if(rows.length === 0){
      mainEl.innerHTML = '<h2>Class Roster</h2><div class="empty-msg">No students yet.</div>';
      return;
    }

    // Students needing the most support float to the top; students with
    // no recordings at all sort to the very bottom.
    rows.sort((a,b) => {
      if(a.avg === null && b.avg === null) return a.name.localeCompare(b.name);
      if(a.avg === null) return 1;
      if(b.avg === null) return -1;
      return a.avg - b.avg;
    });

    let html = `<h2>Class Roster</h2>
      <table class="roster-table">
        <thead><tr>
          <th>Student</th><th>Pesukim Recorded</th><th>Avg Reading %</th><th>Comprehension</th><th>Last Active</th>
        </tr></thead><tbody>`;
    rows.forEach(r => {
      const tier = r.avg === null ? 'none' : pctTier(r.avg);
      const tierLabel = tier === 'high' ? 'Doing Well' : tier === 'mid' ? 'Making Progress' : tier === 'low' ? 'Needs Support' : 'Not Started';
      const avgLabel = r.avg === null ? '—' : Math.round(r.avg) + '%';
      const vc = r.verdictCounts;
      const compParts = [];
      if(vc.excellent) compParts.push('🌟' + vc.excellent);
      if(vc.correct) compParts.push('✅' + vc.correct);
      if(vc.partial) compParts.push('🤔' + vc.partial);
      if(vc.incorrect) compParts.push('💡' + vc.incorrect);
      const compLabel = compParts.length ? compParts.join(' ') : '—';
      html += `<tr class="roster-row" data-id="${r.id}">
        <td class="rname">${r.name}</td>
        <td>${r.posukCount}</td>
        <td>${avgLabel}</td>
        <td><span class="status-pill ${tier}">${tierLabel}</span> <span style="margin-left:6px;">${compLabel}</span></td>
        <td>${r.lastActive}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    mainEl.innerHTML = html;

    mainEl.querySelectorAll('.roster-row').forEach(row => {
      row.onclick = () => {
        const id = row.dataset.id;
        setTab('student');
        const el = [...document.querySelectorAll('.student-item')].find(e => e.dataset.id === id);
        if(el) selectStudent(id, studentsMap[id], el);
      };
    });
  }catch(err){
    mainEl.innerHTML = '<div class="empty-msg">Could not build the class roster.</div>';
    console.error(err);
  }
}

/* ---------- Reports tab ----------
   Flat, filterable list of every posuk attempt across the class: who,
   which parsha/perek/posuk, their reading %, and their comprehension
   verdict. Filters can be combined freely — one/several/all students,
   one parsha, one perek within it, one posuk within that perek, a date
   range, and which score type(s) to show — so a teacher can go as broad
   as "the whole class, whole parsha" or as narrow as "how did everyone
   do on this one posuk". Results can be read on screen, downloaded as a
   CSV, or opened in a print-friendly view (which any browser can
   "Print to PDF" from). */
let reportRows = []; // cached rows for the current filter selection, used by CSV/print export

function verdictLabel(v){
  if(v === 'excellent') return '🌟 Excellent';
  if(v === 'correct') return '✅ Got it';
  if(v === 'partial') return '🤔 Almost';
  if(v === 'incorrect') return '💡 Try again';
  return '—';
}

// Same as verdictLabel but appends the supplementary 0-100 score, e.g.
// "🌟 Excellent (94%)" — used wherever a report row displays comprehension.
function verdictLabelWithScore(v, score){
  const label = verdictLabel(v);
  if(label === '—' || typeof score !== 'number') return label;
  return label + ' (' + score + '%)';
}

// Builds one row per posuk (or posuk-range) per student from the raw
// attempts tree, resolving each posukKey into a parsha name / perek /
// posuk number so it can be filtered and displayed like the rest of the
// dashboard. A comprehension range attempt (key ends in "from-to" instead
// of a plain posuk number) becomes a row with isRange true and no reading
// score, since range attempts are comprehension-only.
// Includes the latest attempt's timestamp so rows can be filtered/shown by date.
function buildReportRows(allAttempts){
  const rows = [];
  Object.entries(studentsMap).forEach(([id, name]) => {
    const posukMap = allAttempts[id];
    if(!posukMap) return;
    Object.entries(posukMap).forEach(([posukKey, attemptMap]) => {
      const parts = posukKey.split('_');
      if(parts.length < 3) return;
      const posukPart = parts[parts.length - 1];
      const perekNum = parseInt(parts[parts.length - 2]);
      const parshaSlug = parts.slice(0, parts.length - 2).join('_');
      if(!perekNum) return;
      const rangeMatch = /^(\d+)-(\d+)$/.exec(posukPart);
      const isRange = !!rangeMatch;
      const posukNum = isRange ? parseInt(rangeMatch[1]) : parseInt(posukPart);
      if(!posukNum) return;
      const rangeStart = isRange ? parseInt(rangeMatch[1]) : null;
      const rangeEnd = isRange ? parseInt(rangeMatch[2]) : null;
      const parshaName = Object.keys(PARSHA_CONFIG).find(n => n.replace(/\s+/g,'') === parshaSlug) || parshaSlug;
      const attempts = Object.values(attemptMap).sort((a,b) => b.timestamp - a.timestamp);
      const latest = attempts[0];
      rows.push({
        studentId: id,
        studentName: name,
        parshaName,
        perekNum,
        posukNum,
        isRange,
        rangeStart,
        rangeEnd,
        posukLabel: isRange ? `${rangeStart}–${rangeEnd}` : String(posukNum),
        timestamp: latest ? latest.timestamp : null,
        hebrewScore: isRange ? null : effHebrewScore(latest), // range attempts are comprehension-only
        comprehensionVerdict: effComprehensionVerdict(latest),
        comprehensionScore: effComprehensionScore(latest)
      });
    });
  });
  return rows;
}

      dateToInput.value = todayStr;
      dateFromInput.disabled = true;
      dateToInput.disabled = true;

// Repopulates the Perek dropdown to match the chosen parsha (or every
// perek across all parshas, if "All Parshas" is selected), and resets
// the Posuk dropdown since it depends on which perek ends up chosen.
function populatePerekFilter(parshaFilter){
  const perekSelect = document.getElementById('reportPerekFilter');
  const perekNums = parshaFilter === 'all'
    ? getAllPerekNums()
    : (PARSHA_CONFIG[parshaFilter] || []).map(ch => ch.num);
  perekSelect.innerHTML = '<option value="all">All Perakim</option>' +
    perekNums.map(n => `<option value="${n}">${n}</option>`).join('');
  populatePosukFilter('all');
}

// Repopulates the Posuk checkbox box to the actual posuk range of the
// chosen perek. Left empty/disabled-looking when no single perek is
// chosen, since "posuk 5" doesn't mean anything across several perakim.
// Supports shift-click range selection, same idea as shift-clicking a
// range of files: click one posuk, shift-click another, and everything
// in between gets checked too — handy for "pesukim 1 through 10".
let lastPosukCbIndex = null;

async function populatePosukFilter(perekFilter){
  const box = document.getElementById('reportPosukBox');
  lastPosukCbIndex = null;

  if(perekFilter === 'all'){
    box.innerHTML = '<label style="display:block;font-size:0.85rem;font-weight:600;margin:0 0 4px;"><input type="checkbox" id="reportPosukAll" checked> All Pesukim</label>';
    box.style.opacity = '0.6';
    box.style.pointerEvents = 'none';
    return;
  }

  box.style.opacity = '1';
  box.style.pointerEvents = 'auto';
  box.innerHTML = '<label style="display:block;font-size:0.85rem;font-weight:600;margin:0 0 4px;"><input type="checkbox" id="reportPosukAll" checked> All Pesukim</label>';
  try{
    const { min, max } = await getPerekRange(parseInt(perekFilter));
    if(isFinite(min) && isFinite(max)){
      let html = box.innerHTML;
      for(let p = min; p <= max; p++){
        html += `<label style="display:block;font-size:0.85rem;font-weight:400;margin:2px 0;"><input type="checkbox" class="report-posuk-cb" value="${p}"> ${p}</label>`;
      }
      box.innerHTML = html;
    }
  }catch(err){
    console.error('Could not load posuk range for perek', perekFilter, err);
  }

  wirePosukCheckboxes();
}

function wirePosukCheckboxes(){
  const allBox = document.getElementById('reportPosukAll');
  const cbs = () => [...document.querySelectorAll('.report-posuk-cb')];
  allBox.onchange = () => {
    if(allBox.checked) cbs().forEach(cb => cb.checked = false);
  };
  cbs().forEach((cb, idx) => {
    cb.onclick = (e) => {
      if(e.shiftKey && lastPosukCbIndex !== null){
        const all = cbs();
        const [start, end] = [lastPosukCbIndex, idx].sort((a,b) => a - b);
        for(let i = start; i <= end; i++) all[i].checked = true;
      }
      lastPosukCbIndex = idx;
      if(cb.checked) allBox.checked = false;
      if(!cbs().some(c => c.checked)) allBox.checked = true;
    };
  });
}

function getSelectedPosukNums(){
  const allBox = document.getElementById('reportPosukAll');
  if(!allBox || allBox.checked) return null; // null = no posuk filter, show every posuk
  return [...document.querySelectorAll('.report-posuk-cb')].filter(cb => cb.checked).map(cb => parseInt(cb.value));
}

function getSelectedStudentIds(){
  const allBox = document.getElementById('reportStudentAll');
  if(allBox.checked) return null; // null = no student filter, show everyone
  return [...document.querySelectorAll('.report-student-cb')].filter(cb => cb.checked).map(cb => cb.value);
}

// Shared summary-stats calculation used by the on-screen report, the CSV
// export, and the printable PDF, so all three always agree with each other.
function computeReportSummary(rows, scoreType){
  const distinctStudents = new Set(rows.map(r => r.studentId)).size;
  const readingScores = rows.map(r => r.hebrewScore).filter(s => typeof s === 'number');
  const avgReading = readingScores.length ? Math.round(readingScores.reduce((a,b)=>a+b,0) / readingScores.length) : null;
  const comprehensionScores = rows.map(r => r.comprehensionScore).filter(s => typeof s === 'number');
  const avgComprehension = comprehensionScores.length ? Math.round(comprehensionScores.reduce((a,b)=>a+b,0) / comprehensionScores.length) : null;
  const verdictCounts = { excellent: 0, correct: 0, partial: 0, incorrect: 0 };
  rows.forEach(r => { if(r.comprehensionVerdict && verdictCounts.hasOwnProperty(r.comprehensionVerdict)) verdictCounts[r.comprehensionVerdict]++; });
  return { distinctStudents, avgReading, avgComprehension, verdictCounts };
}

// Renders the summary as an HTML block (used on-screen and in the print view).
function reportSummaryHtml(rows, scoreType){
  const { distinctStudents, avgReading, avgComprehension, verdictCounts } = computeReportSummary(rows, scoreType);
  let summaryHtml = `<div class="attempt" style="margin-bottom:14px;">
      <div class="row"><span class="label">Pesukim in this report</span><span>${rows.length}</span></div>
      <div class="row"><span class="label">Students represented</span><span>${distinctStudents}</span></div>`;
  if(scoreType !== 'comprehension'){
    summaryHtml += `<div class="row"><span class="label">Average reading score</span><span>${avgReading === null ? '—' : avgReading + '%'}</span></div>`;
  }
  if(scoreType !== 'reading'){
    summaryHtml += `<div class="row"><span class="label">Average comprehension score</span><span>${avgComprehension === null ? '—' : avgComprehension + '%'}</span></div>`;
    summaryHtml += `<div class="row"><span class="label">Comprehension breakdown</span><span>🌟${verdictCounts.excellent} ✅${verdictCounts.correct} 🤔${verdictCounts.partial} 💡${verdictCounts.incorrect}</span></div>`;
  }
  summaryHtml += `</div>`;
  return summaryHtml;
}

    const posukNums = getSelectedPosukNums(); // null = all
    const scoreType = document.getElementById('reportScoreTypeFilter').value;
    const dateFromVal = document.getElementById('reportDateFrom').value;
    const dateToVal = document.getElementById('reportDateTo').value;
    const dateFrom = dateFromVal ? new Date(dateFromVal + 'T00:00:00').getTime() : null;
    const dateTo = dateToVal ? new Date(dateToVal + 'T23:59:59').getTime() : null;

    const allAttempts = await loadAllAttempts();
    let rows = buildReportRows(allAttempts);

    if(studentIds) rows = rows.filter(r => studentIds.includes(r.studentId));
    if(parshaFilter !== 'all') rows = rows.filter(r => r.parshaName === parshaFilter);
    if(perekFilter !== 'all') rows = rows.filter(r => r.perekNum === parseInt(perekFilter));
    // A range attempt (e.g. pesukim 3-5) matches a specific-posuk filter if
    // any of the selected posukim fall anywhere inside that range.
    if(posukNums) rows = rows.filter(r => r.isRange
      ? posukNums.some(p => p >= r.rangeStart && p <= r.rangeEnd)
      : posukNums.includes(r.posukNum));
    if(dateFrom !== null) rows = rows.filter(r => typeof r.timestamp === 'number' && r.timestamp >= dateFrom);
    if(dateTo !== null) rows = rows.filter(r => typeof r.timestamp === 'number' && r.timestamp <= dateTo);

    rows.sort((a,b) => {
      const n = a.studentName.localeCompare(b.studentName);
      if(n !== 0) return n;
      if(a.perekNum !== b.perekNum) return a.perekNum - b.perekNum;
      return a.posukNum - b.posukNum;
    });

    reportRows = rows;
    document.getElementById('reportCsvBtn').classList.toggle('hidden', rows.length === 0);
    document.getElementById('reportPrintBtn').classList.toggle('hidden', rows.length === 0);

    if(rows.length === 0){
      summaryEl.innerHTML = '';
      resultsEl.innerHTML = '<div class="empty-msg">No recordings match these filters yet.</div>';
      return;
    }

    // Summary stats give the big picture before scrolling through every row.
    summaryEl.innerHTML = reportSummaryHtml(rows, scoreType);

    // Columns that are redundant given the current filter (e.g. every row
    // is the same student, or the same perek) are dropped from the on-screen
    // table so the teacher isn't scanning a column that never changes.
    const showStudentCol = studentIds === null || studentIds.length !== 1;
    const showParshaCol = parshaFilter === 'all';
    const showPerekCol = perekFilter === 'all';
    const showPosukCol = posukNums === null || posukNums.length !== 1;
    const showReadingCol = scoreType !== 'comprehension';
    const showComprehensionCol = scoreType !== 'reading';

    let headerCells = '';
    if(showStudentCol) headerCells += '<th>Student</th>';
    if(showParshaCol) headerCells += '<th>Parsha</th>';
    if(showPerekCol) headerCells += '<th>Perek</th>';
    if(showPosukCol) headerCells += '<th>Posuk</th>';
    if(showReadingCol) headerCells += '<th>Reading %</th>';
    if(showComprehensionCol) headerCells += '<th>Comprehension</th>';
    headerCells += '<th>Date</th>';

    let html = `<table class="roster-table"><thead><tr>${headerCells}</tr></thead><tbody>`;
    rows.forEach(r => {
      const scoreLabel = typeof r.hebrewScore === 'number' ? Math.round(r.hebrewScore) + '%' : '—';
      const dateLabel = typeof r.timestamp === 'number' ? new Date(r.timestamp).toLocaleDateString() : '—';
      let cells = '';
      if(showStudentCol) cells += `<td>${r.studentName}</td>`;
      if(showParshaCol) cells += `<td>${r.parshaName}</td>`;
      if(showPerekCol) cells += `<td>${r.perekNum}</td>`;
      if(showPosukCol) cells += `<td>${r.posukLabel}</td>`;
      if(showReadingCol) cells += `<td>${scoreLabel}</td>`;
      if(showComprehensionCol) cells += `<td>${verdictLabelWithScore(r.comprehensionVerdict, r.comprehensionScore)}</td>`;
      cells += `<td>${dateLabel}</td>`;
      html += `<tr>${cells}</tr>`;
    });
    html += '</tbody></table>';
    resultsEl.innerHTML = html;
  }catch(err){
    resultsEl.innerHTML = '<div class="empty-msg">Could not build the report.</div>';
    console.error(err);
  }
}

// CSV/print exports always include every column regardless of what's
// hidden on screen — a downloaded file shouldn't silently drop data just
// because it looked redundant in the current on-screen view.
function downloadReportCsv(){
  if(!reportRows.length) return;
  const scoreType = document.getElementById('reportScoreTypeFilter').value;
  const { distinctStudents, avgReading, avgComprehension, verdictCounts } = computeReportSummary(reportRows, scoreType);

  // Summary block first, then a blank line, then the full data table —
  // so the totals are right there without having to scroll or recompute.
  const summaryLines = [];
  summaryLines.push(['Pesukim in this report', reportRows.length].join(','));
  summaryLines.push(['Students represented', distinctStudents].join(','));
  if(scoreType !== 'comprehension'){
    summaryLines.push(['Average reading score', avgReading === null ? '' : avgReading + '%'].join(','));
  }
  if(scoreType !== 'reading'){
    summaryLines.push(['Average comprehension score', avgComprehension === null ? '' : avgComprehension + '%'].join(','));
    summaryLines.push(['Excellent', verdictCounts.excellent].join(','));
    summaryLines.push(['Correct', verdictCounts.correct].join(','));
    summaryLines.push(['Partial', verdictCounts.partial].join(','));
    summaryLines.push(['Incorrect', verdictCounts.incorrect].join(','));
  }

  const header = ['Student','Parsha','Perek','Posuk','Reading %','Comprehension','Comprehension Score','Date'];
  const lines = [...summaryLines, '', header.join(',')];
  reportRows.forEach(r => {
    const scoreLabel = typeof r.hebrewScore === 'number' ? Math.round(r.hebrewScore) : '';
    const verdictText = r.comprehensionVerdict || '';
    const compScoreLabel = typeof r.comprehensionScore === 'number' ? r.comprehensionScore : '';
    const dateLabel = typeof r.timestamp === 'number' ? new Date(r.timestamp).toLocaleDateString() : '';
    // Quote the student/parsha name in case a name ever contains a comma.
    lines.push([`"${r.studentName}"`, `"${r.parshaName}"`, r.perekNum, r.posukLabel, scoreLabel, verdictText, compScoreLabel, dateLabel].join(','));
  });
  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'posuk_practice_report.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

  // Summary block, styled to match the print page rather than the app's

  let summaryRowsHtml = `<tr><td>Pesukim in this report</td><td>${reportRows.length}</td></tr>

// Must match student.html's slugify exactly - this is the key used both to
// gate entry there and to manage the approved-name list here.
function slugify(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}

// "Manage Access" tab: lets the teacher set/change the class PIN and
// maintain the list of approved student names. student.html checks both
// of these (posukPractice/settings/classPin and posukPractice/allowedStudents)
// before letting anyone past the name gate, so random people with the link
// can't show up as "students" without the teacher adding them first.
async function loadAccessTab(){
  const mainEl = document.getElementById('mainContent');
  mainEl.innerHTML = '<div class="loading">Loading access settings…</div>';
  try{
    const [pinSnap, allowedSnap] = await Promise.all([
      db.ref('posukPractice/settings/classPin').once('value'),
      db.ref('posukPractice/allowedStudents').once('value')
    ]);
    const currentPin = pinSnap.val() || '';
    const allowedVal = allowedSnap.val() || {};
    const approvedNames = Object.entries(allowedVal)
      .map(([slug, info]) => ({ slug, name: (info && info.name) || slug }))
      .sort((a,b) => a.name.localeCompare(b.name));

    let html = `<h2>🔑 Manage Access</h2>
      <div class="empty-msg" style="text-align:left;margin-bottom:18px;">
        Students need BOTH the class PIN and an approved name to get into the app.
        Add a name here before sharing the link with a new student.
      </div>
      <div style="margin-bottom:24px;">
        <div style="font-weight:700;margin-bottom:6px;">Class PIN</div>
        <input id="pinInput" type="text" value="${currentPin}" placeholder="e.g. 1234"
          style="padding:8px 12px;border-radius:8px;border:2px solid var(--gold);font-size:1rem;width:160px;">
        <button class="btn small gold" id="savePinBtn" style="margin-left:8px;">Save PIN</button>
        <span id="pinSaveMsg" style="margin-left:10px;font-size:0.85rem;"></span>
      </div>
      <div>
        <div style="font-weight:700;margin-bottom:6px;">Approved Students (${approvedNames.length})</div>
        <input id="newApprovedName" type="text" placeholder="Student's name" maxlength="30"
          style="padding:8px 12px;border-radius:8px;border:2px solid var(--gold);font-size:1rem;width:220px;">
        <button class="btn small gold" id="addApprovedBtn">Add Student</button>
        <span id="addApprovedMsg" style="margin-left:10px;font-size:0.85rem;"></span>
        <table class="roster-table" style="margin-top:14px;">
          <thead><tr><th>Name</th><th style="width:90px;"></th></tr></thead>
          <tbody id="approvedList">
            ${approvedNames.length === 0
              ? '<tr><td colspan="2" class="empty-msg">No approved students yet.</td></tr>'
              : approvedNames.map(a => `<tr data-slug="${a.slug}">
                  <td>${a.name}</td>
                  <td><button class="btn small remove-approved-btn" style="background:#8a3a3a;box-shadow:0 4px 0 #5c2626;">Remove</button></td>
                </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    mainEl.innerHTML = html;

    document.getElementById('savePinBtn').onclick = async () => {
      const val = document.getElementById('pinInput').value.trim();
      const msgEl = document.getElementById('pinSaveMsg');
      try{
        await db.ref('posukPractice/settings/classPin').set(val);
        msgEl.style.color = '#8fd694';
        msgEl.textContent = 'Saved!';
      }catch(e){
        msgEl.style.color = '#ffb3b3';
        msgEl.textContent = 'Could not save.';
        console.error(e);
      }
    };

    document.getElementById('addApprovedBtn').onclick = async () => {
      const nameVal = document.getElementById('newApprovedName').value.trim();
      const msgEl = document.getElementById('addApprovedMsg');
      if(!nameVal){ return; }
      const slug = slugify(nameVal);
      if(!slug){
        msgEl.style.color = '#ffb3b3';
        msgEl.textContent = 'Please enter a valid name.';
        return;
      }
      try{
        await db.ref('posukPractice/allowedStudents/' + slug).set({
          name: nameVal,
          addedAt: firebase.database.ServerValue.TIMESTAMP
        });
        document.getElementById('newApprovedName').value = '';
        msgEl.style.color = '#8fd694';
        msgEl.textContent = 'Added!';
        loadAccessTab();
      }catch(e){
        msgEl.style.color = '#ffb3b3';
        msgEl.textContent = 'Could not add.';
        console.error(e);
      }
    };

    mainEl.querySelectorAll('.remove-approved-btn').forEach(btn => {
      btn.onclick = async () => {
        const row = btn.closest('tr');
        const slug = row.dataset.slug;
        // This only removes permission for that name to log in going forward;
        // it does NOT delete any existing student data, attempts, or recordings.
        try{
          await db.ref('posukPractice/allowedStudents/' + slug).remove();
          loadAccessTab();
        }catch(e){
          console.error(e);
        }
      };
    });
  }catch(err){
    mainEl.innerHTML = '<div class="empty-msg">Could not load access settings.</div>';
    console.error(err);
  }
}

let studentActiveTab = 'comprehension'; // 'comprehension' | 'reading', for the currently-viewed student
let studentPosukData = {}; // posukKey -> { attempts, latest } for the currently-viewed student
let studentPerekData = {}; // perekNum -> posukNum -> posukKey, for the currently-viewed student
let studentRangeData = []; // comprehension-range attempts (posuk grid can't show these as single tiles)
let selectedPosukKey = null;

async function selectStudent(id, name, el){
  activeStudentId = id;
  selectedPosukKey = null;
  [...document.querySelectorAll('.student-item')].forEach(e => e.classList.remove('active'));
  el.classList.add('active');

  const mainEl = document.getElementById('mainContent');
  mainEl.innerHTML = '<div class="loading">Loading ' + name + '\'s practice history…</div>';

  try{
    const snap = await db.ref('posukPractice/attempts/' + id).once('value');
    const val = snap.val();
    if(!val){
      mainEl.innerHTML = `
        <div class="student-head">
          <h2>${name}</h2>
          <div class="mini-tabs">
            <button class="btn small" id="resetStudentBtn" style="background:var(--tent-navy);box-shadow:0 4px 0 #16202e;">↩️ Reset Progress</button>
            <button class="btn small" id="removeStudentBtn" style="background:#8a3a3a;box-shadow:0 4px 0 #5c2626;">🗑️ Remove Student</button>
          </div>
        </div>
        <div class="empty-msg">No recordings yet.</div>`;
      wireStudentAdminButtons(id, name);
      return;
    }

    // Reshape into perek -> posuk -> posukKey, and cache each posukKey's
    // attempts so tapping a tile can show detail without re-fetching.
    // Comprehension-range attempts (key ends "from-to" instead of a plain
    // posuk number) don't fit a single tile, so they're collected
    // separately into studentRangeData and shown as their own list.
    studentPosukData = {};
    studentPerekData = {};
    studentRangeData = [];
    Object.entries(val).forEach(([posukKey, attemptMap]) => {
      const attempts = Object.entries(attemptMap)
        .map(([attemptId, a]) => ({ attemptId, ...a }))
        .sort((a,b) => b.timestamp - a.timestamp);
      studentPosukData[posukKey] = { attempts, latest: attempts[0] };
      const parsed = parsePosukKey(posukKey);
      if(!parsed.perek) return;
      if(parsed.isRange){
        studentRangeData.push({ posukKey, perekNum: parsed.perek, rangeStart: parsed.rangeStart, rangeEnd: parsed.rangeEnd, latest: attempts[0] });
        return;
      }
      if(!parsed.posuk) return;
      if(!studentPerekData[parsed.perek]) studentPerekData[parsed.perek] = {};
      studentPerekData[parsed.perek][parsed.posuk] = posukKey;
    });
    studentRangeData.sort((a,b) => (b.latest ? b.latest.timestamp : 0) - (a.latest ? a.latest.timestamp : 0));

    mainEl.innerHTML = `
      <div class="student-head">
        <h2>${name}</h2>
        <div class="mini-tabs">
          <button class="mini-tab-btn ${studentActiveTab==='comprehension'?'active':''}" id="studentComprehensionBtn">🧠 Comprehension</button>
          <button class="mini-tab-btn ${studentActiveTab==='reading'?'active':''}" id="studentReadingBtn">🎙️ Reading</button>
          <button class="btn small" id="resetStudentBtn" style="background:var(--tent-navy);box-shadow:0 4px 0 #16202e;">↩️ Reset Progress</button>
          <button class="btn small" id="removeStudentBtn" style="background:#8a3a3a;box-shadow:0 4px 0 #5c2626;">🗑️ Remove Student</button>
        </div>
      </div>
      <div id="studentGridWrap"></div>
      <div id="posukDetail"></div>`;
    document.getElementById('studentComprehensionBtn').onclick = () => { studentActiveTab = 'comprehension'; renderStudentGrid(); };
    document.getElementById('studentReadingBtn').onclick = () => { studentActiveTab = 'reading'; renderStudentGrid(); };
    wireStudentAdminButtons(id, name);

    await renderStudentGrid();
    if(selectedPosukKey) renderPosukDetail(selectedPosukKey);
  }catch(err){
    mainEl.innerHTML = '<div class="empty-msg">Could not load this student\'s recordings.</div>';
    console.error(err);
  }
}

// Wires up the Remove/Reset buttons shown in a student's detail view.
// Kept separate from selectStudent since it's called from two different
// innerHTML branches (has-recordings and no-recordings-yet).
function wireStudentAdminButtons(id, name){
  const resetBtn = document.getElementById('resetStudentBtn');
  const removeBtn = document.getElementById('removeStudentBtn');
  if(resetBtn) resetBtn.onclick = () => resetStudentProgress(id, name);
  if(removeBtn) removeBtn.onclick = () => removeStudentEntirely(id, name);
}

// Clears a student's recordings/scores but leaves them as an approved
// student, so they can start over from scratch without needing to be
// re-added to the roster.
async function resetStudentProgress(id, name){
  if(!confirm(`Reset all progress for ${name}? This deletes their recordings and scores but keeps them as an approved student.`)) return;
  try{
    await db.ref('posukPractice/attempts/' + id).remove();
    alert(`${name}'s progress has been reset.`);
    selectStudent(id, name, document.querySelector(`.student-item[data-id="${id}"]`) || document.createElement('div'));
  }catch(e){
    console.error(e);
    alert('Could not reset progress. Please try again.');
  }
}

// Fully removes a student: their entry in the students list, all their
// attempts/recordings, AND their spot on the approved-names list (so they'd
// need to be re-added before they could log back in under that name).
async function removeStudentEntirely(id, name){
  if(!confirm(`Remove ${name} completely? This deletes their recordings, scores, and approval to log in. This can't be undone.`)) return;
  try{
    await Promise.all([
      db.ref('posukPractice/students/' + id).remove(),
      db.ref('posukPractice/attempts/' + id).remove(),
      db.ref('posukPractice/allowedStudents/' + id).remove()
    ]);
    delete studentsMap[id];
    delete studentsInfo[id];
    activeStudentId = null;
    document.getElementById('mainContent').innerHTML = '<div class="empty-msg">Select a student to view their practice history.</div>';
    loadStudents();
    alert(`${name} has been removed.`);
  }catch(e){
    console.error(e);
    alert('Could not remove student. Please try again.');
  }
}

async function renderStudentGrid(){
  document.querySelectorAll('.mini-tab-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(studentActiveTab === 'comprehension' ? 'studentComprehensionBtn' : 'studentReadingBtn');
  if(btn) btn.classList.add('active');

  const wrap = document.getElementById('studentGridWrap');
  wrap.innerHTML = '';
  const perekNums = Object.keys(studentPerekData).map(Number).sort((a,b) => a - b);
  const showRanges = studentActiveTab === 'comprehension' && studentRangeData.length > 0;

  if(perekNums.length === 0 && !showRanges){
    wrap.innerHTML = '<div class="empty-msg">No recordings yet.</div>';
    return;
  }

  for(const perekNum of perekNums){
    const range = await getPerekRange(perekNum);
    const posuksThisPerek = studentPerekData[perekNum];
    let doneCount = 0;

    const label = document.createElement('div');
    label.className = 'perek-label';
    label.innerHTML = `<span>פרק ${hebrewNumeral(perekNum)}</span><span class="summary" id="teacherPerekSummary${perekNum}"></span>`;

    const grid = document.createElement('div');
    grid.className = 'posuk-grid';

    for(let posukNum = range.min; posukNum <= range.max; posukNum++){
      const posukKey = posuksThisPerek[posukNum];
      const record = posukKey ? studentPosukData[posukKey].latest : null;

      let tier = null;
      let tileLabel = '—';
      if(studentActiveTab === 'reading'){
        const score = record ? effHebrewScore(record) : null;
        if(typeof score === 'number'){
          tier = pctTier(score);
          tileLabel = score + '%';
          doneCount++;
        }
      }else{
        const verdict = record ? effComprehensionVerdict(record) : null;
        if(verdict && VERDICT_INFO[verdict]){
          tier = VERDICT_INFO[verdict].tier;
          tileLabel = VERDICT_INFO[verdict].label;
          doneCount++;
        }
      }

      const pending = record && hasPendingDispute(record);
      const tile = document.createElement('div');
      tile.className = 'posuk-tile ' + (tier ? 'tile-' + tier : 'tile-none') + (posukKey === selectedPosukKey ? ' selected' : '') + (pending ? ' tile-disputed' : '');
      tile.innerHTML = `<span class="tile-num">${hebrewNumeral(posukNum)}</span><span class="tile-score">${tileLabel}</span>` + (pending ? '<span class="tile-dispute-flag">⚠️</span>' : '');
      if(posukKey){
        // Give the tile a stable id so the detail panel's "back" button
        // can scroll the teacher precisely back to the tile they came from.
        tile.id = 'tile_' + posukKey;
        tile.onclick = async () => {
          selectedPosukKey = posukKey;
          await renderStudentGrid();
          renderPosukDetail(posukKey);
          // Jump the teacher's eye straight to the detail panel instead of
          // leaving them hunting for it below a long grid of pesukim.
          const detailEl = document.getElementById('posukDetail');
          if(detailEl) detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
      }
      grid.appendChild(tile);
    }

    label.querySelector('#teacherPerekSummary' + perekNum).textContent = `${doneCount}/${range.max - range.min + 1} pesukim done`;
    wrap.appendChild(label);
    wrap.appendChild(grid);
  }

  if(showRanges){
    const label = document.createElement('div');
    label.className = 'perek-label';
    label.innerHTML = `<span>🧠 Multi-posuk comprehension checks</span>`;
    wrap.appendChild(label);

    const list = document.createElement('div');
    list.style.display = 'flex';
    list.style.flexWrap = 'wrap';
    list.style.gap = '8px';
    studentRangeData.forEach(r => {
      const verdict = r.latest ? effComprehensionVerdict(r.latest) : null;
      const vi = (verdict && VERDICT_INFO[verdict]) ? VERDICT_INFO[verdict] : { label: '—', tier: null };
      const pending = r.latest && hasPendingDispute(r.latest);
      const tile = document.createElement('div');
      tile.className = 'posuk-tile ' + (vi.tier ? 'tile-' + vi.tier : 'tile-none') + (r.posukKey === selectedPosukKey ? ' selected' : '') + (pending ? ' tile-disputed' : '');
      tile.style.width = 'auto';
      tile.style.padding = '6px 10px';
      tile.innerHTML = `<span class="tile-num">פרק ${hebrewNumeral(r.perekNum)} · ${r.rangeStart}–${r.rangeEnd}</span><span class="tile-score">${vi.label}</span>` + (pending ? '<span class="tile-dispute-flag">⚠️</span>' : '');
      tile.id = 'tile_' + r.posukKey;
      tile.onclick = async () => {
        selectedPosukKey = r.posukKey;
        await renderStudentGrid();
        renderPosukDetail(r.posukKey);
        const detailEl = document.getElementById('posukDetail');
        if(detailEl) detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      list.appendChild(tile);
    });
    wrap.appendChild(list);
  }
}

function renderPosukDetail(posukKey){
  const detailEl = document.getElementById('posukDetail');
  if(!detailEl) return;
  const { attempts, latest } = studentPosukData[posukKey];
  const refLabel = formatRefLabel(posukKey);
  let html = `<div class="posuk-group">
    <button class="btn small" id="backToTileBtn" style="background:var(--tent-navy);box-shadow:0 4px 0 #16202e;margin-bottom:10px;">⬆️ Back to grid</button>
    <h3>${refLabel}</h3>
    <div class="posuk-hebrew">${latest.posukText || ''}</div>`;
  attempts.forEach(a => {
    const dateStr = new Date(a.timestamp).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
    let lines = `<div class="top-line"><strong>${dateStr}</strong></div>`;
    if(a.hebrewAudioURL){
      const hScore = effHebrewScore(a);
      lines += `<div class="top-line">
        <span>🎙️ Hebrew reading — <span class="score-pill">${hScore}%</span></span>
        <audio controls src="${a.hebrewAudioURL}"></audio>
      </div>`;
      lines += renderDisputeSection(a, posukKey, 'hebrew');
    }
    if(a.comprehensionAudioURL){
      const cVerdict = effComprehensionVerdict(a);
      const vi = VERDICT_INFO[cVerdict] || { label: cVerdict || '' };
      lines += `<div class="top-line">
        <span>🧠 Comprehension — <span class="score-pill">${vi.label}</span></span>
        <audio controls src="${a.comprehensionAudioURL}"></audio>
      </div>`;
      if(a.comprehensionFeedback){
        lines += `<div class="summary-meta" style="margin-top:2px;">${a.comprehensionFeedback}</div>`;
      }
      lines += renderDisputeSection(a, posukKey, 'comprehension');
    }
    html += `<div class="attempt-row">${lines}</div>`;
  });
  html += `</div>`;
  detailEl.innerHTML = html;

  // Scroll back to the exact tile that was clicked, rather than just
  // the top of the grid, so the teacher lands right where they left off.
  const backBtn = document.getElementById('backToTileBtn');
  if(backBtn){
    backBtn.onclick = () => {
      const tileEl = document.getElementById('tile_' + posukKey);
      if(tileEl){
        tileEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }else{
        detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };
  }

  // Wire up finalize controls now that the HTML is in the DOM.
  attempts.forEach(a => {
    if(a.hebrewDisputeStatus === 'pending'){
      wireFinalizeHebrew(a, posukKey);
    }
    if(a.comprehensionDisputeStatus === 'pending'){
      wireFinalizeComprehension(a, posukKey);
    }
  });
}

/* Builds the little banner/finalize block for one skill on one attempt.
   Pending disputes get a red flag + an inline override control; already-
   resolved ones get a quiet confirmation note; no dispute means nothing. */
function renderDisputeSection(a, posukKey, skill){
  if(skill === 'hebrew'){
    if(a.hebrewDisputeStatus === 'pending'){
      return `<div class="dispute-banner">⚠️ Student disputes this score — asked for ${a.hebrewDisputeRequested}%</div>
        <div class="finalize-row" id="finalizeHebrew_${a.attemptId}">
          <span>Final score:</span>
          <input type="number" min="0" max="100" id="finalizeHebrewInput_${a.attemptId}" value="${a.hebrewDisputeRequested}">
          <span>%</span>
          <button class="btn" id="finalizeHebrewAcceptBtn_${a.attemptId}">Accept student's number</button>
          <button class="btn gold" id="finalizeHebrewSaveBtn_${a.attemptId}">Save final score</button>
          <button class="btn small" style="background:var(--ink-soft);box-shadow:none;" id="finalizeHebrewKeepBtn_${a.attemptId}">Keep original (${a.hebrewScore}%)</button>
        </div>`;
    }
    if(a.hebrewDisputeStatus === 'resolved' && typeof a.hebrewFinalScore === 'number'){
      return `<div class="summary-meta" style="margin-top:4px;">✔️ Dispute reviewed — final score set to ${a.hebrewFinalScore}%</div>`;
    }
    return '';
  }
  // comprehension
  const labelMap = { excellent: '🌟 Excellent', correct: '✅ Got it', partial: '🤔 Almost', incorrect: '💡 Try again' };
  if(a.comprehensionDisputeStatus === 'pending'){
    const options = Object.entries(labelMap).map(([key,label]) =>
      `<option value="${key}" ${key === a.comprehensionDisputeRequested ? 'selected' : ''}>${label}</option>`).join('');
    return `<div class="dispute-banner">⚠️ Student disputes this grade — asked for ${labelMap[a.comprehensionDisputeRequested] || a.comprehensionDisputeRequested}</div>
      <div class="finalize-row" id="finalizeComp_${a.attemptId}">
        <span>Final grade:</span>
        <select id="finalizeCompSelect_${a.attemptId}">${options}</select>
        <button class="btn" id="finalizeCompAcceptBtn_${a.attemptId}">Accept student's request</button>
        <button class="btn gold" id="finalizeCompSaveBtn_${a.attemptId}">Save final grade</button>
        <button class="btn small" style="background:var(--ink-soft);box-shadow:none;" id="finalizeCompKeepBtn_${a.attemptId}">Keep original (${labelMap[a.comprehensionVerdict] || a.comprehensionVerdict})</button>
      </div>`;
  }
  if(a.comprehensionDisputeStatus === 'resolved' && a.comprehensionFinalVerdict){
    return `<div class="summary-meta" style="margin-top:4px;">✔️ Dispute reviewed — final grade set to ${labelMap[a.comprehensionFinalVerdict] || a.comprehensionFinalVerdict}</div>`;
  }
  return '';
}

function attemptRef(posukKey, attemptId){
  return db.ref('posukPractice/attempts/' + activeStudentId + '/' + posukKey + '/' + attemptId);
}

function wireFinalizeHebrew(a, posukKey){
  const input = document.getElementById('finalizeHebrewInput_' + a.attemptId);
  const acceptBtn = document.getElementById('finalizeHebrewAcceptBtn_' + a.attemptId);
  const saveBtn = document.getElementById('finalizeHebrewSaveBtn_' + a.attemptId);
  const keepBtn = document.getElementById('finalizeHebrewKeepBtn_' + a.attemptId);
  if(!input || !saveBtn) return;

  const finalize = async (finalScore) => {
    if(isNaN(finalScore) || finalScore < 0 || finalScore > 100){
      alert('Please enter a number between 0 and 100.');
      return;
    }
    try{
      await attemptRef(posukKey, a.attemptId).update({
        hebrewFinalScore: finalScore,
        hebrewDisputeStatus: 'resolved',
        hebrewDisputeResolvedAt: Date.now()
      });
      allAttemptsCache = null; // stats need to be recomputed with the override
      await selectStudent(activeStudentId, studentsMap[activeStudentId],
        [...document.querySelectorAll('.student-item')].find(e => e.dataset.id === activeStudentId));
      selectedPosukKey = posukKey;
      await renderStudentGrid();
      renderPosukDetail(posukKey);
      markStudentsWithPendingDisputes();
    }catch(err){
      console.error(err);
      alert('Could not save the final score — check your internet and try again.');
    }
  };

  acceptBtn.onclick = () => finalize(a.hebrewDisputeRequested);
  saveBtn.onclick = () => finalize(parseInt(input.value, 10));
  keepBtn.onclick = () => finalize(a.hebrewScore);
}

function wireFinalizeComprehension(a, posukKey){
  const select = document.getElementById('finalizeCompSelect_' + a.attemptId);
  const acceptBtn = document.getElementById('finalizeCompAcceptBtn_' + a.attemptId);
  const saveBtn = document.getElementById('finalizeCompSaveBtn_' + a.attemptId);
  const keepBtn = document.getElementById('finalizeCompKeepBtn_' + a.attemptId);
  if(!select || !saveBtn) return;

  const finalize = async (finalVerdict) => {
    if(!VERDICT_INFO[finalVerdict]) return;
    try{
      await attemptRef(posukKey, a.attemptId).update({
        comprehensionFinalVerdict: finalVerdict,
        comprehensionDisputeStatus: 'resolved',
        comprehensionDisputeResolvedAt: Date.now()
      });
      allAttemptsCache = null;
      await selectStudent(activeStudentId, studentsMap[activeStudentId],
        [...document.querySelectorAll('.student-item')].find(e => e.dataset.id === activeStudentId));
      selectedPosukKey = posukKey;
      await renderStudentGrid();
      renderPosukDetail(posukKey);
      markStudentsWithPendingDisputes();
    }catch(err){
      console.error(err);
      alert('Could not save the final grade — check your internet and try again.');
    }
  };

  acceptBtn.onclick = () => finalize(a.comprehensionDisputeRequested);
  saveBtn.onclick = () => finalize(select.value);
  keepBtn.onclick = () => finalize(a.comprehensionVerdict);
}

/* ---------- Shared helpers ---------- */
function parsePosukKey(posukKey){
  // format: ParshaSlug_perek_posuk  e.g. "ChayeiSarah_24_10"
  // A comprehension range attempt uses ParshaSlug_perek_from-to instead
  // (e.g. "ChayeiSarah_24_3-5") since it covers several pesukim at once
  // rather than one — isRange/rangeStart/rangeEnd expose that here so
  // every place that reads a posukKey can handle both shapes.
  const parts = posukKey.split('_');
  const posukPart = parts.pop();
  const perek = parseInt(parts.pop());
  const parshaSlug = parts.join('');
  const rangeMatch = /^(\d+)-(\d+)$/.exec(posukPart);
  if(rangeMatch){
    return { parshaSlug, perek, posuk: parseInt(rangeMatch[1]), isRange: true, rangeStart: parseInt(rangeMatch[1]), rangeEnd: parseInt(rangeMatch[2]) };
  }
  return { parshaSlug, perek, posuk: parseInt(posukPart), isRange: false, rangeStart: null, rangeEnd: null };
}

function formatRefLabel(posukKey){
  const { parshaSlug, perek, posuk, isRange, rangeStart, rangeEnd } = parsePosukKey(posukKey);
  const parshaName = parshaSlug === 'ChayeiSarah' ? 'Chayei Sarah' : parshaSlug;
  const posukLabel = isRange ? `${rangeStart}–${rangeEnd}` : posuk;
  return `${parshaName} · Perek ${perek} · Posuk ${posukLabel}`;
}

function sortPosukKeys(keys){
  return keys.sort((a, b) => {
    const pa = parsePosukKey(a), pb = parsePosukKey(b);
    const orderA = PARSHA_ORDER[pa.parshaSlug] ?? 99;
    const orderB = PARSHA_ORDER[pb.parshaSlug] ?? 99;
    if(orderA !== orderB) return orderA - orderB;
    if(pa.perek !== pb.perek) return pa.perek - pb.perek;
    return pa.posuk - pb.posuk;
  });
}

/* ---------- Class Summary ---------- */
let classActiveSkill = 'comprehension'; // 'comprehension' | 'reading' -- one global toggle for the whole tab
let expandedPerekNum = null; // only one perek open (accordion) at a time; null = all collapsed
let lastAttemptsVal = null; // cached attempts tree so toggling skill/expand doesn't need a re-fetch

async function loadClassSummary(){
  const mainEl = document.getElementById('mainContent');
  mainEl.innerHTML = '<div class="loading">Crunching class averages…</div>';
  try{
    const val = await loadAllAttempts();
    lastAttemptsVal = val;
    if(!val || Object.keys(val).length === 0){
      mainEl.innerHTML = '<h2>Class Stats</h2><div class="empty-msg">No recordings yet.</div>';
      return;
    }

    let html = '<h2>Class Stats</h2>';
    html += `<div class="mini-tabs" style="margin-bottom:6px;">
      <button class="mini-tab-btn ${classActiveSkill==='comprehension'?'active':''}" id="classComprehensionBtn">🧠 Comprehension</button>
      <button class="mini-tab-btn ${classActiveSkill==='reading'?'active':''}" id="classReadingBtn">🎙️ Reading</button>
    </div>`;
    html += `<div id="classPosukGridWrap"></div>`;
    mainEl.innerHTML = html;

    document.getElementById('classComprehensionBtn').onclick = () => { classActiveSkill = 'comprehension'; renderClassPosukGrid(lastAttemptsVal); };
    document.getElementById('classReadingBtn').onclick = () => { classActiveSkill = 'reading'; renderClassPosukGrid(lastAttemptsVal); };

    await renderClassPosukGrid(val);
  }catch(err){
    mainEl.innerHTML = '<div class="empty-msg">Could not load class summary.</div>';
    console.error(err);
  }
}

let classPosukData = {}; // posukKey -> { doneList, notDoneList, posukText } for the currently active skill
let selectedClassPosukKey = null;

/* Returns { tier, label } for a given attempt record + active skill, or
   null if that skill wasn't attempted on this record. Reading is a 0-100
   percentage; comprehension is a category (excellent/correct/partial/
   incorrect), so it needs its own tier mapping rather than an average. */
function skillInfo(record, skill){
  if(!record) return null;
  if(skill === 'reading'){
    if(typeof record.hebrewScore !== 'number') return null;
    const score = effHebrewScore(record);
    return { tier: pctTier(score), label: score + '%' };
  }
  const v = effComprehensionVerdict(record);
  if(!v || !VERDICT_INFO[v]) return null;
  return { tier: VERDICT_INFO[v].tier, label: VERDICT_INFO[v].label };
}

/* For a class-wide tile, there's no single "average" verdict, so we color
   the tile by whichever tier most of the class landed in (ties favor the
   more cautious/lower tier, so a struggling half isn't masked). */
function majorityTier(tiers){
  if(!tiers.length) return null;
  const counts = { high: 0, mid: 0, low: 0 };
  tiers.forEach(t => counts[t]++);
  if(counts.low >= counts.mid && counts.low >= counts.high) return 'low';
  if(counts.mid >= counts.high) return 'mid';
  return 'high';
}

async function renderClassPosukGrid(val){
  const wrap = document.getElementById('classPosukGridWrap');
  if(!wrap) return;
  wrap.innerHTML = '';
  classPosukData = {};
  const totalStudents = Object.keys(studentsMap).length;
  if(totalStudents === 0){
    wrap.innerHTML = '<div class="empty-msg">No students yet.</div>';
    return;
  }
  const audioField = classActiveSkill === 'reading' ? 'hebrewAudioURL' : 'comprehensionAudioURL';

  const perekNums = getAllPerekNums();
  for(const perekNum of perekNums){
    const range = await getPerekRange(perekNum);
    const isExpanded = expandedPerekNum === perekNum;

    const section = document.createElement('div');
    section.className = 'perek-section' + (isExpanded ? ' expanded' : '');

    const header = document.createElement('div');
    header.className = 'perek-label perek-header';
    header.innerHTML = `<span><span class="arrow">▶</span>פרק ${hebrewNumeral(perekNum)}</span><span class="summary" id="classPerekSummary${perekNum}"></span>`;
    header.onclick = () => {
      expandedPerekNum = isExpanded ? null : perekNum;
      selectedClassPosukKey = null;
      renderClassPosukGrid(val);
    };

    const body = document.createElement('div');
    body.className = 'perek-body';

    const grid = document.createElement('div');
    grid.className = 'posuk-grid';
    let perekStarted = 0, perekTotal = 0;

    if(isExpanded){
      for(let posukNum = range.min; posukNum <= range.max; posukNum++){
        const slug = resolveParshaSlug(perekNum, posukNum);
        if(!slug) continue;
        const posukKey = `${slug}_${perekNum}_${posukNum}`;
        perekTotal++;

        const doneList = [];
        let posukText = '';
        Object.entries(studentsMap).forEach(([studentId, name]) => {
          const attemptMap = val[studentId] && val[studentId][posukKey];
          if(attemptMap){
            const attempts = Object.values(attemptMap).sort((a,b) => b.timestamp - a.timestamp);
            const latest = attempts.find(a => skillInfo(a, classActiveSkill)) || null;
            if(latest){
              doneList.push({ studentId, name, latest });
              if(!posukText && latest.posukText) posukText = latest.posukText;
            }
          }
        });
        const doneIds = new Set(doneList.map(d => d.studentId));
        const notDoneList = Object.entries(studentsMap)
          .filter(([sid]) => !doneIds.has(sid))
          .map(([, name]) => name);

        if(doneList.length) perekStarted++;

        const tiers = doneList.map(d => skillInfo(d.latest, classActiveSkill).tier);
        const overallTier = majorityTier(tiers);

        classPosukData[posukKey] = { doneList, notDoneList, posukText };

        const tile = document.createElement('div');
        tile.className = 'posuk-tile ' + (overallTier !== null ? 'tile-' + overallTier : 'tile-none') + (posukKey === selectedClassPosukKey ? ' selected' : '');
        tile.innerHTML = `<span class="tile-num">${hebrewNumeral(posukNum)}</span><span class="tile-score">${doneList.length}/${totalStudents}</span>`;
        tile.onclick = () => {
          const prevSelected = grid.querySelector('.posuk-tile.selected');
          if(prevSelected) prevSelected.classList.remove('selected');
          tile.classList.add('selected');
          selectedClassPosukKey = posukKey;
          renderClassPosukDetail(posukKey, body);
        };
        grid.appendChild(tile);
      }
    }else{
      // Collapsed: still need started/total counts for the header summary,
      // without building tiles (keeps collapsed sections cheap).
      for(let posukNum = range.min; posukNum <= range.max; posukNum++){
        const slug = resolveParshaSlug(perekNum, posukNum);
        if(!slug) continue;
        perekTotal++;
        const posukKey = `${slug}_${perekNum}_${posukNum}`;
        const started = Object.keys(studentsMap).some(studentId => {
          const attemptMap = val[studentId] && val[studentId][posukKey];
          return attemptMap && Object.values(attemptMap).some(a => skillInfo(a, classActiveSkill));
        });
        if(started) perekStarted++;
      }
    }

    header.querySelector('#classPerekSummary' + perekNum).textContent = `${perekStarted}/${perekTotal} pesukim started`;
    body.appendChild(grid);
    body.appendChild(Object.assign(document.createElement('div'), { className: 'class-posuk-detail-inline' }));
    section.appendChild(header);
    section.appendChild(body);
    wrap.appendChild(section);

    if(isExpanded && selectedClassPosukKey && classPosukData[selectedClassPosukKey]){
      renderClassPosukDetail(selectedClassPosukKey, body);
    }
  }
}

function renderClassPosukDetail(posukKey, bodyEl){
  const detailEl = bodyEl.querySelector('.class-posuk-detail-inline');
  if(!detailEl) return;
  const data = classPosukData[posukKey];
  if(!data) return;
  const total = Object.keys(studentsMap).length;
  const doneCount = data.doneList.length;
  const notDoneCount = total - doneCount;
  const refLabel = formatRefLabel(posukKey);
  const skillLabel = classActiveSkill === 'reading' ? '🎙️ Reading' : '🧠 Comprehension';
  const audioField = classActiveSkill === 'reading' ? 'hebrewAudioURL' : 'comprehensionAudioURL';
  const durKey = classActiveSkill === 'reading' ? 'heb' : 'comp';

  let html = `<div class="posuk-group">
    <h3>${refLabel} — ${skillLabel}</h3>
    ${data.posukText ? `<div class="posuk-hebrew">${data.posukText}</div>` : ''}
    <div class="summary-meta" style="margin-bottom:10px;">${doneCount} of ${total} student${total===1?'':'s'} recorded this posuk${notDoneCount > 0 ? ' · ' + notDoneCount + ' not yet' : ''}</div>`;

  if(doneCount === 0){
    html += `<div class="empty-msg">No one has recorded this posuk yet.</div>`;
  }else{
    [...data.doneList].sort((a,b) => a.name.localeCompare(b.name)).forEach(entry => {
      const a = entry.latest;
      const dateStr = new Date(a.timestamp).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
      let lines = `<div class="top-line"><strong>${entry.name}</strong><span class="summary-meta">${dateStr}</span></div>`;
      if(a[audioField]){
        const info = skillInfo(a, classActiveSkill);
        lines += `<div class="top-line">
          <span>${skillLabel} — <span class="score-pill">${info ? info.label : '—'}</span> <span class="dur" id="dur_${entry.studentId}_${durKey}">⏱ …</span></span>
          <audio controls src="${a[audioField]}"></audio>
        </div>`;
        if(classActiveSkill === 'comprehension' && a.comprehensionFeedback){
          lines += `<div class="summary-meta" style="margin-top:2px;">${a.comprehensionFeedback}</div>`;
        }
      }
      html += `<div class="attempt-row">${lines}</div>`;
    });
  }

  if(data.notDoneList.length > 0){
    html += `<div class="section-title" style="margin:14px 0 6px;font-size:0.95rem;">Not Yet Recorded</div>
      <div class="not-done-list">${[...data.notDoneList].sort().join(', ')}</div>`;
  }
  html += `</div>`;
  detailEl.innerHTML = html;

  // Recording lengths aren't stored — fetch them lazily from the audio
  // files themselves only for the posuk currently being viewed.
  data.doneList.forEach(entry => {
    const a = entry.latest;
    if(a[audioField]){
      getAudioDuration(a[audioField]).then(d => {
        const el = document.getElementById(`dur_${entry.studentId}_${durKey}`);
        if(el) el.textContent = d ? '⏱ ' + formatDuration(d) : '';
      });
    }
  });
}
