<!doctype html><html lang="en"><meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Yiddish Story 2</title>
<!-- Second Yiddish story: same reader layout as the Wine Merchant (../story.html).
     Text, audio and pictures come from story.js; word timings from word-times.js. See README.md. -->
<style>[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:#eee7d7;color:#201c18;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25);background:#143e69;color:white;padding:12px 20px;border-bottom:4px solid #ddb649;display:flex;gap:24px;align-items:center}
header a.back{color:#ffe7a3;font-weight:bold;text-decoration:none;white-space:nowrap}header a.back:hover{text-decoration:underline}
h1{font-size:24px;margin:0 0 4px}.title-yi{display:block;font:bold 22px 'Times New Roman',serif;direction:rtl;color:#ffe7a3;margin:0 0 4px}small{font-size:14px;white-space:pre-line}
audio{width:100%}.player{flex:1}
button,select{font:600 16px Arial;padding:9px 12px;border:1px solid #bcc8d3;border-radius:8px;background:white;color:#143e69;cursor:pointer}button:hover{background:#e5eef7}button:disabled{opacity:.4;cursor:default}
.bar{display:flex;align-items:center;gap:8px;padding:8px;flex-wrap:wrap}
main{height:calc(100vh - 119px);min-height:450px;display:grid;grid-template-columns:var(--pictureWidth,55%) 1fr;gap:12px;padding:12px}
.card{background:#fffdf6;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 3px 15px #0002}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#e2dacb;padding:10px}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.soon{display:flex;flex-direction:column;align-items:center;gap:10px;color:#6b5a3a;text-align:center;font-weight:bold;font-size:18px}
.soon span{font-size:64px;line-height:1}
.nav{justify-content:space-between}.caption{text-align:center;padding:8px;background:#fff2c7;font-weight:bold;min-height:36px}
.textbar{background:#fff0bd}.transcript{overflow:auto;flex:1;padding:14px;scroll-behavior:smooth}
.para{font-family:'Times New Roman',serif;font-size:var(--font,28px);line-height:1.6;text-align:right;direction:rtl;white-space:pre-wrap;border:2px solid transparent;padding:12px;border-radius:9px;margin:0 0 10px;cursor:pointer}
.para.en{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-size:20px;cursor:default}
.para.active{background:#ffec8b;border-color:#bc8a00}
.w{border-radius:5px}.w.on{background:#ffb020;color:#1d1300}
.empty{font-size:20px;color:#614d19;padding:18px;line-height:1.5}
.hint{font-size:13px;padding:8px;color:#4f4c45;border-top:1px solid #ddd}
.thumbs{display:flex;overflow-x:auto;gap:6px;padding:6px}.thumbs button{min-width:44px}.chosen{background:#ffe291!important}
#notice{font-size:14px;color:#614d19}input[type=range]{width:110px}
@media(max-width:850px){header{display:block}main{height:auto;display:block}.card{height:70vh;margin-bottom:12px}.player{margin-top:10px}h1{font-size:20px}
 /* No pictures yet: keep the placeholder small so the story text is near the top. */
 main.no-pics .pic-card{height:auto}main.no-pics .stage{min-height:120px;flex:none}main.no-pics .pic-card > .bar{display:none}}
</style>
<script src="../../guest-mode.js?v=20261011-guest"></script><script src="../../access-guard.js" data-b3-tool-id="yiddish"></script><script src="../../teacher-account.js?v=20261008"></script>
<header><a class="back" href="../index.html">← Yiddish</a><div><h1 id="title">Story 2</h1><span id="titleYi" class="title-yi" lang="yi" hidden></span><small id="credit"></small></div><div class="player"><audio id="audio" controls preload="metadata"></audio><div class="bar"><label>Speed <select id="speed"><option>0.75</option><option selected>1</option><option>1.1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><button id="rewind">Back 10 sec</button><button id="full">Full screen</button></div></div></header>
<main><section class="card pic-card" aria-label="Pictures"><div class="bar"><label>Picture width <input id="width" type="range" min="30" max="75" value="55"></label></div><div id="stage" class="stage"></div><div id="caption" class="caption"></div><div id="picNav" class="bar nav"><button id="prev">← Previous</button><strong id="count"></strong><button id="next">Next →</button></div><div id="thumbs" class="thumbs"></div><div class="hint" id="picHint">Pictures follow the audio. You can also use ← / → or click a paragraph.</div></section><section class="card" aria-label="Story text"><div class="bar textbar"><button id="smaller">A−</button><strong id="fontLabel">28 px</strong><button id="bigger">A+</button><button id="top">Text top</button><label><input type="checkbox" id="follow" checked> Follow the audio</label></div><div class="transcript" id="text"></div><div class="hint">Original wording preserved. Click a paragraph to highlight it<span id="seekHint" hidden> and play from there</span>. <span id="notice" role="status"></span></div></section></main>
<script src="story.js?v=1"></script><script src="word-times.js?v=1"></script>
<script>
(() => {
  const S = window.YIDDISH_STORY_2 || {}, WT = window.YIDDISH_STORY_2_WORD_TIMES || null, $ = id => document.getElementById(id);
  const paras = Array.isArray(S.paras) ? S.paras : [], intro = Array.isArray(S.intro) ? S.intro : [];
  const pics = (Array.isArray(S.pictures) ? S.pictures : []).filter(p => p && p.src);
  /* Pictures with `at` (seconds) change at that moment in the audio, even in the middle of a paragraph. */
  const picsByTime = pics.length > 0 && pics.every(p => Number.isFinite(p.at));
  pics.sort(picsByTime ? (a, b) => a.at - b.at : (a, b) => (a.para || 0) - (b.para || 0));
  const times = Object.entries(S.times || {}).map(([i, t]) => [Number(i), Number(t)]).filter(([i, t]) => Number.isInteger(i) && paras[i] != null && Number.isFinite(t)).sort((a, b) => a[1] - b[1]);
  const KEY = 'yiddish-story2-reader-v1', audio = $('audio');
  let state = { font: 28, width: 55 }, pos = 0, activePara = -1, onWord = null;
  try { state = { ...state, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  /* Header */
  const title = S.title || 'Story 2';
  $('title').textContent = title; document.title = title + ' — Yiddish Story';
  if (S.titleYi) { $('titleYi').textContent = S.titleYi; $('titleYi').hidden = false; }
  $('credit').textContent = S.credit || '';

  /* Text */
  const box = $('text');
  intro.forEach(line => { const e = document.createElement('p'); e.className = 'para en'; e.textContent = line; box.append(e); });
  const wordSpans = [];
  paras.forEach((text, i) => {
    const e = document.createElement('p'); e.className = 'para'; e.id = 'p' + i; e.lang = 'yi'; e.dataset.i = i;
    const t = WT && WT.paras && WT.paras[i] && WT.paras[i].t;
    if (Array.isArray(t) && t.length) {
      /* Wrap each whitespace-separated word so it can light up while it is spoken. */
      let k = 0; const spans = [];
      String(text).split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) { e.append(part); return; }
        const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = part;
        const tt = t[k++]; if (Array.isArray(tt)) { sp.dataset.s = tt[0]; sp.dataset.e = tt[1]; spans.push(sp); }
        e.append(sp);
      });
      wordSpans[i] = spans;
    } else e.textContent = text;
    if (!String(text).trim()) e.hidden = true;
    e.onclick = ev => {
      const w = ev.target.closest('.w');
      const at = w && w.dataset.s != null ? Number(w.dataset.s) : startOf(i);
      setActive(i, false);
      if (at != null && audioReady) { audio.currentTime = at; audio.play().catch(() => {}); }
    };
    box.append(e);
  });
  if (!paras.length) {
    const e = document.createElement('p'); e.className = 'empty';
    e.textContent = 'This story is being prepared. Please check back soon.'; box.append(e);
  }
  if (times.length) $('seekHint').hidden = false;
  function startOf(i) { const f = times.find(([p]) => p === i); return f ? f[1] : null; }

  /* Audio */
  let audioReady = false;
  if (paras.length && S.audio) {
    audio.src = S.audio;
    audio.addEventListener('loadedmetadata', () => { audioReady = true; });
    audio.addEventListener('error', () => { $('notice').textContent = 'The recording is not ready yet.'; });
  } else { audio.removeAttribute('src'); audio.closest('.player').querySelectorAll('button,select').forEach(b => b.disabled = true); }
  $('speed').onchange = e => audio.playbackRate = +e.target.value;
  $('rewind').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 10); };
  $('full').onclick = async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) {} };

  function setActive(i, scroll) {
    if (i === activePara) return;
    activePara = i;
    box.querySelectorAll('.para.active').forEach(x => x.classList.remove('active'));
    const p = $('p' + i); if (!p) return;
    p.classList.add('active');
    if (scroll && $('follow').checked) box.scrollTop = p.offsetTop - box.offsetTop - 10;
    if (pics.length && !picsByTime) { let j = -1; pics.forEach((pic, k) => { if ((pic.para || 0) <= i) j = k; }); if (j >= 0 && j !== pos) { pos = j; renderPic(); } }
  }
  function tick() {
    const t = audio.currentTime;
    if (times.length) { let cur = null; for (const [i, s] of times) { if (s <= t + 0.05) cur = i; else break; } if (cur != null) setActive(cur, true); }
    let hit = null; const spans = wordSpans[activePara];
    if (spans) for (const sp of spans) { if (+sp.dataset.s <= t && t < +sp.dataset.e) { hit = sp; break; } }
    if (hit !== onWord) { if (onWord) onWord.classList.remove('on'); if (hit) hit.classList.add('on'); onWord = hit; }
    if (picsByTime) { let j = 0; pics.forEach((pic, k) => { if (pic.at <= t + 0.05) j = k; }); if (j !== pos) { pos = j; renderPic(); } }
  }
  let raf = 0; const loop = () => { tick(); if (!audio.paused) raf = requestAnimationFrame(loop); };
  audio.addEventListener('play', () => { cancelAnimationFrame(raf); loop(); });
  /* timeupdate keeps highlighting going when animation frames pause (hidden tab, low-power mode). */
  audio.addEventListener('seeked', tick); audio.addEventListener('timeupdate', tick);

  /* Pictures */
  function renderPic() {
    const stage = $('stage');
    if (!pics.length) {
      stage.innerHTML = '<div class="soon"><span aria-hidden="true">🖼️</span>Pictures coming soon</div>';
      document.querySelector('main').classList.add('no-pics');
      $('caption').hidden = true; $('picNav').hidden = true; $('thumbs').hidden = true; $('picHint').hidden = true; return;
    }
    const pic = pics[pos], img = document.createElement('img');
    img.src = pic.src; img.alt = pic.caption || ''; stage.replaceChildren(img);
    if (pics[pos + 1]) new Image().src = pics[pos + 1].src; /* load the next picture early so page turns are instant */
    $('caption').textContent = pic.caption || '';
    $('count').textContent = `${pos + 1} / ${pics.length}`;
    $('prev').disabled = pos === 0; $('next').disabled = pos === pics.length - 1;
    $('thumbs').replaceChildren(...pics.map((p, j) => { const b = document.createElement('button'); b.textContent = j + 1; b.title = p.caption || ''; b.className = j === pos ? 'chosen' : ''; b.onclick = () => go(j); return b; }));
  }
  function go(j) {
    if (j < 0 || j >= pics.length) return; pos = j; renderPic();
    if (picsByTime && audioReady) { audio.currentTime = pics[j].at; return; }
    if ($('follow').checked && pics[j].para != null) { const p = $('p' + pics[j].para); if (p) { box.querySelectorAll('.para.active').forEach(x => x.classList.remove('active')); p.classList.add('active'); activePara = pics[j].para; box.scrollTop = p.offsetTop - box.offsetTop - 10; } }
  }
  $('prev').onclick = () => go(pos - 1); $('next').onclick = () => go(pos + 1);
  document.addEventListener('keydown', e => { if (/INPUT|SELECT|TEXTAREA|AUDIO/.test(e.target.tagName)) return; if (e.key === 'ArrowRight') { go(pos + 1); e.preventDefault(); } if (e.key === 'ArrowLeft') { go(pos - 1); e.preventDefault(); } });

  /* Size controls */
  function settings() { document.documentElement.style.setProperty('--font', state.font + 'px'); document.documentElement.style.setProperty('--pictureWidth', state.width + '%'); $('fontLabel').textContent = state.font + ' px'; $('width').value = state.width; persist(); }
  $('smaller').onclick = () => { state.font = Math.max(18, state.font - 2); settings(); };
  $('bigger').onclick = () => { state.font = Math.min(72, state.font + 2); settings(); };
  $('width').oninput = e => { state.width = +e.target.value; settings(); };
  $('top').onclick = () => { box.scrollTop = 0; };
  settings(); renderPic();
})();
</script></html>
