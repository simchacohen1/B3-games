<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Add-on</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#0f172a}
  body{display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#172033;color:#fff;min-height:52px}
  .bar button{min-height:40px;padding:0 16px;border:0;border-radius:10px;background:#fff;color:#172033;font:800 15px system-ui;cursor:pointer}
  .bar .name{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .note{margin-left:auto;font-size:12px;color:#aebbd0;white-space:nowrap}
  main{flex:1;min-height:0;position:relative}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .msg{max-width:520px;margin:12vh auto;padding:18px 20px;border-radius:14px;background:#fff;border:1px solid #cbd5e1;text-align:center;font-size:17px}
  @media(max-width:560px){.bar .note{display:none}}
</style>
</head>
<body>
<header class="bar">
  <button id="back" type="button">← Back</button>
  <span id="icon" aria-hidden="true"></span>
  <span class="name" id="title">Add-on</span>
  <span class="note">This add-on runs inside Shluchim Online School</span>
</header>
<main id="stage"><p class="msg" id="msg" hidden></p></main>
<script src="teacher-addons-core.js?v=20261118-step2"></script>
<script src="addon-view.js?v=20261118-step2"></script>
</body>
</html>
