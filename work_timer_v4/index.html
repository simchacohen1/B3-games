<!doctype html>
<html lang="en">
<head>
<script>
  (function() {
    const idbReq = indexedDB.open('firebaseLocalStorageDb', 1);
    idbReq.onsuccess = function(e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('firebaseLocalStorage')) return;
      const tx = db.transaction('firebaseLocalStorage', 'readonly');
      const store = tx.objectStore('firebaseLocalStorage');
      const getAll = store.getAll();
      getAll.onsuccess = function() {
        if (getAll.result && getAll.result.length > 0) {
          window.currentUserSession = getAll.result[0].value;
          document.addEventListener('DOMContentLoaded', function() {
            const modals = document.querySelectorAll('#pinModal, #loginModal, .auth-overlay, .modal-backdrop');
            modals.forEach(m => m.style.display = 'none');
          });
        }
      };
    };
  })();
</script>
