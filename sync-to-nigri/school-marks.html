<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Marks → Nigri</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f8fb;color:#18324a;margin:0;padding:22px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #bdd5e8;border-radius:14px;padding:18px;margin:14px 0}.hidden{display:none}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}button,select,input{font:inherit;padding:9px;border-radius:9px;border:1px solid #bdd5e8}button{cursor:pointer;font-weight:700}.primary{background:#2d6ea3;color:white;border:0}.good{background:#2e8b57;color:white;border:0}.launch{padding:10px;border:1px solid #bdd5e8;border-radius:10px;margin:7px 0;cursor:pointer}.launch.active{border:2px solid #2d6ea3;background:#eef7fd}.small{font-size:12px;color:#667b8c}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #dce7ef;text-align:left}th{background:#edf5fa}.back{color:#2d6ea3;text-decoration:none;font-weight:700}
</style></head><body><div class="wrap">
<a class="back" href="./index.html">← Back to Sync choices</a>
<h1>School Marks → Nigri</h1>
<div id="lock" class="card"><h2>Teacher Access</h2><input id="pw" type="password" placeholder="Teacher password"><button class="primary" onclick="unlock()">Open</button><div id="lockmsg" class="small"></div></div>
<div id="app" class="hidden">
<div class="grid">
<div class="card"><h2>Quiz History</h2><select id="filter" onchange="renderHistory()"><option value="all">All</option><option value="et">B3 ET</option><option value="wt">B3 WT</option></select><div id="history"></div></div>
<div class="card"><h2 id="title">Choose a quiz</h2><div id="details" class="hidden">
<p><label>Grade <select id="grade"><option>B3 ET</option><option>B3 WT</option></select></label></p>
<p><label>Topic <select id="topic"><option>Shoroshim</option><option>Chumash Comprehension</option><option>Chumash Translation</option><option>Chumash</option><option>Chumash-Rashi</option><option>Halacha-Yahadus</option><option>Parsha</option></select></label></p>
<p><label>Type <select id="type"><option>Quiz</option><option>Test/Project</option><option>Classwork</option><option>Homework</option></select></label></p>
<p><label>Date <input id="date" type="date"></label></p>
<p><label>Name <input id="name" type="text"></label></p>
<table><thead><tr><th>Student</th><th>Mark</th><th>Attempt</th><th>Attendance</th></tr></thead><tbody id="students"></tbody></table>
<p><button id="sync" class="good" onclick="syncMarks()">Sync to Nigri</button></p><div id="status" class="small"></div>
</div></div></div></div></div>
<script>
const PASS='class123',SYNC_URL='https://nigrisync.onrender.com/sync-marks',SYNC_KEY='1qaz2wsx';
const config={apiKey:"AIzaSyDaheO5K2qL8qe3rHIZY4nTd0wuEUG_DEs",authDomain:"b3-games.firebaseapp.com",databaseURL:"https://b3-games-default-rtdb.firebaseio.com",projectId:"b3-games",storageBucket:"b3-games.firebasestorage.app",messagingSenderId:"568530046190",appId:"1:568530046190:web:fd765fdd27e55a3c73f7ff"};
firebase.initializeApp(config);const db=firebase.database();
const R={et:['chaim_chaikin','yossi_gourarie','sholom_huebner','moshe_lapine','kehos_notik','yisroel_oirechman','moshe_raichman','avrohom_rosenfeld','levi_rozmarin','arik_traxler'],wt:['ari_greenberg','zev_rosenfeld','levi_schtroks','yisroel_aryeh_simmonds','leibel_vogel','leib_wolf']};
const N={chaim_chaikin:'Chaikin Mayer Chaim',yossi_gourarie:'Gourarie Yossi',sholom_huebner:'Huebner Sholom DovBer',moshe_lapine:'Lapine Moshe',kehos_notik:'Notik Kehos',yisroel_oirechman:'Oirechman Yisroel',moshe_raichman:'Raichman Moshe Tuvia',avrohom_rosenfeld:'Rosenfeld Avrohom',levi_rozmarin:'Rozmarin Levi',arik_traxler:'Traxler Arik',ari_greenberg:'Greenberg Ari',zev_rosenfeld:'Rosenfeld Zev',levi_schtroks:'Schtroks Levi',yisroel_aryeh_simmonds:'Simmonds Yisroel Aryeh',leibel_vogel:'Vogel Leibel',leib_wolf:'Wolf Yisroel Arye Leib'};
let launches={},responses={},completions={},sel='';
function A(v){if(!v)return[];if(Array.isArray(v))return v;return Object.keys(v).sort((a,b)=>Number(a)-Number(b)).map(k=>v[k])}
function grade(c){return c==='wt'?'B3 WT':'B3 ET'} function topic(s){return s==='shorashim'?'Shoroshim':s==='translation'?'Chumash Translation':'Chumash Comprehension'}
async function unlock(){if(document.getElementById('pw').value!==PASS){document.getElementById('lockmsg').textContent='Incorrect password.';return}document.getElementById('lock').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const [a,b,c]=await Promise.all([db.ref('b3Quiz/launches').once('value'),db.ref('b3Quiz/responses').once('value'),db.ref('b3Quiz/completions').once('value')]);launches=a.val()||{};responses=b.val()||{};completions=c.val()||{};renderHistory()}
function renderHistory(){const f=document.getElementById('filter').value,box=document.getElementById('history');box.innerHTML='';Object.keys(launches).filter(id=>{const l=launches[id]||{};return !l.retakeOf&&!l.makeupOf&&(f==='all'||l.classId===f)}).sort((a,b)=>(launches[b].createdAt||0)-(launches[a].createdAt||0)).forEach(id=>{const l=launches[id],q=l.quizSnapshot||{},d=document.createElement('div');d.className='launch'+(id===sel?' active':'');d.innerHTML='<b>'+(q.title||'Untitled')+'</b><div class="small">'+grade(l.classId)+'</div>';d.onclick=()=>{sel=id;renderHistory();showQuiz()};box.appendChild(d)})}
function qs(l){return A(l?.quizSnapshot?.questions)} function score(lid,sid){const q=qs(launches[lid]),r=(responses[lid]||{})[sid]||{};let c=0,a=0;q.forEach((x,i)=>{const z=r[i]||r[String(i)];if(z){a++;if(z.correct)c++}});const done=!!(completions[lid]?.[sid])||(q.length&&a===q.length);return{pct:q.length?Math.round(c/q.length*100):null,done,a}}
function related(lid,base){if(lid===base)return true;let cur=lid;for(let i=0;i<10;i++){const l=launches[cur]||{},p=l.retakeOf||l.makeupOf;if(!p)return false;if(p===base)return true;cur=p}return false}
function best(base,sid){const c=[];Object.keys(launches).forEach(lid=>{if(!related(lid,base))return;const l=launches[lid],targets=l.targetStudents?Object.keys(l.targetStudents).filter(k=>l.targetStudents[k]):[];if(targets.length&&!targets.includes(sid))return;if(!targets.length&&!R[l.classId]?.includes(sid))return;const s=score(lid,sid);if(s.a)c.push({lid,l,s})});if(!c.length)return{mark:null,src:'Missing'};const pool=c.filter(x=>x.s.done);const p=pool.length?pool:c;p.sort((a,b)=>(Number(b.l.attemptNumber)||1)-(Number(a.l.attemptNumber)||1)||(b.l.createdAt||0)-(a.l.createdAt||0));const x=p[0];return{mark:x.s.done?x.s.pct:null,src:x.l.retakeOf?'Retake':x.l.makeupOf?'Make-Up':'Original'}}
function showQuiz(){const l=launches[sel],q=l.quizSnapshot||{};document.getElementById('title').textContent=q.title||'Results';document.getElementById('details').classList.remove('hidden');document.getElementById('grade').value=grade(l.classId);document.getElementById('topic').value=topic(q.skillType||'comprehension');const d=new Date(Number(l.createdAt));document.getElementById('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');document.getElementById('name').value=q.title||'Weekly Quiz';const body=document.getElementById('students');body.innerHTML='';R[l.classId].forEach(sid=>{const b=best(sel,sid),tr=document.createElement('tr'),m=b.mark===null;tr.dataset.sid=sid;tr.dataset.mark=m?'0':b.mark;tr.innerHTML='<td>'+N[sid]+'</td><td>'+(m?'0% — missing':b.mark+'%')+'</td><td>'+b.src+'</td><td><select><option value="'+(m?'review':'present')+'" selected>'+(m?'Review / leave unchanged':'Present')+'</option><option value="absent">Absent</option><option value="present">Present</option></select></td>';body.appendChild(tr)})}
async function syncMarks(){if(!sel)return;const rows=[...document.querySelectorAll('#students tr')],body={class_section:document.getElementById('grade').value,topic:document.getElementById('topic').value,test_name:document.getElementById('name').value.trim(),type:{'Quiz':'quiz','Test/Project':'test','Classwork':'classwork','Homework':'homework'}[document.getElementById('type').value]||'quiz',date:document.getElementById('date').value,description:'',students:rows.map(r=>({name:N[r.dataset.sid],mark:Number(r.dataset.mark),attendance:r.querySelector('select').value}))};if(!body.test_name){alert('Give this mark a name first.');return}const s=document.getElementById('status'),btn=document.getElementById('sync');btn.disabled=true;s.textContent='Syncing to Nigri…';try{const res=await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json','X-Sync-Key':SYNC_KEY},body:JSON.stringify(body)}),data=await res.json().catch(()=>({}));s.textContent=res.ok&&data.status==='success'?'Saved to Nigri!'+(data.test_id?' (mark #'+data.test_id+')':''):'Nigri did not save this: '+(data.detail||res.status)}catch(e){s.textContent='Could not reach Nigri sync: '+e.message}finally{btn.disabled=false}}
</script></body></html>
