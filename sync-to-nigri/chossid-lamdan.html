<!doctype html>
<html lang="en">
<head><script src="../guest-mode.js?v=20261011-guest" data-guest="block"></script>
<script>
  (function() {
    const idbReq = indexedDB.open('firebaseLocalStorageDb', 1);
    idbReq.onsuccess = function(e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('firebaseLocalStorage')) return;
      const tx = db.transaction('firebaseLocalStorage', 'readonly');
      const store = tx.objectStore('firebaseLocalStorage');
      const getAll = store.getAll();
      getAll.onsuccess = function() {
        if (getAll.result && getAll.result.length > 0) {
          window.currentUserSession = getAll.result[0].value;
          document.addEventListener('DOMContentLoaded', function() {
            const modals = document.querySelectorAll('#pinModal, #loginModal, .auth-overlay, .modal-backdrop');
            modals.forEach(m => m.style.display = 'none');
          });
        }
      };
    };
  })();
</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Chossid is a Lamdan — Weekly Marks</title>
<style>
:root{--ink:#18324a;--blue:#245d91;--line:#c9dfef;--good:#2e8b57;--muted:#667b8c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8fb;color:var(--ink)}
.wrap{max-width:1100px;margin:20px auto;padding:0 14px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 5px 18px rgba(30,70,100,.06)}
h1{color:var(--blue);margin-bottom:4px}.small{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:8px;border-bottom:1px solid #dce7ef;text-align:left;vertical-align:top}th{background:#edf5fa}
input,textarea,button{font:inherit}input,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}input[type=number]{width:85px}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.good{background:var(--good);color:#fff}.secondary{background:#e8f1f7;color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.status{font-weight:700}.back{color:var(--blue);text-decoration:none;font-weight:700}
.banner{background:#eef7fd;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media(max-width:700px){th:nth-child(3),td:nth-child(3){min-width:260px}}
</style></head>
<body><div class="wrap">
<a class="back" href="./school-marks.html">← Back to School Marks</a>
<h1>A Chossid is a Lamdan — Weekly Marks</h1>
<div class="banner">These are reviewable drafts. Edit any score or comment before syncing. Nothing is saved to Nigri until you press the green button.</div>
<div class="card">
<label><b>Week ending</b><input id="date" type="date" style="max-width:190px;margin-left:8px"></label>
</div>
<div id="classes"></div>
</div>
<script>
const SYNC_URL='https://nigrisync.onrender.com/sync-marks',SYNC_KEY='1qaz2wsx';
const DEFAULT_DATA={
 date:'2026-10-15',
 classes:[
  {id:'et',label:'B3 ET',students:[
   ['Chaikin Mayer Chaim','',''],
   ['Gourarie Yossi','',''],
   ['Huebner Sholom DovBer','',''],
   ['Lapine Moshe','',''],
   ['Notik Kehos','',''],
   ['Oirechman Yisroel','',''],
   ['Raichman Moshe Tuvia','',''],
   ['Rosenfeld Avrohom','',''],
   ['Rozmarin Levi','',''],
   ['Traxler Arik','','']
  ]},
  {id:'wt',label:'B3 WT',students:[
   ['Greenberg Ari','',''],
   ['Rosenfeld Zev','',''],
   ['Schtroks Levi','',''],
   ['Simmonds Yisroel Aryeh','',''],
   ['Vogel Leibel','',''],
   ['Wolf Yisroel Arye Leib','','']
  ]}
 ]
};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function decodePayload(){
 const p=new URLSearchParams(location.search).get('p'); if(!p)return DEFAULT_DATA;
 try{const b=p.replace(/-/g,'+').replace(/_/g,'/');const txt=decodeURIComponent(escape(atob(b)));const j=JSON.parse(txt);return j&&j.classes?j:DEFAULT_DATA}catch(e){console.warn('Bad prefill payload',e);return DEFAULT_DATA}
}
const data=decodePayload(); document.getElementById('date').value=data.date||'2026-10-15';
function render(){
 const host=document.getElementById('classes');host.innerHTML='';
 data.classes.forEach(cls=>{
  const card=document.createElement('div');card.className='card';card.dataset.classId=cls.id;
  card.innerHTML='<h2>'+esc(cls.label)+'</h2><table><thead><tr><th>Student</th><th>Mark</th><th>Comment</th></tr></thead><tbody>'+
  cls.students.map((s,i)=>'<tr><td><b>'+esc(s[0])+'</b></td><td><input type="number" min="0" max="100" value="'+(s[1]??'')+'" data-mark="'+i+'"></td><td><textarea rows="2" data-comment="'+i+'">'+esc(s[2])+'</textarea></td></tr>').join('')+
  '</tbody></table><div class="actions"><button class="good" onclick="syncClass(\''+cls.id+'\',this)">Sync '+esc(cls.label)+' to Nigri</button><span class="status" id="status-'+cls.id+'"></span></div>';
  host.appendChild(card);
 });
}
async function syncClass(id,btn){
 const cls=data.classes.find(c=>c.id===id),card=document.querySelector('[data-class-id="'+id+'"]'),status=document.getElementById('status-'+id);
 const rows=[...card.querySelectorAll('tbody tr')];
 const students=rows.map((r,i)=>{const raw=r.querySelector('[data-mark]').value.trim();return{name:cls.students[i][0],mark:raw===''?null:Number(raw),attendance:'present',comment:r.querySelector('[data-comment]').value.trim()||undefined}});
 const missing=students.filter(s=>s.mark===null||!Number.isFinite(s.mark));
 if(missing.length){status.textContent='Enter a mark for every student before syncing.';return;}
 const date=document.getElementById('date').value;
 const body={class_section:cls.label,topic:'A Chossid is a Lamdan',test_name:'A Chossid is a Lamdan — Week Ending '+date,type:'test',date,description:'Weekly A Chossid is a Lamdan mark for effort and responsibility.',students};
 if(!confirm('Save '+cls.label+' A Chossid is a Lamdan marks to Nigri?'))return;
 btn.disabled=true;status.textContent='Syncing…';
 try{
  const res=await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json','X-Sync-Key':SYNC_KEY},body:JSON.stringify(body)});
  const out=await res.json().catch(()=>({}));
  status.textContent=res.ok&&out.status==='success'?'Saved to Nigri'+(out.test_id?' (mark #'+out.test_id+')':''):'Not saved: '+(out.detail||res.status);
 }catch(e){status.textContent='Could not reach Nigri sync: '+e.message}finally{btn.disabled=false}
}
render();
</script></body></html>
