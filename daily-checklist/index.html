<!doctype html>
<html lang="en">
<head><script src="/domain-redirect.js"></script>
<meta charset="utf-8">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist · SOLS</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicons/checklist.svg">
<style>
:root{--navy:#173b62;--navy2:#0f2a47;--green:#1f9d55;--greenbg:#e5f7ec;--red:#c0392b;--redbg:#fdecea;--ink:#1f2d3d;--muted:#5d6b7a;--line:#d9e4ee}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,Arial,sans-serif;background:linear-gradient(180deg,#eaf4fb 0%,#fdf7e8 100%);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:22px;font-weight:900}
header .who{margin-left:auto;font-weight:800}
.homeBtn{background:#ffffff22;color:#fff;border:0;border-radius:10px;padding:7px 12px;font-weight:800;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
.banner{background:#fff8e1;border:2px solid #f1d58a;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:700}
.banner a{color:var(--navy)}
.daynav{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.daynav .arr{flex:none;width:54px;height:54px;border-radius:14px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:26px;font-weight:900;line-height:1}
.daynav .arr[disabled]{opacity:.25;cursor:default;border-color:var(--line)}
.date{flex:1;text-align:center;color:var(--navy);font-weight:900;font-size:18px;border-radius:14px;padding:8px 6px;background:#fff;border:2px solid var(--line)}
.date small{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.date.yest{background:#fff3d6;border-color:#e0a21a;color:#7a4b00}
.pic{flex:none;width:50px;height:50px;border-radius:12px;background:#eef5fb;display:flex;align-items:center;justify-content:center;font-size:32px}
.spk{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;line-height:1}
.spk.on{background:var(--navy);border-color:var(--navy)}
@media(max-width:420px){.row{flex-wrap:wrap}.row .nm{min-width:0;flex-basis:calc(100% - 120px)}.mini{width:100%}.mini button{flex:1}}
.progress{height:10px;background:#dbe6ef;border-radius:999px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--navy);width:0;transition:width .25s}
.count{text-align:center;color:var(--muted);font-weight:800;font-size:14px;margin-bottom:14px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:26px 16px;box-shadow:0 6px 18px #173b6214}
.q{text-align:center;font-size:30px;font-weight:900;line-height:1.25;margin:10px 0 26px;overflow-wrap:anywhere}
.q .star{color:#d92d20;font-size:32px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{border:0;border-radius:18px;min-height:120px;font-size:34px;font-weight:900;color:#fff}
.btn.yes{background:var(--green)}
.btn.no{background:var(--red)}
.btn.sel{outline:6px solid var(--navy);outline-offset:3px}
.btn:active{transform:scale(.97)}
.nav{display:flex;justify-content:space-between;margin-top:16px}
.nav button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:800;color:var(--navy)}
.nav button[disabled]{opacity:.4;cursor:default}
.list{display:grid;gap:10px;margin-top:6px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.row .nm{flex:1;font-weight:800;font-size:18px;overflow-wrap:anywhere}
.row .nm .star{color:#d92d20}
.mini{display:flex;gap:6px}
.mini button{border:2px solid var(--line);background:#fff;border-radius:10px;min-width:64px;min-height:46px;font-weight:900;font-size:16px}
.mini button.yes.on{background:var(--green);border-color:var(--green);color:#fff}
.mini button.no.on{background:var(--red);border-color:var(--red);color:#fff}
.done{text-align:center;font-size:22px;font-weight:900;margin:6px 0 12px}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:16px;min-height:18px}
.hidden{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script>window.firebase||document.write('<script src="../vendor/firebase/12.15.0/firebase-app-compat.js"><\/script>')</script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script>window.firebase&&firebase.auth||document.write('<script src="../vendor/firebase/12.15.0/firebase-auth-compat.js"><\/script>')</script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script><script>window.firebase&&firebase.database||document.write('<script src="../vendor/firebase/12.15.0/firebase-database-compat.js"><\/script>')</script>
<script src="../firebase-config.js"></script>
<script src="../student-class.js?v=20261007-tab-login"></script>
<script src="../guest-mode.js?v=20261011-guest"></script>
<script src="../game-gate.js?v=20261021-follow-unblock" data-game-id="daily-checklist" data-back-href="../index.html"></script>
<script src="common.js"></script>
<script defer src="../student-lock.js?v=20261120-locks1" data-feature="daily-checklist"></script>
</head>
<body>
<header>
  <h1><span aria-hidden="true">☑️</span> Daily Checklist</h1>
  <span class="who" id="whoName"></span>
  <a class="homeBtn" href="../index.html">Home</a>
</header>
<main>
  <div class="banner hidden" id="banner"></div>
  <div class="daynav">
    <button type="button" class="arr" id="prevDay" aria-label="Go back to yesterday">◀</button>
    <div class="date" id="dateLabel" aria-live="polite"></div>
    <button type="button" class="arr" id="nextDay" aria-label="Go forward to today">▶</button>
  </div>
  <div id="loading" class="note">Loading…</div>

  <section id="summary" class="hidden">
    <div class="done" id="doneMsg"></div>
    <div class="list" id="list"></div>
  </section>

  <div class="note" id="note"></div>
</main>
<script src="../teacher-account.js?v=20261008"></script>
<script>
(function(){
"use strict";
var C=window.B3DailyChecklist;
var $=function(id){return document.getElementById(id)};
var isGuest=function(){return !!(window.B3Guest&&window.B3Guest.isGuest())};
var studentId=String(sessionStorage.getItem("b3Games_studentId")||sessionStorage.getItem("posukPractice_studentId")||"").trim();
var studentName=String(sessionStorage.getItem("b3Games_studentName")||"").trim();
var items=C.DEFAULT_ITEMS.map(function(x,i){return {id:x.id,name:x.name,star:x.star,order:i}});
var answers={};      // itemId -> 1 | 0 (for the day being shown)
var today=C.schoolDate();
var yesterday=C.shiftDate(today,-1);
var viewDay=today;   // the day being shown: today or yesterday
var answersByDay={};answersByDay[today]=answers;
var loadedDays={};
var db=null,base=null;
var saveFailed=false;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function nameHtml(it){return esc(it.name)+(it.star?' <span class="star" aria-label="starred">⭐</span>':"")}
function setNote(t){$("note").textContent=t||""}
function pretty(key){var p=key.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}

function show(which){["summary","loading"].forEach(function(id){$(id).classList.toggle("hidden",id!==which)})}

function render(){
  if(!items.length){show("loading");$("loading").textContent="Your teacher has not added any checklist items yet.";return}
  renderSummary();
}
function dayRefFor(day){return(db&&base&&studentId)?db.ref(base+"/answers/"+day+"/"+studentId):null}
function updateNav(){
  var y=viewDay===yesterday;
  $("dateLabel").innerHTML='<small>'+(y?"Yesterday":"Today")+'</small>'+esc(pretty(viewDay));
  $("dateLabel").classList.toggle("yest",y);
  $("prevDay").disabled=y;$("nextDay").disabled=!y;
}
var canSpeak=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
var HEB=/[֐-׿]/;
function speak(text,btn){
  if(!canSpeak)return;
  var ss=window.speechSynthesis;ss.cancel();
  var parts=String(text).match(/[֐-׿][֐-׿\s'"׳״]*|[^֐-׿]+/g)||[];
  var last=null;
  parts.forEach(function(p){
    if(!p.trim())return;
    var u=new SpeechSynthesisUtterance(p.trim());u.lang=HEB.test(p)?"he-IL":"en-US";
    var pre=u.lang.slice(0,2);
    var v=ss.getVoices().filter(function(x){var l=String(x.lang||"").toLowerCase().replace("_","-");return l.slice(0,2)===pre||(pre==="he"&&l.slice(0,2)==="iw")})[0];
    if(v)u.voice=v;
    u.rate=.85;last=u;ss.speak(u);
  });
  if(last&&btn){btn.classList.add("on");var off=function(){btn.classList.remove("on")};last.onend=off;last.onerror=off}
}
function renderSummary(){
  show("summary");
  var yd=viewDay===yesterday;
  $("doneMsg").textContent=items.every(function(it){return answers[it.id]!=null})?(yd?"All done for yesterday! 🎉":"All done for today! 🎉"):(yd?"Tap YES or NO for what you did yesterday.":"Tap YES or NO for each one.");
  $("list").innerHTML=items.map(function(it,i){var a=answers[it.id];
    return '<div class="row"><div class="pic" aria-hidden="true">'+C.iconFor(it)+'</div><div class="nm" dir="auto">'+nameHtml(it)+'</div>'+
      (canSpeak?'<button type="button" class="spk" data-s="'+i+'" aria-label="Read aloud: '+esc(it.name)+'">🔊</button>':'')+'<div class="mini">'+
      '<button type="button" class="yes'+(a===1?' on':'')+'" data-i="'+i+'" data-v="1">YES</button>'+
      '<button type="button" class="no'+(a===0?' on':'')+'" data-i="'+i+'" data-v="0">NO</button></div></div>'}).join("");
}
function setAnswer(it,v){
  answers[it.id]=v;
  var dayRef=dayRefFor(viewDay);
  if(!dayRef)return;
  var upd={name:studentName||studentId,t:firebase.database.ServerValue.TIMESTAMP};
  upd["items/"+it.id]={v:v,n:it.name,s:it.star?1:0,o:it.order};
  dayRef.update(upd).then(function(){saveFailed=false;setNote("✓ Saved for your teacher")}).catch(function(e){
    console.warn("Daily Checklist save failed",e);saveFailed=true;setNote("Could not save that answer. Check your internet and tap it again.")});
}

$("list").onclick=function(e){
  var sp=e.target.closest("button[data-s]");
  if(sp){speak(items[+sp.dataset.s].name,sp);return}
  var b=e.target.closest("button[data-i]");if(!b)return;
  setAnswer(items[+b.dataset.i],+b.dataset.v);renderSummary();
};

async function waitForAuth(){
  try{
    if(!firebase.auth||firebase.auth().currentUser)return;
    await new Promise(function(res){var off=firebase.auth().onAuthStateChanged(function(u){if(u){off();res()}});setTimeout(function(){off();res()},4000)});
  }catch(e){}
}

/* Read a day's saved answers once (cached). Today and yesterday are the only days a boy can open. */
async function loadDay(day){
  var ref=dayRefFor(day);
  if(!ref||loadedDays[day])return;
  var snap=await ref.child("items").once("value");
  var saved=snap.val()||{},a=answersByDay[day]||(answersByDay[day]={});
  items.forEach(function(it){var s=saved[it.id];if(s&&(s.v===1||s.v===0)&&a[it.id]==null)a[it.id]=s.v});
  loadedDays[day]=true;
}
async function goDay(day){
  if(day===viewDay)return;
  viewDay=day;answers=answersByDay[day]||(answersByDay[day]={});
  updateNav();setNote("");
  if(dayRefFor(day)&&!loadedDays[day]){
    show("loading");$("loading").textContent="Loading…";
    try{await loadDay(day)}catch(e){console.warn("Daily Checklist day load failed",e);setNote("Could not load that day's saved answers. You can still answer.")}
    if(viewDay!==day)return; // the boy tapped an arrow again while this was loading
  }
  render();
}
$("prevDay").onclick=function(){goDay(yesterday)};
$("nextDay").onclick=function(){goDay(today)};

async function start(){
  updateNav();
  if(isGuest()){
    $("whoName").textContent="Guest";
    setNote("Guest preview — nothing is saved.");
    render();return;
  }
  var account=await window.B3TeacherAccountReady;
  if(account&&account.user&&account.authorized&&!(window.B3SiteSettings&&window.B3SiteSettings.getActingStudent&&window.B3SiteSettings.getActingStudent())){
    $("whoName").textContent="Teacher demonstration";
    setNote("Demonstration — answers are not saved.");
    render();return;
  }
  $("whoName").textContent=studentName;
  if(!studentId){
    $("banner").innerHTML='You can look around, but your answers will not be saved. <a href="../index.html">Sign in on Fun Torah Tools</a> to save them.';
    $("banner").classList.remove("hidden");render();return;
  }
  try{
    if(!window.firebase||!window.B3_FIREBASE_CONFIG)throw new Error("Firebase not loaded");
    if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
    await waitForAuth();
    db=firebase.database();
    var info=await window.FunTorahStudentClass.resolve(db,studentId);
    if(!info.classId){setNote("Ask your teacher to add you to a class to save your answers.");render();return}
    base=C.basePath(info.workspaceId,info.classId);
    try{var cfg=await db.ref(base+"/config/items").once("value");if(cfg.val())items=C.itemsFromConfig(cfg.val(),false)}
    catch(e){console.warn("Daily Checklist items unavailable, using the standard list",e)}
    await loadDay(today);
    render();
  }catch(e){
    console.error(e);db=null;base=null;
    setNote("Could not connect, so answers will not be saved right now. Please refresh.");
    render();
  }
}
start();
})();
</script>
</body>
</html>
