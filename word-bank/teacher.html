<!doctype html><html lang="en"><head><script src="../teacher-tool-gate.js?v=20261028-gate" data-scope="teacher"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Word Bank Progress • Fun Torah Tools</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf4fa;color:#173552;font:16px system-ui,Arial}header{background:#173b62;color:white;padding:18px max(18px,calc((100vw - 1050px)/2))}header a{color:white}h1{margin:10px 0 0}main{max-width:1050px;margin:auto;padding:18px}.panel{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #173b6218}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button,input{font:inherit;padding:9px;border:1px solid #b7cbda;border-radius:9px}button{background:#e3f1fb;cursor:pointer;font-weight:700}.student{padding:12px;border:1px solid #d6e3ed;border-radius:12px;margin:8px 0;background:#fbfdff}.counts{color:#536b7d;font-size:14px}.words{display:grid;gap:8px;margin-top:10px}.word{border:1px solid #d6e3ed;border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}.he{font-size:22px;font-weight:900;direction:rtl;text-align:right}.lesson{grid-column:1/-1;color:#63768a;font-size:13px}.status{font-weight:700}.error{color:#b42318}.hint{color:#607487;font-size:13px}@media(max-width:650px){.word{grid-template-columns:1fr}.lesson{grid-column:auto}}</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script><script src="../firebase-config.js"></script><script>if(window.firebase&&window.B3_FIREBASE_CONFIG&&!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);</script><script src="../site-settings.js"></script><script src="bank-core.js"></script></head>
<body><header><a href="../teacher-home.html">← Teacher Center</a><h1>📚 Student Word Bank Progress</h1><p>Review collected and mastered words by student and lesson.</p></header><main><section class="panel"><div class="row"><label for="classSelect"><b>Class</b></label><select id="classSelect"><option value="">Choose a class…</option></select><span id="status" class="status" role="status" aria-live="polite">Checking teacher access…</span></div><p class="hint">Editing a word updates its spelling or meaning while preserving collection and practice history.</p></section><section id="roster" class="panel" hidden></section><section id="detail" class="panel" hidden></section></main>
<script>
const $=id=>document.getElementById(id),api=window.B3SiteSettings,params=new URLSearchParams(location.search),initialClass=params.get('class')||'';let access=null;
function safe(value){return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
async function loadClassIds(value){const sel=$('classSelect');sel.replaceChildren(new Option('Choose a class…',''));const db=firebase.database(),ws=api?.workspaceId||'b3-2026';const snap=await db.ref('b3Games/workspaces/'+ws+'/classes').once('value');const classes=snap.val()||{};const owned=String(access?.role||'')==='admin'?Object.keys(classes):(access?.classIds||[]);for(const id of owned){const row=classes[id];if(!row||row.active===false)continue;sel.add(new Option(String(row.name||id),id))}if(value&&owned.includes(value)&&classes[value]?.active!==false)sel.value=value;}
function ctx(classId){return {workspaceId:api?.workspaceId||'b3-2026',classId,studentId:''}}
async function showRoster(){const classId=$('classSelect').value;if(!classId)return;$('status').textContent='Loading student vocabulary…';$('roster').hidden=false;$('detail').hidden=true;try{const result=await FTTWordBank.teacherRequest('teacherRoster',{classId},ctx(classId));if(!result)throw Error('Teacher sign-in is required.');const rows=result.students||[];$('roster').innerHTML='<h2>'+safe($('classSelect').selectedOptions[0].text)+' · '+rows.length+' students</h2>'+rows.map(s=>'<article class="student"><div class="row" style="justify-content:space-between"><strong>'+safe(s.name)+'</strong><span class="counts">'+s.collected+' collected · '+s.practiced+' practiced · '+s.mastered+' mastered</span><button type="button" data-student="'+safe(s.id)+'">Inspect words</button></div></article>').join('')||'<p>No student words have been collected yet.</p>';$('roster').querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>showStudent(classId,b.dataset.student,b.closest('.student').querySelector('strong').textContent));$('status').textContent='Loaded '+rows.length+' students.'}catch(e){$('status').textContent=e.message;$('status').classList.add('error')}}
async function showStudent(classId,studentId,name){$('detail').hidden=false;$('detail').innerHTML='<h2>'+safe(name)+' · Word Bank</h2><p>Loading…</p>';try{const result=await FTTWordBank.teacherRequest('teacherRead',{classId,studentId},ctx(classId));if(!result)throw Error('Teacher sign-in is required.');const rows=Object.values(result.bank||{}).sort((a,b)=>a.hebrew.localeCompare(b.hebrew,'he'));$('detail').innerHTML='<h2>'+safe(name)+' · Word Bank</h2><p class="counts">'+result.summary.collected+' collected · '+result.summary.practiced+' practiced · '+result.summary.mastered+' mastered</p>'+(rows.length?'<div class="words">'+rows.map(w=>'<div class="word" data-word="'+safe(w.id)+'"><div><div class="he" lang="he" dir="rtl">'+safe(w.hebrew)+'</div><small>'+safe((w.sources||[w.source]).join(' + '))+'</small></div><input aria-label="English meaning" value="'+safe(w.english)+'"><div class="row"><span>'+Number(w.practiceCount||0)+' practiced · '+(w.mastered?'⭐ mastered':'not mastered')+'</span><button type="button" data-save-word>Save</button></div><div class="lesson">Lessons: '+safe((w.lessons||[]).map(x=>x.title||x.id).join(' · ')||'—')+'</div></div>').join('')+'</div>':'<p>No words collected yet.</p>');$('detail').querySelectorAll('[data-save-word]').forEach(b=>b.onclick=async()=>{const row=b.closest('[data-word]'),wordId=row.dataset.word,input=row.querySelector('input');b.disabled=true;try{await FTTWordBank.teacherRequest('teacherEdit',{classId,studentId,wordId,change:{hebrew:row.querySelector('.he').textContent,english:input.value}},ctx(classId));$('status').textContent='Word updated; student progress was kept.'}catch(e){$('status').textContent=e.message;$('status').classList.add('error')}finally{b.disabled=false}})}catch(e){$('detail').innerHTML='<p class="error">'+safe(e.message)+'</p>'}}
$('classSelect').onchange=showRoster;
if(api&&typeof api.onAuthStateChanged==='function')api.onAuthStateChanged(async(user,authorized,role)=>{access=role||{};if(!user||!authorized){$('status').textContent='Please sign in to Teacher Center first.';return}try{await loadClassIds(initialClass);$('status').textContent='Choose a class to inspect vocabulary progress.';if($('classSelect').value)showRoster()}catch(e){$('status').textContent=e.message;$('status').classList.add('error')}});else $('status').textContent='Teacher sign-in could not start.';
</script><script src="../back-nav.js" data-mode="inline" data-href="../teacher-home.html" data-label="← Teacher Center"></script></body></html>
