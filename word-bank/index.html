<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Word Bank • Fun Torah Tools</title><link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script src="../firebase-config.js"></script><script>if(window.firebase&&window.B3_FIREBASE_CONFIG&&!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);</script><script src="bank-core.js"></script><script src="mitzvah-titles.js"></script><script src="sefer-vocabulary-catalog.js"></script><script src="halacha-vocabulary.js"></script></head>
<body><header><a href="../index.html">← Fun Torah Tools</a><h1>📚 My Word Bank</h1><p>Words I am learning in Sefer HaMitzvos and Halacha</p></header>
<main><nav class="filters" aria-label="Filter words"><button class="active" data-filter="all">All Words</button><button data-filter="sefer-hamitzvos">Sefer HaMitzvos</button><button data-filter="halacha">Halacha</button></nav>
<section class="stats" aria-label="My progress"><article>📖 <b id="collected">0</b><span>collected</span></article><article>🎯 <b id="practiced">0</b><span>practiced</span></article><article>⭐ <b id="mastered">0</b><span>mastered</span></article></section>
<section class="panel"><div class="tabs"><button class="active" data-view="words">All My Words</button><button data-view="practice">Practice My Words</button></div><div id="message" role="status" aria-live="polite"></div><div id="wordList" class="word-list"></div><div id="practice" hidden><nav class="practice-modes" aria-label="Practice activity"><button class="active" data-mode="quiz">Multiple Choice</button><button data-mode="match">Matching Game</button></nav><div id="practiceQuiz"><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" hidden>Next Word ➜</button></div><div id="practiceMatch" hidden><p class="hint">Tap a Hebrew word, then its English meaning.</p><div id="matchHebrew" class="answers"></div><div id="matchEnglish" class="answers"></div><div id="matchFeedback" role="status" aria-live="polite"></div></div></div></section>
<p class="fineprint" id="saveStatus">Your bank syncs to your student account when available; offline changes stay on this device until they sync.</p></main>
<script src="student.js"></script></body></html>
