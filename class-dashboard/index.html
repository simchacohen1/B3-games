<style>

<script>
/* =========================================================
   STUDENT DATA
   Deduplicated from roster export. Each city geocoded with
   lat/lon + IANA timezone embedded (no runtime geocoding).
   ========================================================= */
const TEACHER_TZ = "America/New_York";

// Student details (addresses, parents, phone numbers) are NOT kept in this public
// file. They load after the owner signs in, from studentRewards/privateClassDashboard,
// which only the owner account can read.
let STUDENTS = [];

// Sort order: timezone (east to west by standard UTC offset), then last name.
const TZ_OFFSET_RANK = {
  "America/Grenada": -4, "America/Barbados": -4, "America/Manaus": -4,
  "America/New_York": -5, "America/Mexico_City": -6, "America/Chicago": -6,
  "America/Regina": -6, "America/Denver": -7, "America/Vancouver": -8,
  "America/Los_Angeles": -8, "America/Anchorage": -9
};
function sortStudents(){STUDENTS.sort((a, b) => {
  // East (less-negative offset, e.g. -4) should come before West (more-negative, e.g. -9)
  const r = TZ_OFFSET_RANK[b.tz] - TZ_OFFSET_RANK[a.tz];
  if (r !== 0) return r;
  return a.last.localeCompare(b.last);
});}

/* =========================================================
   PHONE NORMALIZATION -> wa.me digits
   ========================================================= */
function normalizePhone(raw) {
  if (!raw) return null;
  let hasPlus = raw.trim().startsWith("+");
  let digits = raw.replace(/[^\d]/g, "");
  if (hasPlus) return digits;                       // already international
  if (digits.length === 11 && digits.startsWith("1")) return digits; // NANP w/ leading 1
  if (digits.length === 10) return "1" + digits;     // bare NANP 10-digit -> assume +1
  if (digits.length >= 11) return digits;            // assume already has country code (e.g. Brazil)
  return digits;
}

/* =========================================================
   NOAA-STYLE SUNRISE EQUATION
   Returns UTC decimal hours for the given LOCAL calendar date.
   ========================================================= */
function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

function calcSunUTC(year, month, day, lat, lon, zenith, isSunrise) {
  const N1 = Math.floor(275 * month / 9);
  const N2 = Math.floor((month + 9) / 12);
  const N3 = 1 + Math.floor((year - 4 * Math.floor(year / 4) + 2) / 3);
  const N = N1 - (N2 * N3) + day - 30;

  const lngHour = lon / 15;
  const t = isSunrise ? N + ((6 - lngHour) / 24) : N + ((18 - lngHour) / 24);

  const M = (0.9856 * t) - 3.289;
  let L = M + (1.916 * Math.sin(toRad(M))) + (0.020 * Math.sin(2 * toRad(M))) + 282.634;
  L = ((L % 360) + 360) % 360;

  let RA = toDeg(Math.atan(0.91764 * Math.tan(toRad(L))));
  RA = ((RA % 360) + 360) % 360;
  const Lq = Math.floor(L / 90) * 90;
  const RAq = Math.floor(RA / 90) * 90;
  RA = (RA + (Lq - RAq)) / 15;

  const sinDec = 0.39782 * Math.sin(toRad(L));
  const cosDec = Math.cos(Math.asin(sinDec));
  const cosH = (Math.cos(toRad(zenith)) - (sinDec * Math.sin(toRad(lat)))) / (cosDec * Math.cos(toRad(lat)));

  if (cosH > 1 || cosH < -1) return null; // no rise/set (polar) — not expected for our cities

  let H = isSunrise ? 360 - toDeg(Math.acos(cosH)) : toDeg(Math.acos(cosH));
  H = H / 15;

  const T = H + RA - (0.06571 * t) - 6.622;
  let UT = T - lngHour;
  UT = ((UT % 24) + 24) % 24;
  return UT;
}

// Build a UTC Date instant from a local Y-M-D + decimal UT hours
function utDecimalToDate(year, month, day, utDecimal) {
  const h = Math.floor(utDecimal);
  const remMin = (utDecimal - h) * 60;
  const m = Math.floor(remMin);
  const s = Math.round((remMin - m) * 60);
  return new Date(Date.UTC(year, month - 1, day, h, m, s));
}

// Get {year, month, day} of "today" for a given IANA timezone
function localYMD(tz, refDate) {
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" });
  const parts = fmt.formatToParts(refDate || new Date());
  const obj = {};
  parts.forEach(p => { if (p.type !== "literal") obj[p.type] = parseInt(p.value, 10); });
  return { year: obj.year, month: obj.month, day: obj.day };
}

/* Compute full zmanim set (local NOAA calc) for a student for "their today" */
function computeLocalZmanim(student) {
  const { year, month, day } = localYMD(student.tz);
  const sunriseUT = calcSunUTC(year, month, day, student.lat, student.lon, 90.833, true);
  const sunsetUT  = calcSunUTC(year, month, day, student.lat, student.lon, 90.833, false);
  const altSunriseUT = calcSunUTC(year, month, day, student.lat, student.lon, 91.583, true);  // Baal HaTanya netz
  const altSunsetUT  = calcSunUTC(year, month, day, student.lat, student.lon, 91.583, false); // Baal HaTanya shkia

  if (sunriseUT === null || sunsetUT === null || altSunriseUT === null || altSunsetUT === null) {
    return null;
  }

  const sunrise = utDecimalToDate(year, month, day, sunriseUT);
  let sunset = utDecimalToDate(year, month, day, sunsetUT);
  if (sunset <= sunrise) sunset = new Date(sunset.getTime() + 24 * 3600 * 1000);

  const altSunrise = utDecimalToDate(year, month, day, altSunriseUT);
  let altSunset = utDecimalToDate(year, month, day, altSunsetUT);
  if (altSunset <= altSunrise) altSunset = new Date(altSunset.getTime() + 24 * 3600 * 1000);

  const dayLenMs = sunset - sunrise;
  const shaahZmanisMs = dayLenMs / 12;
  const chatzos = new Date(sunrise.getTime() + dayLenMs / 2);

  const altDayLenMs = altSunset - altSunrise;
  const shema = new Date(altSunrise.getTime() + (altDayLenMs * 3 / 12));

  return {
    sunrise, sunset, chatzos, shema,
    shaahZmanisMinutes: shaahZmanisMs / 60000,
    source: "calc"
  };
}

/* =========================================================
   HEBCAL ZMANIM (sunrise/sunset/chatzos), cached per city+date,
   silent NOAA fallback if unreachable.
   ========================================================= */
const hebcalCache = {};

async function fetchHebcalZmanim(student) {
  const { year, month, day } = localYMD(student.tz);
  const dateStr = `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const cacheKey = `${student.id}-${dateStr}`;
  if (hebcalCache[cacheKey]) return hebcalCache[cacheKey];

  const local = computeLocalZmanim(student); // always compute as fallback baseline (and for shema, always local)
  if (!local) return null;

  try {
    const url = `https://www.hebcal.com/zmanim?cfg=json&latitude=${student.lat}&longitude=${student.lon}&tzid=${encodeURIComponent(student.tz)}&date=${dateStr}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    const t = data.times || {};
    const result = {
      sunrise: t.sunrise ? new Date(t.sunrise) : local.sunrise,
      sunset: t.sunset ? new Date(t.sunset) : local.sunset,
      chatzos: t.chatzot ? new Date(t.chatzot) : local.chatzos,
      shema: local.shema, // Baal HaTanya shema always computed locally
      shaahZmanisMinutes: local.shaahZmanisMinutes,
      source: "hebcal"
    };
    hebcalCache[cacheKey] = result;
    return result;
  } catch (e) {
    hebcalCache[cacheKey] = local; // silent fallback
    return local;
  }
}

/* =========================================================
   WEATHER (Open-Meteo, batched)
   ========================================================= */
const WEATHER_ICONS = {
  0: ["☀️", "Clear sky"], 1: ["🌤️", "Mainly clear"], 2: ["⛅", "Partly cloudy"], 3: ["☁️", "Overcast"],
  45: ["🌫️", "Fog"], 48: ["🌫️", "Rime fog"],
  51: ["🌦️", "Light drizzle"], 53: ["🌦️", "Drizzle"], 55: ["🌧️", "Dense drizzle"],
  61: ["🌧️", "Light rain"], 63: ["🌧️", "Rain"], 65: ["🌧️", "Heavy rain"],
  71: ["🌨️", "Light snow"], 73: ["🌨️", "Snow"], 75: ["❄️", "Heavy snow"],
  80: ["🌦️", "Rain showers"], 81: ["🌧️", "Rain showers"], 82: ["⛈️", "Violent showers"],
  95: ["⛈️", "Thunderstorm"], 96: ["⛈️", "Thunderstorm w/ hail"], 99: ["⛈️", "Severe thunderstorm"]
};
function weatherIcon(code) { return (WEATHER_ICONS[code] || ["🌡️", "—"]); }

let weatherData = {}; // id -> {tempF, tempC, wind, code}

async function fetchWeather() {
  try {
    const lats = STUDENTS.map(s => s.lat).join(",");
    const lons = STUDENTS.map(s => s.lon).join(",");
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("weather fetch failed");
    const data = await res.json();
    const arr = Array.isArray(data) ? data : [data];
    arr.forEach((entry, i) => {
      const s = STUDENTS[i];
      if (!s || !entry.current) return;
      const tempF = entry.current.temperature_2m;
      const tempC = (tempF - 32) * 5 / 9;
      weatherData[s.id] = {
        tempF: Math.round(tempF),
        tempC: Math.round(tempC),
        wind: Math.round(entry.current.wind_speed_10m),
        code: entry.current.weather_code
      };
    });
  } catch (e) {
    // fail gracefully — cards show "Weather unavailable"
  }
  renderWeatherOnly();
}

/* =========================================================
   RENDERING
   ========================================================= */
let currentTab = "B3 WT";
let showMyTime = false;
const zmanimCache = {}; // id -> zmanim result (refreshed once per load / per day change)
const classCounts = {};
// Runs once the private student details have loaded.
function startDashboard(){
  sortStudents();
  STUDENTS.forEach(s => classCounts[s.cls] = (classCounts[s.cls] || 0) + 1);
  init();
}
const CLASSES = ["B3 WT", "B3 ET"]; // fixed, stable order regardless of student sort

// Group email label (matches the Google Contacts "Group Membership" label) and
// WhatsApp group invite link for each class.
let GROUP_INFO = {};

function buildTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  CLASSES.forEach(cls => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (cls === currentTab ? " active" : "");
    btn.textContent = `${cls} (${classCounts[cls]})`;
    btn.onclick = () => { currentTab = cls; buildTabs(); renderGrid(); buildGroupActions(); };
    tabsEl.appendChild(btn);
  });
}

let SCHOOL_EMAIL = "";

// Actual parent email addresses baked in directly (comma-separated), since Gmail
// compose links can't auto-expand a Contacts group label from a URL -- that
// autocomplete only works when a human clicks the suggestion inside Gmail itself.
// The school office address is included as an additional Bcc recipient on both lists.
let GROUP_BCC_EMAILS = {};

function buildGroupActions() {
  const el = document.getElementById("groupActions");
  const info = GROUP_INFO[currentTab];
  if (!el || !info) { if (el) el.innerHTML = ""; return; }
  const bccList = GROUP_BCC_EMAILS[currentTab] || "";
  // authuser=<email> tells Gmail which signed-in account to compose from
  // (works if that account is already signed into the browser; otherwise Gmail prompts to switch/sign in).
  // to= is your own school address (Gmail requires a To); bcc= is every parent email,
  // so parents can't see each other's addresses.
  const gmailUrl = "https://mail.google.com/mail/?view=cm&fs=1"
    + "&authuser=" + encodeURIComponent(SCHOOL_EMAIL)
    + "&to=" + encodeURIComponent(SCHOOL_EMAIL)
    + "&bcc=" + encodeURIComponent(bccList);
  el.innerHTML = `
    <a class="group-btn email-btn" href="${gmailUrl}" target="_blank" rel="noopener">✉️ Email ${currentTab} Parents</a>
    <a class="group-btn wa-group-btn" href="${info.waLink}" target="_blank" rel="noopener">💬 WhatsApp ${currentTab} Group</a>
  `;
}

function buildGridShells() {
  const main = document.getElementById("main");
  main.innerHTML = "";
  CLASSES.forEach(cls => {
    const grid = document.createElement("div");
    grid.className = "grid" + (cls === currentTab ? " active" : "");
    grid.id = "grid-" + cls.replace(/\s+/g, "");
    main.appendChild(grid);
  });
}

function fmtTimeInTz(date, tz) {
  if (!date) return "--:--";
  return new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" }).format(date);
}

function cardId(s) { return "card-" + s.id + "-" + s.cls.replace(/\s+/g,""); }

function renderGrid() {
  document.querySelectorAll(".grid").forEach(g => g.classList.remove("active"));
  const activeGrid = document.getElementById("grid-" + currentTab.replace(/\s+/g, ""));
  if (activeGrid) activeGrid.classList.add("active");
  applySearchFilter();
}

function buildCardHTML(s) {
  const waFatherNum = normalizePhone(s.fatherPhone);
  const waMotherNum = normalizePhone(s.motherPhone);
  const locationLabel = s.region ? `${s.city}, ${s.region}, ${s.country}` : `${s.city}, ${s.country}`;
  const fullAddress = s.street ? `${s.street}, ${locationLabel}` : locationLabel;

  return `
    <div class="card" id="${cardId(s)}" data-name="${(s.first + ' ' + s.last).toLowerCase()}" data-city="${s.city.toLowerCase()}">
      <div class="card-name">${s.first} ${s.last}</div>
      <div class="card-location">
        ${s.flag} ${locationLabel}
        <a class="map-link" href="https://www.google.com/maps/place/${encodeURIComponent(fullAddress)}/@${s.lat},${s.lon},700m/data=!3m1!1e3" target="_blank" rel="noopener" title="View on Google Earth (satellite)">🌍</a>
        <a class="map-link" href="https://www.google.com/maps?q=&layer=c&cbll=${s.lat},${s.lon}&cbp=0,0,0,0,0" target="_blank" rel="noopener" title="Street View (if available)">🧍</a>
      </div>
      <div class="card-birthday">🎂 Age ${s.age} &nbsp;·&nbsp; Hebrew Bday: ${s.hebBday}</div>

      <div class="card-row">
        <span class="local-clock" data-tz="${s.tz}">--:--</span>
        <span class="daynight-badge" data-daynight>—</span>
      </div>

      <div class="weather-row" data-weather-id="${s.id}">🌡️ Loading weather…</div>

      <div class="wa-buttons">
        ${waFatherNum ? `<a class="wa-btn" href="https://wa.me/${waFatherNum}" target="_blank" rel="noopener">💬 ${s.father}</a>` : ""}
        ${waMotherNum ? `<a class="wa-btn" href="https://wa.me/${waMotherNum}" target="_blank" rel="noopener">💬 ${s.mother}</a>` : ""}
      </div>
    </div>`;
}

function buildAllCards() {
  CLASSES.forEach(cls => {
    const grid = document.getElementById("grid-" + cls.replace(/\s+/g, ""));
    const students = STUDENTS.filter(s => s.cls === cls);
    grid.innerHTML = students.map(buildCardHTML).join("");
  });
}

function renderWeatherOnly() {
  STUDENTS.forEach(s => {
    const el = document.querySelector(`[data-weather-id="${s.id}"]`);
    if (!el) return;
    const w = weatherData[s.id];
    if (!w) {
      el.innerHTML = `🌡️ Weather unavailable`;
      return;
    }
    const [icon, desc] = weatherIcon(w.code);
    el.innerHTML = `<span class="icon">${icon}</span> ${w.tempF}°F / ${w.tempC}°C · ${desc} · 💨 ${w.wind} mph`;
  });
}

function refreshZmanimFor(s) {
  // Only the day/night badge needs this now, so the local calc is all we need —
  // no reason to call out to Hebcal for a value we no longer display.
  const z = computeLocalZmanim(s);
  zmanimCache[s.id] = z;
  updateZmanimDisplay(s);
}

function updateZmanimDisplay(s) {
  const card = document.getElementById(cardId(s));
  if (!card) return;
  const z = zmanimCache[s.id];
  if (!z) return;

  // day/night indicator based on real sunrise/sunset instants
  const now = new Date();
  const isDaytime = now >= z.sunrise && now <= z.sunset;
  const badge = card.querySelector('[data-daynight]');
  if (badge) {
    badge.textContent = isDaytime ? "☀️ Daytime" : "🌙 Nighttime";
    badge.className = "daynight-badge " + (isDaytime ? "day" : "night");
  }
  card.classList.toggle("night", !isDaytime);
}

function tickClocks() {
  const now = new Date();
  document.querySelectorAll(".local-clock").forEach(el => {
    const tz = el.getAttribute("data-tz");
    el.textContent = new Intl.DateTimeFormat("en-US", {
      timeZone: tz, hour: "numeric", minute: "2-digit"
    }).format(now);
  });

  // Header clock (teacher's time)
  document.getElementById("myClock").textContent = new Intl.DateTimeFormat("en-US", {
    timeZone: TEACHER_TZ, hour: "numeric", minute: "2-digit"
  }).format(now);

  const engDate = new Intl.DateTimeFormat("en-US", {
    timeZone: TEACHER_TZ, weekday: "long", month: "long", day: "numeric", year: "numeric"
  }).format(now);
  let hebDate = "";
  try {
    hebDate = new Intl.DateTimeFormat("en-US-u-ca-hebrew", {
      timeZone: TEACHER_TZ, day: "numeric", month: "long", year: "numeric"
    }).format(now);
  } catch (e) { hebDate = ""; }
  document.getElementById("myDates").textContent = hebDate ? `${engDate} · ${hebDate}` : engDate;
}

function applySearchFilter() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const activeGrid = document.getElementById("grid-" + currentTab.replace(/\s+/g, ""));
  if (!activeGrid) return;
  let anyVisible = false;
  activeGrid.querySelectorAll(".card").forEach(card => {
    const match = !q || card.dataset.name.includes(q) || card.dataset.city.includes(q);
    card.style.display = match ? "" : "none";
    if (match) anyVisible = true;
  });
  let emptyMsg = activeGrid.querySelector(".empty-msg");
  if (!anyVisible) {
    if (!emptyMsg) {
      emptyMsg = document.createElement("div");
      emptyMsg.className = "empty-msg";
      emptyMsg.textContent = "No students match your search.";
      activeGrid.appendChild(emptyMsg);
    }
  } else if (emptyMsg) {
    emptyMsg.remove();
  }
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  buildTabs();
  buildGroupActions();
  buildGridShells();
  buildAllCards();
  renderGrid();

  document.getElementById("searchBox").addEventListener("input", applySearchFilter);

  tickClocks();
  setInterval(tickClocks, 1000);
  // day/night + zmanim refresh needs the clock ticking too, so re-check badges each minute
  setInterval(() => STUDENTS.forEach(s => zmanimCache[s.id] && updateZmanimDisplay(s)), 30000);

  STUDENTS.forEach(refreshZmanimFor);
  // refresh zmanim once a day is enough, but re-check every hour in case the page stays open across midnight
  setInterval(() => STUDENTS.forEach(refreshZmanimFor), 60 * 60 * 1000);

  fetchWeather();
  setInterval(fetchWeather, 10 * 60 * 1000);
}

// ---- Owner sign-in: the dashboard data is private ----
firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const gateEl=document.getElementById("privateGate"),gateMsg=document.getElementById("privateGateMsg");
document.getElementById("privateSignIn").onclick=()=>firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err=>{gateMsg.textContent=(err&&err.message)||"Google sign-in did not complete.";});
let dashboardStarted=false;
// One-time setup: the owner loads the class details file, and it is saved to the owner-only spot.
document.getElementById("privateImportFile").onchange=async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data.students)||!data.students.length)throw new Error("That file does not contain class details.");
    data.savedAt=Date.now();
    await firebase.database().ref("studentRewards/privateClassDashboard").set(data);
    location.reload();
  }catch(err){console.warn(err);gateMsg.textContent=(err&&err.message)||"Could not load that file.";}
};
firebase.auth().onAuthStateChanged(async user=>{
  if(!user){gateMsg.textContent="This page has private student details. Sign in with the owner Google account.";return;}
  try{
    const data=(await firebase.database().ref("studentRewards/privateClassDashboard").once("value")).val();
    if(!data||!Array.isArray(data.students)){gateMsg.textContent="No class details have been saved yet.";document.getElementById("privateSignIn").style.display="none";document.getElementById("privateImport").style.display="";return;}
    STUDENTS=data.students;GROUP_INFO=data.groupInfo||{};SCHOOL_EMAIL=data.schoolEmail||"";GROUP_BCC_EMAILS=data.groupBccEmails||{};
    gateEl.style.display="none";
    if(!dashboardStarted){dashboardStarted=true;startDashboard();}
  }catch(err){console.warn(err);gateMsg.textContent="This Google account cannot open the class details.";}
});
</script>
