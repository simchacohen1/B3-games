<script>
/* =========================================================
   STUDENT DATA
   Deduplicated from roster export. Each city geocoded with
   lat/lon + IANA timezone embedded (no runtime geocoding).
   ========================================================= */
const TEACHER_TZ = "America/New_York";

// Student details (addresses, parents, phone numbers) are NOT kept in this public
// file. They load after the owner signs in, from studentRewards/privateClassDashboard,
// which only the owner account can read.
let STUDENTS = [];

// Sort order: timezone (east to west by standard UTC offset), then last name.
const TZ_OFFSET_RANK = {
  "America/Grenada": -4, "America/Barbados": -4, "America/Manaus": -4,
  "America/New_York": -5, "America/Mexico_City": -6, "America/Chicago": -6,
  "America/Regina": -6, "America/Denver": -7, "America/Vancouver": -8,
  "America/Los_Angeles": -8, "America/Anchorage": -9
};
function sortStudents(){STUDENTS.sort((a, b) => {
  // East (less-negative offset, e.g. -4) should come before West (more-negative, e.g. -9)
  const r = TZ_OFFSET_RANK[b.tz] - TZ_OFFSET_RANK[a.tz];
  if (r !== 0) return r;
  return a.last.localeCompare(b.last);
});}

/* =========================================================
   PHONE NORMALIZATION -> wa.me digits
   ========================================================= */
function normalizePhone(raw) {
  if (!raw) return null;
  let hasPlus = raw.trim().startsWith("+");
  let digits = raw.replace(/[^\d]/g, "");
  if (hasPlus) return digits;                       // already international
  if (digits.length === 11 && digits.startsWith("1")) return digits; // NANP w/ leading 1
  if (digits.length === 10) return "1" + digits;     // bare NANP 10-digit -> assume +1
  if (digits.length >= 11) return digits;            // assume already has country code (e.g. Brazil)
  return digits;
}

/* =========================================================
   NOAA-STYLE SUNRISE EQUATION
   Returns UTC decimal hours for the given LOCAL calendar date.
   ========================================================= */
function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

function calcSunUTC(year, month, day, lat, lon, zenith, isSunrise) {
  const N1 = Math.floor(275 * month / 9);
  const N2 = Math.floor((month + 9) / 12);
  const N3 = 1 + Math.floor((year - 4 * Math.floor(year / 4) + 2) / 3);
  const N = N1 - (N2 * N3) + day - 30;

  const lngHour = lon / 15;
  const t = isSunrise ? N + ((6 - lngHour) / 24) : N + ((18 - lngHour) / 24);

  const M = (0.9856 * t) - 3.289;
  let L = M + (1.916 * Math.sin(toRad(M))) + (0.020 * Math.sin(2 * toRad(M))) + 282.634;
  L = ((L % 360) + 360) % 360;

  let RA = toDeg(Math.atan(0.91764 * Math.tan(toRad(L))));
  RA = ((RA % 360) + 360) % 360;
  const Lq = Math.floor(L / 90) * 90;
  const RAq = Math.floor(RA / 90) * 90;
  RA = (RA + (Lq - RAq)) / 15;

  const sinDec = 0.39782 * Math.sin(toRad(L));
  const cosDec = Math.cos(Math.asin(sinDec));
  const cosH = (Math.cos(toRad(zenith)) - (sinDec * Math.sin(toRad(lat)))) / (cosDec * Math.cos(toRad(lat)));

  if (cosH > 1 || cosH < -1) return null; // no rise/set (polar) — not expected for our cities

  let H = isSunrise ? 360 - toDeg(Math.acos(cosH)) : toDeg(Math.acos(cosH));
  H = H / 15;

  const T = H + RA - (0.06571 * t) - 6.622;
  let UT = T - lngHour;
  UT = ((UT % 24) + 24) % 24;
  return UT;
}

// Build a UTC Date instant from a local Y-M-D + decimal UT hours
function utDecimalToDate(year, month, day, utDecimal) {
  const h = Math.floor(utDecimal);
  const remMin = (utDecimal - h) * 60;
  const m = Math.floor(remMin);
  const s = Math.round((remMin - m) * 60);
  return new Date(Date.UTC(year, month - 1, day, h, m, s));
}

// Get {year, month, day} of "today" for a given IANA timezone
function localYMD(tz, refDate) {
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" });
  const parts = fmt.formatToParts(refDate || new Date());
  const obj = {};
  parts.forEach(p => { if (p.type !== "literal") obj[p.type] = parseInt(p.value, 10); });
  return { year: obj.year, month: obj.month, day: obj.day };
}

/* Compute full zmanim set (local NOAA calc) for a student for "their today" */
function computeLocalZmanim(student) {
  const { year, month, day } = localYMD(student.tz);
  const sunriseUT = calcSunUTC(year, month, day, student.lat, student.lon, 90.833, true);
  const sunsetUT  = calcSunUTC(year, month, day, student.lat, student.lon, 90.833, false);
  const altSunriseUT = calcSunUTC(year, month, day, student.lat, student.lon, 91.583, true);  // Baal HaTanya netz
  const altSunsetUT  = calcSunUTC(year, month, day, student.lat, student.lon, 91.583, false); // Baal HaTanya shkia

  if (sunriseUT === null || sunsetUT === null || altSunriseUT === null || altSunsetUT === null) {
    return null;
  }

  const sunrise = utDecimalToDate(year, month, day, sunriseUT);
  let sunset = utDecimalToDate(year, month, day, sunsetUT);
  if (sunset <= sunrise) sunset = new Date(sunset.getTime() + 24 * 3600 * 1000);

  const altSunrise = utDecimalToDate(year, month, day, altSunriseUT);
  let altSunset = utDecimalToDate(year, month, day, altSunsetUT);
  if (altSunset <= altSunrise) altSunset = new Date(altSunset.getTime() + 24 * 3600 * 1000);

  const dayLenMs = sunset - sunrise;
  const shaahZmanisMs = dayLenMs / 12;
  const chatzos = new Date(sunrise.getTime() + dayLenMs / 2);

  const altDayLenMs = altSunset - altSunrise;
  const shema = new Date(altSunrise.getTime() + (altDayLenMs * 3 / 12));

  return {
    sunrise, sunset, chatzos, shema,
    shaahZmanisMinutes: shaahZmanisMs / 60000,
    source: "calc"
  };
}

/* =========================================================
   HEBCAL ZMANIM (sunrise/sunset/chatzos), cached per city+date,
   silent NOAA fallback if unreachable.
   ========================================================= */
const hebcalCache = {};

async function fetchHebcalZmanim(student) {
  const { year, month, day } = localYMD(student.tz);
  const dateStr = `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const cacheKey = `${student.id}-${dateStr}`;
  if (hebcalCache[cacheKey]) return hebcalCache[cacheKey];

  const local = computeLocalZmanim(student); // always compute as fallback baseline (and for shema, always local)
  if (!local) return null;

  try {
    const url = `https://www.hebcal.com/zmanim?cfg=json&latitude=${student.lat}&longitude=${student.lon}&tzid=${encodeURIComponent(student.tz)}&date=${dateStr}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    const t = data.times || {};
    const result = {
      sunrise: t.sunrise ? new Date(t.sunrise) : local.sunrise,
      sunset: t.sunset ? new Date(t.sunset) : local.sunset,
      chatzos: t.chatzot ? new Date(t.chatzot) : local.chatzos,
      shema: local.shema, // Baal HaTanya shema always computed locally
      shaahZmanisMinutes: local.shaahZmanisMinutes,
      source: "hebcal"
    };
    hebcalCache[cacheKey] = result;
    return result;
  } catch (e) {
    hebcalCache[cacheKey] = local; // silent fallback
    return local;
  }
}

/* =========================================================
   WEATHER (Open-Meteo, batched)
   ========================================================= */
const WEATHER_ICONS = {
  0: ["☀️", "Clear sky"], 1: ["🌤️", "Mainly clear"], 2: ["⛅", "Partly cloudy"], 3: ["☁️", "Overcast"],
  45: ["🌫️", "Fog"], 48: ["🌫️", "Rime fog"],
  51: ["🌦️", "Light drizzle"], 53: ["🌦️", "Drizzle"], 55: ["🌧️", "Dense drizzle"],
  61: ["🌧️", "Light rain"], 63: ["🌧️", "Rain"], 65: ["🌧️", "Heavy rain"],
  71: ["🌨️", "Light snow"], 73: ["🌨️", "Snow"], 75: ["❄️", "Heavy snow"],
  80: ["🌦️", "Rain showers"], 81: ["🌧️", "Rain showers"], 82: ["⛈️", "Violent showers"],
  95: ["⛈️", "Thunderstorm"], 96: ["⛈️", "Thunderstorm w/ hail"], 99: ["⛈️", "Severe thunderstorm"]
};
function weatherIcon(code) { return (WEATHER_ICONS[code] || ["🌡️", "—"]); }

let weatherData = {}; // id -> {tempF, tempC, wind, code}

async function fetchWeather() {
  try {
    const lats = STUDENTS.map(s => s.lat).join(",");
    const lons = STUDENTS.map(s => s.lon).join(",");
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("weather fetch failed");
    const data = await res.json();
    const arr = Array.isArray(data) ? data : [data];
    arr.forEach((entry, i) => {
      const s = STUDENTS[i];
      if (!s || !entry.current) return;
      const tempF = entry.current.temperature_2m;
      const tempC = (tempF - 32) * 5 / 9;
      weatherData[s.id] = {
        tempF: Math.round(tempF),
        tempC: Math.round(tempC),
        wind: Math.round(entry.current.wind_speed_10m),
        code: entry.current.weather_code
      };
    });

/* =========================================================
   PRECISE MAPS + PLACE DISCOVERY
   Locations/parent contact details continue to come ONLY from the
   owner's private Firebase data. News requests contain city/country
   only, never a student's identity or home address.
   ========================================================= */
function safeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeCoordinate(value) {
  const num = Number(value);
  return Number.isFinite(num) ? num : null;
}
function fullStudentAddress(s) {
  const location = [s.city, s.region, s.country].filter(Boolean).join(', ');
  return [s.street, location].filter(Boolean).join(', ');
}
function googleAddressUrl(address) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
}
function streetViewUrl(lat, lon) {
  return 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' +
    encodeURIComponent(lat + ',' + lon);
}
// Important: s.lat / s.lon are CITY centers in the original data,
// so they must NOT be used for a house Street View.
function savedHouseCoordinates(s) {
  const pairs = [
    [s.streetViewLat,s.streetViewLon], [s.homeLat,s.homeLon],
    [s.houseLat,s.houseLon], [s.homeLatitude,s.homeLongitude],
    [s.homeLocation && s.homeLocation.lat,s.homeLocation && s.homeLocation.lon]
  ];
  for (const pair of pairs) {
    const lat = safeCoordinate(pair[0]), lon = safeCoordinate(pair[1]);
    if (pair[0] != null && pair[1] != null && String(pair[0]).trim() !== '' && String(pair[1]).trim() !== '' && lat !== null && lon !== null &&
        lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) return {lat,lon};
  }
  return null;
}
function showMapNotice(message) {
  let notice = document.querySelector('.map-notice');
  if (notice) notice.remove();
  notice = document.createElement('div');
  notice.className = 'map-notice';
  notice.setAttribute('role','status');
  notice.textContent = message;
  document.body.appendChild(notice);
  setTimeout(() => { if (notice.isConnected) notice.remove(); }, 8000);
}
const HOUSE_POSITION_CACHE = new Map();
let lastGeocodeRequest = 0;
function approxDistanceKm(lat1,lon1,lat2,lon2) {
  const rad = Math.PI/180;
  const dLat=(lat2-lat1)*rad, dLon=(lon2-lon1)*rad;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
async function geocodeHouseOnce(s) {
  const key = fullStudentAddress(s);
  if (HOUSE_POSITION_CACHE.has(key)) return HOUSE_POSITION_CACHE.get(key);
  const numberMatch = String(s.street || '').match(/^\s*(\d+[a-zA-Z]?(?:\s*[-/]\s*\d+[a-zA-Z]?)?)/);
  if (!numberMatch) return null;
  // Limit browser requests to the community service (one request per >1s).
  const pause = Math.max(0, lastGeocodeRequest + 1300 - Date.now());
  if (pause) await new Promise(resolve => setTimeout(resolve,pause));
  lastGeocodeRequest = Date.now();
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=3&q=' +
      encodeURIComponent(key);
    const resp = await fetch(url, {headers:{'Accept':'application/json'}});
    if (!resp.ok) throw new Error('Geocoding unavailable');
    const options = await resp.json();
    const requestedNumber = numberMatch[1].replace(/\s/g,'').toLowerCase();
    const best = (Array.isArray(options) ? options : []).find(item => {
      const foundNumber = String(item.address && item.address.house_number || '').replace(/\s/g,'').toLowerCase();
      const lat=Number(item.lat), lon=Number(item.lon);
      const centerLat=safeCoordinate(s.lat), centerLon=safeCoordinate(s.lon);
      const nearCity = centerLat === null || centerLon === null ||
        approxDistanceKm(centerLat,centerLon,lat,lon)<100;
      return foundNumber === requestedNumber && nearCity &&
        Number.isFinite(lat) && Number.isFinite(lon);
    });
    const point = best ? {lat:Number(best.lat),lon:Number(best.lon)} : null;
    HOUSE_POSITION_CACHE.set(key,point); // Session cache; never store home addresses or coordinates in public HTML.
    return point;
  } catch (error) {
    console.info('Precise house geocode unavailable', error);
    return null;
  }
}
async function openStreetViewForStudent(s, button) {
  const address = fullStudentAddress(s);
  if (!s.street) {
    showMapNotice('No street address is saved. Opening the city map instead.');
    window.open(googleAddressUrl(address),'_blank','noopener');
    return;
  }
  let home = savedHouseCoordinates(s);
  if (home) {
    window.open(streetViewUrl(home.lat,home.lon),'_blank','noopener');
    return;
  }
  // Open Maps immediately during the click, so browsers do not block the new tab.
  // If a precise address match is found, update that tab to direct Street View.
  const tab = window.open(googleAddressUrl(address),'_blank');
  if (tab) { try { tab.opener = null; } catch(e) {} }
  button.disabled = true;
  const original = button.textContent;
  button.textContent = '🔎 Locating house…';
  try {
    home = await geocodeHouseOnce(s);
    if (home) {
      if (tab && !tab.closed) tab.location.href = streetViewUrl(home.lat,home.lon);
      else showMapNotice('House located. Allow pop-ups to launch Street View.');
    } else {
      showMapNotice('Exact house coordinates were not verified. Opened the saved address in Google Maps; choose Street View there if available.');
    }
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
}

const PLACE_INFO_CACHE = new Map();
function wikipediaApiUrl(params) {
  const url = new URL('https://en.wikipedia.org/w/api.php');
  Object.entries({format:'json',origin:'*',...params}).forEach(([k,v])=>url.searchParams.set(k,v));
  return url.toString();
}
async function wikipediaOverview(phrase) {
  const search = await fetch(wikipediaApiUrl({action:'query',list:'search',srsearch:phrase,
    srlimit:'3',srnamespace:'0'}));
  if (!search.ok) throw new Error('Wikipedia search unavailable');
  const searchJson = await search.json();
  const matches = (searchJson.query && searchJson.query.search) || [];
  if (!matches.length) return null;
  const hit = matches[0];
  const request = await fetch(wikipediaApiUrl({action:'query',prop:'extracts',exintro:'1',
    explaintext:'1',exsentences:'4',pageids:String(hit.pageid)}));
  if (!request.ok) throw new Error('Wikipedia summary unavailable');
  const json = await request.json();
  const page = json.query && json.query.pages && json.query.pages[hit.pageid];
  if (!page || !page.extract) return null;
  const text = page.extract.replace(/\s+/g,' ').trim();
  const clipped = text.length>530 ? text.slice(0,527).replace(/\s+\S*$/,'')+'…' : text;
  return {title:page.title,text:clipped,url:'https://en.wikipedia.org/?curid='+hit.pageid};
}
function newsSearchUrl(s) {
  const phrase = [s.city,s.region,s.country].filter(Boolean).join(' ');
  return 'https://news.google.com/search?q='+encodeURIComponent(phrase)+
    '&hl=en-US&gl=US&ceid=US%3Aen';
}
function gdeltIndexedDate(value) {
  const m = String(value||'').match(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z$/);
  if (!m) return null;
  const d = new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]));
  return Number.isNaN(d.valueOf()) ? null : d;
}
async function recentPlaceNews(s) {
  const city=s.city || '', region=s.region || '', country=s.country || '';
  const query = '"'+city.replace(/"/g,'')+'" "'+(region||country).replace(/"/g,'')+'" sourcelang:english';
  const params = new URLSearchParams({query,mode:'artlist',maxrecords:'6',
    format:'json',sort:'datedesc',timespan:'7d'});
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(),11000);
  try {
    const response = await fetch('https://api.gdeltproject.org/api/v2/doc/doc?'+params,
      {signal:controller.signal});
    if (!response.ok) throw new Error('Recent news unavailable');
    const json = await response.json();
    return (Array.isArray(json.articles) ? json.articles : [])
      .filter(a=>a.title && /^https:\/\//i.test(a.url||''))
      .slice(0,4).map(a=>({title:String(a.title),url:a.url,
        source:String(a.domain||'News source'),date:gdeltIndexedDate(a.seendate)}));
  } finally {clearTimeout(timeout);}
}
function appendText(parent,tag,text,cls) {
  const node=document.createElement(tag);
  if (cls) node.className=cls;
  node.textContent=text;
  parent.appendChild(node);
  return node;
}
function appendSafeLink(parent,text,url,cls) {
  const link=document.createElement('a');
  link.className=cls||'explorer-link';
  link.textContent=text;
  link.href=url;
  link.target='_blank';link.rel='noopener noreferrer';
  parent.appendChild(link);
  return link;
}
async function loadPlaceExplorer(s,container,force=false) {
  const key=[s.city,s.region,s.country].join('|').toLowerCase();
  const current=PLACE_INFO_CACHE.get(key);
  let promise;
  if (!force && current && Date.now()-current.when<10*60*1000) {
    promise=current.promise;
  } else {
    promise=Promise.allSettled([
      wikipediaOverview([s.city,s.region,s.country].filter(Boolean).join(' ')),
      wikipediaOverview(s.country === 'USA' ? 'United States' : s.country),
      recentPlaceNews(s)
    ]);
    PLACE_INFO_CACHE.set(key,{promise,when:Date.now()});
  }
  container.replaceChildren();
  appendText(container,'div','Getting city facts and recent headlines…','place-loading');
  const results=await promise;
  if (!container.isConnected) return;
  container.replaceChildren();
  const sections=[{name:'🏙️ City: '+s.city,result:results[0]},
    {name:'🌍 Country: '+s.country,result:results[1]}];
  for (const section of sections) {
    const wrapper=appendText(container,'section','','explorer-section');
    appendText(wrapper,'div',section.name,'explorer-heading');
    if (section.result.status==='fulfilled' && section.result.value) {
      appendText(wrapper,'p',section.result.value.text,'explorer-copy');
      appendSafeLink(wrapper,'Read more on Wikipedia ('+section.result.value.title+')',section.result.value.url);
    } else {
      appendText(wrapper,'p','Details could not be loaded right now.','explorer-copy');
      appendSafeLink(wrapper,'Search Wikipedia',
        'https://en.wikipedia.org/w/index.php?search='+encodeURIComponent(section.name.slice(3)));
    }
  }
  const sights=appendText(container,'section','','explorer-section');
  appendText(sights,'div','⭐ Famous places and landmarks','explorer-heading');
  appendSafeLink(sights,'Discover landmarks in '+s.city,
    googleAddressUrl('famous landmarks and attractions in '+[s.city,s.region,s.country].filter(Boolean).join(', ')));
  const news=appendText(container,'section','','explorer-section');
  appendText(news,'div','📰 Recent local news · past 7 days','explorer-heading');
  const newsResult=results[2];
  const articles=newsResult.status==='fulfilled' ? newsResult.value : [];
  if (articles.length) {
    const list=appendText(news,'ul','','news-items');
    for (const a of articles) {
      const item=appendText(list,'li','');
      appendSafeLink(item,a.title,a.url);
      appendText(item,'small',a.source+(a.date ? ' · Indexed '+a.date.toLocaleDateString('en-US') : ''));
    }
  } else {
    appendText(news,'p','No recent headlines could be retrieved for this location.','explorer-copy');
  }
  appendSafeLink(news,'See latest results in Google News ↗',newsSearchUrl(s));
  const control=appendText(container,'div','','explorer-section');
  appendText(control,'span','Information: Wikipedia · Headlines: GDELT news index','explorer-caption');
  const refresh=appendText(control,'button','↻ Refresh facts and news','location-action');
  refresh.type='button';
  refresh.addEventListener('click',()=>loadPlaceExplorer(s,container,true));
}

function updateZmanimDisplay(s) {
  const card = document.getElementById(cardId(s));
  if (!card) return;
  const z = zmanimCache[s.id];
  if (!z) return;

  // day/night indicator based on real sunrise/sunset instants
  const now = new Date();
  const isDaytime = now >= z.sunrise && now <= z.sunset;
  const badge = card.querySelector('[data-daynight]');
  if (badge) {
    badge.textContent = isDaytime ? "☀️ Daytime" : "🌙 Nighttime";
    badge.className = "daynight-badge " + (isDaytime ? "day" : "night");
  }
  card.classList.toggle("night", !isDaytime);
}

  document.getElementById("myClock").textContent = new Intl.DateTimeFormat("en-US", {
    timeZone: TEACHER_TZ, hour: "numeric", minute: "2-digit"
  }).format(now);

  const engDate = new Intl.DateTimeFormat("en-US", {
    timeZone: TEACHER_TZ, weekday: "long", month: "long", day: "numeric", year: "numeric"
  }).format(now);
  let hebDate = "";
  try {
    hebDate = new Intl.DateTimeFormat("en-US-u-ca-hebrew", {
      timeZone: TEACHER_TZ, day: "numeric", month: "long", year: "numeric"
    }).format(now);
  } catch (e) { hebDate = ""; }

function applySearchFilter() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const activeGrid = document.getElementById("grid-" + currentTab.replace(/\s+/g, ""));
  if (!activeGrid) return;
  let anyVisible = false;
  activeGrid.querySelectorAll(".card").forEach(card => {
    const match = !q || card.dataset.name.includes(q) || card.dataset.city.includes(q);
    card.style.display = match ? "" : "none";
    if (match) anyVisible = true;
  });
  let emptyMsg = activeGrid.querySelector(".empty-msg");
  if (!anyVisible) {
    if (!emptyMsg) {
      emptyMsg = document.createElement("div");
      emptyMsg.className = "empty-msg";
      emptyMsg.textContent = "No students match your search.";
      activeGrid.appendChild(emptyMsg);
    }
  } else if (emptyMsg) {
    emptyMsg.remove();
  }
}

function init() {
  buildTabs();

  buildGridShells();
  buildAllCards();

  document.getElementById("searchBox").addEventListener("input", applySearchFilter);

  tickClocks();
  setInterval(tickClocks, 1000);
  // day/night + zmanim refresh needs the clock ticking too, so re-check badges each minute
  setInterval(() => STUDENTS.forEach(s => zmanimCache[s.id] && updateZmanimDisplay(s)), 30000);

  STUDENTS.forEach(refreshZmanimFor);
  // refresh zmanim once a day is enough, but re-check every hour in case the page stays open across midnight
  setInterval(() => STUDENTS.forEach(refreshZmanimFor), 60 * 60 * 1000);

  fetchWeather();
  setInterval(fetchWeather, 10 * 60 * 1000);
}
