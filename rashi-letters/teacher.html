<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rashi Letters — Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family: 'Mekorot Rashi';
    src: url('./fonts/Mekorot-Rashi.ttf') format('truetype');
    font-display: swap;
  }
  :root{
    --parchment: #F1E7CE;
    --parchment-dark: #E4D4AC;
    --ink: #3B2A1E;
    --ink-soft: #6B5842;
    --rimon: #8C2F39;
    --rimon-dark: #6E1F28;
    --gold: #C9A227;
    --shadow: rgba(59,42,30,0.25);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: radial-gradient(circle at 20% 10%, #F6EEDA 0%, #E9DBB8 55%, #DCC998 100%);
    font-family:'Quicksand', sans-serif; color:var(--ink); min-height:100vh;
  }
  .wrap{ max-width:960px; margin:0 auto; padding:28px 18px 60px; }
  header.top{ text-align:center; margin-bottom:20px; }
  header.top h1{
    font-family:'Frank Ruhl Libre', serif; font-weight:700; font-size:1.9rem;
    color:var(--rimon-dark); margin:0 0 4px;
  }
  header.top p{ margin:0; color:var(--ink-soft); font-size:0.9rem; }
  .toolbar{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:var(--parchment); border:2px solid var(--gold); border-radius:14px;
    padding:14px 18px; margin-bottom:18px; flex-wrap:wrap;
  }
  .btn{
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:0.9rem;
    border:none; border-radius:999px; padding:9px 18px; cursor:pointer;
    color:#fff; background:var(--rimon); box-shadow:0 3px 0 var(--rimon-dark);
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--rimon-dark); }
  .btn.gold{ background:var(--gold); box-shadow:0 3px 0 #97781a; color:var(--ink); }
  table{ width:100%; border-collapse:collapse; background:#FFFDF7; border:2px solid var(--gold); border-radius:14px; overflow:hidden; }
  thead th{
    background:var(--parchment-dark); text-align:left; padding:10px 12px;
    font-size:0.85rem; color:var(--ink-soft); font-weight:700;
  }
  tbody td{ padding:10px 12px; border-top:0.5px solid var(--parchment-dark); font-size:0.9rem; }
  .unit-pill{
    display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.75rem;
    font-weight:700; margin:2px; background:var(--parchment-dark); color:var(--ink-soft);
  }
  .unit-pill.done{ background:#DCEFD9; color:#2E5C2C; }
  .phase-tag{
    display:inline-block; padding:2px 9px; border-radius:999px; font-size:0.72rem;
    font-weight:700; background:var(--gold); color:var(--ink);
  }
  .phase-tag.word{ background:var(--rimon); color:#fff; }
  .accuracy-good{ color:#2E5C2C; font-weight:700; }
  .accuracy-mid{ color:#8C6B1F; font-weight:700; }
  .accuracy-low{ color:var(--rimon); font-weight:700; }
  .empty{ text-align:center; padding:40px; color:var(--ink-soft); }
  .rashi-sample{ font-family:'Mekorot Rashi', serif; font-size:1.4rem; }

:root{--parchment:#fff;--parchment-dark:#e5eafa;--ink:#172547;--ink-soft:#475675;--rimon:#6553d6;--rimon-dark:#3f3099;--gold:#b8c4e7;--gold-light:#ede9ff;--shadow:#283f7520}
body{background:radial-gradient(ellipse at 5% 5%,#e0dcff,transparent 45%),radial-gradient(ellipse at 95% 60%,#ccf5ed,transparent 45%),#f3f6ff;font-family:'Quicksand',Arial,sans-serif}

x solid #d8dff0;border-radius:10px;padding:10px}.letter-box{position:relative;background:linear-gradient(135deg,#f0edff,#edf6ff);border:0;border-radius:22px;min-height:235px;margin-bottom:20px}.letter-box:before{content:'RASHI SCRIPT';position:absolute;top:18px;left:22px;font:700 11px 'Quicksand',sans-serif;letter-spacing:2px;color:#605592}#rashiLetter{font-size:150px;color:#342773;direction:rtl}#rashiLetter.word-mode{font-size:83px}.prompt{font-size:21px;font-weight:700;color:var(--ink)}.choices{gap:16px}.choice-btn{height:100px;font-size:54px;border:2px solid #dbe2f1;border-bottom:6px solid #c9d3e9;border-radius:19px;background:white}.choice-btn.word-btn{font-size:36px;min-height:100px}.choice-btn:hover:not(:disabled){border-color:#8877e6;background:#f6f3ff;transform:translateY(-2px)}.choice-btn.correct{background:#d9f9e8;border-color:#249665;color:#125e3f}.choice-btn.incorrect{background:#fff0e3;border-color:#d78737}.choice-btn:disabled{color:var(--ink);opacity:1}#feedback{font-size:19px;min-height:30px;line-height:1.5}.progress-track{height:13px;border-radius:20px}#progFill{background:linear-gradient(90deg,#7160e6,#36bda3)}.streak-star{font-size:32px;color:#dfa900;opacity:.22}.streak-star.lit{opacity:1}.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid #dce3f4;padding:14px 20px;border-radius:18px;margin-bottom:18px;font-weight:700}.hud button{background:#eef0fc;border:0;padding:10px;border-radius:10px;color:#3f3099;font:inherit;cursor:pointer}.help-row{display:flex;justify-content:center;gap:12px;margin-bottom:18px}.helper{border:0;background:#ece9ff;color:#443694;padding:12px 18px;border-radius:12px;font:700 15px 'Quicksand',sans-serif;cursor:pointer}.study{background:#f1f7ff;border:2px solid #d5e2fa;border-radius:18px;padding:20px;margin:16px 0;text-align:center}.compare{display:flex;justify-content:center;gap:50px;align-items:center;margin:15px}.compare span{font:80px Arial;direction:rtl}.compare .rashi{font-family:'Mekorot Rashi'}.compare small{display:block;font:700 13px 'Quicksand',sans-serif;color:#536180;margin-top:15px}.star-note{text-align:center;font-size:14px;color:#536180}.finish-icon{font-size:70px}button:focus-visible,input:focus-visible{outline:4px solid #f0b93a;outline-offset:4px}#completeScreen h2{font-size:32px}#completeScreen p{font-size:20px}.pop-banner{animation:pop .4s ease}
@media(min-width:800px){#app{max-width:760px;margin:auto}}
@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:20px;border-radius:22px}header.top h1{font-size:27px}.brand-icon{width:54px;height:54px}.letter-grid{grid-template-columns:repeat(3,1fr)}.unit-label{font-size:14px}.phase-row{gap:8px}.phase-pill{display:none}#rashiLetter.word-mode{font-size:62px}.choice-btn.word-btn{font-size:29px}.hud{font-size:13px;padding:10px}.letter-box{min-height:205px}.compare{gap:25px}.compare span{font-size:65px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.wrap{max-width:1250px}header.top{display:block}#tableHolder{overflow-x:auto}table{border:1px solid #dce3f4}thead th{font-size:15px;padding:18px 14px}tbody td{font-size:17px;padding:18px 14px}.unit-pill{font-size:15px;padding:7px 10px}.phase-tag{font-size:14px}.toolbar{background:white;border-color:#dce3f4;padding:20px}.toolbar label{font-size:18px!important}tbody tr:nth-child(even){background:#f6f8ff}
</style>
</head>
<body>
<div class="wrap" id="teacherGate" style="text-align:center;padding-top:60px">Checking your teacher account…</div>
<div class="wrap" id="teacherApp" style="display:none">
  <header class="top">
    <h1>אותיות רש"י</h1>
    <p>Rashi Quest • Teacher dashboard</p>
  </header>

  <div class="toolbar">
    <div>
      <label id="lockLabel" style="font-size:0.85rem; color:var(--ink-soft);display:none">
        <input type="checkbox" id="lockToggle"> Close practice for students
      </label>
      <span id="scopeLabel" style="font-size:0.85rem; color:var(--ink-soft);"></span>
    </div>
    <button class="btn gold" id="refreshBtn">Refresh</button>
  </div>

  <div id="tableHolder">
    <div class="empty">Loading…</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script>window.firebase||document.write('<script src="../vendor/firebase/12.15.0/firebase-app-compat.js"><\/script>')</script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script><script>window.firebase&&firebase.database||document.write('<script src="../vendor/firebase/12.15.0/firebase-database-compat.js"><\/script>')</script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script>window.firebase&&firebase.auth||document.write('<script src="../vendor/firebase/12.15.0/firebase-auth-compat.js"><\/script>')</script>
<script src="../firebase-config.js"></script>
<script src="../site-settings.js?v=20261008-tool-versions"></script>
<script src="../teacher-class-scope.js"></script>
<script>
if(!firebase.apps.length) firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const db = firebase.database();
// Only signed-in teachers see this dashboard, and only students in their classes.
let teacherScope = null, isOwner = false;

const UNITS = [
  { id:'zayin', label:'ז' },
  { id:'bet', label:'בּ/ב' },
  { id:'tsadi', label:'צ' },
  { id:'alef', label:'א' },
  { id:'tsadisofit', label:'ץ' },
  { id:'memsofit', label:'ם' },
  { id:'shin', label:'שׁ/שׂ' },
  { id:'samech', label:'ס' },
  { id:'finalreview', label:'שׁ/שׂ review' }
];

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTime(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function accuracyClass(pct){
  if(pct === null) return '';
  if(pct >= 80) return 'accuracy-good';
  if(pct >= 50) return 'accuracy-mid';
  return 'accuracy-low';
}

async function loadDashboard(){
  const holder = document.getElementById('tableHolder');
  if(!teacherScope){ holder.innerHTML = '<div class="empty">Sign in to see your class.</div>'; return; }
  const ids = Object.keys(teacherScope.students || {});
  const entries = await Promise.all(ids.map(async id => [id, (await db.ref('rashiLetters/progress/' + id).once('value')).val()]));
  const data = {};
  entries.forEach(([id, rec]) => { if(rec) data[id] = { ...rec, name: teacherScope.students[id].name || rec.name }; });
  const rows = Object.keys(data).map(slug => {
    const rec = data[slug];
    const units = rec.units || {};
    let totalAttempts = 0, totalCorrect = 0;
    const unitCells = UNITS.map((u,i) => {
      const letterStat = units[u.id + '_letter'];
      const wordStat = units[u.id + '_word'];
      const attempts = (letterStat?letterStat.attempts:0||0) + (wordStat?wordStat.attempts:0||0);
      const correct = (letterStat?letterStat.correct:0||0) + (wordStat?wordStat.correct:0||0);
      const done = (typeof rec.currentUnitIndex === 'number') && rec.currentUnitIndex > i;
      totalAttempts += attempts;
      totalCorrect += correct;
      const pct = attempts ? Math.round((correct/attempts)*100) : null;
      const label = u.label + (pct !== null ? ' ' + pct + '%' : '');
      return '<span class="unit-pill' + (done ? ' done' : '') + '">' + label + '</span>';
    }).join('');
    const overallPct = totalAttempts ? Math.round((totalCorrect/totalAttempts)*100) : null;
    const phase = rec.currentPhase === 'word' ? 'word' : 'letter';
    return {
      slug, name: rec.name || slug,
      currentUnit: (typeof rec.currentUnitIndex === 'number') ? Math.min(rec.currentUnitIndex+1, UNITS.length) : 1,
      phase,
      overallPct, unitCells, lastActive: rec.lastActive
    };
  }).sort((a,b) => a.name.localeCompare(b.name));

  if(rows.length === 0){
    holder.innerHTML = '<div class="empty">No student activity yet.</div>';
    return;
  }

  let html = '<table><thead><tr>' +
    '<th>Student</th><th>Unit</th><th>Phase</th><th>Accuracy</th><th>Letters</th><th>Last active</th>' +
    '</tr></thead><tbody>';
  rows.forEach(r => {
    const accClass = accuracyClass(r.overallPct);
    const phaseTag = r.phase === 'word'
      ? '<span class="phase-tag word">Word</span>'
      : '<span class="phase-tag">Letter</span>';
    html += '<tr>' +
      '<td>' + escapeHtml(r.name) + '</td>' +
      '<td>' + r.currentUnit + ' / ' + UNITS.length + '</td>' +
      '<td>' + phaseTag + '</td>' +
      '<td class="' + accClass + '">' + (r.overallPct !== null ? r.overallPct + '%' : '—') + '</td>' +
      '<td>' + r.unitCells + '</td>' +
      '<td>' + fmtTime(r.lastActive) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  holder.innerHTML = html;
}

async function loadLockState(){
  const snap = await db.ref('rashiLetters/settings/accessLocked').once('value');
  document.getElementById('lockToggle').checked = (snap.val() === true);
}
document.getElementById('lockToggle').addEventListener('change', async (e) => {
  await db.ref('rashiLetters/settings/accessLocked').set(e.target.checked);
});
document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

async function loadTeacher(user, access){
  const gate = document.getElementById('teacherGate'), app = document.getElementById('teacherApp');
  teacherScope = null;
  if(!access || !access.authorized){
    app.style.display = 'none'; gate.style.display = '';
    gate.innerHTML = 'Sign in with your teacher Google account. <button class="btn gold" id="teacherLogin">Sign in with Google</button>';
    document.getElementById('teacherLogin').onclick = () => window.B3SiteSettings.signInWithGoogle();
    return;
  }
  try{
    isOwner = access.role === 'admin';
    if(!isOwner){
      const row = (await db.ref('b3Games/workspaces/b3-2026/teachers/' + user.uid).once('value')).val();
      if(!row || row.active === false) throw new Error('Your teacher account is not active.');
      access = { ...access, classIds: Object.keys(row.classIds || {}).filter(id => id !== '*' && row.classIds[id] === true) };
    }
    teacherScope = await window.FunTorahTeacherScope.roster(async p => (await db.ref(p).once('value')).val(), access, new URLSearchParams(location.search).get('class') || '', 'rashi-letters');
    document.getElementById('scopeLabel').textContent = Object.values(teacherScope.classes).map(c => c.name).join(' + ');
    document.getElementById('lockLabel').style.display = isOwner ? '' : 'none';
    gate.style.display = 'none'; app.style.display = '';
    if(isOwner) loadLockState();
    loadDashboard();
  }catch(error){
    app.style.display = 'none'; gate.style.display = '';
    gate.textContent = error.message || 'Could not load your class.';
  }
}
window.B3SiteSettings.onAuthStateChanged((user, authorized, access) => loadTeacher(user, access || { authorized }));
</script>
</body>
</html>
