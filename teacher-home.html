<style>
/* Only what the owner's homepage does not already have. Everything else comes from home-island.css. */
#app{max-width:1190px;margin:auto}
.teacher-bar{max-width:520px;margin:6px auto 8px;padding:10px 22px;border-radius:28px;background:#fff;border:2px solid #fde68a;box-shadow:0 6px 18px rgba(234,179,8,.15);text-align:center}
.teacher-bar strong{font-family:'Fredoka',sans-serif;font-size:18px;color:#1f2a44}
.teacher-bar .sub{color:#92400e;font-weight:700;font-size:14px;margin-top:3px}
.teacher-bar p{margin:6px 0 0;font-size:14px;color:#475569}
.gate{max-width:520px;margin:24px auto;padding:26px;background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.10);color:#475569}

.sign{border:0;border-radius:11px;padding:12px 18px;background:#2563eb;color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}.sign:disabled{opacity:.6;cursor:wait}

/* The fixed lock/follow/pointer pill (teacher-global-controls.js) sits at the top centre; keep the page content clear of it. */
#homeTitle{padding-top:62px;margin-top:0}
.home-topbar{max-width:760px;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.home-topbar.hidden{display:none}
.home-topbar label{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:#1f2937;background:#fff;border-radius:999px;padding:5px 6px 5px 14px;box-shadow:0 4px 12px rgba(0,0,0,.10)}
.home-topbar select{border:1px solid #cbd5e1;border-radius:999px;padding:6px 10px;font:inherit;font-weight:800;background:#f8fafc;color:#1f2937;max-width:200px}
.home-topbar button{border:0;border-radius:999px;padding:10px 16px;background:#1f2937;color:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.home-topbar button:focus-visible,.home-topbar select:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.approvals-modal{position:fixed;inset:0;z-index:10000;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.approvals-modal.hidden{display:none}
.approvals-card{width:min(460px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.approvals-card h2{margin:0 0 4px;color:#26364a}.approvals-card p{margin:0 0 12px;color:#64748b;font-size:14px}
.approvals-card a{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:14px;margin:8px 0;text-decoration:none;color:#1f2937;font-weight:800}
.approvals-card button{margin-top:8px;border:0;border-radius:10px;padding:10px 14px;background:#26364a;color:#fff;font:inherit;font-weight:800;cursor:pointer}
@media(max-width:620px){.signout-pill{top:58px}#homeTitle{padding-top:104px}}
.class-card{margin:0 0 34px}
.class-card h2{font-family:'Fredoka',sans-serif;font-size:30px;color:#0f3b5f;text-align:center;margin:8px 0 0}
.island-intro h3{font-family:'Fredoka',sans-serif;font-size:40px;color:#0f3b5f;font-weight:700;margin:0}
@media(max-width:600px){.island-intro h3{font-size:28px}}
.empty{color:#64748b;padding:15px 0;text-align:center}
.teacher-tools-section h3{font-family:'Fredoka',sans-serif;font-size:26px;color:#9a3412;margin:0 0 6px}
.teacher-tool-card{cursor:pointer;font:inherit;color:inherit}
.teacher-tool-card.act-as-student{border:2px solid #bbf7d0;background:#f0fdf4;box-shadow:0 4px 0 #bbf7d0}
.teacher-tool-card.act-as-student .card-title{color:#166534}
.island-map>.game-group[data-game-group="learn"]{--c:#f59e0b;--soft:#fef3c7;--deep:#78350f}
.island-map>.game-group[data-game-group="roots"]{--c:#22c55e;--soft:#dcfce7;--deep:#14532d}
.island-map>.game-group[data-game-group="skills"]{--c:#ec4899;--soft:#fce7f3;--deep:#831843}
.island-map>.game-group[data-game-group="more-learning"]{--c:#6366f1;--soft:#e0e7ff;--deep:#312e81}
.island-map>.game-group[data-game-group="class"]{--c:#f97316;--soft:#ffedd5;--deep:#7c2d12}
.island-map>.game-group[data-game-group="challenge"]{--c:#0ea5e9;--soft:#e0f2fe;--deep:#0c4a6e}
.island-place[data-game-group]{grid-column:auto!important}
.teacher-tools-container{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.teacher-tools-section{max-width:1130px}
</style>

</head><body>
<button id="signOut" class="signout-pill hidden">Sign out</button>
<h1 id="homeTitle">Fun Torah Tools</h1>
<div id="homeSubtitle" class="subtitle">Learning games and practice tools</div>
<div id="homeTopBar" class="home-topbar hidden"><label for="homeClassPick">Class <select id="homeClassPick" aria-label="Choose class"></select></label><button type="button" id="homeApprovalsBtn">🔔 Approvals</button><button type="button" id="homeTeacherToolsBtn">👨‍🏫 Teacher Tools</button></div>
<div id="approvalsModal" class="approvals-modal hidden" role="dialog" aria-modal="true" aria-labelledby="approvalsTitle"><div class="approvals-card"><h2 id="approvalsTitle">🔔 Approvals</h2><p id="approvalsSub">Open the review queue for your class.</p><div id="approvalsList"></div><button type="button" id="approvalsClose">Close</button></div></div>
<div id="gate" class="gate">Checking your teacher account…</div>
<div id="app" class="hidden"><div class="teacher-bar"><strong id="who"></strong><div class="sub">Choose a class or open one of the tools enabled for it.</div><div id="principalSummary"></div></div><div id="classes" class="classes"></div></div>
<script>
(function(){
const api=window.B3SiteSettings,WS=api.workspaceId||"b3-2026";
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const db=firebase.database(),q=id=>document.getElementById(id);
const R=window.B3HomeToolRegistry;
// Everything below comes from shared/home-tool-registry.js, the same source index.html uses.
const TOOLS={};
R.groups.forEach(g=>g.tiles.forEach(t=>{if(!t.companion&&!TOOLS[t.id])TOOLS[t.id]=[t.title,t.teacherHref||t.href];}));
R.teacherTools.forEach(t=>{if(t.grant&&t.audiences.includes('teacher')&&!TOOLS[t.grant])TOOLS[t.grant]=[t.title,t.href];});
TOOLS['class-gallery']=TOOLS['class-gallery']||TOOLS.gallery;
const classLabel=(id,name)=>window.B3ClassLabel?window.B3ClassLabel(id,name):(id==='et'?'B3 ET':id==='wt'?'B3 WT':String(name||id));
window.addEventListener('b3-site-class-change',e=>{if(window.__homeSiteClassSync)window.__homeSiteClassSync(e.detail&&e.detail.classId);});
function esc(s){const d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
const previewParams=new URLSearchParams(location.search),previewTeacherId=previewParams.get('previewTeacher');
let renderGeneration=0,previewActive=false;
function previewHref(tool,classId){const p=new URLSearchParams({previewTeacher:previewTeacherId,previewType:previewParams.get('previewType')||'teacher',class:classId,tool});return 'teacher-preview-tool.html?'+p.toString();}
function showTeacherSignIn(message){
 q('app').classList.add('hidden');q('gate').classList.remove('hidden');
 q('classes').replaceChildren();q('principalSummary').replaceChildren();
 q('signOut').classList.add('hidden');
 q('gate').innerHTML='<h2>Teacher &amp; administrator sign in</h2><p id="teacherSignInStatus" role="status"></p><button type="button" class="sign" id="login">Sign in with Google</button>';
 q('teacherSignInStatus').textContent=message||'Use your authorized teacher or administrator Google account.';
 q('login').onclick=async()=>{q('login').disabled=true;q('teacherSignInStatus').textContent='Signing in…';try{await api.signInWithGoogle();}catch(error){showTeacherSignIn(error.message||'Could not sign in. Please try again.');}};
}
function setupTopBar(ids,snaps,access,user){
 const bar=q('homeTopBar'),pick=q('homeClassPick'),rows=ids.map((id,i)=>({id,row:snaps[i].val()||{},ok:snaps[i].exists()&&(snaps[i].val()||{}).active!==false})).filter(x=>x.ok);
 bar.classList[rows.length?'remove':'add']('hidden');
 const keep=pick.value;
 pick.innerHTML='<option value="">All my classes</option>'+rows.map(x=>'<option value="'+esc(x.id)+'">'+esc(classLabel(x.id,x.row.name))+'</option>').join('');
 // One class for the whole site: the class in the link, else the one chosen last, else a teacher's only class.
 const SC=window.B3SiteClass,uid=previewActive?'':(user?.uid||''),saved=SC&&uid?SC.get(uid):'',linked=previewActive?'':(previewParams.get('class')||'');
 const remember=id=>{if(SC&&uid){SC.set(uid,id||'all');try{window.dispatchEvent(new CustomEvent('b3-site-class-change',{detail:{classId:id||'all'}}));}catch(e){}}};
 if(rows.some(x=>x.id===linked)){pick.value=linked;remember(linked);}
 else if(rows.some(x=>x.id===keep))pick.value=keep;
 else if(rows.some(x=>x.id===saved))pick.value=saved;
 else if(saved==='all')pick.value='';
 else if(rows.length===1){pick.value=rows[0].id;remember(rows[0].id);}
 const cards=document.querySelectorAll?[...document.querySelectorAll('#classes .class-card')]:[];
 const apply=()=>cards.forEach((c,i)=>{const id=rows[i]?.id;if(c.style)c.style.display=!pick.value||id===pick.value?'':'none';});
 pick.onchange=()=>{apply();remember(pick.value);};apply();
 window.__homeSiteClassSync=id=>{const v=id==='all'?'':id;if([...pick.options].some(o=>o.value===v)){pick.value=v;apply();}};
 const current=()=>rows.find(x=>x.id===pick.value)||rows[0];
 q('homeTeacherToolsBtn').onclick=()=>{const idx=rows.indexOf(current());const sec=cards[idx]?.querySelector('.teacher-tools-section');if(sec)sec.scrollIntoView({behavior:'smooth',block:'start'});};
 q('homeApprovalsBtn').onclick=()=>{
  const cur=current();if(!cur)return;
  const grants=cur.row.toolGrants||{};
  const links=R.approvalLinks.filter(l=>grants[l.grant]===true);
  q('approvalsSub').textContent='Review queues for '+classLabel(cur.id,cur.row.name)+'.';
  q('approvalsList').innerHTML=links.length?links.map(l=>'<a href="'+esc(previewActive?'#':R.withClass(l.href,cur.id))+'"><span aria-hidden="true">'+l.icon+'</span>'+esc(l.title)+'</a>').join(''):'<p>No review queues are enabled for this class.</p>';
  q('approvalsModal').classList.remove('hidden');
 };
 q('approvalsClose').onclick=()=>q('approvalsModal').classList.add('hidden');
 q('approvalsModal').onclick=e=>{if(e.target===q('approvalsModal'))q('approvalsModal').classList.add('hidden');};
}
async function render(user,access){
 const generation=++renderGeneration;
 if(previewTeacherId){
   q('signOut').classList.add('hidden');
   if(!access?.authorized||access.role!=='admin'){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent='Only the owner can preview another teacher.';return;}
   try{
     const choices=await B3TeacherPreview.list(db,WS,access,user?.uid);
     if(generation!==renderGeneration)return;
     const teacher=choices.find(t=>t.id===previewTeacherId&&t.type===(previewParams.get('previewType')||'teacher'));
     if(!teacher)throw new Error('This teacher is no longer active or available.');
     previewActive=true;user={email:teacher.name};access={authorized:true,role:'teacher',classIds:teacher.classIds};
   }catch(error){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent=error.message;return;}
 }
 if(access?.actingAsStudent){q("app").classList.add("hidden");q("gate").classList.remove("hidden");q("gate").textContent="You are viewing Fun Torah Tools as "+access.actingAsStudent.name+". Press “Exit student view” at the bottom to return to your teacher account.";return}
 if(!access?.authorized){showTeacherSignIn(user?'This Google account is not assigned as a Fun Torah Tools teacher. Choose your authorized account.':'');return}
 if(access.role==="admin"){
   if(previewParams.get('manageStudentTools')!=='1'){location.replace("index.html");return}
   const allClasses=(await db.ref("b3Games/workspaces/"+WS+"/classes").once("value")).val()||{};
   if(generation!==renderGeneration)return;
   access={...access,classIds:Object.keys(allClasses).filter(id=>allClasses[id]&&allClasses[id].active!==false)};
 }
 const principal=access.accountType==="principal"&&!previewActive;
 q("homeTitle").textContent=principal?"Principal Center":"Fun Torah Tools";
 q("homeSubtitle").textContent=principal?"Teachers, supervised classes and learning tools":"Your classes and teaching tools";
 const supervised=principal?Object.values(access.supervisedTeachers||{}):[];
 q("principalSummary").innerHTML=principal?'<p><b>Supervised teachers:</b> '+(supervised.map(t=>esc(t.name)).join(", ")||"No teachers assigned")+'</p><p class="sub" style="color:#64748b">You have teacher-level access to your supervised classes. Adding staff and changing platform-wide settings remain owner-only.</p>':"";
 q("gate").classList.add("hidden");q("app").classList.remove("hidden");q("signOut").classList.remove("hidden");q("who").textContent=user?.email||"Teacher";
 if(access.claimPending){const pending=document.createElement("p");pending.textContent="Your invitation is recognized. The owner still needs to deploy teacher account linking before class changes can be saved.";q("who").parentElement.appendChild(pending);}
 const ids=access.classIds||[],snaps=await Promise.all(ids.map(id=>db.ref("b3Games/workspaces/"+WS+"/classes/"+id).once("value"))),siteSettings=access.role!=="admin"&&ids.some(id=>id==="et"||id==="wt")?(await db.ref("b3Games/siteSettings").once("value")).val()||{}:{};
 if(generation!==renderGeneration)return;
 q("classes").innerHTML=snaps.map((s,i)=>{
 const id=ids[i],row=s.val()||{};
 if(!s.exists()||row.active===false)return "";
 const grants=row.toolGrants||{},enabled=Object.entries(grants).filter(x=>x[1]===true&&TOOLS[x[0]]);
 if(["et","wt"].includes(id)&&siteSettings.games?.["multiplayer-center"]!==false&&siteSettings.classGames?.[id]?.["multiplayer-center"]!==false&&!enabled.some(x=>x[0]==="multiplayer-center"))enabled.push(["multiplayer-center",true]);
 if(grants["student-rewards"]===true&&!enabled.some(([tool])=>tool==="daily-points"))enabled.push(["daily-points",true]);
 const cls=encodeURIComponent(id),on=new Set(enabled.map(x=>x[0])),isOn=tool=>on.has(tool);
 const places=R.renderMap({audience:"teacher",isOn,hrefFor:t=>previewActive?previewHref(t.id,id):R.withClass(t.teacherHref||t.href,id)});
 const teacherCards=R.renderTeacherTools({audience:"teacher",classId:id,isOn,preview:previewActive,previewHref:tool=>previewHref(tool,id)});
 const teacherBox='<div class="teacher-tools-section"><h3>👨‍🏫 Teacher Tools</h3><p class="teacher-tools-subtitle">For you and this class</p><div class="teacher-tools-container">'+teacherCards+'</div></div>';
 return '<section class="class-card"><h2>'+esc(classLabel(id,row.name))+'</h2>'+(principal?'<p class="sub">Teacher: '+(supervised.filter(t=>t.classIds?.[id]===true).map(t=>esc(t.name)).join(", ")||"Assigned teacher")+'</p>':"")+' <div class="island-intro"><div><h3>Welcome to Learning Island!</h3><p>Choose a place to explore.</p></div></div><div class="game-container island-map" aria-label="Learning Island destinations">'+(places||'<div class="empty">No tools have been enabled for this class yet.</div>')+'</div>'+teacherBox+(!previewActive&&window.B3StudentToolControls?window.B3StudentToolControls.render(id,row,TOOLS,access.role==='admin'&&['et','wt'].includes(id)):'')+'</section>';
 }).join("")||'<div class="gate">No classes are assigned to this teacher yet.</div>';
 if(!previewActive&&window.B3StudentToolControls)window.B3StudentToolControls.bind(q("classes"));
 setupTopBar(ids,snaps,access,user);
 if(previewActive){
   q('signOut').classList.add('hidden');
   q('who').textContent='Viewing as '+user.email;
   const welcome=q('who').parentElement;
   welcome.querySelector('.sub').textContent='Explore the teacher’s assigned classes and tools in read-only view. You remain signed in as the owner.';
   if(!q('exitTeacherPreview')){const exit=document.createElement('a');exit.id='exitTeacherPreview';exit.href='admin.html?v=20261008-teacher-preview';exit.className='sign';exit.textContent='Exit teacher view';exit.style.cssText='display:inline-block;margin-top:14px;color:#fff';welcome.append(exit);}
 }
}
q("classes").onclick=e=>{if(e.target.closest&&e.target.closest("[data-act-as-student]"))api.openActAsStudentPicker();};
q("signOut").onclick=()=>api.signOut().then(()=>location.reload());
let principalAccessRef=null,principalAccessHandler=null;
function stopPrincipalAccessWatch(){
 if(principalAccessRef&&principalAccessHandler)principalAccessRef.off("value",principalAccessHandler);
 principalAccessRef=null;principalAccessHandler=null;
}
function watchPrincipalAccess(user,access){
 stopPrincipalAccessWatch();
 if(!user?.uid||access?.accountType!=="principal"||previewTeacherId)return;
 const ref=db.ref("b3Games/workspaces/"+WS+"/teachers/"+user.uid);
 const handle=snapshot=>{
  if(principalAccessRef!==ref)return;
  render(user,window.B3PrincipalScope.accessFromPrincipalRecord(snapshot.val()));
 };
 const failed=()=>{
  if(principalAccessRef!==ref)return;
  q("classes").replaceChildren();q("principalSummary").replaceChildren();
  q("signOut").classList.add("hidden");
  q("app").classList.add("hidden");q("gate").classList.remove("hidden");
  q("gate").textContent="Supervised class access could not be refreshed. Sign in again to continue.";
 };
 principalAccessRef=ref;principalAccessHandler=handle;
 ref.on("value",handle,failed);
}
window.addEventListener("pagehide",stopPrincipalAccessWatch,{once:true});
api.onAuthStateChanged((user,authorized,access)=>{
 const resolved=access||{authorized};
 const done=render(user,resolved);
 watchPrincipalAccess(user,resolved);
 return done;
});
})();
</script><script src="back-nav.js" data-mode="inline" data-href="index.html" data-label="← Fun Torah Tools"></script></body></html>
