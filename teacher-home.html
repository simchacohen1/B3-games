<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fun Torah Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Rashi+Hebrew:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1f2937}header{background:#172033;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:26px}.sub{color:#b9c6da;font-size:13px;margin-top:5px}button,a{font:inherit}.sign{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:#334155;color:#fff}.wrap{max-width:1000px;margin:28px auto;padding:0 18px}.welcome{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 5px 18px rgba(15,23,42,.06);margin-bottom:18px}.classes{display:grid;gap:18px}.class-card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px}.class-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.manage{background:#2563eb;color:#fff;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:800}.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}.tool{flex-direction:column;gap:9px;display:flex;align-items:center;justify-content:center;min-height:125px;padding:24px 12px;border:1px solid #dbe3ee;border-radius:14px;text-decoration:none;color:#1f2937;background:#fff;font-size:17px;font-weight:bold;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.1)}.tool-icon{display:block;font-size:40px;line-height:1}.tool-icon img{width:74px;height:74px;object-fit:contain}.tool-icon.rashi{font-family:"Noto Rashi Hebrew",serif;font-size:44px;font-weight:600;direction:rtl}.tool:hover{background:#eef2ff}.empty{color:#64748b;padding:15px 0}.gate{text-align:center;padding:70px 20px}.hidden{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script><script src="firebase-config.js?v=20261001-teacherauth"></script><script src="site-settings.js?v=20261001-teacherauth"></script>
</head><body>
<header><div><h1>Fun Torah Tools</h1><div class="sub">Your classes and teaching tools</div></div><button id="signOut" class="sign hidden">Sign out</button></header>
<div class="wrap"><div id="gate" class="gate">Checking your teacher account…</div><div id="app" class="hidden"><div class="welcome"><strong id="who"></strong><div class="sub" style="color:#64748b">Choose a class or open one of the tools enabled for it.</div></div><div id="classes" class="classes"></div></div></div>
<script>
(function(){
const api=window.B3SiteSettings,WS=api.workspaceId||"b3-2026";
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const db=firebase.database(),q=id=>document.getElementById(id);
const TOOLS={
"yiddish":["Yiddish","yiddish/teacher.html"],"posuk-practice-scroll":["Posuk Practice","record_pesukim/teacher.html"],"rashi-letters":["Rashi Letters","rashi-letters/teacher.html"],"shorashim":["Shorashim","shorashim/teacher.html?v=20260917-correct-dashboard"],"chazara":["Chazara","chazara/teacher.html"],"game-show":["Game Show","game-show/teacher.html"],"student-rewards":["Student Rewards","student-rewards/teacher.html"],"weekly-quiz":["Weekly Quiz","weekly-quiz/teacher.html"],"gallery":["Gallery","class-gallery/index.html"],"tag":["Tag Game","class-gallery/index.html"],
"davening":["Davening Player","davening_student_app/index.html"],"class-pointer":["Class Pointer","class-pointer-prototype/classroom.html"],"name-picker":["Name Picker","name-picker/index.html"],"chavrusa":["Chavrusa of the Day","chavrusa/index.html"]
};
const ICONS={'yiddish':'<img src="assets/yiddish-icon-v2.png" alt="">','posuk-practice-scroll':'📜','rashi-letters':'אב','shorashim':'🌳','chazara':'🔁','game-show':'🏆','student-rewards':'🌟','weekly-quiz':'📝','gallery':'🖼️','class-gallery':'🖼️','tag':'🏃','davening':'📖','chumash-quiz':'❓','work-timer':'⏱️','class-slides':'🖥️','class-pointer':'👆','name-picker':'🎡','chavrusa':'👥'};
TOOLS['class-gallery']=TOOLS.gallery;
function esc(s){const d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
let renderGeneration=0;
async function render(user,access){
 const generation=++renderGeneration;
 if(!access?.authorized){q("app").classList.add("hidden");q("gate").classList.remove("hidden");q("gate").innerHTML='This Google account is not assigned as a Fun Torah Tools teacher. <br><button class="sign" id="login" style="margin-top:14px">Sign in with Google</button>';q("login").onclick=()=>api.signInWithGoogle();return}
 if(access.role==="admin"){location.replace("index.html");return}
 q("gate").classList.add("hidden");q("app").classList.remove("hidden");q("signOut").classList.remove("hidden");q("who").textContent=user?.email||"Teacher";
 if(access.claimPending){const pending=document.createElement("p");pending.textContent="Your invitation is recognized. The owner still needs to deploy teacher account linking before class changes can be saved.";q("who").parentElement.appendChild(pending);}
 const ids=access.classIds||[],snaps=await Promise.all(ids.map(id=>db.ref("b3Games/workspaces/"+WS+"/classes/"+id).once("value")));
 if(generation!==renderGeneration)return;
 q("classes").innerHTML=snaps.map((s,i)=>{const id=ids[i],row=s.val()||{},grants=row.toolGrants||{},tools=Object.entries(grants).filter(x=>x[1]===true&&TOOLS[x[0]]).map(([tool])=>'<a class="tool" href="'+TOOLS[tool][1]+(TOOLS[tool][1].includes("?")?"&":"?")+"class="+encodeURIComponent(id)+'" target="_blank" rel="noopener"><span class="tool-icon '+(tool==='rashi-letters'?'rashi':'')+'" aria-hidden="true">'+(ICONS[tool]||'📚')+'</span><span>'+esc(TOOLS[tool][0])+'</span></a>').join("");
 if(!s.exists()||row.active===false)return "";
 return '<section class="class-card"><div class="class-head"><h2>'+esc(row.name||id)+'</h2><a class="manage" href="admin.html?tab=students&class='+encodeURIComponent(id)+'">Manage Class</a></div><div class="tools">'+(tools||'<div class="empty">No tools have been enabled for this class yet.</div>')+'</div></section>'
 }).join("")||'<div class="welcome">No classes are assigned to this teacher yet.</div>';
}
q("signOut").onclick=()=>api.signOut().then(()=>location.reload());
api.onAuthStateChanged((user,authorized,access)=>render(user,access||{authorized}));
})();
</script></body></html>
