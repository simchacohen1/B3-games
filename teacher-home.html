<button id="signOut" class="signout-pill hidden">Sign out</button>
<h1 id="homeTitle">Fun Torah Tools</h1>
<div id="homeSubtitle" class="subtitle">Learning games and practice tools</div>
<div id="gate" class="gate">Checking your teacher account…</div>
<div id="app" class="hidden"><div class="teacher-bar"><strong id="who"></strong><div class="sub">Choose a class or open one of the tools enabled for it.</div><div id="principalSummary"></div><nav id="classJump" class="class-jump" aria-label="Your assigned classes"></nav></div><div id="classes" class="classes"></div></div>
<script>
(function(){
const api=window.B3SiteSettings,WS=api.workspaceId||"b3-2026";
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const db=firebase.database(),q=id=>document.getElementById(id);
const REGISTRY=window.B3HomeToolRegistry,TOOLS=Object.fromEntries(Object.entries(REGISTRY.tools).map(([id,t])=>[id,[t.title,t.href]]));
const STUDENT_TOOLS={'sefer-hamitzvos':'sefer-hamitzvos/index.html',yiddish:'yiddish/index.html','posuk-practice-scroll':'record_pesukim/student.html','rashi-letters':'rashi-letters/student.html',gematria:'gematria/index.html',shorashim:'shorashim/index.html',chazara:'chazara/index.html','game-show':'game-show/player.html','student-rewards':'student-rewards/student.html','daily-points':'student-rewards/student.html','weekly-quiz':'weekly-quiz/index.html',halacha:'halacha/index.html?teacher=1','mishnayos-practice':'mishnayos/student.html'};
const ICONS={'sefer-hamitzvos':'📖','halacha':'📔','yiddish':'<img src="assets/yiddish-icon-v2.png" alt="">','posuk-practice-scroll':'📜','rashi-letters':'אב','gematria':'🔢','shorashim':'🌳','chazara':'🔁','game-show':'🏆','student-rewards':'🌟','daily-points':'✅','weekly-quiz':'📝','homework':'📚','multiplayer-center':'🎮','gallery':'🖼️','class-gallery':'🖼️','tag':'🏃','davening':'📖','chumash-quiz':'❓','work-timer':'⏱️','class-slides':'🖥️','class-pointer':'👆','name-picker':'🎡','chavrusa':'👥','mishnayos-practice':'🕍'};
TOOLS['class-gallery']=TOOLS.gallery;
const PLACES=REGISTRY.groups.map(g=>[g.id,g.icon,g.title,g.subtitle,g.tools,g.id==="learn"?" island-main":g.id==="roots"?" island-main island-roots":"" ]);
function esc(s){const d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
const previewParams=new URLSearchParams(location.search),previewTeacherId=previewParams.get('previewTeacher');
let renderGeneration=0,previewActive=false;
function previewHref(tool,classId){const p=new URLSearchParams({previewTeacher:previewTeacherId,previewType:previewParams.get('previewType')||'teacher',class:classId,tool});return 'teacher-preview-tool.html?'+p.toString();}
function showTeacherSignIn(message){
 q('app').classList.add('hidden');q('gate').classList.remove('hidden');
 q('classes').replaceChildren();q('principalSummary').replaceChildren();
 q('signOut').classList.add('hidden');
 q('gate').innerHTML='<h2>Teacher &amp; administrator sign in</h2><p id="teacherSignInStatus" role="status"></p><button type="button" class="sign" id="login">Sign in with Google</button>';
 q('teacherSignInStatus').textContent=message||'Use your authorized teacher or administrator Google account.';
 q('login').onclick=async()=>{q('login').disabled=true;q('teacherSignInStatus').textContent='Signing in…';try{await api.signInWithGoogle();}catch(error){showTeacherSignIn(error.message||'Could not sign in. Please try again.');}};
}
async function render(user,access){
 const generation=++renderGeneration;
 if(previewTeacherId){
   q('signOut').classList.add('hidden');
   if(!access?.authorized||access.role!=='admin'){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent='Only the owner can preview another teacher.';return;}
   try{
     const choices=await B3TeacherPreview.list(db,WS,access,user?.uid);
     if(generation!==renderGeneration)return;
     const teacher=choices.find(t=>t.id===previewTeacherId&&t.type===(previewParams.get('previewType')||'teacher'));
     if(!teacher)throw new Error('This teacher is no longer active or available.');
     previewActive=true;user={email:teacher.name};access={authorized:true,role:'teacher',classIds:teacher.classIds};
   }catch(error){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent=error.message;return;}
 }
 if(access?.actingAsStudent){q("app").classList.add("hidden");q("gate").classList.remove("hidden");q("gate").textContent="You are viewing Fun Torah Tools as "+access.actingAsStudent.name+". Press “Exit student view” at the bottom to return to your teacher account.";return}
 if(!access?.authorized){showTeacherSignIn(user?'This Google account is not assigned as a Fun Torah Tools teacher. Choose your authorized account.':'');return}
 if(access.role==="admin"){
   if(previewParams.get('manageStudentTools')!=='1'){location.replace("index.html");return}
   const allClasses=(await db.ref("b3Games/workspaces/"+WS+"/classes").once("value")).val()||{};
   if(generation!==renderGeneration)return;
   access={...access,classIds:Object.keys(allClasses).filter(id=>allClasses[id]&&allClasses[id].active!==false)};
 }
 const principal=access.accountType==="principal"&&!previewActive;
 q("homeTitle").textContent=principal?"Principal Center":"Fun Torah Tools";
 q("homeSubtitle").textContent=principal?"Teachers, supervised classes and learning tools":"Your classes and teaching tools";
 const supervised=principal?Object.values(access.supervisedTeachers||{}):[];
 q("principalSummary").innerHTML=principal?'<p><b>Supervised teachers:</b> '+(supervised.map(t=>esc(t.name)).join(", ")||"No teachers assigned")+'</p><p class="sub" style="color:#64748b">You have teacher-level access to your supervised classes. Adding staff and changing platform-wide settings remain owner-only.</p>':"";
 q("gate").classList.add("hidden");q("app").classList.remove("hidden");q("signOut").classList.remove("hidden");q("who").textContent=user?.email||"Teacher";
 if(access.claimPending){const pending=document.createElement("p");pending.textContent="Your invitation is recognized. The owner still needs to deploy teacher account linking before class changes can be saved.";q("who").parentElement.appendChild(pending);}
 const ids=access.classIds||[],snaps=await Promise.all(ids.map(id=>db.ref("b3Games/workspaces/"+WS+"/classes/"+id).once("value"))),siteSettings=access.role!=="admin"&&ids.some(id=>id==="et"||id==="wt")?(await db.ref("b3Games/siteSettings").once("value")).val()||{}:{};
 if(generation!==renderGeneration)return;
 q("classes").innerHTML=snaps.map((s,i)=>{
 const id=ids[i],row=s.val()||{};
 if(!s.exists()||row.active===false)return "";
 const grants=row.toolGrants||{},enabled=Object.entries(grants).filter(x=>x[1]===true&&TOOLS[x[0]]&&(!REGISTRY.tools[x[0]].supportedClasses||REGISTRY.tools[x[0]].supportedClasses.includes(id)));
 if(["et","wt"].includes(id)&&siteSettings.games?.["multiplayer-center"]!==false&&siteSettings.classGames?.[id]?.["multiplayer-center"]!==false&&!enabled.some(x=>x[0]==="multiplayer-center"))enabled.push(["multiplayer-center",true]);
 if(grants["student-rewards"]===true&&!enabled.some(([tool])=>tool==="daily-points"))enabled.push(["daily-points",true]);
 const cls=encodeURIComponent(id),link=tool=>{const definition=REGISTRY.tools[tool],base=definition.classHrefs?.[id]||TOOLS[tool][1];return previewActive?previewHref(tool,id):base+(base.includes('?')?'&':'?')+'class='+cls;};
 const iconFor=tool=>{const value=REGISTRY.tools[tool]?.icon||ICONS[tool]||'';if(value.endsWith('.png'))return '<img class="yiddish-icon tool-icon" src="'+value+'" alt="">';return tool==='rashi-letters'?'<span class="card-icon tool-icon rashi-icon" lang="he" dir="rtl" aria-hidden="true">'+value+'</span>':'<span class="card-icon tool-icon" aria-hidden="true">'+value+'</span>';};
 const tileFor=(kind,[tool])=>'<a class="'+kind+'" data-game-id="'+tool+'" href="'+link(tool)+'" rel="noopener">'+iconFor(tool)+'<span class="card-title">'+esc(TOOLS[tool][0])+'</span></a>';
 const actionTile=(action)=>{
   if(action.classGrant&&grants[action.classGrant]!==true)return "";
   if(previewActive&&action.preview===false)return "";
   if(action.kind==="button"){
     return previewActive?"":'<button type="button" class="teacher-tool-card act-as-student" data-act-as-student><span class="card-icon" aria-hidden="true">'+action.icon+'</span><span class="card-title">'+esc(action.title)+'</span></button>';
   }
   const href=previewActive?previewHref(action.id,id):action.href+(action.classParam?(action.href.includes('?')?'&':'?')+'class='+cls:'');
   return '<a class="teacher-tool-card" href="'+href+'"'+(action.newTab?' target="_blank" rel="noopener"':'')+'><span class="card-icon" aria-hidden="true">'+action.icon+'</span><span class="card-title">'+esc(action.title)+'</span></a>';
 };
 const placed=new Set(),places=PLACES.map(([key,icon,title,sub,toolIds,extra])=>{const mine=enabled.filter(x=>toolIds.includes(x[0]));mine.forEach(x=>placed.add(x[0]));const cards=mine.map(x=>tileFor('game-card',x)+(REGISTRY.tools[x[0]].companions||[]).map(c=>{const href=c.teacherHref||c.href;return '<a class="game-card" data-game-id="'+x[0]+'" data-companion-of="'+x[0]+'" href="'+href+(href.includes('?')?'&':'?')+'class='+cls+'"><span class="card-icon">'+c.icon+'</span><span class="card-title">'+esc(c.title)+'</span></a>';}).join(''));return mine.length?'<section class="game-group island-place'+extra+'" data-game-group="'+key+'"><div class="game-group-head"><span class="game-group-icon" aria-hidden="true">'+icon+'</span><div><div class="game-group-title">'+title+'</div><div class="game-group-subtitle">'+sub+'</div></div></div><div class="game-group-grid">'+cards.join("")+'</div></section>':"";}).join("");
 const teacherOnly=enabled.filter(x=>!placed.has(x[0]));
 const teacherCards=REGISTRY.teacherActions.map(actionTile).join("")+teacherOnly.map(x=>tileFor('teacher-tool-card',x)).join("");
 const teacherBox='<div class="teacher-tools-section"><h3>👨‍🏫 Teacher Tools</h3><p class="teacher-tools-subtitle">For you and this class</p><div class="teacher-tools-container">'+teacherCards+'</div></div>';
 return '<section class="class-card" id="class-card-'+encodeURIComponent(id)+'"><h2>'+esc(row.name||id)+'</h2>'+(principal?'<p class="sub">Teacher: '+(supervised.filter(t=>t.classIds?.[id]===true).map(t=>esc(t.name)).join(", ")||"Assigned teacher")+'</p>':"")+' <div class="island-intro"><div><h3>Welcome to Learning Island!</h3><p>Choose a place to explore.</p></div></div><div class="game-container island-map" aria-label="Learning Island destinations">'+(places||'<div class="empty">No tools have been enabled for this class yet.</div>')+'</div>'+teacherBox+(!previewActive&&window.B3StudentToolControls?window.B3StudentToolControls.render(id,row,TOOLS,access.role==='admin'&&['et','wt'].includes(id)):'')+'</section>';
 }).join("")||'<div class="gate">No classes are assigned to this teacher yet.</div>';
 const classCards=Array.from(q('classes').querySelectorAll('.class-card'));
 q('classJump').innerHTML=classCards.length>1?classCards.map(card=>'<button type="button" data-class-target="'+card.id+'">'+esc(card.querySelector('h2')?.textContent||'Class')+'</button>').join(''):'';
 q('classJump').style.display=classCards.length>1?'flex':'none';
 if(!previewActive&&window.B3StudentToolControls)window.B3StudentToolControls.bind(q("classes"));
 if(previewActive){
   q('signOut').classList.add('hidden');
   q('who').textContent='Viewing as '+user.email;
   const welcome=q('who').parentElement;
   welcome.querySelector('.sub').textContent='Explore the teacher’s assigned classes and tools in read-only view. You remain signed in as the owner.';
   if(!q('exitTeacherPreview')){const exit=document.createElement('a');exit.id='exitTeacherPreview';exit.href='admin.html?v=20261008-teacher-preview';exit.className='sign';exit.textContent='Exit teacher view';exit.style.cssText='display:inline-block;margin-top:14px;color:#fff';welcome.append(exit);}
 }
}
q("classes").onclick=e=>{if(e.target.closest&&e.target.closest("[data-act-as-student]"))api.openActAsStudentPicker();};
q('classJump').onclick=e=>{const button=e.target.closest&&e.target.closest('[data-class-target]');if(!button)return;document.getElementById(button.dataset.classTarget)?.scrollIntoView({behavior:'smooth',block:'start'});};
q("signOut").onclick=()=>api.signOut().then(()=>location.reload());
let principalAccessRef=null,principalAccessHandler=null;
function stopPrincipalAccessWatch(){
 if(principalAccessRef&&principalAccessHandler)principalAccessRef.off("value",principalAccessHandler);
 principalAccessRef=null;principalAccessHandler=null;
}
function watchPrincipalAccess(user,access){
 stopPrincipalAccessWatch();
 if(!user?.uid||access?.accountType!=="principal"||previewTeacherId)return;
 const ref=db.ref("b3Games/workspaces/"+WS+"/teachers/"+user.uid);
 const handle=snapshot=>{
  if(principalAccessRef!==ref)return;
  render(user,window.B3PrincipalScope.accessFromPrincipalRecord(snapshot.val()));
 };
 const failed=()=>{
  if(principalAccessRef!==ref)return;
  q("classes").replaceChildren();q("principalSummary").replaceChildren();
  q("signOut").classList.add("hidden");
  q("app").classList.add("hidden");q("gate").classList.remove("hidden");
  q("gate").textContent="Supervised class access could not be refreshed. Sign in again to continue.";
 };
 principalAccessRef=ref;principalAccessHandler=handle;
 ref.on("value",handle,failed);
}
window.addEventListener("pagehide",stopPrincipalAccessWatch,{once:true});
api.onAuthStateChanged((user,authorized,access)=>{
 const resolved=access||{authorized};
 const done=render(user,resolved);
 watchPrincipalAccess(user,resolved);
 return done;
});
})();
</script><script src="back-nav.js" data-mode="inline" data-href="index.html" data-label="← Fun Torah Tools"></script></body></html>
