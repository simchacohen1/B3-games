TOOLS['class-gallery']=TOOLS.gallery;
const PLACES=[
["learn",'<svg viewBox="0 0 64 64" width="52" height="52" role="img" aria-label="Rebbe"><path d="M9 64c0-13 10-20 23-20s23 7 23 20z" fill="#1f2937"/><path d="M26 44l6 13 6-13z" fill="#fff"/><ellipse cx="32" cy="29" rx="11" ry="12" fill="#f3c79d"/><path d="M20.5 28c0 15 5 25 11.5 25s11.5-10 11.5-25c-2 6-6 9-11.5 9s-9.5-3-11.5-9z" fill="#4a3426"/><path d="M27 36.5c2-1.6 3.5-1.6 5-.6 1.5-1 3-1 5 .6-2 .8-3.5 1-5 .4-1.5.6-3 .4-5-.4z" fill="#4a3426"/><circle cx="28" cy="28" r="1.5" fill="#1f2937"/><circle cx="36" cy="28" r="1.5" fill="#1f2937"/><path d="M25.5 24.5q2.5-1.5 5 0M33.5 24.5q2.5-1.5 5 0" stroke="#4a3426" stroke-width="1.3" fill="none" stroke-linecap="round"/><ellipse cx="32" cy="19" rx="18" ry="3.6" fill="#111827"/><path d="M21.5 19c0-8 3-12.5 10.5-12.5S42.5 11 42.5 19z" fill="#111827"/><path d="M21.8 15.5h20.4v3H21.8z" fill="#374151"/><path d="M32 7.5v4" stroke="#374151" stroke-width="1.4" stroke-linecap="round"/></svg>',"Chumash Cheder","Learn your posuk, then review it",["posuk-practice-scroll","chazara"]," island-main"],
["roots","🌳","Shorashim Grove","Grow your Hebrew word skills",["shorashim"]," island-main island-roots"],
["skills","📚","Skills Library","Rashi letters, Yiddish, and Gematria",["rashi-letters","yiddish","gematria"],""],
["more-learning","🕍","Learning Beis Midrash","Halacha and Sefer HaMitzvos",["halacha","sefer-hamitzvos"],""],
["class","🏡","Class Village","Your gallery and rewards",["gallery","class-gallery","student-rewards","daily-points","tag"],""],
["challenge","🏆","Challenge Playground","Quiz yourself or play a game",["weekly-quiz","game-show","multiplayer-center"],""]
];
function esc(s){const d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
const previewParams=new URLSearchParams(location.search),previewTeacherId=previewParams.get('previewTeacher');
let renderGeneration=0,previewActive=false;
function previewHref(tool,classId){const p=new URLSearchParams({previewTeacher:previewTeacherId,previewType:previewParams.get('previewType')||'teacher',class:classId,tool});return 'teacher-preview-tool.html?'+p.toString();}
function showTeacherSignIn(message){
 q('app').classList.add('hidden');q('gate').classList.remove('hidden');
 q('gate').innerHTML='<h2>Teacher &amp; administrator sign in</h2><p id="teacherSignInStatus" role="status"></p><button type="button" class="sign" id="login">Sign in with Google</button>';
 q('teacherSignInStatus').textContent=message||'Use your authorized teacher or administrator Google account.';
 q('login').onclick=async()=>{q('login').disabled=true;q('teacherSignInStatus').textContent='Signing in…';try{await api.signInWithGoogle();}catch(error){showTeacherSignIn(error.message||'Could not sign in. Please try again.');}};
}
async function render(user,access){
 const generation=++renderGeneration;
 if(previewTeacherId){
   q('signOut').classList.add('hidden');
   if(!access?.authorized||access.role!=='admin'){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent='Only the owner can preview another teacher.';return;}
   try{
     const choices=await B3TeacherPreview.list(db,WS,access,user?.uid);
     if(generation!==renderGeneration)return;
     const teacher=choices.find(t=>t.id===previewTeacherId&&t.type===(previewParams.get('previewType')||'teacher'));
     if(!teacher)throw new Error('This teacher is no longer active or available.');
     previewActive=true;user={email:teacher.name};access={authorized:true,role:'teacher',classIds:teacher.classIds};
   }catch(error){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent=error.message;return;}
 }
 if(access?.actingAsStudent){q("app").classList.add("hidden");q("gate").classList.remove("hidden");q("gate").textContent="You are viewing Fun Torah Tools as "+access.actingAsStudent.name+". Press “Exit student view” at the bottom to return to your teacher account.";return}
 if(!access?.authorized){showTeacherSignIn(user?'This Google account is not assigned as a Fun Torah Tools teacher. Choose your authorized account.':'');return}
 if(access.role==="admin"){
   if(previewParams.get('manageStudentTools')!=='1'){location.replace("index.html");return}
   const allClasses=(await db.ref("b3Games/workspaces/"+WS+"/classes").once("value")).val()||{};
   if(generation!==renderGeneration)return;
   access={...access,classIds:Object.keys(allClasses).filter(id=>allClasses[id]&&allClasses[id].active!==false)};
 }
 q("gate").classList.add("hidden");q("app").classList.remove("hidden");q("signOut").classList.remove("hidden");q("who").textContent=user?.email||"Teacher";
 if(access.claimPending){const pending=document.createElement("p");pending.textContent="Your invitation is recognized. The owner still needs to deploy teacher account linking before class changes can be saved.";q("who").parentElement.appendChild(pending);}
 const ids=access.classIds||[],snaps=await Promise.all(ids.map(id=>db.ref("b3Games/workspaces/"+WS+"/classes/"+id).once("value"))),siteSettings=access.role!=="admin"&&ids.some(id=>id==="et"||id==="wt")?(await db.ref("b3Games/siteSettings").once("value")).val()||{}:{};
 if(generation!==renderGeneration)return;
 q("classes").innerHTML=snaps.map((s,i)=>{
 const id=ids[i],row=s.val()||{};
 if(!s.exists()||row.active===false)return "";
 const grants=row.toolGrants||{},enabled=Object.entries(grants).filter(x=>x[1]===true&&TOOLS[x[0]]);
 if(["et","wt"].includes(id)&&siteSettings.games?.["multiplayer-center"]!==false&&siteSettings.classGames?.[id]?.["multiplayer-center"]!==false&&!enabled.some(x=>x[0]==="multiplayer-center"))enabled.push(["multiplayer-center",true]);
 if(grants["student-rewards"]===true&&!enabled.some(([tool])=>tool==="daily-points"))enabled.push(["daily-points",true]);
 const cls=encodeURIComponent(id),link=tool=>previewActive?previewHref(tool,id):TOOLS[tool][1]+(TOOLS[tool][1].includes('?')?'&':'?')+'class='+cls;
 const iconFor=tool=>{const icon=ICONS[tool]||'';if(icon.startsWith('<img'))return icon.replace('<img ','<img class="yiddish-icon tool-icon" ');return tool==='rashi-letters'?'<span class="card-icon tool-icon rashi-icon" lang="he" dir="rtl" aria-hidden="true">'+icon+'</span>':'<span class="card-icon tool-icon" aria-hidden="true">'+icon+'</span>';};
 const tileFor=(kind,[tool])=>'<a class="'+kind+'" data-game-id="'+tool+'" href="'+link(tool)+'" rel="noopener">'+iconFor(tool)+'<span class="card-title">'+esc(TOOLS[tool][0])+'</span></a>';
 const actionTile=(icon,label,href,extra)=>'<a class="teacher-tool-card" href="'+href+'"'+(extra||'')+'><span class="card-icon" aria-hidden="true">'+icon+'</span><span class="card-title">'+label+'</span></a>';
 const placed=new Set(),places=PLACES.map(([key,icon,title,sub,toolIds,extra])=>{const mine=enabled.filter(x=>toolIds.includes(x[0]));mine.forEach(x=>placed.add(x[0]));return mine.length?'<section class="game-group island-place'+extra+'" data-game-group="'+key+'"><div class="game-group-head"><span class="game-group-icon" aria-hidden="true">'+icon+'</span><div><div class="game-group-title">'+title+'</div><div class="game-group-subtitle">'+sub+'</div></div></div><div class="game-group-grid">'+mine.map(x=>tileFor('game-card',x)).join("")+'</div></section>':"";}).join("");
 const teacherOnly=enabled.filter(x=>!placed.has(x[0]));
 const teacherCards=(previewActive?'':'<button type="button" class="teacher-tool-card act-as-student" data-act-as-student><span class="card-icon" aria-hidden="true">👀</span><span class="card-title">Sign in as a Student</span></button>')
  +actionTile('📈','Student Report',previewActive?previewHref('student-report',id):'student-report/index.html?class='+cls)
  +actionTile('📚','Vocabulary Progress','word-bank/teacher.html?class='+cls)
  +actionTile('🎛️','Manage Class',previewActive?previewHref('manage-class',id):'admin.html?tab=students&class='+cls)
  +(previewActive?'':actionTile('👣','Follow the Teacher','follow-teacher/teacher.html?class='+cls,' target="_blank" rel="noopener"'))
  +(grants['class-pointer']===true&&!previewActive?actionTile('🖥','Send Everyone to Share Screen','class-pointer-prototype/classroom.html?dashboard=teacher&amp;class='+cls+'&amp;sendEveryoneShare=1',' rel="noopener"'):'')
  +teacherOnly.map(x=>tileFor('teacher-tool-card',x)).join("");
 const teacherBox='<div class="teacher-tools-section"><h3>👨‍🏫 Teacher Tools</h3><p class="teacher-tools-subtitle">For you and this class</p><div class="teacher-tools-container">'+teacherCards+'</div></div>';
 return '<section class="class-card"><h2>'+esc(row.name||id)+'</h2><div class="island-intro"><div><h3>Welcome to Learning Island!</h3><p>Choose a place to explore.</p></div></div><div class="game-container island-map" aria-label="Learning Island destinations">'+(places||'<div class="empty">No tools have been enabled for this class yet.</div>')+'</div>'+teacherBox+(!previewActive&&window.B3StudentToolControls?window.B3StudentToolControls.render(id,row,TOOLS,access.role==='admin'&&['et','wt'].includes(id)):'')+'</section>';
 }).join("")||'<div class="gate">No classes are assigned to this teacher yet.</div>';
 if(!previewActive&&window.B3StudentToolControls)window.B3StudentToolControls.bind(q("classes"));
 if(previewActive){
   q('signOut').classList.add('hidden');
   q('who').textContent='Viewing as '+user.email;
   const welcome=q('who').parentElement;
   welcome.querySelector('.sub').textContent='Explore the teacher’s assigned classes and tools in read-only view. You remain signed in as the owner.';
   if(!q('exitTeacherPreview')){const exit=document.createElement('a');exit.id='exitTeacherPreview';exit.href='admin.html?v=20261008-teacher-preview';exit.className='sign';exit.textContent='Exit teacher view';exit.style.cssText='display:inline-block;margin-top:14px;color:#fff';welcome.append(exit);}
 }
}
q("classes").onclick=e=>{if(e.target.closest&&e.target.closest("[data-act-as-student]"))api.openActAsStudentPicker();};
q("signOut").onclick=()=>api.signOut().then(()=>location.reload());
// The gate already says “Checking your teacher account…”. Keep that neutral
// state until Firebase has restored the saved Google session and verified access.
// Calling showTeacherSignIn() before this callback flashes the login unnecessarily.
api.onAuthStateChanged((user,authorized,access)=>render(user,access||{authorized}));
})();
