<div class="wrap"><div id="gate" class="gate">Checking your teacher account…</div><div id="app" class="hidden"><div class="welcome"><strong id="who"></strong><div class="sub" style="color:#64748b">Choose a class or open one of the tools enabled for it.</div><div id="principalSummary"></div></div><div id="classes" class="classes"></div></div></div>
<script>
(function(){
const api=window.B3SiteSettings,WS=api.workspaceId||"b3-2026";
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const db=firebase.database(),q=id=>document.getElementById(id);
const TOOLS={
"sefer-hamitzvos":["Sefer HaMitzvos","sefer-hamitzvos/index.html"],"halacha":["Halacha","halacha/teacher.html"],"yiddish":["Yiddish","yiddish/teacher.html"],"posuk-practice-scroll":["Posuk Practice","record_pesukim/teacher.html"],"rashi-letters":["Rashi Letters","rashi-letters/teacher.html"],"gematria":["Gematria","gematria/teacher.html"],"shorashim":["Shorashim","shorashim/teacher.html?v=20260917-correct-dashboard"],"chazara":["Chazara","chazara/teacher.html"],"game-show":["Game Show","game-show/teacher.html"],"student-rewards":["Student Rewards","student-rewards/teacher.html"],"daily-points":["Daily Points","student-rewards/teacher.html?tab=Daily%20Points"],"weekly-quiz":["Weekly Quiz","weekly-quiz/teacher.html"],"gallery":["Gallery","class-gallery/index.html"],"tag":["Tag Game","class-gallery/index.html"],
"davening":["Davening Player","davening_student_app/index.html"],"class-pointer":["Class Pointer","class-pointer-prototype/dashboard.html?teacher=1"],"multiplayer-center":["Multiplayer Arcade","multiplayer/index.html"],"name-picker":["Name Picker","name-picker/index.html"],"chavrusa":["Chavrusa of the Day","chavrusa/index.html"]
};
const STUDENT_TOOLS={'sefer-hamitzvos':'sefer-hamitzvos/index.html',yiddish:'yiddish/index.html','posuk-practice-scroll':'record_pesukim/student.html','rashi-letters':'rashi-letters/student.html',gematria:'gematria/index.html',shorashim:'shorashim/index.html',chazara:'chazara/index.html','game-show':'game-show/player.html','student-rewards':'student-rewards/student.html','daily-points':'student-rewards/student.html','weekly-quiz':'weekly-quiz/index.html',halacha:'halacha/index.html?teacher=1'};
const ICONS={'sefer-hamitzvos':'📖','yiddish':'<img src="assets/yiddish-icon-v2.png" alt="">','posuk-practice-scroll':'📜','rashi-letters':'אב','gematria':'🔢','shorashim':'🌳','chazara':'🔁','game-show':'🏆','student-rewards':'🌟','daily-points':'✅','weekly-quiz':'📝','multiplayer-center':'🎮','gallery':'🖼️','class-gallery':'🖼️','tag':'🏃','davening':'📖','chumash-quiz':'❓','work-timer':'⏱️','class-slides':'🖥️','class-pointer':'👆','name-picker':'🎡','chavrusa':'👥'};
TOOLS['class-gallery']=TOOLS.gallery;
function esc(s){const d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
const previewParams=new URLSearchParams(location.search),previewTeacherId=previewParams.get('previewTeacher');
let renderGeneration=0,previewActive=false;
function previewHref(tool,classId){const p=new URLSearchParams({previewTeacher:previewTeacherId,previewType:previewParams.get('previewType')||'teacher',class:classId,tool});return 'teacher-preview-tool.html?'+p.toString();}
function showTeacherSignIn(message){
 q('app').classList.add('hidden');q('gate').classList.remove('hidden');
 q('gate').innerHTML='<h2>Teacher &amp; administrator sign in</h2><p id="teacherSignInStatus" role="status"></p><button type="button" class="sign" id="login">Sign in with Google</button>';
 q('teacherSignInStatus').textContent=message||'Use your authorized teacher or administrator Google account.';
 q('login').onclick=async()=>{q('login').disabled=true;q('teacherSignInStatus').textContent='Signing in…';try{await api.signInWithGoogle();}catch(error){showTeacherSignIn(error.message||'Could not sign in. Please try again.');}};
}
async function render(user,access){
 const generation=++renderGeneration;
 if(previewTeacherId){
   q('signOut').classList.add('hidden');q('actAsStudent').classList.add('hidden');
   if(!access?.authorized||access.role!=='admin'){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent='Only the owner can preview another teacher.';return;}
   try{
     const choices=await B3TeacherPreview.list(db,WS,access,user?.uid);
     if(generation!==renderGeneration)return;
     const teacher=choices.find(t=>t.id===previewTeacherId&&t.type===(previewParams.get('previewType')||'teacher'));
     if(!teacher)throw new Error('This teacher is no longer active or available.');
     previewActive=true;user={email:teacher.name};access={authorized:true,role:'teacher',classIds:teacher.classIds};
   }catch(error){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent=error.message;return;}
 }
 if(access?.actingAsStudent){q("app").classList.add("hidden");q("gate").classList.remove("hidden");q("gate").textContent="You are viewing Fun Torah Tools as "+access.actingAsStudent.name+". Press “Exit student view” at the bottom to return to your teacher account.";return}
 if(!access?.authorized){showTeacherSignIn(user?'This Google account is not assigned as a Fun Torah Tools teacher. Choose your authorized account.':'');return}
 if(access.role==="admin"){
   if(previewParams.get('manageStudentTools')!=='1'){location.replace("index.html");return}
   const allClasses=(await db.ref("b3Games/workspaces/"+WS+"/classes").once("value")).val()||{};
   if(generation!==renderGeneration)return;
   access={...access,classIds:Object.keys(allClasses).filter(id=>allClasses[id]&&allClasses[id].active!==false)};
 }
 const principal=access.accountType==="principal"&&!previewActive;
 q("homeTitle").textContent=principal?"Principal Center":"Fun Torah Tools";
 q("homeSubtitle").textContent=principal?"Teachers, supervised classes and learning tools":"Your classes and teaching tools";
 const supervised=principal?Object.values(access.supervisedTeachers||{}):[];
 q("principalSummary").innerHTML=principal?'<p><b>Supervised teachers:</b> '+(supervised.map(t=>esc(t.name)).join(", ")||"No teachers assigned")+'</p><p class="sub" style="color:#64748b">You have teacher-level access to your supervised classes. Adding staff and changing platform-wide settings remain owner-only.</p>':"";
 q("gate").classList.add("hidden");q("app").classList.remove("hidden");q("signOut").classList.remove("hidden");q("actAsStudent").classList.remove("hidden");q("who").textContent=user?.email||"Teacher";
 if(access.claimPending){const pending=document.createElement("p");pending.textContent="Your invitation is recognized. The owner still needs to deploy teacher account linking before class changes can be saved.";q("who").parentElement.appendChild(pending);}
 const ids=access.classIds||[],snaps=await Promise.all(ids.map(id=>db.ref("b3Games/workspaces/"+WS+"/classes/"+id).once("value"))),siteSettings=access.role!=="admin"&&ids.some(id=>id==="et"||id==="wt")?(await db.ref("b3Games/siteSettings").once("value")).val()||{}:{};
 if(generation!==renderGeneration)return;
 q("classes").innerHTML=snaps.map((s,i)=>{const id=ids[i],row=s.val()||{},grants=row.toolGrants||{},enabled=Object.entries(grants).filter(x=>x[1]===true&&TOOLS[x[0]]);if(["et","wt"].includes(id)&&siteSettings.games?.["multiplayer-center"]!==false&&siteSettings.classGames?.[id]?.["multiplayer-center"]!==false&&!enabled.some(x=>x[0]==="multiplayer-center"))enabled.push(["multiplayer-center",true]);if(grants["student-rewards"]===true&&!enabled.some(([tool])=>tool==="daily-points"))enabled.push(["daily-points",true]);const tools=enabled.map(([tool])=>{const teacherHref=previewActive?previewHref(tool,id):TOOLS[tool][1]+(TOOLS[tool][1].includes('?')?'&':'?')+'class='+encodeURIComponent(id);const studentPath=STUDENT_TOOLS[tool];const studentHref=studentPath?studentPath+(studentPath.includes('?')?'&':'?')+'demo=1&class='+encodeURIComponent(id):'';return '<div class="tool"><span class="tool-icon '+(tool==='rashi-letters'?'rashi':'')+'" aria-hidden="true">'+(ICONS[tool]||'')+'</span><span>'+esc(TOOLS[tool][0])+'</span><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px"><a href="'+teacherHref+'"  rel="noopener">'+'Open'+'</a></div></div>';}).join("");
 if(!s.exists()||row.active===false)return "";
 return '<section class="class-card"><div class="class-head"><h2>'+esc(row.name||id)+'</h2>'+(principal?'<small>Teacher: '+(supervised.filter(t=>t.classIds?.[id]===true).map(t=>esc(t.name)).join(", ")||"Assigned teacher") +'</small>':"")+'<span style="display:flex;gap:8px;flex-wrap:wrap"><a class="manage" style="background:#15803d" href="'+(previewActive?previewHref('student-report',id):'student-report/index.html?class='+encodeURIComponent(id))+'"  rel="noopener">📈 Student Report</a><a class="manage" style="background:#7c3aed" href="word-bank/teacher.html?class='+encodeURIComponent(id)+'">📚 Vocabulary Progress</a><a class="manage" href="'+(previewActive?previewHref('manage-class',id):'admin.html?tab=students&class='+encodeURIComponent(id))+'">Manage Class</a></span></div>'+(previewActive?'':'<p style="margin:14px 0"><a class="manage" style="background:#1d4ed8" href="follow-teacher/teacher.html?class='+encodeURIComponent(id)+'" target="_blank" rel="noopener">👣 Follow the Teacher</a></p>')+'<div class="tools">'+(tools||'<div class="empty">No tools have been enabled for this class yet.</div>')+'</div>'+(grants['class-pointer']===true&&!previewActive?'<p style="margin:14px 0"><a class="manage" style="background:#1d4ed8"  rel="noopener" href="class-pointer-prototype/classroom.html?dashboard=teacher&amp;class='+encodeURIComponent(id)+'&amp;sendEveryoneShare=1">🖥 Send Everyone to Share Screen</a></p>':'')+(!previewActive&&window.B3StudentToolControls?window.B3StudentToolControls.render(id,row,TOOLS,access.role==='admin'&&['et','wt'].includes(id)):'')+'</section>'
 }).join("")||'<div class="welcome">No classes are assigned to this teacher yet.</div>';
 if(!previewActive&&window.B3StudentToolControls)window.B3StudentToolControls.bind(q("classes"));
 if(previewActive){
   q('signOut').classList.add('hidden');q('actAsStudent').classList.add('hidden');
   q('who').textContent='Viewing as '+user.email;
   const welcome=q('who').parentElement;
   welcome.querySelector('.sub').textContent='Explore the teacher’s assigned classes and tools in read-only view. You remain signed in as the owner.';
   if(!q('exitTeacherPreview')){const exit=document.createElement('a');exit.id='exitTeacherPreview';exit.href='admin.html?v=20261008-teacher-preview';exit.className='manage';exit.textContent='Exit teacher view';exit.style.cssText='display:inline-block;margin-top:14px';welcome.append(exit);}
 }
}
q("actAsStudent").onclick=()=>api.openActAsStudentPicker();
q("signOut").onclick=()=>api.signOut().then(()=>location.reload());
// The gate already says “Checking your teacher account…”. Keep that neutral
// state until Firebase has restored the saved Google session and verified access.
// Calling showTeacherSignIn() before this callback flashes the login unnecessarily.
api.onAuthStateChanged((user,authorized,access)=>render(user,access||{authorized}));
})();
</script><script src="back-nav.js" data-mode="inline" data-href="index.html" data-label="← Fun Torah Tools"></script></body></html>
