<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fun Torah Tools</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1f2937}header{background:#172033;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:26px}.sub{color:#b9c6da;font-size:13px;margin-top:5px}button,a{font:inherit}.sign{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:#334155;color:#fff}.wrap{max-width:1000px;margin:28px auto;padding:0 18px}.welcome{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 5px 18px rgba(15,23,42,.06);margin-bottom:18px}.classes{display:grid;gap:18px}.class-card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px}.class-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.manage{background:#2563eb;color:#fff;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:800}.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}.tool{display:flex;align-items:center;justify-content:center;min-height:82px;padding:14px;border:1px solid #dbe3ee;border-radius:14px;text-decoration:none;color:#1f2937;background:#f8fafc;font-weight:900;text-align:center}.tool:hover{background:#eef2ff}.empty{color:#64748b;padding:15px 0}.gate{text-align:center;padding:70px 20px}.hidden{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script><script src="firebase-config.js?v=20261001-teacherauth"></script><script src="site-settings.js?v=20261001-teacherauth"></script>
</head><body>
<header><div><h1>Fun Torah Tools</h1><div class="sub">Your classes and teaching tools</div></div><button id="signOut" class="sign hidden">Sign out</button></header>
<div class="wrap"><div id="gate" class="gate">Checking your teacher account…</div><div id="app" class="hidden"><div class="welcome"><strong id="who"></strong><div class="sub" style="color:#64748b">Choose a class or open one of the tools enabled for it.</div></div><div id="classes" class="classes"></div></div></div>
<script>
(function(){
const api=window.B3SiteSettings,WS=api.workspaceId||"b3-2026";
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const db=firebase.database(),q=id=>document.getElementById(id);
const TOOLS={
"yiddish":["Yiddish","yiddish/teacher.html"],"posuk-practice-scroll":["Posuk Practice","record_pesukim/teacher.html"],"rashi-letters":["Rashi Letters","rashi-letters/teacher.html"],"shorashim":["Shorashim","shorashim/teacher.html?v=20260917-correct-dashboard"],"chazara":["Chazara","chazara/teacher.html"],"game-show":["Game Show","game-show/teacher.html"],"student-rewards":["Student Rewards","student-rewards/teacher.html"],"weekly-quiz":["Weekly Quiz","weekly-quiz/teacher.html"],"gallery":["Gallery","class-gallery/index.html"],"tag":["Tag Game","class-gallery/index.html"],"tent-trail-trivia":["Tent Trail Trivia","tent-trail-trivia/index.html"]
};
function esc(s){const d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
async function render(user,access){
 if(!access?.authorized){q("gate").innerHTML='This Google account is not assigned as a Fun Torah Tools teacher. <br><button class="sign" id="login" style="margin-top:14px">Sign in with Google</button>';q("login").onclick=()=>api.signInWithGoogle();return}
 if(access.role==="admin"||(access.classIds||[]).includes("*")){location.replace("index.html");return}
 q("gate").classList.add("hidden");q("app").classList.remove("hidden");q("signOut").classList.remove("hidden");q("who").textContent=user?.email||"Teacher";
 const ids=access.classIds||[],snaps=await Promise.all(ids.map(id=>db.ref("b3Games/workspaces/"+WS+"/classes/"+id).once("value")));
 q("classes").innerHTML=snaps.map((s,i)=>{const id=ids[i],row=s.val()||{},grants=row.toolGrants||{},tools=Object.entries(grants).filter(x=>x[1]===true&&TOOLS[x[0]]).map(([tool])=>'<a class="tool" href="'+TOOLS[tool][1]+'">'+esc(TOOLS[tool][0])+'</a>').join("");
 return '<section class="class-card"><div class="class-head"><h2>'+esc(row.name||id)+'</h2><a class="manage" href="admin.html?tab=students&class='+encodeURIComponent(id)+'">Manage Class</a></div><div class="tools">'+(tools||'<div class="empty">No tools have been enabled for this class yet.</div>')+'</div></section>'
 }).join("")||'<div class="welcome">No classes are assigned to this teacher yet.</div>';
}
q("signOut").onclick=()=>api.signOut().then(()=>location.reload());
api.onAuthStateChanged((user,authorized,access)=>render(user,access||{authorized}));
})();
</script></body></html>
