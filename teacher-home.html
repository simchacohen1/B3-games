<script>
  (function() {
    const idbReq = indexedDB.open('firebaseLocalStorageDb', 1);
    idbReq.onsuccess = function(e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('firebaseLocalStorage')) return;
      const tx = db.transaction('firebaseLocalStorage', 'readonly');
      const store = tx.objectStore('firebaseLocalStorage');
      const getAll = store.getAll();
      getAll.onsuccess = function() {
        if (getAll.result && getAll.result.length > 0) {
          window.currentUserSession = getAll.result[0].value;
          document.addEventListener('DOMContentLoaded', function() {
            const modals = document.querySelectorAll('#pinModal, #loginModal, .auth-overlay, .modal-backdrop');
            modals.forEach(m => m.style.display = 'none');
          });
        }
      };
    };
  })();

<header><div><h1>Fun Torah Tools</h1><div class="sub">Your classes and teaching tools</div></div><div style="display:flex;gap:8px"><button id="switchToStudent" class="sign hidden" style="background:#15803d">🔄 Switch to Student</button><button id="actAsStudent" class="sign hidden" style="background:#475569" title="Teacher preview only — not safe when handing the computer to a student">👀 Preview Student (teacher stays signed in)</button><button id="signOut" class="sign hidden">Sign out</button></div></header>
<div class="wrap"><div id="gate" class="gate">Checking your teacher account…</div><div id="app" class="hidden"><div class="welcome"><strong id="who"></strong><div class="sub" style="color:#64748b">Choose a class or open one of the tools enabled for it.</div></div><div id="classes" class="classes"></div></div></div>
<dialog id="upgradeDialog" aria-labelledby="upgradeTitle">
<h2 id="upgradeTitle">Add Shorashim Lab</h2>
<p id="upgradeStatus" role="status">Asking Stripe to calculate the amount for the remainder of your annual subscription…</p>
<div id="upgradePrice"></div>
<p id="upgradeDetails"></p>
<div class="actions"><button type="button" class="sign hidden" id="upgradeApprove">Confirm prorated purchase</button><button type="button" class="sign secondary" id="upgradeCancel">Close</button></div>
</dialog>
<script>
(function(){
const api=window.B3SiteSettings,WS=api.workspaceId||"b3-2026";
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const db=firebase.database(),q=id=>document.getElementById(id);
const TOOLS={
"halacha":["Halacha","halacha/teacher.html"],"yiddish":["Yiddish","yiddish/teacher.html"],"posuk-practice-scroll":["Posuk Practice","record_pesukim/teacher.html"],"rashi-letters":["Rashi Letters","rashi-letters/teacher.html"],"gematria":["Gematria","gematria/teacher.html"],"shorashim":["Shorashim","shorashim/teacher.html?v=20260917-correct-dashboard"],"chazara":["Chazara","chazara/teacher.html"],"game-show":["Game Show","game-show/teacher.html"],"student-rewards":["Student Rewards","student-rewards/teacher.html"],"daily-points":["Daily Points","student-rewards/teacher.html?tab=Daily%20Points"],"weekly-quiz":["Weekly Quiz","weekly-quiz/teacher.html"],"gallery":["Gallery","class-gallery/index.html"],"tag":["Tag Game","class-gallery/index.html"],
"davening":["Davening Player","davening_student_app/index.html"],"class-pointer":["Class Pointer","class-pointer-prototype/dashboard.html?teacher=1"],"name-picker":["Name Picker","name-picker/index.html"],"chavrusa":["Chavrusa of the Day","chavrusa/index.html"]
};
const STUDENT_TOOLS={yiddish:'yiddish/index.html','posuk-practice-scroll':'record_pesukim/student.html','rashi-letters':'rashi-letters/student.html',gematria:'gematria/index.html',shorashim:'shorashim/index.html',chazara:'chazara/index.html','game-show':'game-show/player.html','student-rewards':'student-rewards/student.html','daily-points':'student-rewards/student.html','weekly-quiz':'weekly-quiz/index.html',halacha:'halacha/index.html?teacher=1'};
const ICONS={'yiddish':'<img src="assets/yiddish-icon-v2.png" alt="">','posuk-practice-scroll':'📜','rashi-letters':'אב','gematria':'🔢','shorashim':'🌳','chazara':'🔁','game-show':'🏆','student-rewards':'🌟','daily-points':'✅','weekly-quiz':'📝','gallery':'🖼️','class-gallery':'🖼️','tag':'🏃','davening':'📖','chumash-quiz':'❓','work-timer':'⏱️','class-slides':'🖥️','class-pointer':'👆','name-picker':'🎡','chavrusa':'👥'};
TOOLS['class-gallery']=TOOLS.gallery;
function esc(s){const d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
const previewParams=new URLSearchParams(location.search),previewTeacherId=previewParams.get('previewTeacher');
let renderGeneration=0,previewActive=false;
function showTeacherSignIn(message){
 q('app').classList.add('hidden');q('gate').classList.remove('hidden');
 q('gate').innerHTML='<h2>Teacher &amp; administrator sign in</h2><p id="teacherSignInStatus" role="status"></p><button type="button" class="sign" id="login">Sign in with Google</button>';
 q('teacherSignInStatus').textContent=message||'Use your authorized teacher or administrator Google account.';
 q('login').onclick=async()=>{q('login').disabled=true;q('teacherSignInStatus').textContent='Signing in…';try{await api.signInWithGoogle();}catch(error){showTeacherSignIn(error.message||'Could not sign in. Please try again.');}};
}
async function render(user,access){
 const generation=++renderGeneration;
 if(previewTeacherId){
   q('signOut').classList.add('hidden');q('actAsStudent').classList.add('hidden');q('switchToStudent').classList.add('hidden');
   if(!access?.authorized||access.role!=='admin'){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent='Only the owner can preview another teacher.';return;}
   try{
     const choices=await B3TeacherPreview.list(db,WS,access,user?.uid);
     if(generation!==renderGeneration)return;
     const teacher=choices.find(t=>t.id===previewTeacherId&&t.type===(previewParams.get('previewType')||'teacher'));
     if(!teacher)throw new Error('This teacher is no longer active or available.');
     previewActive=true;user={email:teacher.name};access={authorized:true,role:'teacher',classIds:teacher.classIds};
   }catch(error){q('app').classList.add('hidden');q('gate').classList.remove('hidden');q('gate').textContent=error.message;return;}
 }
 if(access?.actingAsStudent){q("app").classList.add("hidden");q("gate").classList.remove("hidden");q("gate").textContent="You are viewing Fun Torah Tools as "+access.actingAsStudent.name+". Press “Exit student view” at the bottom to return to your teacher account.";return}
 if(!access?.authorized){showTeacherSignIn(user?'This Google account is not assigned as a Fun Torah Tools teacher. Choose your authorized account.':'');return}
 if(access.role==="admin"){
   if(previewParams.get('manageStudentTools')!=='1'){location.replace("index.html");return}
   const allClasses=(await db.ref("b3Games/workspaces/"+WS+"/classes").once("value")).val()||{};
   if(generation!==renderGeneration)return;
   access={...access,classIds:Object.keys(allClasses).filter(id=>allClasses[id]&&allClasses[id].active!==false)};
 }
 q("gate").classList.add("hidden");q("app").classList.remove("hidden");q("signOut").classList.remove("hidden");q("actAsStudent").classList.remove("hidden");q("switchToStudent").classList.remove("hidden");q("who").textContent=user?.email||"Teacher";
 if(access.claimPending){const pending=document.createElement("p");pending.textContent="Your invitation is recognized. The owner still needs to deploy teacher account linking before class changes can be saved.";q("who").parentElement.appendChild(pending);}
 const ids=access.classIds||[],snaps=await Promise.all(ids.map(id=>db.ref("b3Games/workspaces/"+WS+"/classes/"+id).once("value")));
 if(generation!==renderGeneration)return;
 q("classes").innerHTML=snaps.map((s,i)=>{const id=ids[i],row=s.val()||{},grants=row.toolGrants||{},enabled=Object.entries(grants).filter(x=>x[1]===true&&TOOLS[x[0]]);if(grants["student-rewards"]===true&&!enabled.some(([tool])=>tool==="daily-points"))enabled.push(["daily-points",true]);const tools=enabled.map(([tool])=>{const teacherHref=TOOLS[tool][1]+(TOOLS[tool][1].includes('?')?'&':'?')+'class='+encodeURIComponent(id);const studentPath=STUDENT_TOOLS[tool];const studentHref=studentPath?studentPath+(studentPath.includes('?')?'&':'?')+'demo=1&class='+encodeURIComponent(id):'';return '<div class="tool"><span class="tool-icon '+(tool==='rashi-letters'?'rashi':'')+'" aria-hidden="true">'+(ICONS[tool]||'')+'</span><span>'+esc(TOOLS[tool][0])+'</span><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px"><a href="'+teacherHref+'" target="_blank" rel="noopener">'+'Open'+'</a></div></div>';}).join("");
 if(!s.exists()||row.active===false)return "";
 return '<section class="class-card"><div class="class-head"><h2>'+esc(row.name||id)+'</h2><span style="display:flex;gap:8px;flex-wrap:wrap"><a class="manage" style="background:#15803d" href="student-report/index.html?class='+encodeURIComponent(id)+'" target="_blank" rel="noopener">📈 Student Report</a><a class="manage" href="admin.html?tab=students&class='+encodeURIComponent(id)+'">Manage Class</a>'+(row.billing?.managed===true&&access.role==='teacher'&&!previewActive?'<button type="button" class="manage" data-billing-class="'+esc(id)+'">💳 Manage Billing</button>'+(grants.shorashim!==true?' <button type="button" class="manage" style="background:#15803d" data-add-shorashim="'+esc(id)+'">＋ Add Shorashim</button>':''):'')+'</span></div><div class="tools">'+(tools||'<div class="empty">No tools have been enabled for this class yet.</div>')+'</div>'+(!previewActive&&window.B3StudentToolControls?window.B3StudentToolControls.render(id,row,TOOLS,access.role==='admin'&&['et','wt'].includes(id)):'')+'</section>'
 }).join("")||'<div class="welcome">No classes are assigned to this teacher yet.</div>';
 if(!previewActive&&window.B3StudentToolControls)window.B3StudentToolControls.bind(q("classes"));
 if(!previewActive){
  q('classes').querySelectorAll('[data-add-shorashim]').forEach(button=>{
   button.addEventListener('click',async()=>{
    const dialog=q('upgradeDialog');
    if(typeof dialog.showModal!=='function'){alert('Please use an up-to-date browser.');return;}
    q('upgradePrice').textContent='';q('upgradeDetails').textContent='';
    q('upgradeStatus').textContent='Calculating your exact prorated cost through Stripe…';
    q('upgradeApprove').classList.add('hidden');
    dialog.showModal();
    const classId=button.getAttribute('data-add-shorashim');
    const callUpgrade=async params=>{
     const current=firebase.auth().currentUser;
     if(!current)throw Error('Sign in with your authorized teacher Google account.');
     const response=await fetch('https://us-central1-b3-games.cloudfunctions.net/funTorahUpgradeTool',{
      method:'POST',headers:{'Content-Type':'application/json',
        Authorization:'Bearer '+await current.getIdToken()},
      body:JSON.stringify(params)
     });
     const data=await response.json().catch(()=>({}));
     if(!response.ok)throw Error(data.error||'Stripe upgrade is unavailable.');
     return data;
    };
    try{
     const quote=await callUpgrade({action:'preview',classId,toolId:'shorashim'});
     if(!dialog.open)return;
     const usd=cents=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(cents/100);
     q('upgradeStatus').textContent='Stripe has calculated your payment:';
     q('upgradePrice').textContent=usd(quote.chargeNowCents)+' due now';
     q('upgradeDetails').textContent='Shorashim Lab will cost '+usd(quote.annualRenewalPriceCents)+
      ' per year at your existing renewal date. It unlocks only after payment succeeds.';
     const approve=q('upgradeApprove');
     approve.classList.remove('hidden');approve.disabled=false;
     approve.onclick=async()=>{
      approve.disabled=true;q('upgradeStatus').textContent='Sending your approved purchase to Stripe…';
      try{
       const result=await callUpgrade({action:'confirm',quoteId:quote.quoteId,
        acknowledge:true,confirmedAmountCents:quote.chargeNowCents});
       q('upgradeStatus').textContent=result.message||'Stripe is processing your payment.';
       q('upgradeDetails').textContent='Your existing learning tools remain available. Check Manage Billing if Stripe needs additional payment confirmation.';
       approve.classList.add('hidden');
      }catch(error){
       q('upgradeStatus').textContent=error.message||'Unable to confirm. You have not been told that a charge succeeded.';
       approve.disabled=false;
      }
     };
    }catch(error){
     if(dialog.open)q('upgradeStatus').textContent=error.message||'Stripe could not preview this upgrade.';
    }
   });
  });
 }

 if(!previewActive){
  q('classes').querySelectorAll('[data-billing-class]').forEach(button=>{
   button.addEventListener('click',async()=>{
    button.disabled=true;button.textContent='Opening Stripe…';
    try{
     const current=firebase.auth().currentUser;
     if(!current)throw Error('Please sign in with your Google teacher account.');
     const reply=await fetch('https://us-central1-b3-games.cloudfunctions.net/funTorahBillingPortal',{
      method:'POST',headers:{'Content-Type':'application/json',
       Authorization:'Bearer '+await current.getIdToken()},
      body:JSON.stringify({classId:button.getAttribute('data-billing-class')})
     });
     const data=await reply.json().catch(()=>({}));
     if(!reply.ok)throw Error(data.error||'Billing management is unavailable.');
     if(!/^https:\/\/billing\.stripe\.com\//.test(data.url||''))
      throw Error('Unexpected Stripe billing link.');
     location.assign(data.url);
    }catch(error){
     button.disabled=false;button.textContent='💳 Manage Billing';
     alert(error?.message||'Could not open Stripe billing.');
    }
   });
  });
 }

 if(previewActive){
   q('signOut').classList.add('hidden');q('actAsStudent').classList.add('hidden');
   q('who').textContent='Viewing as '+user.email;
   const welcome=q('who').parentElement;
   welcome.querySelector('.sub').textContent='Read-only preview of this teacher’s assigned classes and enabled tools. You remain signed in as the owner.';
   if(!q('exitTeacherPreview')){const exit=document.createElement('a');exit.id='exitTeacherPreview';exit.href='admin.html?v=20261008-teacher-preview';exit.className='manage';exit.textContent='Exit teacher view';exit.style.cssText='display:inline-block;margin-top:14px';welcome.append(exit);}
   q('classes').querySelectorAll('a').forEach(link=>{link.removeAttribute('href');link.removeAttribute('target');link.setAttribute('aria-disabled','true');link.title='Read-only teacher preview';link.style.cursor='default';});
 }
}
q('upgradeCancel').onclick=()=>q('upgradeDialog').close();
q('switchToStudent').onclick=async()=>{
 const button=q('switchToStudent');
 if(!window.confirm('Switch to Student? This signs the teacher out on this computer. You will need to sign in again to access Teacher Center. Close any other open teacher tabs before giving the device to a student.'))return;
 button.disabled=true;button.textContent='Locking teacher session…';
 try{
  await B3SharedDevice.switchToStudent(firebase.auth());
 }catch(error){button.disabled=false;button.textContent='🔄 Switch to Student';alert(error.message||'Could not securely sign out. Do not hand the device to a student yet.');}
};
q("actAsStudent").onclick=()=>api.openActAsStudentPicker();
q("signOut").onclick=()=>api.signOut().then(()=>location.reload());
showTeacherSignIn();
api.onAuthStateChanged((user,authorized,access)=>render(user,access||{authorized}));
})();
</script></body></html>
