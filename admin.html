<!doctype html>
<html lang="en">
<head><script src="teacher-tool-gate.js?v=20261028-gate" data-scope="teacher"></script><script src="guest-mode.js?v=20261011-guest" data-guest="block"></script>

<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B3 Teacher Administration</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f1f5f9;color:#1f2937}
body{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:#172033;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}
.brand{font-size:22px;font-weight:900;margin:0 8px 5px}.brand-sub{font-size:12px;color:#aebbd0;margin:0 8px 24px;line-height:1.4}
nav{display:grid;gap:7px}.nav-btn{width:100%;border:0;border-radius:11px;background:transparent;color:#dbe5f4;text-align:left;padding:12px 13px;font-size:14px;font-weight:800;cursor:pointer}
.nav-btn:hover{background:#24314a}.nav-btn.active{background:#fff;color:#172033}
.back{display:block;margin-top:24px;color:#cbd5e1;text-decoration:none;font-size:13px;font-weight:800;padding:11px 13px;border-top:1px solid #334155}
main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 28px}.workspace{position:relative;height:calc(100vh - 72px)}
.topbar h1{font-size:23px;margin:0}.topbar p{font-size:12px;color:#64748b;margin:4px 0 0}
iframe{display:block;width:100%;height:100%;border:0;background:#f1f5f9}
@media(max-width:760px){body{grid-template-columns:1fr}aside{position:static;height:auto;padding:14px}.brand-sub{margin-bottom:12px}nav{grid-template-columns:repeat(2,1fr)}.back{margin-top:12px}.topbar{display:none}.workspace{height:calc(100vh - 270px)}}
.ta-panel{display:none;position:absolute;inset:0;overflow:auto;background:#f1f5f9;padding:28px 20px;z-index:4}
#ownerControlPanel{position:relative;inset:auto;overflow:visible}
.workspace{overflow:auto}
.nav-btn small{display:block;font-size:12px;line-height:1.4;font-weight:400;opacity:.8;margin-top:5px}
.ta-wrap{max-width:640px;margin:0 auto}.ta-card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 4px 14px rgba(15,23,42,.06);margin-bottom:16px}
.ta-card h2{margin:0 0 6px;font-size:24px}.ta-hint{color:#64748b;font-size:16px;line-height:1.45;margin:6px 0 0}
.ta-pill{display:inline-block;margin:16px 0 4px;padding:12px 26px;border-radius:999px;font-size:26px;font-weight:900}
.ta-open{background:#dcfce7;color:#14532d}.ta-locked{background:#fee2e2;color:#7f1d1d}
.ta-btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.ta-btns button{flex:1 1 200px;border:0;border-radius:12px;padding:16px 18px;font-size:18px;font-weight:800;cursor:pointer;color:#fff}
.ta-lock{background:#dc2626}.ta-unlock{background:#16a34a}.ta-btns button:disabled{opacity:.45;cursor:default}
.ta-msg{margin-top:14px;font-weight:800;font-size:16px;min-height:22px}
.ta-panel select{width:100%;padding:13px;font-size:17px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;margin-bottom:14px}
/* Owner control panel: one class at a time, every game one tap away. */
.cp-wrap{max-width:720px;margin:0 auto}
.cp-switch{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.cp-switch button{border:2px solid #cbd5e1;background:#fff;border-radius:14px;padding:14px;font-size:22px;font-weight:900;cursor:pointer;color:#334155;display:flex;align-items:center;justify-content:center;gap:9px}
.cp-switch button.on{border-color:#172033;background:#172033;color:#fff}
.cp-dot{width:12px;height:12px;border-radius:50%;display:inline-block}.cp-dot.open{background:#22c55e}.cp-dot.locked{background:#ef4444}
.cp-status{border-radius:16px;padding:16px 18px;margin-bottom:12px;font-size:20px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cp-status.open{background:#dcfce7;color:#14532d}.cp-status.locked{background:#fee2e2;color:#7f1d1d}
.cp-status small{display:block;font-size:14px;font-weight:700;opacity:.85;margin-top:3px}
.cp-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.cp-modes button{border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:13px 6px;font-size:15px;font-weight:900;cursor:pointer;color:#334155}
.cp-modes button.on{background:#172033;border-color:#172033;color:#fff}
.cp-emergency{background:#7f1d1d;color:#fff;border-radius:14px;padding:13px 16px;margin-bottom:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cp-emergency button{border:0;border-radius:10px;padding:9px 13px;font-weight:900;cursor:pointer}
.cp-games{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden}
.cp-games-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #e2e8f0;font-weight:900;color:#334155}
.cp-games-head span{font-size:12px;color:#64748b;font-weight:700}
.cp-bulk{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}
.cp-bulk button{flex:1;min-width:120px;border:0;border-radius:999px;padding:10px 12px;font-size:14px;font-weight:900;cursor:pointer}
.cp-bulk button:disabled{opacity:.5;cursor:default}
.cp-bulk .all-open{background:#dcfce7;color:#166534}.cp-bulk .all-closed{background:#fee2e2;color:#991b1b}
.cp-row{display:grid;grid-template-columns:44px minmax(0,1fr) 132px;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #f1f5f9}
.cp-row:first-of-type{border-top:0}
.cp-name{font-weight:800;font-size:16px;color:#1f2937;overflow:hidden;text-overflow:ellipsis}
.cp-name small{display:block;font-size:11px;color:#b45309;font-weight:800}
.cp-star{border:0;background:transparent;font-size:24px;cursor:pointer;filter:grayscale(1);opacity:.3;padding:4px}.cp-star.on{filter:none;opacity:1}
.cp-toggle{border:0;border-radius:999px;padding:11px 8px;font-size:15px;font-weight:900;cursor:pointer}
.cp-toggle.open{background:#dcfce7;color:#166534}.cp-toggle.closed{background:#fee2e2;color:#991b1b}
.cp-row button:disabled,.cp-modes button:disabled{opacity:.5;cursor:wait}
.cp-cls{display:inline-block;border-radius:6px;padding:1px 6px;margin-right:6px;font-size:12px;font-weight:900;color:#fff;vertical-align:2px}
.cp-cls.et{background:#2563eb}.cp-cls.wt{background:#9333ea}
.cp-wrap.cls-et .cp-games{border-left:6px solid #2563eb}.cp-wrap.cls-wt .cp-games{border-left:6px solid #9333ea}
.cp-wrap.cls-et .cp-modes button.on{background:#2563eb;border-color:#2563eb}.cp-wrap.cls-wt .cp-modes button.on{background:#9333ea;border-color:#9333ea}
.cp-msg{min-height:22px;margin-top:10px;font-weight:800;color:#475569;text-align:center}
/* embed=1: Class Access opened from the home-page padlock, locked to one class. */
html.embed body{grid-template-columns:1fr}
html.embed aside,html.embed .topbar,html.embed .cp-switch{display:none!important}
html.embed .workspace{height:100vh!important}
html.embed #adminFrame{position:absolute!important;width:1px!important;height:1px!important;opacity:0;pointer-events:none}
html.embed .ta-panel{padding:16px 12px}
</style>
<script defer src="teacher-global-bootstrap.js?v=20261020"></script>
</head>
<body>
<aside>
  <div class="brand">Teacher Tools</div>
  <div class="brand-sub">Your classes, students, and activities.</div>
  <nav>
    <button class="nav-btn active" data-tab="access" id="classAccessNav">🔐 Class Access<small>Lock / unlock · schedules · exceptions</small></button>
    <button class="nav-btn" data-tab="students">👥 Students<small>Roster · passcodes · each student's tools</small></button>
    <button class="nav-btn" data-tab="activities" id="activitiesNav" style="display:none">🎮 Activities<small>Show / hide games for everyone</small></button>
    <button class="nav-btn" data-tab="administration" id="administrationNav" style="display:none">⚙️ Administration<small>Teachers · classes · permitted tools</small></button>
  </nav>
  <button id="viewAsTeacher" class="nav-btn" type="button" style="display:none;margin-top:18px">👀 View as Teacher<small>Preview another teacher's account</small></button>
  <button id="teacherCenterSignOut" class="nav-btn" type="button" style="display:none">Sign out</button>
  <a class="back" id="backToTools" href="index.html">← Back to Fun Torah Tools</a>
</aside>
<main>
  <div class="topbar"><div><h1 id="pageTitle">Class Access</h1><p id="pageSub">Open, close, and schedule your classes.</p></div></div>
  <div class="workspace" id="workspace">
    <div id="teacherAccessPanel" class="ta-panel"></div>
    <div id="ownerControlPanel" class="ta-panel"></div>
    <iframe id="adminFrame" src="index.html?adminPage=1" title="B3 administration"></iframe>
    <iframe id="administrationFrame" title="Teachers, classes, and platform permissions" style="display:none"></iframe>

  </div>
</main>
<script>
const tabs={
  access:["Class Access","Lock or unlock classes and games, set schedules, and manage access exceptions."],
  students:["Students","Manage your class roster, passcodes, and each student's tools."],
  activities:["Activities","Show or hide activities for all students. Drag between Active and Inactive."],
  administration:["Administration","Add teachers and classes, assign teachers, and set their permitted tools and content."]
};
const adminParams=new URLSearchParams(location.search);
const requestedClassId=String(adminParams.get("class")||"").trim();
const embedMode=adminParams.get("embed")==="1";
if(embedMode)document.documentElement.classList.add("embed");
let currentTab=String(adminParams.get("tab")||"access").trim()||"access";
if(currentTab==="settings"||currentTab==="special")currentTab="access";
if(!tabs[currentTab])currentTab="access";
const frame=document.getElementById("adminFrame");
document.getElementById('teacherCenterSignOut').onclick=()=>frame.contentWindow.B3SiteSettings.signOut().then(()=>location.href='index.html');
const backToTools=document.getElementById("backToTools");
backToTools.addEventListener("click",e=>{
  e.preventDefault();
  try{
    const access=frame.contentWindow?.B3SiteSettings?.getCurrentAccess?.()||{};
    // The owner keeps the existing B3 home. A regular teacher should never
    // land on the owner's B3 dashboard; keep them in their scoped Teacher Center
    // until the generic teacher home is available.
    if(access.role==="admin") location.href="index.html";
    else location.href="teacher-home.html";
  }catch(err){location.href="teacher-home.html";}
});

function findHeading(d,text){
  return [...d.querySelectorAll("#adminControls > h3")].find(h=>h.textContent.trim()===text);
}
function makeSection(d,id){
  let s=d.getElementById("admin-section-"+id);
  if(!s){s=d.createElement("section");s.id="admin-section-"+id;s.className="admin-dashboard-section";d.getElementById("adminControls").appendChild(s)}
  return s;
}
function moveRange(start,count,target){let n=start;for(let i=0;i<count&&n;i++){const next=n.nextElementSibling;target.appendChild(n);n=next}}
function isOwnerNow(){try{return (frame.contentWindow?.B3SiteSettings?.getCurrentAccess?.()||{}).role==="admin"}catch(e){return false}}
let teacherAccessClass="";
function taEsc(v){const d=document.createElement("div");d.textContent=String(v==null?"":v);return d.innerHTML}
async function renderTeacherAccess(msg){
  const panel=document.getElementById("teacherAccessPanel");
  const w=frame.contentWindow,db=w?.firebase?.database?.(),access=w?.B3SiteSettings?.getCurrentAccess?.()||{},ws=w?.B3SiteSettings?.workspaceId||"b3-2026";
  if(!db||!w?.B3SiteSettings){panel.innerHTML='<div class="ta-wrap"><div class="ta-card">Loading teacher sign-in…</div></div>';setTimeout(()=>{if(currentTab==="access"&&!isOwnerNow())renderTeacherAccess()},900);return}
  if(!access.authorized){
    panel.innerHTML='<div class="ta-wrap"><div class="ta-card"><h2>Teacher &amp; administrator sign in</h2><p>Sign in with your authorized Google account to open your classes.</p><button type="button" id="taSignIn">Sign in with Google</button><p role="status" id="taSignInStatus"></p></div></div>';
    document.getElementById('taSignIn').onclick=async()=>{try{await w.B3SiteSettings.signInWithGoogle();applyRoleView();showTab(currentTab);}catch(error){document.getElementById('taSignInStatus').textContent=error.message||'Could not sign in. Please try again.';}};
    return;
  }
  const ids=(access.classIds||[]).filter(Boolean);
  if(!ids.length){panel.innerHTML='<div class="ta-wrap"><div class="ta-card"><h2>No class yet</h2><p class="ta-hint">No class is assigned to your account yet.</p></div></div>';return}
  if(!teacherAccessClass||!ids.includes(teacherAccessClass))teacherAccessClass=ids.includes(requestedClassId)?requestedClassId:ids[0];
  const base="b3Games/workspaces/"+ws+"/classes/";
  const snaps=await Promise.all(ids.map(id=>db.ref(base+id).once("value")));
  const recs={};ids.forEach((id,i)=>recs[id]=snaps[i].val()||{});
  const rec=recs[teacherAccessClass],name=rec.name||teacherAccessClass;
  const legacy=teacherAccessClass==="et"||teacherAccessClass==="wt";
  const locked=rec.siteEnabled===false||(rec.access&&rec.access.mode==="locked");
  const picker=ids.length>1?'<select id="taPick">'+ids.map(id=>'<option value="'+taEsc(id)+'"'+(id===teacherAccessClass?" selected":"")+'>'+taEsc(recs[id].name||id)+'</option>').join("")+'</select>':"";
  panel.innerHTML='<div class="ta-wrap">'+picker+'<div class="ta-card"><h2>'+taEsc(name)+'</h2><p class="ta-hint">'+(legacy?"This class follows the B3 master schedule, so it can't be locked here.":"When your class is locked, your students can't open any activity. Unlock it when you want them to play.")+'</p><div class="ta-pill '+(locked?"ta-locked":"ta-open")+'">'+(locked?"🔒 LOCKED":"✅ OPEN")+'</div>'+(legacy?"":'<div class="ta-btns"><button class="ta-lock" id="taLock" '+(locked?"disabled":"")+'>🔒 Lock my class now</button><button class="ta-unlock" id="taUnlock" '+(locked?"":"disabled")+'>✅ Unlock my class</button></div>')+'<div class="ta-msg" id="taMsg">'+taEsc(msg||"")+'</div></div></div>';
  const pick=document.getElementById("taPick");if(pick)pick.onchange=()=>{teacherAccessClass=pick.value;renderTeacherAccess()};
  const save=async lockIt=>{
    const msgEl=document.getElementById("taMsg");msgEl.textContent="Saving…";
    try{
      const u={};u[base+teacherAccessClass+"/access/mode"]=lockIt?"locked":"open";
      if(!lockIt&&rec.siteEnabled===false)u[base+teacherAccessClass+"/siteEnabled"]=true;
      await db.ref().update(u);
      renderTeacherAccess(lockIt?"Class locked ✓":"Class unlocked ✓");
    }catch(err){console.error(err);msgEl.textContent="Could not save. Please try again."}
  };
  const lb=document.getElementById("taLock"),ub=document.getElementById("taUnlock");
  if(lb)lb.onclick=()=>save(true);if(ub)ub.onclick=()=>save(false);
}
// ---- Owner Control page -------------------------------------------------
// One class at a time: status, Automatic / Open now / Lock now, and every
// game with a one-tap Open/Closed switch. Starred games stay open while the
// class is locked.
let CP_CLASSES=[{id:"et",name:"ET"},{id:"wt",name:"WT"}];
let cpRecords={},cpClassesUnsub=false;
let cpClass=(embedMode&&requestedClassId)?requestedClassId:(()=>{try{return localStorage.getItem("b3ControlClass")||"et"}catch(e){return "et"}})();
let cpSettings=null,cpUnsub=null,cpTimer=null,cpBusy=false,cpMsg="";
function cpClassTabs(){
 return CP_CLASSES.map(c=>'<button type="button" data-cp-class="'+cpEsc(c.id)+'" class="'+(c.id===cpClass?'on':'')+'"><span class="cp-dot"></span>'+cpEsc(c.name)+'</button>').join('');
}
function cpBindClassTabs(panel){
 panel.querySelectorAll("[data-cp-class]").forEach(b=>b.onclick=()=>{
   cpClass=b.dataset.cpClass;cpMsg="";
   try{localStorage.setItem("b3ControlClass",cpClass)}catch(e){}
   renderOwnerControl();
 });
}
function cpWatchClasses(){
 const w=frame.contentWindow,db=w?.firebase?.database?.(),ws=w?.B3SiteSettings?.workspaceId||"b3-2026";
 if(!db||cpClassesUnsub)return;
 cpClassesUnsub=true;
 db.ref("b3Games/workspaces/"+ws+"/classes").on("value",snapshot=>{
   cpRecords=snapshot.val()||{};
   const all=Object.entries(cpRecords).filter(([id,row])=>/^[A-Za-z0-9_-]{1,100}$/.test(id)&&row&&row.active!==false);
   all.sort(([a,ar],[b,br])=>{
     const priority=id=>id==="et"?0:id==="wt"?1:2;
     return priority(a)-priority(b)||String(ar.name||a).localeCompare(String(br.name||b));
   });
   CP_CLASSES=all.map(([id,row])=>({id,name:String(row.name||id)}));
   if(!CP_CLASSES.some(c=>c.id===cpClass))cpClass=CP_CLASSES[0]?.id||"";
   if(currentTab==="access"&&isOwnerNow())renderOwnerControl();
 },e=>{console.error("Could not load class registry",e);cpClassesUnsub=false});
}
function cpApi(){return frame.contentWindow?.B3SiteSettings}
function cpGames(){
  const d=frame.contentDocument;if(!d)return [];
  const seen=new Set();
  return [...d.querySelectorAll(".game-card[data-game-id]")].map(card=>{
    const id=card.dataset.gameId;if(!id||seen.has(id))return null;seen.add(id);
    return {id,name:(card.querySelector(".card-title")?.textContent||card.textContent).trim()};
  }).filter(Boolean);
}
function cpFmt(mins){let h=Math.floor(mins/60)%24,m=mins%60;const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap}
function cpNow(){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value||"";
  return {day:get("weekday").slice(0,3).toLowerCase(),mins:(Number(get("hour"))%24)*60+Number(get("minute"))};
}
function cpToMin(t){const [h,m]=String(t||"0:0").split(":").map(Number);return (h||0)*60+(m||0)}
// Next schedule change today, e.g. "locks at 12:15 PM" / "opens at 12:25 PM".
function cpNextChange(lockWindows,isLockedNow){
  const now=cpNow(),ranges=(lockWindows&&lockWindows[now.day])||[];
  if(isLockedNow){
    const r=ranges.find(r=>{const s=cpToMin(r.start),e=cpToMin(r.end);return s===e||(s<e?now.mins>=s&&now.mins<e:now.mins>=s||now.mins<e)});
    if(!r||cpToMin(r.start)===cpToMin(r.end))return "locked all day";
    return "opens at "+cpFmt(cpToMin(r.end));
  }
  const next=ranges.map(r=>cpToMin(r.start)).filter(s=>s>now.mins).sort((a,b)=>a-b)[0];
  return next==null?"no more locks today":"locks at "+cpFmt(next);
}
function cpEsc(v){const d=document.createElement("div");d.textContent=String(v==null?"":v);return d.innerHTML}
function startOwnerControl(){
  cpWatchClasses();
  const api=cpApi();
  if(!api){document.getElementById("ownerControlPanel").innerHTML='<div class="cp-wrap"><div class="ta-card">Loading…</div></div>';setTimeout(()=>{if(currentTab==="access"&&isOwnerNow())startOwnerControl()},700);return}
  if(!cpUnsub){cpUnsub=true;api.subscribe(s=>{cpSettings=api.normalizeSettings?api.normalizeSettings(s):s;if(currentTab==="access")renderOwnerControl();});}
  if(!cpTimer)cpTimer=setInterval(()=>{if(currentTab==="access"&&isOwnerNow())renderOwnerControl()},30000);
  renderOwnerControl();
}
function renderOwnerControl(){
  const panel=document.getElementById("ownerControlPanel"),api=cpApi();
  if(!cpSettings||!api){panel.innerHTML='<div class="cp-wrap"><div class="ta-card">Loading your classes…</div></div>';return}
  if(!CP_CLASSES.length){panel.innerHTML='<div class="cp-wrap"><div class="ta-card">No active classes yet. Add one in Administration.</div></div>';return}
  if(!["et","wt"].includes(cpClass))return renderOwnerPlatformClass(panel);
  const s=cpSettings,cls=cpClass,info=api.describeClassAccess(s,cls),access=s.classAccess?.[cls]||{mode:"auto"};
  const stars=api.activeLockedGameList?api.activeLockedGameList(s,cls):String(s.classLockedGameOverride?.[cls]||"").split(",").map(v=>v.trim()).filter(Boolean);
  const starUntil=id=>{const ms=api.lockedGameExpiry?api.lockedGameExpiry(s,cls,id):0;return ms?" · until "+new Date(ms).toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"}):""};
  let detail;
  if(s.siteEnabled===false)detail="Emergency lock is on";
  else if(access.mode==="open")detail="Opened by you · stays open until you press Automatic";
  else if(access.mode==="locked")detail="Locked by you · stays locked until you press Automatic";
  else detail="Following recess schedule · "+cpNextChange(access.lockWindows,!info.open);
  const tabsHtml=cpClassTabs();
  const CL=cls.toUpperCase(),badge='<span class="cp-cls '+cls+'">'+CL+'</span>';
  const modes=[["auto","⏰ "+CL+" Automatic"],["open","🔓 Open "+CL+" now"],["locked","🔒 Lock "+CL+" now"]].map(([m,l])=>'<button type="button" data-cp-mode="'+m+'" class="'+(access.mode===m?"on":"")+'"'+(cpBusy?" disabled":"")+'>'+l+'</button>').join("");
  const games=cpGames().filter(g=>s.games?.[g.id]!==false);
  const rows=games.map(g=>{
    const open=s.classGames?.[cls]?.[g.id]!==false,starred=stars.includes(g.id);
    const note=starred?(info.open?"⭐ stays open during lock":"⭐ open now even though class is locked")+starUntil(g.id):"";
    return '<div class="cp-row"><button type="button" class="cp-star'+(starred?" on":"")+'" data-cp-star="'+cpEsc(g.id)+'" title="'+(starred?"Remove "+CL+" star":"Keep this game open for "+CL+" while "+CL+" is locked")+'" aria-label="Star '+cpEsc(g.name)+' for '+CL+'"'+(cpBusy?" disabled":"")+'>⭐</button>'
      +'<div class="cp-name">'+badge+cpEsc(g.name)+(note?'<small>'+note+'</small>':"")+'</div>'
      +'<button type="button" class="cp-toggle '+(open?"open":"closed")+'" data-cp-game="'+cpEsc(g.id)+'"'+(cpBusy?" disabled":"")+'>'+(open?"✅ "+CL+" Open":"⛔ "+CL+" Closed")+'</button></div>';
  }).join("");
  panel.innerHTML='<div class="cp-wrap cls-'+cls+'"><div class="cp-switch">'+tabsHtml+'</div>'
    +(s.siteEnabled===false?'<div class="cp-emergency"><span>🚨 Emergency lock is ON — every class is locked.</span><button type="button" id="cpEmergencyOff">Turn emergency lock off</button></div>':"")
    +'<div class="cp-status '+(info.open?"open":"locked")+'"><div>'+(info.open?"✅ "+cls.toUpperCase()+" is OPEN":"🔒 "+cls.toUpperCase()+" is LOCKED")+'<small>'+cpEsc(detail)+'</small></div></div>'
    +'<div class="cp-modes">'+modes+'</div>'
    +'<div class="cp-games"><div class="cp-games-head">Games for '+cls.toUpperCase()+'<span>Tap to open/close · ⭐ = stays open during lock (turns itself off when the lock ends)</span></div>'+(games.length?'<div class="cp-bulk"><button type="button" class="all-open" data-cp-all="open"'+(cpBusy?" disabled":"")+'>✅ Open ALL</button><button type="button" class="all-closed" data-cp-all="closed"'+(cpBusy?" disabled":"")+'>⛔ Close ALL</button></div>':"")+(rows||'<div class="cp-row"><div></div><div class="cp-name">No games yet.</div><div></div></div>')+'</div>'
    +'<div class="cp-msg" id="cpMsg">'+cpEsc(cpMsg)+'</div></div>';
  cpBindClassTabs(panel);
  panel.querySelectorAll("[data-cp-mode]").forEach(b=>b.onclick=()=>cpSave(()=>api.updateClassMode(cls,b.dataset.cpMode),{auto:"Back on the recess schedule ✓",open:cls.toUpperCase()+" opened ✓",locked:cls.toUpperCase()+" locked ✓"}[b.dataset.cpMode]));
  panel.querySelectorAll("[data-cp-game]").forEach(b=>b.onclick=()=>{const id=b.dataset.cpGame,open=s.classGames?.[cls]?.[id]!==false,name=games.find(g=>g.id===id)?.name||id;
    cpSave(async()=>{await api.updateClassGameEnabled(cls,id,!open);if(open&&stars.includes(id))await api.setClassLockedGame(cls,id,false);},name+(open?" closed":" opened")+" for "+cls.toUpperCase()+" ✓")});
  panel.querySelectorAll("[data-cp-all]").forEach(b=>b.onclick=()=>{const open=b.dataset.cpAll==="open";
    if(!confirm((open?"Open":"Close")+" ALL "+games.length+" games for "+CL+"?"))return;
    cpSave(async()=>{for(const g of games){const cur=s.classGames?.[cls]?.[g.id]!==false;if(cur!==open)await api.updateClassGameEnabled(cls,g.id,open);if(!open&&stars.includes(g.id))await api.setClassLockedGame(cls,g.id,false);}},"All games "+(open?"opened":"closed")+" for "+CL+" ✓")});
  panel.querySelectorAll("[data-cp-star]").forEach(b=>b.onclick=()=>{const id=b.dataset.cpStar,name=games.find(g=>g.id===id)?.name||id;
    if(stars.includes(id))return cpSave(()=>api.setClassLockedGame(cls,id,false),name+" will lock with the class ✓");
    cpSave(async()=>{if(s.classGames?.[cls]?.[id]===false)await api.updateClassGameEnabled(cls,id,true);await api.setClassLockedGame(cls,id,true);},name+" will stay open until this lock ends ✓");});
  const em=document.getElementById("cpEmergencyOff");if(em)em.onclick=()=>{if(confirm("Turn the emergency lock off? Classes go back to their normal settings."))cpSave(()=>api.updateSiteEnabled(true),"Emergency lock off ✓")};
}
// New classes use their own access and tool grants, never B3's shared ET/WT settings.
function renderOwnerPlatformClass(panel){
 const id=cpClass,row=cpRecords[id],w=frame.contentWindow;
 if(!row){panel.innerHTML='<div class="cp-wrap"><div class="ta-card">Loading class settings…</div></div>';return}
 const name=String(row.name||id),mode=row.access?.mode==="locked"?"locked":"open",isOpen=row.siteEnabled!==false&&mode!=="locked"&&cpSettings?.siteEnabled!==false;
 const tools=cpGames().map(t=>({id:t.id==="class-gallery"?"gallery":t.id,name:t.name}));
 tools.push({id:"tag",name:"Tag Game"});
 const known=new Set(),distinct=tools.filter(t=>{if(known.has(t.id))return false;known.add(t.id);return true});
 const rows=distinct.map(t=>{
   const on=row.toolGrants?.[t.id]===true;
   return '<div class="cp-row"><div></div><div class="cp-name">'+cpEsc(t.name)+'</div><button type="button" class="cp-toggle '+(on?"open":"closed")+'" data-cp-grant="'+cpEsc(t.id)+'"'+(cpBusy?" disabled":"")+'>'+(on?"✅ Enabled":"⛔ Disabled")+'</button></div>';
 }).join("");
 panel.innerHTML='<div class="cp-wrap"><div class="cp-switch">'+cpClassTabs()+'</div>'
  +(cpSettings?.siteEnabled===false?'<div class="cp-emergency">🚨 The global emergency lock is on for all classes. <button type="button" id="cpEmergencyOffNew">Turn emergency lock off</button></div>':"")
  +'<div class="cp-status '+(isOpen?"open":"locked")+'"><div>'+(isOpen?"✅ ":"🔒 ")+cpEsc(name)+(isOpen?" is OPEN":" is LOCKED")+'<small>Only this class is affected by the controls below.</small></div></div>'
  +'<div class="cp-modes"><button type="button" data-cp-new-mode="open" class="'+(mode==="open"?"on":"")+'"'+(cpBusy?" disabled":"")+'>🔓 Open this class</button><button type="button" data-cp-new-mode="locked" class="'+(mode==="locked"?"on":"")+'"'+(cpBusy?" disabled":"")+'>🔒 Lock this class</button></div>'
  +'<div class="cp-games"><div class="cp-games-head">Tools for '+cpEsc(name)+'<span>Each tool is enabled or disabled for this class independently. Only enabled tools are available to students and teachers.</span></div>'
  +(distinct.length?'<div class="cp-bulk"><button type="button" class="all-open" data-cp-grant-all="1"'+(cpBusy?" disabled":"")+'>✅ Enable ALL</button><button type="button" class="all-closed" data-cp-grant-all="0"'+(cpBusy?" disabled":"")+'>⛔ Disable ALL</button></div>':"")
  +(rows||'<div class="cp-row">No class activities found.</div>')+'</div>'
  +'<div class="cp-msg">'+cpEsc(cpMsg)+'</div></div>';
 cpBindClassTabs(panel);
 const db=w?.firebase?.database?.(),ws=w?.B3SiteSettings?.workspaceId||"b3-2026",base="b3Games/workspaces/"+ws+"/classes/"+id;
 panel.querySelectorAll("[data-cp-new-mode]").forEach(b=>b.onclick=()=>cpSave(()=>{
   if(b.dataset.cpNewMode==="open"){
     const updates={};
     updates[base+"/access/mode"]="open";
     updates[base+"/siteEnabled"]=true;
     return db.ref().update(updates);
   }
   return db.ref(base+"/access/mode").set("locked");
 },name+(b.dataset.cpNewMode==="locked"?" locked ✓":" opened ✓")));
 const emergency=document.getElementById("cpEmergencyOffNew");
 if(emergency)emergency.onclick=()=>{
   if(confirm("Turn off the emergency lock for every class?"))
     cpSave(()=>cpApi().updateSiteEnabled(true),"Emergency lock off ✓");
 };
 panel.querySelectorAll("[data-cp-grant-all]").forEach(b=>b.onclick=()=>{
   const on=b.dataset.cpGrantAll==="1";
   if(!confirm((on?"Enable":"Disable")+" ALL tools for "+name+"?"))return;
   const updates={};distinct.forEach(t=>{updates[base+"/toolGrants/"+t.id]=on;});
   cpSave(()=>db.ref().update(updates),"All tools "+(on?"enabled":"disabled")+" for "+name+" ✓");
 });
 panel.querySelectorAll("[data-cp-grant]").forEach(b=>b.onclick=()=>{
   const tool=b.dataset.cpGrant,on=row.toolGrants?.[tool]===true;
   cpSave(()=>db.ref(base+"/toolGrants/"+tool).set(!on),
     tool+(on?" disabled":" enabled")+" for "+name+" ✓");
 });
}
async function cpSave(fn,okMsg){
  if(cpBusy)return;cpBusy=true;cpMsg="Saving…";renderOwnerControl();
  try{await fn();cpMsg=okMsg;}catch(e){console.error(e);cpMsg="Could not save. Please try again.";}
  cpBusy=false;renderOwnerControl();
}
function applyRoleView(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    const access=w?.B3SiteSettings?.getCurrentAccess?.()||{};
    const owner=access.role==="admin";
    document.getElementById('viewAsTeacher').style.display=owner?'':'none';
    document.getElementById('activitiesNav').style.display=owner?'':'none';
    document.getElementById('administrationNav').style.display=owner?'':'none';
    document.getElementById('teacherCenterSignOut').style.display=access.authorized?'':'none';
    const teacherPanel=document.getElementById("teacherAccessPanel");
    // Auth resolves asynchronously inside the embedded page. If this page was
    // initially rendered as a regular-teacher view, make sure the stale
    // "Loading your class..." overlay is removed as soon as the owner/admin
    // role becomes available.
    d.body.classList.toggle("b3-owner-view",owner);
    if(owner&&teacherPanel&&teacherPanel.style.display!=="none")showTab(currentTab);
    document.querySelector(".brand").textContent="Teacher Tools";
    const accessNav=document.getElementById("classAccessNav");
    if(accessNav){accessNav.style.display="";accessNav.innerHTML='🔐 Class Access<small>'+(owner?'Lock / unlock · schedules · exceptions':'Lock or unlock your assigned class')+'</small>';}
    if(!owner){d.querySelectorAll("p,div,span").forEach(n=>{if(n.children.length===0&&/Turn this off only when you want both ET and WT/.test(n.textContent))n.style.display="none"});}
    // Teacher-account creation is platform-owner administration only.
    const teacherHeading=[...d.querySelectorAll("#adminControls h3")].find(h=>h.textContent.trim()==="Teacher accounts");
    if(teacherHeading){
      teacherHeading.style.display=owner?"":"none";
      let n=teacherHeading.nextElementSibling;
      for(let i=0;i<2&&n;i++){const next=n.nextElementSibling;n.style.display=owner?"":"none";n=next;}
    }
  }catch(e){console.warn("Could not apply teacher role view",e);}
}
function organize(){
  const d=frame.contentDocument;if(!d)return;
  const panel=d.getElementById("adminPanel"),controls=d.getElementById("adminControls");if(!panel||!controls)return;
  panel.classList.remove("hidden");

  if(!d.getElementById("admin-section-activities")){
    const students=makeSection(d,"students"),settings=makeSection(d,"access"),activities=makeSection(d,"activities");
    const classManagement=d.getElementById("classManagementSection");
    if(classManagement)students.appendChild(classManagement);
    const add=(title,help,ownerOnly)=>{const h=d.createElement("h3");h.textContent=title;settings.appendChild(h);let p=null;if(help){p=d.createElement("p");p.className="admin-message";p.textContent=help;settings.appendChild(p);}if(ownerOnly){h.classList.add("b3-owner-only");if(p)p.classList.add("b3-owner-only");}};
    // 1. Recess schedule (the Automatic times)
    add("⏰ Recess schedule","These are the times each class is LOCKED when it is set to Automatic. Open a class below to change its times.",true);
    const classControls=d.getElementById("classControls");if(classControls)settings.appendChild(classControls);
    // 2. One-student exceptions
    const sh=findHeading(d,"Student access while locked");if(sh){sh.textContent="⭐ Special access for one student";moveRange(sh,4,settings);}
    // 3. Add / remove games for everyone
    const ah=findHeading(d,"Student activities");if(ah){ah.textContent="Active & Inactive Activities";moveRange(ah,3,activities);
      const help=activities.querySelector(".activity-manager-help");if(help)help.textContent="Active activities appear for students. Inactive activities are hidden from everyone. Drag between the columns. Use Class Access to open or close an active game temporarily.";}
    // 4. Emergency lock
    add("🚨 Emergency lock","Turning off Emergency master access locks every class at once.",true);
    const master=controls.querySelector(".master-row");if(master){const p=master.nextElementSibling;master.classList.add("b3-owner-only");settings.appendChild(master);if(p&&p.classList.contains("admin-message")){p.classList.add("b3-owner-only");settings.appendChild(p)}}
    if(classControls)classControls.classList.add("b3-owner-only");
    // Teacher accounts and class creation live in Owner Admin.
    const status=d.getElementById("adminStatus"),out=d.getElementById("signOutButton");
    if(status)status.style.display='none';if(out)out.style.display='none';
  }
  applyRoleView();
  if(requestedClassId){
    const select=d.getElementById("manageClassSelect");
    if(select&&[...select.options].some(o=>o.value===requestedClassId)&&select.value!==requestedClassId){
      select.value=requestedClassId;
      select.dispatchEvent(new Event("change",{bubbles:true}));
    }
  }
  showTab(currentTab);
}
function showTab(tab){
  if((tab==="administration"||tab==="activities")&&!isOwnerNow())tab="access";
  currentTab=tab;
  const d=frame.contentDocument;if(!d)return;
  const owner=isOwnerNow();
  const adminView=document.getElementById('administrationFrame'),isAdministration=tab==='administration'&&owner;
  adminView.style.display=isAdministration?'block':'none';
  frame.style.display=isAdministration?'none':'block';
  if(isAdministration&&!adminView.getAttribute('src'))adminView.src='owner-admin.html?embedded=1';
  const teacherPanel=document.getElementById("teacherAccessPanel"),isTeacherAccess=tab==="access"&&!owner;
  teacherPanel.style.display=isTeacherAccess?"block":"none";
  if(isTeacherAccess)renderTeacherAccess();
  const ownerPanel=document.getElementById("ownerControlPanel"),isOwnerControl=tab==="access"&&owner;
  ownerPanel.style.display=isOwnerControl?"block":"none";
  if(isOwnerControl)startOwnerControl();
  d.querySelectorAll(".admin-dashboard-section").forEach(s=>s.style.display=s.id==="admin-section-"+tab?"block":"none");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  document.getElementById("pageTitle").textContent=tabs[tab][0];
  document.getElementById("pageSub").textContent=isTeacherAccess?"Lock or unlock your class for your students.":tabs[tab][1];
  if(isTeacherAccess)document.getElementById("pageTitle").textContent="Class Access";
  frame.contentWindow.scrollTo(0,0);
}
document.querySelectorAll(".nav-btn[data-tab]").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
frame.addEventListener("load",()=>{
  const d=frame.contentDocument;
  const style=d.createElement("style");
  style.textContent=`
    body{padding:22px 24px 55px!important;background:#f1f5f9!important;text-align:left!important}
    body>h1,body>.subtitle,#studentBar,#loginCard,#lockedCard,#gamesArea,#teacherToolsSection,#approvalCenterButton,.admin-button{display:none!important}
    .admin-panel{position:static!important;display:block!important;width:min(1000px,100%)!important;max-height:none!important;overflow:visible!important;margin:0 auto!important;padding:0!important;background:transparent!important;box-shadow:none!important}
    .admin-panel>h2{display:none!important}.admin-panel>#adminStatus{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:11px 14px;margin:0 0 16px!important}
    #adminPasswordGate,#signInButton,#signOutButton{max-width:520px}
    #adminControls{background:transparent!important}
    .admin-dashboard-section{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 5px 18px rgba(15,23,42,.06)}
    .admin-dashboard-section>h3{font-size:22px!important;margin:0 0 5px!important;padding:0!important;border:0!important;color:#26364a}
    .admin-dashboard-section>.admin-message,.admin-dashboard-section>.activity-manager-help{margin-bottom:16px!important}
    .class-card{padding:16px!important}.override-box{margin-top:10px!important}
    body.admin-panel-open #gamesArea,body.admin-panel-open #teacherToolsSection{width:auto!important;margin:0!important}
    body:not(.b3-owner-view) .b3-owner-only{display:none!important}
    body.b3-owner-view #classControls .mode-buttons,
    body.b3-owner-view #classControls .class-card>div:has(>[data-locked-game-override]),
    body.b3-owner-view .activity-class-controls{display:none!important}
    #admin-section-access>h3{margin-top:26px!important}#admin-section-access>h3:first-child{margin-top:0!important}
    @media(max-width:650px){body{padding:12px!important}.admin-dashboard-section{padding:14px}.mode-buttons{grid-template-columns:1fr!important}}
  `;
  d.head.appendChild(style);
  const resize=()=>{const height=d.body.offsetHeight;if(frame.style.height!==height+'px')frame.style.height=height+'px';};
  // Resize on the next frame: changing the frame's height inside the observer callback
  // re-lays out the observed body and raises "ResizeObserver loop" errors (seen in Safari).
  new ResizeObserver(()=>requestAnimationFrame(resize)).observe(d.body);
  resize();
  organize();
  // Do not observe/rewrite the panel class here. The embedded page legitimately
  // changes it during login/auth rendering; forcing it back synchronously caused
  // a MutationObserver loop that froze the entire Teacher Center.
  const panel=d.getElementById("adminPanel");
  if(panel) panel.classList.remove("hidden");
  setTimeout(applyRoleView,700);
  setTimeout(applyRoleView,1800);
  // Sign-in finishes at its own pace; keep the owner/teacher view in sync.
  if(!window.__b3RoleTimer)window.__b3RoleTimer=setInterval(applyRoleView,2500);
});
