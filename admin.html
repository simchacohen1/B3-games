<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B3 Teacher Administration</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f1f5f9;color:#1f2937}
body{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:#172033;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}
.brand{font-size:22px;font-weight:900;margin:0 8px 5px}.brand-sub{font-size:12px;color:#aebbd0;margin:0 8px 24px;line-height:1.4}
nav{display:grid;gap:7px}.nav-btn{width:100%;border:0;border-radius:11px;background:transparent;color:#dbe5f4;text-align:left;padding:12px 13px;font-size:14px;font-weight:800;cursor:pointer}
.nav-btn:hover{background:#24314a}.nav-btn.active{background:#fff;color:#172033}
.back{display:block;margin-top:24px;color:#cbd5e1;text-decoration:none;font-size:13px;font-weight:800;padding:11px 13px;border-top:1px solid #334155}
main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 28px}.workspace{position:relative;height:calc(100vh - 72px)}
.topbar h1{font-size:23px;margin:0}.topbar p{font-size:12px;color:#64748b;margin:4px 0 0}
iframe{display:block;width:100%;height:100%;border:0;background:#f1f5f9}.student-preview{display:none;position:absolute;right:18px;top:18px;bottom:18px;width:min(430px,38vw);background:#fff;border:1px solid #cbd5e1;border-radius:16px;box-shadow:0 12px 35px rgba(15,23,42,.18);overflow:hidden;z-index:5}.student-preview.visible{display:flex;flex-direction:column}.preview-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #e2e8f0;font-weight:900}.preview-head button{border:0;background:#eef2f7;border-radius:8px;padding:6px 9px;cursor:pointer;font-weight:800}.preview-viewport{position:relative;flex:1;overflow:auto;background:#e2e8f0}.student-preview iframe{position:absolute;left:0;top:0;width:1280px;height:900px;background:#fff;transform-origin:top left;border:0}.preview-resizer{display:none;position:absolute;top:18px;bottom:18px;width:12px;z-index:6;cursor:col-resize;transform:translateX(-6px)}.preview-resizer::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:#94a3b8;border-radius:2px}.workspace.preview-open .preview-resizer{display:block}.workspace.preview-open>#adminFrame{width:calc(100% - var(--preview-space,448px))}
@media(max-width:760px){body{grid-template-columns:1fr}aside{position:static;height:auto;padding:14px}.brand-sub{margin-bottom:12px}nav{grid-template-columns:repeat(2,1fr)}.back{margin-top:12px}.topbar{display:none}.workspace{height:calc(100vh - 270px)}.student-preview{right:8px;left:8px;top:8px;bottom:8px;width:auto}.workspace.preview-open>#adminFrame{width:100%}}
</style>
</head>
<body>
<aside>
  <div class="brand">B3 Teacher Center</div>
  <div class="brand-sub">Everything for your class, organized in one place.</div>
  <nav>
    <button class="nav-btn active" data-tab="access">🔐 Class Access</button>
    <button class="nav-btn" data-tab="students">👥 Students &amp; Classes</button>
    <button class="nav-btn" data-tab="activities">🎮 Activities</button>
    <button class="nav-btn" data-tab="special">⭐ Special Access</button>
    <button class="nav-btn" data-tab="teachers">👨‍🏫 Teacher Accounts</button>
  </nav>
  <a class="back" href="index.html">← Back to B3 Games</a>
</aside>
<main>
  <div class="topbar"><div><h1 id="pageTitle">Class Access</h1><p id="pageSub">Open, close, and schedule your classes.</p></div></div>
  <div class="workspace" id="workspace">
    <iframe id="adminFrame" src="index.html?adminPage=1" title="B3 administration"></iframe>
    <div class="preview-resizer" id="previewResizer" title="Drag to resize preview"></div><aside class="student-preview" id="studentPreview">
      <div class="preview-head"><span>👀 Student Preview</span><button id="refreshPreview" type="button">Refresh</button></div>
      <div class="preview-viewport" id="previewViewport"><iframe id="studentPreviewFrame" src="index.html?preview=1" title="Student view preview"></iframe></div>
    </aside>
  </div>
</main>
<script>
const tabs={
  access:["Class Access","Open, close, and schedule your classes."],
  students:["Students & Classes","Add students, change passcodes, and choose class memberships."],
  activities:["Activities","Choose which B3 activities each class can use."],
  special:["Special Access","Give an individual student access while the class is locked."],
  teachers:["Teacher Accounts","Manage the teachers connected to this workspace."]
};
let currentTab="access";
const frame=document.getElementById("adminFrame");

function findHeading(d,text){
  return [...d.querySelectorAll("#adminControls > h3")].find(h=>h.textContent.trim()===text);
}
function makeSection(d,id){
  let s=d.getElementById("admin-section-"+id);
  if(!s){s=d.createElement("section");s.id="admin-section-"+id;s.className="admin-dashboard-section";d.getElementById("adminControls").appendChild(s)}
  return s;
}
function moveRange(start,count,target){let n=start;for(let i=0;i<count&&n;i++){const next=n.nextElementSibling;target.appendChild(n);n=next}}
function organize(){
  const d=frame.contentDocument;if(!d)return;
  const panel=d.getElementById("adminPanel"),controls=d.getElementById("adminControls");if(!panel||!controls)return;
  panel.classList.remove("hidden");

  if(!d.getElementById("admin-section-access")){
    const access=makeSection(d,"access"),students=makeSection(d,"students"),activities=makeSection(d,"activities"),special=makeSection(d,"special"),teachers=makeSection(d,"teachers");
    const master=controls.querySelector(".master-row");if(master){access.appendChild(master);const p=master.nextElementSibling;if(p&&p.classList.contains("admin-message"))access.appendChild(p)}
    const classControls=d.getElementById("classControls");if(classControls)access.appendChild(classControls);
    const ch=findHeading(d,"Class management");if(ch)moveRange(ch,3,students);
    const th=findHeading(d,"Teacher accounts");if(th)moveRange(th,3,teachers);
    const ah=findHeading(d,"Student activities");if(ah)moveRange(ah,3,activities);
    const sh=findHeading(d,"Student access while locked");if(sh)moveRange(sh,4,special);
  }
  showTab(currentTab);
}
function showTab(tab){
  currentTab=tab;
  const preview=document.getElementById("studentPreview"),workspace=document.getElementById("workspace");
  const showing=tab==="activities";
  preview.classList.toggle("visible",showing);workspace.classList.toggle("preview-open",showing);
  if(showing){ document.getElementById("studentPreviewFrame").contentWindow.location.reload(); setTimeout(scaleStudentPreview,0); }
  const d=frame.contentDocument;if(!d)return;
  d.querySelectorAll(".admin-dashboard-section").forEach(s=>s.style.display=s.id==="admin-section-"+tab?"block":"none");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  document.getElementById("pageTitle").textContent=tabs[tab][0];
  document.getElementById("pageSub").textContent=tabs[tab][1];
  frame.contentWindow.scrollTo(0,0);
}
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
const previewFrame=document.getElementById("studentPreviewFrame"),previewViewport=document.getElementById("previewViewport"),previewPanel=document.getElementById("studentPreview"),previewResizer=document.getElementById("previewResizer"),workspaceEl=document.getElementById("workspace");
function setPreviewWidth(width){
  const min=300,max=Math.max(320,workspaceEl.clientWidth-360);
  const w=Math.max(min,Math.min(max,width));
  previewPanel.style.width=w+"px";
  previewResizer.style.right=(18+w)+"px";
  workspaceEl.style.setProperty("--preview-space",(w+36)+"px");
  scaleStudentPreview();
}
let resizingPreview=false;
previewResizer.addEventListener("pointerdown",e=>{resizingPreview=true;previewResizer.setPointerCapture(e.pointerId);document.body.style.userSelect="none";});
previewResizer.addEventListener("pointermove",e=>{if(!resizingPreview)return;const rect=workspaceEl.getBoundingClientRect();setPreviewWidth(rect.right-e.clientX-18);});
previewResizer.addEventListener("pointerup",()=>{resizingPreview=false;document.body.style.userSelect="";});
setPreviewWidth(Math.min(430,workspaceEl.clientWidth*.38));
function syncStudentPreview(){
  try{
    const adminDoc=frame.contentDocument, studentDoc=previewFrame.contentDocument;
    if(!adminDoc||!studentDoc)return;
    const inactive=new Set([...adminDoc.querySelectorAll("#inactiveActivityList [data-activity-id]")].map(row=>row.dataset.activityId));
    studentDoc.querySelectorAll(".game-card[data-game-id]").forEach(card=>{
      card.classList.toggle("hidden",inactive.has(card.dataset.gameId));
    });
    studentDoc.querySelectorAll(".game-group").forEach(group=>{
      const any=[...group.querySelectorAll(".game-card")].some(card=>!card.classList.contains("hidden"));
      group.classList.toggle("hidden",!any);
    });
  }catch(e){console.warn("Could not sync student preview",e);}
}
function scaleStudentPreview(){
  const desktopWidth=1280, desktopHeight=900;
  const scale=Math.min(previewViewport.clientWidth/desktopWidth,previewViewport.clientHeight/desktopHeight);
  previewFrame.style.transform="scale("+scale+")";
  previewFrame.style.width=desktopWidth+"px";
  previewFrame.style.height=desktopHeight+"px";
}
previewFrame.addEventListener("load",()=>{
  try{
    const d=previewFrame.contentDocument;
    const style=d.createElement("style");
    style.textContent=`#adminAccessButton,#adminPanel,#teacherToolsSection,#approvalCenterButton,.version-modal,.approval-center-modal{display:none!important}`;
    d.head.appendChild(style);
    const panel=d.getElementById("adminPanel"); if(panel) panel.classList.add("hidden");
    const tools=d.getElementById("teacherToolsSection"); if(tools) tools.classList.add("hidden");
    d.body.classList.remove("admin-panel-open");
  }catch(e){console.warn("Could not apply student preview mode",e);}
  syncStudentPreview();
  scaleStudentPreview();
});
window.addEventListener("resize",scaleStudentPreview);
document.getElementById("refreshPreview").addEventListener("click",()=>previewFrame.contentWindow.location.reload());
frame.addEventListener("load",()=>{
  const d=frame.contentDocument;
  const style=d.createElement("style");
  style.textContent=`
    body{padding:22px 24px 55px!important;background:#f1f5f9!important;text-align:left!important}
    body>h1,body>.subtitle,#studentBar,#loginCard,#lockedCard,#gamesArea,#teacherToolsSection,#approvalCenterButton,.admin-button{display:none!important}
    .admin-panel{position:static!important;display:block!important;width:min(1000px,100%)!important;max-height:none!important;overflow:visible!important;margin:0 auto!important;padding:0!important;background:transparent!important;box-shadow:none!important}
    .admin-panel>h2{display:none!important}.admin-panel>#adminStatus{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:11px 14px;margin:0 0 16px!important}
    #adminPasswordGate,#signInButton,#signOutButton{max-width:520px}
    #adminControls{background:transparent!important}
    .admin-dashboard-section{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 5px 18px rgba(15,23,42,.06)}
    .admin-dashboard-section>h3{font-size:22px!important;margin:0 0 5px!important;padding:0!important;border:0!important;color:#26364a}
    .admin-dashboard-section>.admin-message,.admin-dashboard-section>.activity-manager-help{margin-bottom:16px!important}
    .class-card{padding:16px!important}.override-box{margin-top:10px!important}
    body.admin-panel-open #gamesArea,body.admin-panel-open #teacherToolsSection{width:auto!important;margin:0!important}
    @media(max-width:650px){body{padding:12px!important}.admin-dashboard-section{padding:14px}.mode-buttons{grid-template-columns:1fr!important}}
  `;
  d.head.appendChild(style);
  organize();
  const activityLists=d.querySelectorAll("#activeActivityList,#inactiveActivityList");
  if(activityLists.length){
    const activityObserver=new MutationObserver(()=>syncStudentPreview());
    activityLists.forEach(list=>activityObserver.observe(list,{childList:true,subtree:true}));
  }
  syncStudentPreview();
  // Do not observe/rewrite the panel class here. The embedded page legitimately
  // changes it during login/auth rendering; forcing it back synchronously caused
  // a MutationObserver loop that froze the entire Teacher Center.
  const panel=d.getElementById("adminPanel");
  if(panel) panel.classList.remove("hidden");
});
</script>
</body>
</html>
