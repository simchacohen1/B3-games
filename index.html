<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>B3 Games</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        text-align: center;
        padding: 40px 20px;
    }

    h1 {
        font-size: 48px;
        margin-bottom: 30px;
        color: #333;
    }

    .game-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 20px;
        max-width: 900px;
        margin: auto;
    }

    .game-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: white;
        padding: 24px 12px;
        border-radius: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        text-decoration: none;
        transition: transform 0.15s, box-shadow 0.15s;
    }

    .game-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }

    .card-icon {
        font-size: 40px;
        line-height: 1;
    }

    .card-title {
        font-size: 17px;
        font-weight: bold;
        color: #333;
    }

    .hidden {
        display: none !important;
    }

    .admin-button {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 9999;
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        background: #1f2937;
        color: white;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }

    .admin-panel {
        position: fixed;
        top: 60px;
        right: 12px;
        width: 300px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 14px 32px rgba(0,0,0,0.18);
        padding: 16px;
        text-align: left;
        z-index: 9999;
        max-height: 80vh;
        overflow-y: auto;
    }

    .admin-panel h2 {
        margin: 0 0 12px;
        font-size: 20px;
    }

    .admin-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 0;
        font-size: 15px;
    }

    .admin-action {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        margin-top: 8px;
        background: #1f2937;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .admin-action.secondary {
        background: #e5e7eb;
        color: #111827;
    }

    .disabled-note {
        margin-top: 40px;
        color: #4b5563;
    }

    .admin-message {
        font-size: 13px;
        line-height: 1.4;
        color: #4b5563;
        margin: 0 0 12px;
    }
</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="site-settings.js"></script>
</head>

<body>
    <h1>B3 Games</h1>

    <div class="game-container">
        <a class="game-card" data-game-id="kahoot-word-quiz" href="kahoot-word-quiz/index.html">
            <span class="card-icon">❓</span>
            <span class="card-title">Kahoot Word Quiz Engine</span>
        </a>
        <a class="game-card" data-game-id="kodesh-construct" href="kodesh-construct/index.html">
            <span class="card-icon">🔤</span>
            <span class="card-title">Dikduk Arcade</span>
        </a>
        <a class="game-card" data-game-id="chumash-quiz" href="chumash-quiz/index.html">
            <span class="card-icon">📖</span>
            <span class="card-title">Chumash Quiz</span>
        </a>
        <a class="game-card" data-game-id="posuk-practice-scroll" href="record_pesukim/student.html">
            <span class="card-icon">📜</span>
            <span class="card-title">Posuk Practice Scroll</span>
        </a>
        <a class="game-card" data-game-id="rashi-letters" href="rashi-letters/student.html">
            <span class="card-icon">✡️</span>
            <span class="card-title">Rashi Letters</span>
        </a>
        <a class="game-card" data-game-id="shorashim" href="shorashim/index.html">
            <span class="card-icon">🌳</span>
            <span class="card-title">Shorashim</span>
        </a>
        <a class="game-card" data-game-id="class-gallery" href="class-gallery/index.html">
            <span class="card-icon">🖼️</span>
            <span class="card-title">Class Gallery</span>
        </a>
        <a class="game-card" data-game-id="game-show" href="game-show/player.html">
            <span class="card-icon">🏆</span>
            <span class="card-title">Game Show</span>
        </a>
    </div>

    <p id="disabledMessage" class="disabled-note hidden">All games are currently disabled.</p>

    <button id="adminAccessButton" class="admin-button">Admin</button>

    <div id="adminPanel" class="admin-panel hidden">
      <h2>Game Controls</h2>
      <p id="adminStatus" class="admin-message">Checking sign-in…</p>

      <button id="signInButton" class="admin-action">Sign in with Google</button>
      <button id="signOutButton" class="admin-action secondary hidden">Sign out</button>

      <div id="adminControls" class="hidden">
        <div class="admin-row">
          <label for="siteEnabledToggle">Site enabled</label>
          <input id="siteEnabledToggle" type="checkbox">
        </div>
        <div id="gameToggles"></div>
      </div>
    </div>

    <script>
      const settingsApi = window.B3SiteSettings;
      const adminAccessButton = document.getElementById("adminAccessButton");
      const adminPanel = document.getElementById("adminPanel");
      const adminControls = document.getElementById("adminControls");
      const signInButton = document.getElementById("signInButton");
      const signOutButton = document.getElementById("signOutButton");
      const siteEnabledToggle = document.getElementById("siteEnabledToggle");
      const gameToggles = document.getElementById("gameToggles");
      const disabledMessage = document.getElementById("disabledMessage");
      const adminStatus = document.getElementById("adminStatus");
      const gameCards = Array.from(document.querySelectorAll(".game-card"));

      const gameDefinitions = gameCards.map((card) => ({
          id: card.dataset.gameId,
          name: (card.querySelector(".card-title")?.textContent || card.textContent).trim(),
          element: card
      }));

      let currentSettings = settingsApi.defaultSettings;
      let currentUser = null;
      let isAuthorizedAdmin = false;

      function renderGames() {
          let visibleCount = 0;

          gameDefinitions.forEach((game) => {
              const shouldShow =
                  currentSettings.siteEnabled &&
                  currentSettings.games[game.id] !== false;

              game.element.classList.toggle("hidden", !shouldShow);

              if (shouldShow) {
                  visibleCount += 1;
              }
          });

          disabledMessage.classList.toggle("hidden", visibleCount !== 0);
      }

      function renderAdminPanel() {
          const signedIn = Boolean(currentUser);

          signInButton.classList.toggle("hidden", signedIn);
          signOutButton.classList.toggle("hidden", !signedIn);
          adminControls.classList.toggle("hidden", !isAuthorizedAdmin);

          if (!signedIn) {
              adminStatus.textContent =
                  "Sign in with the authorized Google account to change game settings.";
              return;
          }

          if (!isAuthorizedAdmin) {
              adminStatus.textContent =
                  `Signed in as ${currentUser.email || "an unauthorized account"}. This account cannot edit settings.`;
              return;
          }

          adminStatus.textContent =
              `Signed in as ${currentUser.email}. Changes affect everyone.`;

          siteEnabledToggle.checked = currentSettings.siteEnabled;
          gameToggles.innerHTML = "";

          gameDefinitions.forEach((game) => {
              const row = document.createElement("div");
              row.className = "admin-row";

              const label = document.createElement("label");
              label.setAttribute("for", `toggle-${game.id}`);
              label.textContent = game.name;

              const input = document.createElement("input");
              input.type = "checkbox";
              input.id = `toggle-${game.id}`;
              input.checked = currentSettings.games[game.id] !== false;

              input.addEventListener("change", async () => {
                  const oldValue = !input.checked;

                  try {
                      currentSettings.games[game.id] = input.checked;
                      renderGames();
                      await settingsApi.updateGameEnabled(game.id, input.checked);
                  } catch (error) {
                      currentSettings.games[game.id] = oldValue;
                      input.checked = oldValue;
                      renderGames();
                      alert("Could not save this game setting. Make sure you are signed in with the authorized account.");
                      console.error(error);
                  }
              });

              row.appendChild(label);
              row.appendChild(input);
              gameToggles.appendChild(row);
          });
      }

      adminAccessButton.addEventListener("click", () => {
          adminPanel.classList.toggle("hidden");
          if (!adminPanel.classList.contains("hidden")) {
              renderAdminPanel();
          }
      });

      signInButton.addEventListener("click", async () => {
          try {
              await settingsApi.signInWithGoogle();
          } catch (error) {
              alert("Google sign-in did not complete.");
              console.error(error);
          }
      });

      signOutButton.addEventListener("click", async () => {
          try {
              await settingsApi.signOut();
          } catch (error) {
              alert("Could not sign out.");
              console.error(error);
          }
      });

      siteEnabledToggle.addEventListener("change", async () => {
          const oldValue = !siteEnabledToggle.checked;

          try {
              currentSettings.siteEnabled = siteEnabledToggle.checked;
              renderGames();
              await settingsApi.updateSiteEnabled(siteEnabledToggle.checked);
          } catch (error) {
              currentSettings.siteEnabled = oldValue;
              siteEnabledToggle.checked = oldValue;
              renderGames();
              alert("Could not save the site setting. Make sure you are signed in with the authorized account.");
              console.error(error);
          }
      });

      settingsApi.onAuthStateChanged((user, authorized) => {
          currentUser = user;
          isAuthorizedAdmin = authorized;
          renderAdminPanel();
      });

      settingsApi.subscribe((settings) => {
          currentSettings = settings;
          renderGames();
          renderAdminPanel();
      });
    </script>
</body>
</html>
