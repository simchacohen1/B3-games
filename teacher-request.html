<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Teacher Access — Fun Torah Tools</title>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script src="firebase-config.js"></script>
<style>body{font:18px system-ui,sans-serif;background:#f1f5f9;margin:0;color:#172033}main{max-width:540px;margin:40px auto;padding:26px;background:white;border-radius:20px;box-shadow:0 8px 30px #15223b1a}h1{font-size:26px}label{display:block;margin:18px 0 5px;font-weight:650}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #94a3b8;border-radius:9px;font:inherit}button{padding:13px 18px;border:0;border-radius:9px;background:#1d4ed8;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.fine{font-size:15px;color:#475569}.check{display:flex;gap:10px;align-items:center}.check input{width:22px;height:22px}.status{margin:16px 0;font-weight:700}</style></head><body><main><a href="index.html">← Home</a><h1>Request a teacher account</h1><p>Teachers may request access using their Google account. Every request is reviewed by the Fun Torah Tools administrator. Approval does not automatically open any student tools.</p><button id="signin" type="button">Sign in with Google</button><form id="form" hidden><p class="fine" id="signed"></p><label for="name">Your name</label><input id="name" required maxlength="120"><label for="school">School or organization</label><input id="school" required maxlength="160"><label for="purpose">What do you teach? (optional)</label><textarea id="purpose" maxlength="350"></textarea><label class="check"><input id="adult" type="checkbox" required>I confirm I am at least 18 years old.</label><button id="submit" type="submit">Request teacher access</button></form><p class="status" id="status" role="status"></p></main>
<script>
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);
const auth=firebase.auth(),form=document.getElementById('form'),status=document.getElementById('status'),signin=document.getElementById('signin');
auth.onAuthStateChanged(user=>{form.hidden=!user;signin.hidden=!!user;document.getElementById('signed').textContent=user?'Signed in as '+user.email:''});
signin.onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){status.textContent=e.message}};
form.onsubmit=async e=>{e.preventDefault();const user=auth.currentUser;if(!user)return;
 const submit=document.getElementById('submit');submit.disabled=true;status.textContent='Submitting request…';
 try{const response=await fetch('https://us-central1-b3-games.cloudfunctions.net/funTorahTeacherRequests',{method:'POST',headers:{'Authorization':'Bearer '+await user.getIdToken(),'Content-Type':'application/json'},body:JSON.stringify({action:'request',name:document.getElementById('name').value,school:document.getElementById('school').value,purpose:document.getElementById('purpose').value,adultConfirmed:document.getElementById('adult').checked})});const result=await response.json();if(!response.ok)throw Error(result.error||'Could not submit');status.textContent='Request received. You will need administrator approval before receiving any teacher access.';form.hidden=true;}catch(e){status.textContent=e.message}finally{submit.disabled=false}
};
</script></body></html>
