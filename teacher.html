  ]},
  { posuk: 32, questions: [
    { heb: "בַּעֲבוּר הָעֲשָׂרָה", en: "What is the final, lowest number Avrohom asks about?", ans: "Ten" },
    { heb: "אַךְ הַפַּעַם", en: "This phrase means...", ans: "'Just this one more time' (Avrohom's final request)" }
  ]},
  { posuk: 33, questions: [
    { heb: "וַיֵּלֶךְ ה' כַּאֲשֶׁר כִּלָּה", en: "This phrase means...", ans: "Hashem went, once He finished speaking" },
    { heb: "וְאַבְרָהָם שָׁב לִמְקֹמוֹ", en: "This phrase means...", ans: "And Avrohom returned to his place" }
  ]}
];

// These get filled in once the active question set is loaded from the database
// (or, the first time ever, seeded into the database from localPosukData below).
let posukData = [];
let questions = [];
let posukStartIndex = [];
let questionsReady = false;

function buildFromPosukData(data) {
  posukData = data;
  questions = [];
  posukData.forEach(p => {
    p.questions.forEach((q, i) => {
      questions.push({ posuk: p.posuk, qOfPosuk: i + 1, totalForPosuk: p.questions.length, heb: q.heb, en: q.en, ans: q.ans });
    });
  });
  posukStartIndex = [];
  let idx = 0;
  posukData.forEach(p => {
    posukStartIndex.push(idx);
    idx += p.questions.length;
  });
  buildPosukGrid();
  questionsReady = true;
}

function syncQuestionsToDatabase() {
  const sure = confirm("This will REPLACE your current question list with the original built-in list from when this file was created. Any edits you made in the on-page editor will be lost. Continue?");
  if (!sure) return;
  setRef.set({ title: ACTIVE_SET_TITLE, posukData: localPosukData }).then(() => {
    document.getElementById('soundStatus').textContent = 'Restored built-in questions';
  }).catch(err => {
    document.getElementById('soundStatus').textContent = 'Sync error: ' + err.message;
  });
}

// ---------- On-page question editor ----------

function openEditor() {
  renderEditor(posukData);
  document.getElementById('editorOverlay').style.display = 'block';
}

function closeEditor() {
  document.getElementById('editorOverlay').style.display = 'none';
}

function renderEditor(data) {
  const list = document.getElementById('editorList');
  list.innerHTML = '';
  data.forEach(p => {
    list.appendChild(createPosukBlock(p.posuk, p.questions));
  });
}

function createPosukBlock(posukNum, questionsArr) {
  const block = document.createElement('div');
  block.className = 'editor-posuk';

  const head = document.createElement('div');
  head.className = 'editor-posuk-head';
  head.innerHTML =
    '<label>Posuk #</label>' +
    '<input type="number" class="posuk-num-input" value="' + posukNum + '" min="1">' +
    '<button class="editor-btn editor-del-posuk" onclick="removePosukBlock(this)">Delete this posuk</button>';
  block.appendChild(head);

  const qContainer = document.createElement('div');
  qContainer.className = 'editor-questions-container';
  (questionsArr || []).forEach(q => {
    qContainer.appendChild(createQuestionBlock(q));
  });
  block.appendChild(qContainer);

  const addQBtn = document.createElement('button');
  addQBtn.className = 'editor-btn editor-add-question';
  addQBtn.textContent = '+ Add question to this posuk';
  addQBtn.onclick = () => qContainer.appendChild(createQuestionBlock({ heb: '', en: '', ans: '' }));
  block.appendChild(addQBtn);

  return block;
}

function createQuestionBlock(q) {
  const div = document.createElement('div');
  div.className = 'editor-question';
  div.innerHTML =
    '<label>Hebrew phrase</label>' +
    '<input type="text" class="editor-heb-input q-heb" value="' + escapeAttr(q.heb || '') + '">' +
    '<label>Question</label>' +
    '<textarea class="q-en">' + escapeHtml(q.en || '') + '</textarea>' +
    '<label>Answer</label>' +
    '<textarea class="q-ans">' + escapeHtml(q.ans || '') + '</textarea>' +
    '<button class="editor-btn editor-del-question" onclick="this.parentElement.remove()">Delete this question</button>';
  return div;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function addPosukBlock() {
  const list = document.getElementById('editorList');
  // Suggest the next posuk number based on the last block's number + 1
  const nums = [...list.querySelectorAll('.posuk-num-input')].map(i => parseInt(i.value) || 0);
  const nextNum = nums.length ? Math.max(...nums) + 1 : 1;
  list.appendChild(createPosukBlock(nextNum, [{ heb: '', en: '', ans: '' }]));
}

function removePosukBlock(btn) {
  const sure = confirm("Delete this entire posuk and its questions?");
  if (!sure) return;
  btn.closest('.editor-posuk').remove();
}

function saveEditor() {
  const posukBlocks = [...document.querySelectorAll('#editorList > .editor-posuk')];
  if (posukBlocks.length === 0) {
    alert("You need at least one posuk before saving.");
    return;
  }
  const newPosukData = [];
  for (const block of posukBlocks) {
    const posukNum = parseInt(block.querySelector('.posuk-num-input').value) || 0;
    const qBlocks = [...block.querySelectorAll('.editor-question')];
    const questions = qBlocks.map(qb => ({
      heb: qb.querySelector('.q-heb').value.trim(),
      en: qb.querySelector('.q-en').value.trim(),
      ans: qb.querySelector('.q-ans').value.trim()
    })).filter(q => q.heb || q.en || q.ans); // drop fully-empty rows
    if (questions.length > 0) {
      newPosukData.push({ posuk: posukNum, questions });
    }
  }
  if (newPosukData.length === 0) {
    alert("There's nothing to save - add at least one question first.");
    return;
  }
  setRef.set({ title: ACTIVE_SET_TITLE, posukData: newPosukData }).then(() => {
    document.getElementById('soundStatus').textContent = 'Questions saved (' + newPosukData.length + ' pesukim)';
    closeEditor();
  }).catch(err => {
    document.getElementById('soundStatus').textContent = 'Save error: ' + err.message;
  });
}

// On load: read the active question set from the database. If it doesn't exist
// yet (first time this game is ever run), seed it from localPosukData automatically.
setRef.once('value').then(snap => {
  const existing = snap.val();
  if (existing && existing.posukData) {
    buildFromPosukData(existing.posukData);
  } else {
    setRef.set({ title: ACTIVE_SET_TITLE, posukData: localPosukData }).then(() => {
      buildFromPosukData(localPosukData);
      document.getElementById('soundStatus').textContent = 'Question set created in database';
    });
  }
  // Keep this screen live-updated if the question set changes (e.g. synced from
  // another tab, or you click "Sync" again later).
  setRef.on('value', liveSnap => {
    const liveData = liveSnap.val();
    if (liveData && liveData.posukData) {
      buildFromPosukData(liveData.posukData);
    }
  });
});

function loadQuestion(qIndex) {
  const q = questions[qIndex] || questions[0];
  document.getElementById('qnum').textContent = 'Posuk ' + q.posuk + ' - Question ' + q.qOfPosuk + ' of ' + q.totalForPosuk;
  document.getElementById('qhebrew').textContent = q.heb;
  document.getElementById('qtext').textContent = q.en;
  highlightActivePosuk(q.posuk);
}

function buildPosukGrid() {
  const grid = document.getElementById('posukGrid');
  grid.innerHTML = '';
  posukData.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'posuk-btn';
    btn.id = 'posukBtn' + p.posuk;
    btn.textContent = p.posuk;
    btn.onclick = () => goToQuestion(posukStartIndex[i]);
    grid.appendChild(btn);
  });
}

function highlightActivePosuk(posukNum) {
  posukData.forEach(p => {
    const btn = document.getElementById('posukBtn' + p.posuk);
    if (btn) btn.classList.toggle('active', p.posuk === posukNum);
  });
}

function goToQuestion(qIndex) {
  ensureAudioAwake();
  gameRef.child('qIndex').set(qIndex);
  gameRef.child('revealed').set(false);
  gameRef.child('buzzedBy').set(null);
}

function nextQuestion() {
  gameRef.child('qIndex').once('value', snap => {
    const current = snap.val() || 0;
    goToQuestion((current + 1) % questions.length);
  });
}

function prevQuestion() {
  gameRef.child('qIndex').once('value', snap => {
    const current = snap.val() || 0;
    goToQuestion((current - 1 + questions.length) % questions.length);
  });
}

function ensureAudioAwake() {
  if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
    sharedAudioCtx.resume();
  }
}

function reveal() {
  ensureAudioAwake();
  gameRef.child('revealed').set(true);
}

function clearBuzz() {
  ensureAudioAwake();
  gameRef.child('buzzedBy').set(null);
}

function adjustScore(name, delta) {
  ensureAudioAwake();
  const scoresRef = gameRef.child('scores').child(sanitize(name));
  scoresRef.transaction(current => (current || 0) + delta);
}

function sanitize(name) {
  return name.replace(/[.#$\[\]]/g, '_');
}

function resetGame() {
  ensureAudioAwake();
  const sure = confirm("This will erase ALL player names and scores for a fresh start. Continue?");
  if (!sure) return;
  gameRef.set({
    qIndex: 0,
    revealed: false,
    buzzedBy: null,
    scores: null
  });
  document.getElementById('soundStatus').textContent = 'Game reset - names cleared';
}

let sharedAudioCtx = null;

function enableSound() {
  sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = sharedAudioCtx.createOscillator();
  const gain = sharedAudioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(440, sharedAudioCtx.currentTime);
  gain.gain.setValueAtTime(0.2, sharedAudioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, sharedAudioCtx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(sharedAudioCtx.destination);
  osc.start();
  osc.stop(sharedAudioCtx.currentTime + 0.15);
  document.getElementById('soundStatus').textContent = 'Sound enabled';
}

function playAlertSound() {
  try {
    if (!sharedAudioCtx) {
      document.getElementById('soundStatus').textContent = 'No audio context - click enable sound';
      return;
    }
    if (sharedAudioCtx.state === 'suspended') {
      sharedAudioCtx.resume();
    }
    const ctx = sharedAudioCtx;
    [660, 880].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.2);
    });
    document.getElementById('soundStatus').textContent = 'Alert fired (state: ' + ctx.state + ')';
  } catch (err) {
    document.getElementById('soundStatus').textContent = 'Sound error: ' + err.message;
  }
}

let lastBuzzedBy = null;

gameRef.on('value', snapshot => {
  if (!questionsReady) return; // wait until the question set has loaded from the database
  const data = snapshot.val() || {};
  const qIndex = data.qIndex || 0;
  loadQuestion(qIndex);
  document.getElementById('answer').textContent = data.revealed ? questions[qIndex].ans : '';
  document.getElementById('buzzedName').textContent = data.buzzedBy || 'Waiting...';

  if (data.buzzedBy && data.buzzedBy !== lastBuzzedBy) {
    document.getElementById('soundStatus').textContent = 'Buzz detected: ' + data.buzzedBy;
    playAlertSound();
  }
  lastBuzzedBy = data.buzzedBy || null;

  const scores = data.scores || {};
  const board = document.getElementById('board');
  board.innerHTML = '';
  Object.keys(scores).sort().forEach(name => {
    const div = document.createElement('div');
    div.className = 'team';
    div.innerHTML =
      '<div class="name">' + name + '</div>' +
      '<div class="score">' + scores[name] + '</div>' +
      '<button onclick="adjustScore(\'' + name + '\',1)">+1</button>' +
      '<button onclick="adjustScore(\'' + name + '\',-1)">-1</button>';
    board.appendChild(div);
  });
});
</script>
