<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chazara Teacher</title><style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f5f7fb;color:#1f2937}.w{max-width:1200px;margin:auto;padding:22px}h1{margin:0}.sub{color:#64748b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px #0001}.stat b{display:block;font-size:28px}.stat span{font-size:12px;color:#64748b}.panel{margin:14px 0}input,select,button{padding:9px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.tools{display:flex;gap:8px;margin-bottom:12px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:10px;border-bottom:1px solid #e5e7eb}th{font-size:12px;color:#64748b}tbody tr{cursor:pointer}tbody tr:hover{background:#f8fafc}.name{font-weight:bold}.pill{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:bold}.bad{background:#fee2e2;color:#991b1b}.good{background:#dcfce7;color:#166534}.hidden{display:none}.perek{margin:20px 0}.perek h3{text-align:right;direction:rtl;font-size:23px}.grid{direction:rtl;display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}.tile{border-radius:14px;padding:10px;text-align:center;min-height:85px}.ref{direction:rtl;font-size:17px;font-weight:bold}.count{font-size:28px;font-weight:bold}.last{font-size:10px}.back{float:right;text-decoration:none;font-weight:bold;color:#334155}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.scroll{overflow:auto}}</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script><script src="../firebase-config.js"></script></head><body><div class="w"><a class="back" href="../index.html">← B3 Games</a><h1>🔁 Chazara — Teacher Dashboard</h1><div class="sub">All student Chazara activity</div>
<div class="stats"><div class="stat"><b id="ns">0</b><span>Students</span></div><div class="stat"><b id="nt">0</b><span>Total Chazaras</span></div><div class="stat"><b id="na">0</b><span>Active Today</span></div><div class="stat"><b id="nd">0</b><span>Pesukim Due</span></div></div>
<div class="panel"><div class="tools"><input id="q" placeholder="Search student"><select id="f"><option value="">ET + WT</option><option value="et">ET</option><option value="wt">WT</option></select></div><div class="scroll"><table><thead><tr><th>Student</th><th>Class</th><th>Chazaras</th><th>Learned</th><th>At Goal</th><th>Due</th><th>Last Chazara</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="detail" class="panel hidden"></div></div>
<script>
if(!firebase.apps.length)firebase.initializeApp(window.B3_FIREBASE_CONFIG);const db=firebase.database(),$=x=>document.getElementById(x),ET=new Set(["chaim_chaikin","mayer_chaim_chaikin","yossi_gourarie","sholom_huebner","sholom_dovber_huebner","moshe_lapine","kehos_notik","yisroel_oirechman","moshe_raichman","moshe_tuvia_raichman","avrohom_rosenfeld","levi_rozmarin","arik_traxler","simcha_cohen"]),WT=new Set(["ari_greenberg","zev_rosenfeld","levi_schtroks","yisroel_aryeh_simmonds","leibel_vogel","leib_wolf"]);let D={},R={};
function cls(id){let c=R[id]?.classId;return c==="et"||c==="wt"?c:ET.has(id)?"et":WT.has(id)?"wt":""}function ago(t){return t?Math.floor((Date.now()-t)/86400000):9999}function keys(d){return Object.keys(d.learned||{}).filter(k=>d.learned[k])}function due(d,k){let t=d.reviews?.[k]?.lastAt;if(t)return ago(t)>=14;let l=d.learnedAt?.[k];return l?ago(l)>=14:false}function stats(d){let a=keys(d),goal=+d.goal||10,total=0,at=0,dn=0,last=0;a.forEach(k=>{let r=d.reviews?.[k]||{},c=+r.count||0;total+=c;if(c>=goal)at++;if(due(d,k))dn++;last=Math.max(last,+r.lastAt||0)});return{a,total,at,dn,last}}function fmt(t){return t?new Date(t).toLocaleDateString():"—"}
function hn(n){let o=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],t=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];n=+n;let s=n===15?'טו':n===16?'טז':(t[Math.floor(n/10)]||'')+(o[n%10]||'');return s.length===1?s+"׳":s.slice(0,-1)+"״"+s.slice(-1)}function col(c,g){let x=Math.min(1,c/g);return`hsl(${8+112*x} ${48+38*x}% ${35+22*x}%)`}
function render(){let q=$("q").value.toLowerCase(),f=$("f").value,A=Object.entries(D).map(([id,d])=>({id,d,s:stats(d)}));$("ns").textContent=A.length;$("nt").textContent=A.reduce((n,x)=>n+x.s.total,0);let day=new Date();day.setHours(0,0,0,0);$("na").textContent=A.filter(x=>x.s.last>=day.getTime()).length;$("nd").textContent=A.reduce((n,x)=>n+x.s.dn,0);let V=A.filter(x=>(!q||(x.d.name||x.id).toLowerCase().includes(q))&&(!f||cls(x.id)===f)).sort((a,b)=>(a.d.name||a.id).localeCompare(b.d.name||b.id));$("rows").innerHTML="";V.forEach(x=>{let tr=document.createElement("tr");tr.innerHTML=`<td class=name>${x.d.name||R[x.id]?.name||x.id}</td><td>${cls(x.id).toUpperCase()||"—"}</td><td>${x.s.total}</td><td>${x.s.a.length}</td><td>${x.s.at}</td><td><span class="pill ${x.s.dn?"bad":"good"}">${x.s.dn}</span></td><td>${fmt(x.s.last)}</td>`;tr.onclick=()=>show(x.id);$("rows").appendChild(tr)})}
function show(id){let d=D[id],s=stats(d),box=$("detail"),G={};s.a.sort((a,b)=>{let A=a.split("_").map(Number),B=b.split("_").map(Number);return A[0]-B[0]||A[1]-B[1]}).forEach(k=>{let p=k.split("_")[0];(G[p]||(G[p]=[])).push(k)});box.innerHTML=`<button id=x style="float:right">Close</button><h2>${d.name||R[id]?.name||id}</h2><div class=sub>${cls(id).toUpperCase()} · ${s.total} total Chazaras · ${s.dn} due</div><div id=g></div>`;let g=box.querySelector("#g");Object.keys(G).sort((a,b)=>+a-+b).forEach(p=>{let sec=document.createElement("div");sec.className="perek";sec.innerHTML=`<h3>פרק ${hn(p)}</h3><div class=grid></div>`;let gg=sec.querySelector(".grid");G[p].forEach(k=>{let v=k.split("_")[1],r=d.reviews?.[k]||{},c=+r.count||0,t=document.createElement("div");t.className="tile";t.style.background=col(c,+d.goal||10);t.style.color=c/(+d.goal||10)<.45?"white":"#12351d";t.innerHTML=`<div class=ref>פסוק ${hn(v)}</div><div class=count>${c}</div><div class=last>${r.lastAt?"Last: "+fmt(r.lastAt):"Not reviewed yet"}${due(d,k)?" · DUE":""}</div>`;gg.appendChild(t)});g.appendChild(sec)});box.classList.remove("hidden");box.querySelector("#x").onclick=()=>box.classList.add("hidden");box.scrollIntoView({behavior:"smooth"})}
$("q").oninput=render;$("f").onchange=render;Promise.all([db.ref("posukPractice/chazara/students").once("value"),db.ref("posukPractice/allowedStudents").once("value")]).then(([a,r])=>{D=a.val()||{};R=r.val()||{};render()}).catch(e=>{console.error(e);$("rows").innerHTML='<tr><td colspan=7>Could not load Chazara data.</td></tr>'});
</script></body></html>
