<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2744;
  --blue:#4a9eed;
  --blue-dark:#2d7ecc;
  --yellow:#ffd966;
  --yellow-bg:#fffae8;
  --green:#3dba6e;
  --green-bg:#edfaf3;
  --red:#e05252;
  --red-bg:#fef1f1;
  --orange:#f5a623;
  --orange-bg:#fff5e0;
  --bg:#eef3fb;
  --card:#fff;
  --border:#d6e4f5;
  --text:#1a2744;
  --muted:#5b7290;
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--text);
  background:var(--bg);
}
*{box-sizing:border-box}
body{margin:0}

header{
  background:var(--navy);
  color:#fff;
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  box-shadow:0 3px 12px rgba(26,39,68,.25);
}
header strong{font-size:20px;font-weight:800;letter-spacing:-.3px}
header a{color:#a8d4f7;text-decoration:none;font-weight:700;font-size:14px}
header a:hover{color:#fff}
#who{font-size:14px;font-weight:700;margin-right:8px;opacity:.85}

main{max-width:720px;margin:24px auto;padding:0 16px 72px}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(26,39,68,.07)}
.home-fold{padding:0}.fold-sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;cursor:pointer;list-style:none}.fold-sum::-webkit-details-marker{display:none}.fold-sum::before{content:'▸';transition:transform .15s}.home-fold[open] .fold-sum::before{transform:rotate(90deg)}.fold-title{font-weight:800;font-size:1.05rem}.fold-tags{display:flex;gap:6px;flex-wrap:wrap}.fold-tags .badge{margin:0}.fold-sum::after{content:'Open';margin-left:auto;font-size:.85rem;font-weight:700;opacity:.7}.home-fold[open] .fold-sum::after{content:'Close'}.fold-body{padding:0 18px 18px}
.card h3{margin:0 0 6px;font-size:18px;font-weight:800}
.muted{color:var(--muted);font-size:15px}

.badge{display:inline-flex;align-items:center;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:700;background:#e6eef8;color:#2d5486;margin:2px 4px 2px 0;line-height:1.3}
.badge[hidden]{display:none}
.badge.late{background:var(--red-bg);color:var(--red)}
.badge.ok{background:var(--green-bg);color:#1a7a47}
.badge.retry{background:var(--orange-bg);color:#9a5f00}

textarea,input{font:inherit;width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;margin-top:6px;font-size:16px;color:var(--text);transition:border-color .15s}
textarea{min-height:88px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,158,237,.18)}

button{
  font:inherit;
  border:0;
  border-radius:10px;
  padding:10px 18px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  background:var(--blue);
  color:#fff;
  margin:8px 8px 0 0;
  transition:background .15s,transform .1s;
}
button:hover{background:var(--blue-dark)}
button:active{transform:scale(.97)}
button.sec{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
button.sec:hover{background:var(--bg);border-color:var(--blue)}
button:disabled{opacity:.45;cursor:default;transform:none}

.note{padding:12px 14px;border-left:4px solid var(--orange);background:var(--orange-bg);border-radius:0 10px 10px 0;margin-top:10px;font-size:15px;line-height:1.5}
.msg{min-height:20px;margin-top:8px;font-size:14px;font-weight:700}
.err{color:var(--red)}
.good{color:var(--green)}

.button-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:11px 18px;
  margin:8px 8px 0 0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-weight:800;
  font-size:15px;
  text-decoration:none;
  transition:background .15s;
}
.button-link:hover{background:var(--blue-dark)}

button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.home-intro{
  background:linear-gradient(130deg,var(--yellow) 0%,#ffe8a0 55%,#d4eaff 100%);
  border-radius:20px;
  padding:22px 24px;
  margin-bottom:18px;
  box-shadow:0 4px 16px rgba(26,39,68,.1);
}
.home-intro h1{margin:0 0 6px;font-size:28px;font-weight:900;color:var(--navy)}
.home-intro p{margin:0;font-size:16px;line-height:1.5;color:#2d4068}

.home-tabs{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  padding:4px 0 18px;
}
.home-tabs button{
  white-space:normal;
  min-height:72px;
  border:2px solid var(--border);
  background:#fff;
  color:var(--navy);
  padding:12px 10px;
  font-size:15px;
  font-weight:700;
  border-radius:14px;
  box-shadow:0 2px 6px rgba(26,39,68,.06);
}
.home-tabs .tab-todo{background:#fffae8;border-color:#f5cb3a;color:#7a5500}
.home-tabs .tab-handed{background:#e8f1ff;border-color:#6ea8f5;color:#1a3f80}
.home-tabs .tab-finished{background:#e8faf0;border-color:#4fc47d;color:#15673a}
.home-tabs .tab-messages{background:#f5f0ff;border-color:#b69df8;color:#4b2a9c}
.home-tabs .tab-messages .count.unread{background:#25a55f;color:#fff}
.dm-about{display:inline-flex;align-items:center;gap:6px;background:#f5f0ff!important;color:#4b2a9c!important;border:1.5px solid #b69df8!important}
.home-tabs button[aria-selected=true]{
  box-shadow:0 0 0 3px rgba(26,39,68,.12);
  transform:translateY(-3px);
  font-weight:900;
}
.home-tabs button:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.home-tabs .count{
  display:inline-block;
  margin-left:5px;
  border-radius:12px;
  padding:1px 8px;
  background:rgba(255,255,255,.7);
  color:inherit;
  font-size:13px;
}

.home-section[hidden]{display:none}
.home-section h2{font-size:22px;font-weight:800;margin:4px 0 14px;color:var(--navy)}
.home-section>.card.muted{font-size:16px;border:2px dashed var(--border);background:#fff;text-align:center;padding:28px;color:var(--muted)}

.home-card{border:2px solid transparent;border-radius:18px;padding:20px;margin-bottom:12px}
.home-card h3{font-size:20px;font-weight:800;line-height:1.3;margin:0 0 10px}
.home-card.todo{border-color:#f5cb3a;background:#fffdf5}
.home-card.handed{border-color:#6ea8f5;background:#f7faff}
.home-card.finished{border-color:#4fc47d;background:#f4fdf7}
.home-card p{font-size:15px;line-height:1.55;margin:8px 0 0}
.home-card label{font-size:16px;font-weight:700;margin-top:14px;display:block}
.home-card textarea,.home-card input{font-size:16px;padding:12px 13px;border-radius:11px}
.home-card button,.home-card .button-link{min-height:46px;font-size:16px;border-radius:11px;margin-top:10px}
.home-card .button-link{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px}
.home-card .badge{font-size:14px;padding:4px 11px}

/* Message threads are styled once, in homework-common.js. */
.flash{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:0 0 14px;border-radius:14px;background:var(--green-bg);border:1.5px solid #9bdcb4;color:#15673a;font-weight:800;font-size:16px;animation:flashIn .25s ease-out}
@keyframes flashIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.badge.new-msg{background:#f0b429;color:#3d2a00}
.home-tabs .tab-new{display:block;margin-top:4px;font-size:12px;font-weight:800;color:#7a4a00}
.card-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.card-actions button{margin:0!important}
.card-actions .msg{flex-basis:100%;margin-top:2px}
.your-answer{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.your-answer strong{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.stars{font-size:22px;color:#e0a100;letter-spacing:2px}

@media(max-width:520px){
  main{margin:12px auto}
  header{padding:12px 16px}
  .home-tabs{gap:7px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-tabs button{font-size:14px;padding:9px 6px;min-height:64px}
  .home-intro h1{font-size:23px}
  .home-card{padding:16px}
}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filter-bar span.filter-label{font-size:13px;font-weight:800;color:var(--muted);margin-right:4px}
.filter-chip{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:20px;padding:5px 13px;font-size:13px;font-weight:700;background:#fff;color:var(--navy);cursor:pointer;transition:background .12s,border-color .12s}
.filter-chip:hover{background:var(--bg);border-color:var(--blue)}
.filter-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.filter-section{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
</style></head><body>
<header><strong>📚 My Homework</strong><span><span id="who"></span> <a href="../index.html">Back to games</a></span></header>
<main>
<div id="status" class="card muted">Loading your homework…</div>
<div id="filterBar" class="filter-bar" hidden></div>
<div id="list"></div>
</main>
<script src="../firebase-config.js"></script>
<script src="staging-guard.js" data-b3-homework-guard></script>
<script src="homework-common.js"></script>
<script src="messages-ui.js"></script>
<script src="homework-items.js"></script>
<script>
(function(){'use strict';
var H=window.HomeworkCommon,HI=window.HomeworkItems,el=H.el;
var statusBox=document.getElementById('status'),listBox=document.getElementById('list');
var filterBar=document.getElementById('filterBar');
var activeFilters={subject:null,time:null,done:null};
if(!H.isAllowedRuntime()){statusBox.textContent='Homework is not available on this site.';return}
function ss(k){try{return sessionStorage.getItem(k)||''}catch(e){return ''}}
var auth={studentId:ss('b3Games_studentId'),studentName:ss('b3Games_studentName'),pin:ss('b3Games_classPin'),classId:ss('b3Games_studentClass')};
if(!auth.studentId||!auth.pin){
  statusBox.textContent='';
  statusBox.append(el('strong','Please sign in first. '),el('a','Go to sign-in')); statusBox.lastChild.href='../index.html';
  return;
}
document.getElementById('who').textContent=auth.studentName;
function say(box,msg,good){box.textContent=msg;box.className='msg '+(good?'good':'err')}
function draftKey(id){return 'homeworkDraft_'+auth.studentId+'_'+id}
function loadLocal(id){try{return sessionStorage.getItem(draftKey(id))||''}catch(e){return ''}}
function saveLocal(id,v){try{sessionStorage.setItem(draftKey(id),v)}catch(e){}}
function clearLocal(id){try{sessionStorage.removeItem(draftKey(id))}catch(e){}}
function call(body){return H.call(Object.assign({},auth,body))}

var lastData=null,tabApi={},earlierOpen=false;
// Filter chips: subject, due today / this week, done / not done. Chips combine; tap again to turn one off.
function isDone(a){return a.status==='submitted'||a.status==='approved'}
function startOfDay(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function dueMatches(a,time){
  if(a.dueAt==null)return false;
  var today=startOfDay(Date.now()),day=new Date(today);
  if(time==='today'){day.setDate(day.getDate()+1);return a.dueAt>=today&&a.dueAt<day.getTime()}
  day.setDate(day.getDate()-day.getDay());var weekStart=day.getTime();day.setDate(day.getDate()+7); // Sunday to Shabbos
  return a.dueAt>=weekStart&&a.dueAt<day.getTime();
}
function subjectKey(s){return String(s||'').trim().toLowerCase()} // "Chumash" and "chumash" are one subject
function applyFilters(list){
  return list.filter(function(a){
    if(activeFilters.subject&&subjectKey(a.subject)!==activeFilters.subject)return false;
    if(activeFilters.time&&!dueMatches(a,activeFilters.time))return false;
    if(activeFilters.done==='done'&&!isDone(a))return false;
    if(activeFilters.done==='notdone'&&isDone(a))return false;
    return true;
  });
}
function filtering(){return !!(activeFilters.subject||activeFilters.time||activeFilters.done)}
function buildFilterBar(list){
  filterBar.replaceChildren();
  var seen={},subjects=[];list.forEach(function(a){var k=subjectKey(a.subject);if(k&&!seen[k]){seen[k]=1;subjects.push({key:k,name:a.subject.trim()})}});
  subjects.sort(function(x,y){return x.key<y.key?-1:x.key>y.key?1:0});
  if(activeFilters.subject&&!seen[activeFilters.subject])activeFilters.subject=null; // that subject is gone now
  filterBar.hidden=!list.length;if(!list.length)return;
  function chip(text,kind,value){
    var b=el('button',text,'filter-chip'+(activeFilters[kind]===value?' on':''));b.type='button';
    b.setAttribute('aria-pressed',activeFilters[kind]===value?'true':'false');
    b.onclick=function(){activeFilters[kind]=activeFilters[kind]===value?null:value;render(lastData)};
    return b;
  }
  function section(label,chips){var sec=el('div',null,'filter-section');sec.append(el('span',label,'filter-label'));chips.forEach(function(c){sec.append(c)});filterBar.append(sec)}
  filterBar.setAttribute('role','group');filterBar.setAttribute('aria-label','Filter homework');
  if(subjects.length)section('Subject',subjects.map(function(x){return chip(x.name,'subject',x.key)}));
  section('Due',[chip('Today','time','today'),chip('This week','time','week')]);
  section('Show',[chip('Not done','done','notdone'),chip('Done','done','done')]);
  if(filtering()){var clear=el('button','✕ Clear filters','filter-chip');clear.type='button';clear.onclick=function(){activeFilters={subject:null,time:null,done:null};render(lastData)};filterBar.append(clear)}
}
// Messages tab (#647): one-on-one chats with my teachers and the principal.
var Msgs=window.HomeworkMessages.create({role:'student',call:call,
  who:function(c){return {teacherId:c.id}},
  onUnread:function(n){drawUnread(n)},
  onJump:function(id){focusAssignment(id)}});
function drawUnread(n){var b=document.querySelector('.tab-messages .count');if(b){b.textContent=n?n+' new':'';b.classList.toggle('unread',!!n);b.hidden=!n}}
function bucketOf(a){return a.status==='approved'?'finished':a.status==='submitted'?'handed':'todo'}
function render(data){
  lastData=data;
  listBox.replaceChildren();
  statusBox.style.display='none';
  var intro=el('div',null,'home-intro');intro.append(el('h1','Hi, '+auth.studentName+'! 🌟'),el('p',!data.assignments.length?'No homework for you right now. Enjoy your free time!':data.openCount?'Here’s what you can work on today.':'You finished everything. Great job! 🎉'));listBox.append(intro);
  buildFilterBar(data.assignments);listBox.append(filterBar);
  var groups=[{id:'todo',name:'To Do',items:[]},{id:'handed',name:'Handed In',items:[]},{id:'finished',name:'Finished',items:[]}];applyFilters(data.assignments).forEach(function(a){groups[{todo:0,handed:1,finished:2}[bucketOf(a)]].items.push(a)});
  // The chosen tab survives every refresh (sending a note, coming back to the page, handing in).
  var tabs=el('div',null,'home-tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','My homework');var sections=el('div'),tabIcons={todo:'📌 ',handed:'📬 ',finished:'🏆 ',messages:'💬 '},buttons=[];tabApi={};
  function select(id,focus){if(activeTab==='messages'&&id!=='messages')Msgs.hide();activeTab=id;buttons.forEach(function(t){var on=t.dataset.tab===id;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;if(on&&focus)t.focus()});sections.querySelectorAll('[role=tabpanel]').forEach(function(p){p.hidden=p.id!=='section-'+id});if(id==='messages')Msgs.show()}
  function addTab(id,label,pane,fresh){var b=el('button',label,'tab-'+id);b.type='button';b.dataset.tab=id;b.id='tab-'+id;b.setAttribute('role','tab');b.setAttribute('aria-controls','section-'+id);if(fresh)b.append(el('span','💬 '+fresh+' new','tab-new'));pane.id='section-'+id;pane.dataset.tab=id;pane.setAttribute('role','tabpanel');pane.setAttribute('aria-labelledby','tab-'+id);b.onclick=function(){select(id)};buttons.push(b);tabs.append(b);sections.append(pane)}
  groups.forEach(function(g){var pane=el('section',null,'home-section');pane.append(el('h2',g.name));if(!g.items.length){var empty=filtering()?'No homework here matches your filters.':g.id==='todo'?'All done for now! 🎉 Check back when your teacher adds homework.':g.id==='handed'?'You haven’t handed anything in yet. Work you hand in will show up here.':'Finished homework and teacher comments will show up here.';pane.append(el('div',empty,'card muted'))}g.items.forEach(function(a){pane.append(card(a))});
    var fresh=g.items.reduce(function(n,a){return n+H.unreadCount(a.messages,'student')},0);addTab(g.id,(tabIcons[g.id]||'')+g.name+' · '+g.items.length,pane,fresh)});
  var mpane=el('section',null,'home-section');mpane.append(el('h2','Messages'),Msgs.root);
  // Messages from before one-on-one chats (one thread shared by all class teachers) stay readable here.
  var earlier=data.general&&data.general.messages||[];if(earlier.length){var d=el('details',null,'dm-earlier');d.open=earlierOpen;d.addEventListener('toggle',function(){earlierOpen=d.open});d.append(el('summary','Earlier messages to all my teachers · '+earlier.length),generalPanel(earlier));mpane.append(d)}
  addTab('messages',tabIcons.messages+'Messages',mpane);
  var count=el('span',null,'count');tabs.querySelector('.tab-messages').append(count);drawUnread(Msgs.unread());
  // Left/right arrow keys move between tabs.
  tabs.addEventListener('keydown',function(e){if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;var i=buttons.findIndex(function(t){return t.dataset.tab===activeTab});i=(i+(e.key==='ArrowRight'?1:buttons.length-1))%buttons.length;e.preventDefault();select(buttons[i].dataset.tab,true)});
  tabApi.select=select;
  listBox.append(tabs);
  if(flash){var f=el('div',flash,'flash');f.setAttribute('role','status');listBox.append(f);flash='';}
  listBox.append(sections);select(activeTab);Msgs.refreshUnread();
}
// Show one homework post: switch to its tab, open it and bring it into view.
function focusAssignment(id){
  var a=lastData&&lastData.assignments.find(function(x){return x.id===id});
  if(!a){alert('That homework is no longer on your list.');return}
  if(!applyFilters([a]).length){activeFilters={subject:null,time:null,done:null};render(lastData)} // hidden by a filter: show everything
  openCards[id]=1;tabApi.select(bucketOf(a));
  var d=document.querySelector('[data-assignment-card="'+id+'"]');if(!d)return;
  d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'});d.classList.remove('hw-flash');void d.offsetWidth;d.classList.add('hw-flash');
}
var activeTab='todo',flash='';
// Messages that are not about one assignment. Voice only, text only, or both; never needs a hand-in.
function generalPanel(messages){
  var c=el('article',null,'card general-messages');c.id='generalMessages';
  c.append(H.conversation({role:'student',collapsed:true,threadKey:'general',title:'✉️ Messages with your teacher',
    emptyText:'No messages yet. You can type a message or record a voice note for your teacher.',
    messages:messages,send:function(body){return call(body)},onSent:refresh}));
  return c;
}
// Each homework is one short row (title + status). Tap it to open the full card.
var cardRecording=false; // true while a homework microphone is on, so the list does not redraw under it
var openCards={},typedMins={}; // typedMins keeps unsaved minutes when the list redraws (e.g. a filter chip is tapped)
function card(a){
  var body=cardBody(a),bucket=a.status==='approved'?'finished':a.status==='submitted'?'handed':'todo';
  var d=el('details',null,'card home-card home-fold '+bucket),sum=el('summary',null,'fold-sum');d.setAttribute('data-assignment-card',a.id);
  d.open=!!openCards[a.id];d.addEventListener('toggle',function(){if(d.open)openCards[a.id]=1;else delete openCards[a.id]});
  var head=body.firstChild,meta=head&&head.nextSibling;body.removeChild(head);
  var tags=el('span',null,'fold-tags');if(meta){var first=meta.firstChild;if(first)tags.append(first.cloneNode(true));Array.prototype.forEach.call(meta.children,function(x){if(/Due|Late/.test(x.textContent))tags.append(x.cloneNode(true))})}if(a.items&&a.items.length)tags.append(HI.progressTag(a,a));
  var fresh=H.unreadCount(a.messages,'student');if(fresh)tags.append(el('span','💬 '+fresh+' new from your teacher','badge new-msg'));
  sum.append(el('span',a.title,'fold-title'),tags);
  body.className='fold-body';d.append(sum,body);return d;
}
function cardBody(a){
  var bucket=a.status==='approved'?'finished':a.status==='submitted'?'handed':'todo';var c=el('article',null,'card home-card '+bucket);
  c.append(el('h3',a.title));
  var meta=el('div');
  var stateLabel=a.status==='approved'?'Finished! 🌟':a.status==='submitted'?'Handed in — teacher will check it':a.status==='returned'?'Try again — see teacher note':a.status==='in_progress'?'Started — keep going':'Ready to start';
  var b=el('span',stateLabel,'badge'+(a.status==='approved'?' ok':a.status==='returned'?' retry':''));
  meta.append(b,el('span',H.TYPES[a.type]||a.type,'badge'));
  if(a.subject)meta.append(el('span',a.subject,'badge'));
  if(a.dueAt!=null)meta.append(el('span',(a.late?'Late – was due ':'Due ')+H.when(a.dueAt),'badge'+(a.late?' late':'')));
  if(a.assignedAt!=null)meta.append(el('span','Assigned '+H.when(a.assignedAt),'badge'));
  c.append(meta);
  if(a.details)c.append(el('p',a.details));
  if(a.instructionVoice)c.append(H.instructionPlayer(function(){return call({action:'instructionVoiceRead',assignmentId:a.id})}));
  if(a.targetAmount)c.append(el('p','Target: '+a.targetAmount+' '+(a.targetUnit||'items')+(a.targetUnit==='minutes'?' · done so far: '+a.progress+' minutes':''),'muted'));
  // Checklist homework (#649): each item opens the activity in homework mode and ticks itself when finished.
  var hasItems=!!(a.items&&a.items.length);
  if(hasItems)c.append(HI.checklist(a,{canOpen:a.status!=='approved'&&a.status!=='submitted',markDone:function(item){return call({action:'itemDone',assignmentId:a.id,itemId:item.id}).then(refresh)}}));
  var activityUrl=hasItems?'':H.activityUrl(a.type);
  if(activityUrl&&a.status!=='approved'&&a.status!=='submitted'){var launch=el('a','Start Activity','button-link');launch.href=activityUrl;launch.target='_blank';launch.rel='opener';launch.setAttribute('data-assignment-launch',a.id);c.append(launch);c.append(el('p','When you finish, come back here and press Hand In. The activity does not send your homework by itself.','muted'))}
  if(a.status==='returned'&&a.feedback)c.append(el('div','💬 Teacher’s note: '+a.feedback,'note'));
  // Every homework always has a microphone (#755): the recording goes straight to the teacher, who hears it when checking the work.
  c.append(H.recordings({role:'student',key:a.id,messages:a.messages||[],send:function(body){return call(Object.assign({assignmentId:a.id},body))},onSent:refresh,
    onStart:function(){cardRecording=true},onEnd:function(){cardRecording=false}}));
  var hasRecording=(a.messages||[]).some(function(m){return m.voice&&m.role==='student'});
  // Messages tab (#647): a message started here arrives tagged to this homework. It never hands anything in.
  var about=el('button','🎤 Message my teacher about this','sec dm-about');about.type='button';about.setAttribute('data-message-about',a.id);
  about.onclick=function(){tabApi.select('messages');Msgs.compose({assignmentId:a.id,assignmentTitle:a.title,contactId:a.teacherId});listBox.querySelector('.home-tabs').scrollIntoView({behavior:'smooth',block:'start'})};c.append(about);
  c.append(H.conversation({role:'student',collapsed:true,threadKey:a.id,messages:a.messages||[],send:function(body){return call(Object.assign({assignmentId:a.id},body))},onSent:refresh,
    onRead:function(){var d=c.closest('details'),pane=c.closest('[role=tabpanel]');if(d){var t=d.querySelector('.fold-sum .new-msg');if(t)t.remove()}
      if(pane&&!pane.querySelector('.new-msg')){var tab=document.getElementById(pane.getAttribute('aria-labelledby'));var n=tab&&tab.querySelector('.tab-new');if(n)n.remove()}}}));
  function yourAnswer(){if(!a.answer)return;var y=el('div',null,'your-answer');y.append(el('strong','What you handed in'),document.createTextNode(a.answer));c.append(y)}
  if(a.status==='approved'){
    if(a.stars){var st=el('p','★'.repeat(a.stars)+'☆'.repeat(5-a.stars),'stars');st.setAttribute('aria-label',a.stars+' out of 5 stars');c.append(st)}
    if(a.feedback)c.append(el('div','💬 Teacher says: '+a.feedback,'note'));
    yourAnswer();
    return c;
  }
  if(a.status==='submitted'){c.append(el('p','You handed it in! Your teacher will look at it.','muted'));yourAnswer();return c}
  var mins=null;
  if(a.targetUnit==='minutes'){
    c.append(el('label','Minutes I practiced'));
    mins=el('input');mins.type='number';mins.min='0';mins.max='1440';mins.value=typedMins[a.id]!=null?typedMins[a.id]:a.progress||0;mins.addEventListener('input',function(){typedMins[a.id]=mins.value});c.append(mins);
  }
  c.append(el('label',a.targetUnit==='minutes'?'Tell your teacher what you practiced (optional)':hasRecording?'✏️ Anything to tell your teacher? (optional — you sent a recording)':hasItems?'✏️ Anything to tell your teacher? (optional once every item is done)':'✏️ Tell your teacher what you did, or record it with the microphone'));
  var ta=el('textarea');ta.maxLength=2000;ta.value=loadLocal(a.id)||a.draft||(a.status==='returned'?a.answer:'')||'';c.append(ta);
  ta.addEventListener('input',function(){saveLocal(a.id,ta.value)});
  var msg=el('div',null,'msg');
  var save=el('button','Save for later','sec'),sub=el('button',a.status==='returned'?'Fix and Hand In Again':'Hand In Homework');
  save.type=sub.type='button';
  var mv=function(){return mins?Math.max(0,parseInt(mins.value,10)||0):undefined};
  save.onclick=async function(){
    save.disabled=true;
    try{await call({action:'save',assignmentId:a.id,draft:ta.value,progress:mv()});clearLocal(a.id);say(msg,'Saved ✓',true)}
    catch(e){say(msg,e.message)}finally{save.disabled=false}
  };
  sub.onclick=async function(){
    sub.disabled=true;save.disabled=true;sub.textContent='Handing in…';
    try{await call({action:'submit',assignmentId:a.id,answer:ta.value.trim()?ta.value:hasRecording?'🎤 I recorded my answer.':'',progress:mv()});clearLocal(a.id);delete openCards[a.id];delete typedMins[a.id];
      // Follow the homework to the Handed In tab so it does not just vanish from To Do.
      activeTab='handed';flash='📬 “'+a.title+'” is handed in. Your teacher will check it soon.';await refresh();}
    catch(e){say(msg,e.message);sub.disabled=false;save.disabled=false;sub.textContent=a.status==='returned'?'Fix and Hand In Again':'Hand In Homework';if(e.status===400)ta.focus()}
  };
  var row=el('div',null,'card-actions');row.append(sub,save,msg);c.append(row);
  return c;
}
async function refresh(){
  try{render(await call({action:'studentList'}))}
  catch(e){
    statusBox.style.display='';
    if(e.status===401||e.status===403)statusBox.textContent='Please sign in again from the main page. ('+e.message+')';
    else statusBox.textContent=e.message;
  }
}
refresh();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!listBox.querySelector('textarea:focus')&&!Msgs.isRecording()&&!cardRecording)refresh()});
})();
</script></body></html>
