<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>My Files | Fun Torah Tools</title>
<style>
body{margin:0;background:#eef3fb;color:#172d49;font:16px system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#234ea8;color:#fff}
header h1{margin:0;font-size:26px}
header a{color:#fff;font-weight:700}
main{max-width:1100px;margin:20px auto;padding:18px 20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px #1720331f}
.mf-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0 14px}
.mf-switch button:disabled{opacity:.4;cursor:default}
.mf-tools label{display:flex;align-items:center;gap:6px;font-weight:700}
.mf-switch{display:inline-flex;border:1px solid #b8c6dc;border-radius:10px;overflow:hidden}
.mf-switch button{border:0;border-radius:0;min-height:40px;padding:6px 14px;background:#f4f7fc;color:#172d49;font:700 15px system-ui,sans-serif;cursor:pointer}
.mf-switch button[aria-pressed=true]{background:#234ea8;color:#fff}
.mf-layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
#mfNav{display:flex;flex-direction:column;gap:4px;position:sticky;top:8px}
.mf-nav-title{margin:12px 0 2px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#51627a}
.mf-nav-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:40px;padding:6px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#172d49;font:600 15px system-ui,sans-serif;text-align:left;cursor:pointer}
.mf-nav-item:hover{background:#eef3fb}.mf-nav-item.active{background:#dbe7ff;border-color:#9db7ee}
.mf-nav-item.over,.mf-items .over{outline:3px dashed #234ea8;background:#e8f0ff}
.mf-nav-count{font-size:13px;color:#51627a}
.mf-folder{display:flex;align-items:center;gap:2px}.mf-folder .mf-nav-item{flex:1;min-width:0}
.mf-mini{min-height:32px;padding:2px 7px;border:1px solid #d3dcea;border-radius:8px;background:#fff;cursor:pointer}
#viewTitle{margin:0 0 6px;font-size:22px}
.mf-group{margin:18px 0 8px;font-size:15px;color:#234ea8;text-transform:none}
.mf-items.mf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--mf-tile,190px),1fr));gap:12px}
.mf-items.mf-list{display:flex;flex-direction:column;gap:6px}
.mf-item{position:relative;display:flex;gap:10px;border:1px solid #d3dcea;border-radius:12px;background:#fff;padding:10px}
.mf-item.dragging{opacity:.5}
.mf-grid .mf-item{flex-direction:column}
.mf-list .mf-item{flex-direction:row;align-items:center}
.mf-thumb{flex:none;display:flex;align-items:center;justify-content:center;background:#f4f7fc;border:1px solid #e1e8f3;border-radius:8px;overflow:hidden;font-size:34px}
.mf-grid .mf-thumb{width:100%;height:var(--mf-thumb-h,120px)}.mf-list .mf-thumb{width:var(--mf-row-w,72px);height:var(--mf-row-h,48px);font-size:22px}
#filesList{--mf-tile:190px;--mf-thumb-h:120px;--mf-row-w:72px;--mf-row-h:48px;--mf-font:16px}
#filesList.mf-z0{--mf-tile:110px;--mf-thumb-h:62px;--mf-row-w:40px;--mf-row-h:28px;--mf-font:12px}
#filesList.mf-z1{--mf-tile:145px;--mf-thumb-h:90px;--mf-row-w:56px;--mf-row-h:38px;--mf-font:14px}
#filesList.mf-z3{--mf-tile:250px;--mf-thumb-h:165px;--mf-row-w:100px;--mf-row-h:66px;--mf-font:18px}
#filesList.mf-z4{--mf-tile:330px;--mf-thumb-h:230px;--mf-row-w:140px;--mf-row-h:92px;--mf-font:20px}
#filesList .mf-item{font-size:var(--mf-font)}
#filesList.mf-z0 .mf-item,#filesList.mf-z1 .mf-item{padding:6px;gap:6px}
#filesList.mf-z0 .mf-type,#filesList.mf-z0 .mf-date,#filesList.mf-z0 .mf-status{display:none}
#filesList.mf-z0 .mf-tags span,#filesList.mf-z1 .mf-tags span{font-size:10px;padding:0 6px}
#filesList.mf-z0 .mf-actions button,#filesList.mf-z0 .mf-more summary{min-height:30px;min-width:30px;padding:2px 6px;font-size:13px}
#filesList.mf-z1 .mf-actions button,#filesList.mf-z1 .mf-more summary{min-height:34px;min-width:34px;padding:3px 8px;font-size:14px}
#filesList.mf-z3 .mf-actions button,#filesList.mf-z4 .mf-actions button{font-size:inherit}
#filesList.mf-z3 .mf-thumb,#filesList.mf-z4 .mf-thumb{font-size:48px}
.mf-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.mf-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mf-name{overflow-wrap:anywhere}
.mf-tags{display:flex;flex-wrap:wrap;gap:4px}
.mf-tags span{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#eef1f6;color:#3d4f68}
.mf-tags .mf-badge{background:#fff1c9;color:#7a4b00}.mf-tags .mf-subject{background:#dff3e4;color:#14532d}.mf-tags .mf-status.new{background:#ffe0e0;color:#8a1c1c}
.mf-date{color:#51627a}
.mf-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mf-star{font-size:20px;min-width:40px;padding:2px 8px;background:#fff}.mf-star.on{color:#e0a100;border-color:#e0a100}
.mf-more{position:relative}.mf-more summary{list-style:none;cursor:pointer;min-height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #b8c6dc;border-radius:10px;background:#f4f7fc;font-weight:800}
.mf-more summary::-webkit-details-marker{display:none}
.mf-menu{position:absolute;right:0;top:44px;z-index:5;display:flex;flex-direction:column;gap:4px;min-width:170px;padding:8px;background:#fff;border:1px solid #c9d4e4;border-radius:12px;box-shadow:0 10px 30px #10223a40}
.mf-menu button{text-align:left}
@media (max-width:760px){.mf-layout{grid-template-columns:1fr}#mfNav{flex-direction:row;flex-wrap:wrap;position:static}.mf-nav-title{width:100%}.mf-folder{flex:0 0 auto}.mf-nav-item{width:auto}}
#viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:#dfe6f1}
#viewer[hidden],#addPdf[hidden],#newFolder[hidden]{display:none}
#viewerBar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#fff;box-shadow:0 2px 8px #1720331a}
#viewerName{flex:1;min-width:120px;overflow-wrap:anywhere}
#viewerPage{flex:1;overflow:auto;padding:12px;text-align:center}
#viewerPage canvas{background:#fff;box-shadow:0 2px 12px #17203340}
.ftt-sheets-title{margin:4px 0 8px;font-size:20px}#sheets{margin:0 0 18px;padding-bottom:6px;border-bottom:2px solid #e4e9f1}#sheets[hidden]{display:none}#viewerSave[hidden]{display:none}#viewerSave{background:#1d5cb2;border:1px solid #1d5cb2;color:#fff;border-radius:10px;min-height:40px;padding:6px 14px;font:700 15px system-ui,sans-serif;cursor:pointer}#viewerSave:disabled{opacity:.6}
.ftt-picture{display:block;max-width:100%;margin:12px auto;border:1px solid #c9d4e4;border-radius:10px}
</style>
<script defer src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/12.15.0/firebase-storage-compat.js"></script>
<script defer src="../firebase-config.js"></script>
<script defer src="vendor/pdf.min.js?v=3.11.174"></script>
<script defer src="annotation-toolbar.js?v=20261116-drawperm2"></script>
<script defer src="saved-work-core.js?v=20261116-myfiles2"></script>
<script defer src="saved-work.js?v=20261116-myfiles2"></script>
<script defer src="my-files-core.js?v=20261116-myfiles3"></script>
<script defer src="my-files.js?v=20261116-myfiles3"></script>
</head>
<body class="ftt-saved">
<header><h1>📂 My files</h1><a href="../index.html">Back to Fun Torah Tools</a></header>
<main>
<p class="ftt-saved-note">Your saved whiteboards, PDFs and worksheets. Only you can see them.</p>
<div class="mf-tools">
<div class="mf-switch" role="group" aria-label="View"><button id="viewGrid" type="button" aria-pressed="true">▦ Grid</button><button id="viewList" type="button" aria-pressed="false">☰ List</button></div>
<div class="mf-switch" role="group" aria-label="Size of the files"><button id="zoomOut" type="button" aria-label="Smaller files: see more at once" title="Smaller files: see more at once">−</button><button id="zoomIn" type="button" aria-label="Bigger files" title="Bigger files">＋</button></div>
<label>Sort by <select id="sortBy"><option value="date">Date</option><option value="name">Name</option><option value="type">Type</option><option value="subject">Subject</option></select></label>
<button id="newFolder" type="button" class="main" hidden>＋ New folder</button>
<button id="addPdf" type="button" hidden>＋ Add a PDF from this computer</button><input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
</div>
<p id="filesStatus" class="ftt-saved-status" role="status">Loading…</p>
<div class="mf-layout">
<nav id="mfNav" aria-label="Folders and views"></nav>
<section aria-label="Files"><h2 id="viewTitle"></h2><div id="filesList"></div></section>
</div>
</main>
<section id="viewer" aria-label="PDF" hidden>
<div id="viewerBar" role="toolbar" aria-label="PDF controls">
<button id="viewerBack" type="button">← My files</button>
<strong id="viewerName"></strong>
<button id="viewerPrevious" type="button">◀ Previous</button>
<span id="viewerCount" aria-live="polite"></span>
<button id="viewerNext" type="button">Next ▶</button>
<button id="viewerSave" type="button" class="main" hidden>💾 Save my worksheet</button>
<button id="viewerZoomOut" type="button" aria-label="Make smaller">－</button>
<span id="viewerZoom"></span>
<button id="viewerZoomIn" type="button" aria-label="Make bigger">＋</button>
</div>
<div id="viewerPage"></div>
</section>
</body>
</html>
