e</button><p class="classroom-step">1. What would you like to do?</p><div id="classroomModes" role="group" aria-label="Classroom activity"><button class="classroom-mode" type="button" data-classroom-mode="lesson" aria-pressed="false"><strong>👆 Teach &amp; Present</strong><small>Share your lesson, use the pointer, or open a PDF.</small></button><button class="classroom-mode" type="button" data-classroom-mode="screens" aria-pressed="false"><strong>🖥 View Student Screens</strong><small>Invite students to share, then see everyone in one gallery.</small></button><button class="classroom-mode" type="button" data-classroom-mode="boards" aria-pressed="false"><strong>📝 Student Whiteboards</strong><small>Send the class to their individual whiteboards.</small></button></div><p class="classroom-step">2. Choose the class</p><div id="teacherClassButtons" role="group" aria-label="Choose one class"></div><label for="classChoice" hidden>Your class</label><select id="classChoice" hidden></select><button id="openTeacher" hidden disabled>Open teacher classroom</button></section><p><a href="../index.html">Back to Fun Torah Tools</a></p></main></body></html>
